lighter, cleaner profile than kimoto or yamahai.","flavor":"Clean, light.","use":"Everyday through premium sake.","craft":"Added lactic acid makes the starter safe and quick.","src":[["Anchorman: kimoto yamahai sokujo","https://anchorman-inc.tokyo/kimoto-yamahai-sokujo"],["Sakesen: starter types","https://www.sakesen.com/blog/making-raw-sardines/"]]},{"cat":"glossary","name":"Nigori-zake (cloudy sake)","ja":"にごり酒","prefs":[],"text":"Sake from moromi pressed through a coarse cloth or net so that much lees stays. Under tax law it counts as seishu because it has been pressed once; doburoku is unfiltered and classed as 'other brewed alcohol'. 'Katsusei nigori' is bottled unpasteurized, continues fermenting and has fizz.","flavor":"Creamy, rice-sweet.","use":"Dessert or spicy food pairing; shake gently.","craft":"No standard mesh size; unpasteurized active bottles are pressure-hazardous.","src":[["Tanoshii Osake: nigori","https://tanoshiiosake.jp/13020"],["Sake Street: doburoku nigori origarami","https://sakestreet.com/ja/media/what-are-doburoku-nigori-origarami"],["Kubotaya: nigori","https://magazine.asahi-shuzo.co.jp/know/89"]]},{"cat":"glossary","name":"Koshu (aged sake)","ja":"古酒・熟成酒","prefs":[],"text":"No legal definition. The Choki Jukusei-shu Kenkyukai's guide is sake aged at least 3 years at the brewery. Color moves from pale yellow toward amber and brown, and aromas of caramel, honey, dried fruit, nuts and spice develop.","flavor":"Caramel, honey, nuts.","use":"After-dinner or with rich foods.","craft":"Color and age thresholds are reference points.","src":[["Sake World: aged sake research group","https://sakeworld.jp/special/vintagesake/"],["Sipory: koshu guide","https://sipory.jp/blog/koshu-guide"],["Gekkeikan: koshu","https://www.gekkeikan.co.jp/enjoy/sake/type/type04.html"]]},{"cat":"glossary","name":"Awa sake (sparkling sake)","ja":"awa酒（スパークリング日本酒）","prefs":[],"text":"Awa Sake Association was formed in 2016 to promote sparkling sake. Its criteria: rice, koji and water only, CO2 only from natural fermentation, clear appearance with a stream of bubbles when opened, at least 10 percent alcohol and at least 3.5 bar at 20 degrees C. Most use bottle secondary fermentation; tank is also allowed.","flavor":"Light, fizzy, aperitif style.","use":"Toast or aperitif.","craft":"High pressure bottles may burst if stored warm.","src":[["Nagai Shuzo: Awa Sake Association","https://nagai-sake.co.jp/2016/11/01/awasake/"],["Sake Times: sparkling sake","https://jp.sake-times.com/knowledge/word/sake_kindofsparkling"],["Hakkaisan: Awa","https://www.hakkaisan.co.jp/sake/awa-white-koji/"]]},{"cat":"sake","name":"Goriki (強力, Tottori heritage sake rice)","ja":"強力（鳥取の酒米）","prefs":[31],"text":"Goriki is the sake rice most identified with Tottori. It was revived from a small stock of seed rice that had been kept at Tottori University. The grain carries a linear (line-shaped) shinpaku, which is said to let it survive heavy polishing and suit ginjo-type sake. It is hard to cultivate and not suited to mass production, so supply stays small. Tottori brewers also use Tamasakae, Yamada-nishiki, Gohyakumangoku and Torihime according to retail and guide sites.","flavor":"Described as soft, mellow sake; goriki sake is said to open up and gain roundness when warmed.","use":"Served at room temperature or warmed (kan) with the seafood of the San'in coast; also bottled as ginjo-grade junmai.","craft":"Because the plant is difficult and yields are limited, treat each goriki bottling as a single-lot product and ask the maker for the vintage and polishing ratio. The sources summarised here are guide and retail pages, so confirm cultivar-level claims with the brewery or the prefecture before printing them on a menu.","src":[["Tanoshii Osake: characteristics of Tottori sake","https://tanoshiiosake.jp/9296"],["Tottori City tourism: local sake feature","https://www.torican.jp/feature/localbrew"]]},{"cat":"sake","name":"Izumo Toji (出雲杜氏, Shimane brewing guild)","ja":"出雲杜氏","prefs":[32],"text":"Izumo Toji is one of Shimane's two toji groups and is described as the representative toji group of the Chugoku region. Sake made in the traditional Izumo manner is described as high in acidity with a good balance of sweetness and bitterness. A 1996 tally recorded 50 registered Izumo toji, according to the Wikipedia list of toji guilds, which also notes that all guild figures date from 1996 and are not current.","flavor":"Firm acidity framing a rounded sweetness with a bitter edge; a food-oriented style.","use":"Suits Shimane's salty, oily and umami-rich foods; good at room temperature to warm.","craft":"When judging Izumo-style sake, read acidity first: the style leans on acid to carry sweetness and bitterness rather than hiding them. The registered-toji numbers are a 1996 snapshot, so do not quote them as the present size of the guild.","src":[["Izumo Tourism Association: Izumo local sake","https://izumo-kankou.gr.jp/13946"],["Wikipedia: Toji kumiai (guild list)","https://ja.wikipedia.org/wiki/%E6%9D%9C%E6%B0%8F%E7%B5%84%E5%90%88"]]},{"cat":"sake","name":"Sakanishiki (佐香錦, Shimane sake rice)","ja":"佐香錦","prefs":[32],"text":"Sakanishiki is a sake-brewing rice developed by Shimane Prefecture as a premium-sake ingredient, bred to be easier to grow in Shimane's climate. It is named after Saka Shrine in Izumo (Okozakai-cho), a shrine to a sake-brewing deity (Kusunokami) said to be about 1,300 years old. One account says it was bred from Kairyo-hattanso and Kinmon-nishiki as a ginjo rice to stand in for Yamada-nishiki. Shimane brewers also use Kairyo Omachi and Kami-no-mai.","flavor":"Clean, ginjo-type profile; the name itself signals Izumo's myth-linked sake identity.","use":"Used for ginjo and junmai ginjo; the Saka Shrine link makes it a storytelling bottle for Izumo.","craft":"Treat the parentage as reported, not settled: the sources describe it as a cross of two rices but give no breeding record. The claim that Izumo is the birthplace of sake is one tradition among several in Japan and should be stated as such.","src":[["Izumo Tourism Association: Izumo local sake","https://izumo-kankou.gr.jp/13946"],["Nipponia Izumo: Izumo myth and sake","https://nipponiaizumo.jp/blog/culture-history/japanese-sake-mythology/"]]},{"cat":"sake","name":"Izumo Jidenshu (出雲地伝酒, ash-preserved seasoning sake)","ja":"出雲地伝酒","prefs":[32],"text":"Jidenshu is a hai-mochi (ash-preserved) sake of the Izumo region. It is brewed from glutinous rice with about twice the koji of ordinary sake and roughly half the water, aged, then neutralised with wood ash before pressing, which turns it reddish. Its sweetness is about half that of mirin with more umami. Rice control in wartime stopped production; Yoneda Shuzo of Matsue revived it as a seasoning sake in 1990 after efforts from 1989. Its origin is traced to ancient ritual black sake, though accounts vary.","flavor":"Amber-red, dense, savoury-sweet, with less sweetness than mirin and a pronounced umami.","use":"A cooking sake for Izumo home cooking and fish-paste products such as yaki-kamaboko, for seasoning and glaze, and to soften fish smell.","craft":"Use it where mirin would be too sweet: it gives gloss and savour without much sugar. Jidenshu belongs with Kumamoto akazake and Kagoshima jizake in the hai-mochi family, so the same ash-neutralised logic applies; the ash rather than pasteurisation provides keeping quality.","src":[["MAFF Nippon Dento Shoku Zukan: Akumochi-zake","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/akumotizake.html"],["Yoneda Shuzo: aged Izumo Jidenshu","https://www.toyonoaki.com/jidenshu/"],["Shimane tabi: Izumo Jidenshu","https://shimane.mytabi.net/izumo-jiden-sake.php"]]},{"cat":"sake","name":"Bitchu Toji (備中杜氏, Okayama brewing guild)","ja":"備中杜氏","prefs":[33],"text":"Bitchu Toji arose in the Bunka era in the Bitchu region of central-western Okayama, around the Kibi plateau. Their numbers exceeded 500 in the Taisho period. The group is tied to the 'Bitchu-ryu' brewing technique. Some accounts place its base around Kasaoka and Asakuchi and say membership has fallen to the point of near disappearance; its toji once led brewing as far as Manchuria and Korea.","flavor":"Associated with the mellow, wide-bodied style of Okayama sake, especially that built on Omachi.","use":"Reference point when tasting Okayama junmai and Omachi-based sake.","craft":"Treat the numbers as historic: the 500-plus figure belongs to the Taisho era and the guild is described today as small. The 'Bitchu-ryu' name is used by individual breweries in their own copy, so ask a brewer what it concretely means in his koji and moto practice.","src":[["Okayama Kanko Web: Okayama's fine sake","https://www.okayama-kanko.jp/feature/made_in_okayama/30"],["Wikipedia: Toji kumiai (guild list)","https://ja.wikipedia.org/wiki/%E6%9D%9C%E6%B0%8F%E7%B5%84%E5%90%88"]]},{"cat":"sake","name":"Akaiwa Omachi (赤磐雄町, the Omachi heartland of Okayama)","ja":"赤磐雄町","prefs":[33],"text":"Akaiwa City is the main producing area for Bizen rice and the best-known centre of Omachi cultivation. Many labels carry the 'Akaiwa Omachi' name. Omachi is described as originating in Okayama and as a parent of Yamada-nishiki; once scarce, it earned the name 'phantom sake rice'. Okayama also accounts for over 95 percent of national production of Asahi, Omachi and Akebono, and ranks second nationally in Yamada-nishiki output, according to the tourism pages.","flavor":"Wide, mellow umami and body; Omachi is known for roundness and richness.","use":"Junmai and junmai ginjo with food; also used in kimoto and yamahai styles by makers who want body.","craft":"Omachi is hard to grow and hard to brew; look for a producer who states the field area (Akaiwa) and vintage. The production-share figures come from tourism pages and should be checked against a statistical source for formal use.","src":[["Okayama Kanko Web: Omachi rice sake","https://www.okayama-kanko.jp/gourmet/12013"],["Okayama Kanko Web: Okayama's fine sake","https://www.okayama-kanko.jp/feature/made_in_okayama/30"]]},{"cat":"sake","name":"Miura Senzaburo and soft-water brewing (三浦仙三郎, 軟水醸造法)","ja":"三浦仙三郎と軟水醸造法","prefs":[34],"text":"In the Meiji period the brewer Miura Senzaburo perfected a method suited to Hiroshima's soft water, which had been considered unsuitable for sake because low hardness weakens yeast activity. His approach made a Saijo sake distinct from Nada's. In 1898 he published the method as the book Kaijoho Jissenroku and distributed it to local guild members. A separate learning-note source credits him with establishing long, low-temperature brewing that became the basis of ginjo-zukuri; that is an unverified secondary claim.","flavor":"Soft, gentle, round sake with a quiet sweetness, in contrast to Nada's hard-water style.","use":"The historical basis of Saijo and Hiroshima sake; used when explaining soft-water versus hard-water styles.","craft":"The craft lesson is to slow fermentation in soft water so that yeast is not stressed: the point is working with low mineral content, not fighting it. The 'father of ginjo' title is common but the sources here are secondary; cite the book and year, not the title.","src":[["Hiroshima Prefecture: three great sake regions","https://www.pref.hiroshima.lg.jp/lab/topics/20201218/02/"],["Sake Street: Miura Senzaburo","https://sakestreet.com/ja/media/learn-sake-great-people-1"],["Hiroshima Shokudo: soft-water brewing","https://hiroshima-shokudo.com/article/column-288/"]]},{"cat":"sake","name":"Hiroshima Toji and Mitsu Toji (広島杜氏・三津杜氏)","ja":"広島杜氏・三津杜氏","prefs":[34],"text":"Akitsu-cho is described as the birthplace of the Hiroshima Toji, where toji gathered and formed a guild. Toji from the Mitsu area, who had mastered Miura Senzaburo's soft-water method, were active across Japan and abroad. The prefecture's brewing sits in a four-party network of the Prefectural Agricultural Technology Center, the Food Industry Technology Center, JA Group Hiroshima and the brewers' association.","flavor":"Soft-water technique: gentle, round, low-mineral sake.","use":"Reference for tracing why soft-water methods spread beyond Hiroshima.","craft":"The guild story is a technology-transfer story: methods tied to soft water travelled with the toji. When a brewery outside Hiroshima claims a Hiroshima toji lineage, ask what they changed in water handling and fermentation temperature.","src":[["Hiroshima Prefecture: three great sake regions","https://www.pref.hiroshima.lg.jp/lab/topics/20201218/02/"],["Hiroshima Brewers' Association: Hiroshima brewing","https://hirosake.or.jp/brewing/"]]},{"cat":"sake","name":"Hattan-nishiki and Senbon-nishiki (八反錦・千本錦, Hiroshima sake rices)","ja":"八反錦・千本錦","prefs":[34],"text":"Hattan-nishiki and Senbon-nishiki are sake-brewing rices developed by Hiroshima Prefecture. Hattan-nishiki is described as the representative Hiroshima sake rice. They are grown and developed in cooperation among the prefectural agricultural centre, the food industry centre, JA Group Hiroshima and the brewers' association, so cultivar development, brewing trials and marketing are linked.","flavor":"Clean, soft, fine-grained flavour that fits Hiroshima's soft-water style.","use":"Junmai and ginjo-class sake that present a clearly Hiroshima-grown identity.","craft":"Ask for the grain origin and the polishing ratio: a prefecture-bred rice behaves differently from Yamada-nishiki in steaming and koji growth, so the brewer's notes on koji-making tell more than the label.","src":[["Hiroshima Prefecture: three great sake regions","https://www.pref.hiroshima.lg.jp/lab/topics/20201218/02/"],["Hiroshima SAKE Club: characteristics","https://www.hiroshimasake.com/page/12"]]},{"cat":"sake","name":"Saito-no-shizuku (西都の雫, Yamaguchi sake rice)","ja":"西都の雫","prefs":[35],"text":"Saito-no-shizuku is a sake rice bred by Yamaguchi Prefecture for ginjo sake. It is described as large-grained with a high shinpaku appearance rate. Producers contrast it with Yamada-nishiki: Yamada-nishiki gives richness and aroma, while Saito-no-shizuku tends toward a light, crisp style. Sakai Shuzo (Gokyo) uses it for a junmai ginjo with restrained, elegant top aroma, a soft mouthfeel and a clean finish.","flavor":"Light, crisp, clean; restrained aroma and a soft entry.","use":"Junmai ginjo and ginjo served chilled with seafood; useful where a cleaner profile than Yamada-nishiki is wanted.","craft":"A high shinpaku rate and large grain help with koji growth and with heavy polishing; check the polishing ratio and whether the brewer uses 100 percent prefectural rice. The style comparisons come from brewer and retail commentary, not trials.","src":[["Sake Street: why Yamaguchi chooses Saito-no-shizuku","https://sakestreet.com/ja/media/what-is-saitonoshizuku"],["Sake World: Yamaguchi sake","https://sakeworld.jp/special/2502-yamaguchi-sake/"]]},{"cat":"sake","name":"GI Hagi (地理的表示「萩」, Yamaguchi)","ja":"地理的表示 萩","prefs":[35],"text":"Hagi is a geographical indication for sake designated by the National Tax Agency. Its production area is Hagi City and Abu Town (Abu District) in Yamaguchi Prefecture, and it was designated on 30 March 2021 (Reiwa 3). It is one of the sake GIs, alongside Saga, which was designated shortly afterwards.","flavor":"Not a flavour category; a legal origin claim.","use":"On labels and menus to assert that the sake was made within the designated area under the GI standard.","craft":"Check the NTA register for the current standard (raw material origin, water and process rules) before using the name; the conditions are set in the NTA labelling standard, and I did not read them in the sources used here.","src":[["NTA: list of geographical indications for liquors","https://www.nta.go.jp/taxes/sake/hyoji/chiri/ichiran.htm"]]},{"cat":"sake","name":"Awa Yamada-nishiki (阿波山田錦, Tokushima)","ja":"阿波山田錦","prefs":[36],"text":"Awa Yamada-nishiki is Yamada-nishiki grown in Awa City, Tokushima, and used by many Tokushima brewers. Its white-core zone is rich in starch and low in protein and fat, which lets the brewer make sake with full aroma, mild sweetness and fresh acidity. Retail and guide pages note that Tokushima brewers often draw on subsoil water from the Yoshino River system, giving mid-dry to slightly sweet, smooth sake.","flavor":"Full aroma, gentle sweetness, fresh acidity.","use":"Ginjo and daiginjo; the place-name makes it a regional Yamada-nishiki brand.","craft":"The low protein and fat figure is the reason high polishing works cleanly; ask whether the brewer is using the Awa-grown lot or generic Yamada-nishiki, because the label does not always say.","src":[["Awa Yamadanishiki: about the rice","https://awa-yamadanishiki.jp/description/"],["Saketime: Tokushima ranking","https://www.saketime.jp/ranking/tokushima/"]]},{"cat":"sake","name":"Sanuki Yoimai (さぬきよいまい, Kagawa sake rice)","ja":"さぬきよいまい","prefs":[37],"text":"Sanuki Yoimai is a sake rice for Kagawa, with Oseto as the mother and Yamada-nishiki as the father. Kagawa University began research at the request of the Kagawa brewers' cooperative, and the prefecture took over breeding trials and completed it. Some sources date its development to 2006 at Kagawa University. Kagawa brewers such as Kawazuru (Kannonji) bottle it as a junmai nama-genshu.","flavor":"Soft, full flavour with a Yamada-nishiki lineage in the structure.","use":"Junmai and junmai ginjo, including seasonal nama-genshu bottlings.","craft":"A Yamada-nishiki cross is useful for polishing and koji growth; check the vintage and whether the brewery pairs it with the Sanuki olive yeast, as several Kagawa labels do.","src":[["Kensanpin: Sanuki Yoimai","https://www.kensanpin.org/product/crops/1064/"],["Sake Concierge: Oseto, Sanuki Yoimai, Oidemai","https://sakeconcierge.com/genealogy-of-sake-rice-ooseto-and-sanuki-yoimai/"]]},{"cat":"sake","name":"Oseto (オオセト, Kagawa sake rice)","ja":"オオセト","prefs":[37],"text":"Oseto is a sake-brewing rice used in Kagawa since about 1980. It is used by many local breweries and is described as non-sticky, so koji mould penetrates easily, which suits sake making. It is the mother of Sanuki Yoimai. Ayakiku Shuzo is cited as basing its sake on Kagawa-grown Oseto. Sources disagree on how many breweries Kagawa has: one says six, another seven.","flavor":"Clean, light and soft rather than heavy.","use":"Everyday junmai and honjozo for Kagawa; also the base for Sanuki Yoimai crossing.","craft":"Low stickiness helps koji development; watch for over-steaming that makes the grain soft. Brewery counts quoted online vary, so avoid quoting a number unless you have counted from the association's list.","src":[["Sake Concierge: Oseto, Sanuki Yoimai, Oidemai","https://sakeconcierge.com/genealogy-of-sake-rice-ooseto-and-sanuki-yoimai/"],["Azumarikishi: Kagawa sake","https://azumarikishi.co.jp/media/kagawa"]]},{"cat":"sake","name":"Shizuku-hime (しずく媛, Ehime sake rice)","ja":"しずく媛","prefs":[38],"text":"Shizuku-hime is a sake-brewing rice for Ehime developed from Matsuyama Mitsui. Breeding began in 1999 and the name was given in 2007. It produces soft sake with umami, and is beginning to be used outside the prefecture. Umenishiki bottles a junmai from it.","flavor":"Soft, umami-rich, rounded.","use":"Junmai and junmai ginjo, served chilled or at room temperature with Seto Inland Sea seafood.","craft":"Because the parent is a table-type rice that polishes well, Shizuku-hime tends to give a clean style; compare vintages as the cultivar is young.","src":[["Sake Concierge: Shizuku-hime genealogy","https://sakeconcierge.com/shizukuhime-genealogy-of-sake-rice/"],["Tanoshii Osake: characteristics of Ehime sake","https://tanoshiiosake.jp/9303"]]},{"cat":"sake","name":"Matsuyama Mitsui (松山三井, Ehime semi-sake rice)","ja":"松山三井","prefs":[38],"text":"Matsuyama Mitsui was originally grown as table rice. It has large grains that resist breaking, which makes it suitable for sake, and it is now classed as a quasi sake-brewing rice (jun-sakazukuri kotekimai). It polishes readily, and is often used for tanrei karakuchi sake. It is the parent of Shizuku-hime.","flavor":"Light, dry, clean.","use":"Ehime's light-dry sake and the stock for breeding Shizuku-hime.","craft":"A hard, large, tough grain can take a high polish; check the polishing ratio on the label to see how far the brewer has gone with a non-premium cultivar.","src":[["Tanoshii Osake: characteristics of Ehime sake","https://tanoshiiosake.jp/9303"],["Sake Concierge: Shizuku-hime genealogy","https://sakeconcierge.com/shizukuhime-genealogy-of-sake-rice/"]]},{"cat":"sake","name":"Ehime style: Ochi/Ikata toji and EK-1 yeast (愛媛の酒質)","ja":"愛媛の酒質：越智杜氏・伊方杜氏とEK-1酵母","prefs":[38],"text":"Ehime sake is described as centred on tanrei amakuchi with umami. The ingredients are the techniques of the Ochi and Ikata toji, the prefectural rice Shizuku-hime and the prefectural yeast EK-1. EK-1 is described as giving a restrained, elegant aroma suited to food sake. The Ochi toji are a Shikoku representative group, with 10 registered toji in 1996; sources spell the name Ochi two ways. Regional character is described as crisp in Toyo, light with umami in Chuyo and sweet with body in Nanyo.","flavor":"Light, with umami and a gentle sweetness; restrained aroma.","use":"Food sake with Seto Inland Sea fish and Ehime citrus dishes.","craft":"The sources are guide pages; the regional split into three zones is a generalisation. Use EK-1 as a clue to a restrained-aroma profile rather than a guarantee, and ask the brewery which yeast they actually use.","src":[["Tanoshii Osake: characteristics of Ehime sake","https://tanoshiiosake.jp/9303"],["Wikipedia: Toji kumiai (guild list)","https://ja.wikipedia.org/wiki/%E6%9D%9C%E6%B0%8F%E7%B5%84%E5%90%88"]]},{"cat":"sake","name":"CEL-24 yeast (セル24酵母, Kochi)","ja":"CEL-24酵母","prefs":[39],"text":"CEL-24 is the twenty-fourth yeast of the CEL series developed by Haruhiko Kamihigashi of the Kochi Prefectural Industrial Technology Center. It is known for a high fruity aroma and sweetness. Retail descriptions of Kameizumi's CEL-24 Gin-no-yume junmai ginjo nama-genshu give a sake meter value of -15 and acidity of 2.2, though other pages quote about -10. Tosa Shuzo (Katsuragetsu) also makes a CEL-24 junmai daiginjo using Gin-no-yume.","flavor":"Strongly fruity aroma, sweet and juicy; high-aroma ginjo type.","use":"Served chilled as an aperitif or with fruit and cheese-type dishes; bottled mostly as nama or genshu.","craft":"Quoted SMV and acidity vary by shop and vintage, so ask for the brewery's own analysis sheet. Retail pages are the source here; no official CEL-24 specification was seen.","src":[["Kagataya: Kameizumi CEL-24 Gin-no-yume","https://www.kagataya.net/shopdetail/000000006683/"],["Igossou Sakaya Sasaki: CEL24","https://sake-sasaki.com/igossou-blog/cel24%EF%BC%88%E3%82%BB%E3%83%AB24%EF%BC%89%E6%97%A5%E6%9C%AC%E9%85%92-%E9%AB%98%E7%9F%A5/"]]},{"cat":"sake","name":"Gin-no-yume (吟の夢, Kochi sake rice)","ja":"吟の夢","prefs":[39],"text":"Gin-no-yume is a Kochi-bred sake rice, a cross of Yamada-nishiki and Nankai 102 (Hinohikari), bred at the Kochi Agricultural Technology Center and registered in 2002. It is said to have brewing suitability comparable to Yamada-nishiki, inherited from its parent. It is the standard rice for Kochi's CEL-24 bottlings.","flavor":"Clean base that carries the fruity CEL-24 aroma.","use":"Junmai ginjo and junmai daiginjo, especially nama-genshu.","craft":"The Yamada-nishiki parent gives a workable shinpaku; the brewing suitability claim is from retail commentary, so judge it on the brewer's polishing ratio and moromi notes.","src":[["Yahoo Shopping: Kameizumi CEL-24 Gin-no-yume","https://store.shopping.yahoo.co.jp/nishitora/sake-058764.html"],["Kagataya: Kameizumi CEL-24 Gin-no-yume","https://www.kagataya.net/shopdetail/000000006683/"]]},{"cat":"sake","name":"Yume-ikkon (夢一献, Fukuoka sake rice)","ja":"夢一献","prefs":[40],"text":"Yume-ikkon is Fukuoka Prefecture's original sake rice. It has a short culm and is less affected by typhoons than Yamada-nishiki, so it is easier to grow. Sources disagree on the date: one says it was developed in Heisei 15 (2003), another says varietal registration was 1992. Fukuoka is also a leading producer of Yamada-nishiki, with sake breweries concentrated along the soft water of the Chikugo River basin.","flavor":"Clean, soft Fukuoka profile.","use":"Junmai and junmai ginjo from Fukuoka breweries.","craft":"Because registration dates conflict, cite the prefecture's seed record if you need a date. The short culm is a field trait: it matters to the grower and brewer's supply security rather than to flavour.","src":[["Ginjoka: Yume-ikkon","http://ginjoka.com/sake-basic/yumeikkon/"],["Tanoshii Osake: Fukuoka sake","https://tanoshiiosake.jp/5127"]]},{"cat":"sake","name":"Itoshima Yamada-nishiki and Tanaka Rokuju-go (糸島産山田錦・田中六五)","ja":"糸島産山田錦と田中六五","prefs":[40],"text":"Fukuoka is among Japan's notable Yamada-nishiki growing regions, and Itoshima-grown Yamada-nishiki has risen in quality reputation in recent years. Tanaka Rokuju-go by Shiraito Shuzo is made only as a junmai, from 100 percent Itoshima Yamada-nishiki polished to 65 percent. The 65 percent figure is the label name and the policy: one grain, one polishing ratio.","flavor":"Full-bodied junmai flavour with a rice-forward structure.","use":"Served chilled to warm with Hakata dishes.","craft":"A single fixed polishing ratio of 65 percent is a deliberate stance that keeps the rice character; compare it with ginjo-polished bottlings to see what the outer layers contribute.","src":[["Tanoshii Osake: Fukuoka sake","https://tanoshiiosake.jp/5127"],["Saketime: Fukuoka ranking","https://www.saketime.jp/ranking/fukuoka/"]]},{"cat":"sake","name":"Gin-no-sato (吟のさと, Chikugo and Iki sake rice)","ja":"吟のさと","prefs":[40,42],"text":"Gin-no-sato is a rice bred to suit the climate and soil of the Chikugo region of Fukuoka, with Yamada-nishiki as a parent. Ikekame Shuzo in Kurume brews with its own cultured yeast. The rice is also grown on Iki Island, Nagasaki, where a brewery uses sake rice grown in Iki soil.","flavor":"Clean, mid-weight, adapted to Kyushu summers.","use":"Junmai and ginjo from Chikugo and Iki.","craft":"A Yamada-nishiki-parent rice bred for warm Kyushu fields: ask whether the brewer polishes it as hard as the parent. The sources do not give polishing figures.","src":[["Tanoshii Osake: Fukuoka sake","https://tanoshiiosake.jp/5127"],["Tanoshii Osake: characteristics of Nagasaki sake","https://tanoshiiosake.jp/9307"]]},{"cat":"sake","name":"Sagano-hana (さがの華, Saga sake rice)","ja":"さがの華","prefs":[41],"text":"Sagano-hana is Saga Prefecture's original sake-brewing rice, bred from Wakamizu crossed with Yamada-nishiki and developed to lodge less than Yamada-nishiki. One article describes it as supporting Saga's soft, sweet sake. Saga sake is also described as rich and sweet. Brewers such as Tenzan Shuzo grow and study Yamada-nishiki in their own fields.","flavor":"Soft, with sweetness and body.","use":"Junmai and ginjo from Saga, served with Kyushu soy-sweet cooking.","craft":"Lodging resistance matters for the grower; for the brewer the Wakamizu parent suggests a soft-textured grain, but the sources do not give trial data.","src":[["Kyushu sake-rice overview","http://xn--wgv71a483g.biz/category16/entry157.html"],["My-best: Saga sake ranking","https://my-best.com/5723"]]},{"cat":"sake","name":"GI Saga (地理的表示「佐賀」)","ja":"地理的表示 佐賀","prefs":[41],"text":"Saga is a sake geographical indication whose production area is the whole of Saga Prefecture. It was designated on 14 June 2021 (Reiwa 3), the first from Saga, the 17th among all liquor GIs and the first for Japanese sake in Kyushu. The requirements include using only domestic rice for rice and koji and using water drawn within the area. 'The SAGA' certified sake requires rice harvested in the prefecture.","flavor":"Not a flavour category; an origin standard.","use":"On labels to show the sake meets the GI Saga standard and the stricter The SAGA certification.","craft":"Distinguish the two tiers: GI Saga allows any domestic rice, while The SAGA certification requires prefecture-harvested rice. Check the NTA standard for the current wording.","src":[["Saga Shimbun: GI Saga designated","https://www.saga-s.co.jp/articles/-/691436"],["NTA: list of geographical indications for liquors","https://www.nta.go.jp/taxes/sake/hyoji/chiri/ichiran.htm"]]},{"cat":"sake","name":"Iki sake revival (壱岐の日本酒復活, Shigeie Shuzo)","ja":"壱岐の日本酒復活","prefs":[42],"text":"Iki's sake brewing lapsed after 1990 and was revived 23 years later by Shigeie Shuzo, whose first release is cited as 'Kakuzo' in one account. Iki is said to have mineral-rich water suited to sake. Efforts include growing Yamada-nishiki on Iki, and a brewery using Gin-no-sato grown in Iki soil.","flavor":"Southern-island sake; guide pages call Nagasaki sake light yet rich in aroma and umami.","use":"Island-grown sake used with local seafood.","craft":"A rebuilt brewing tradition: ask about the toji's training and the rice origin. Dates are from a single guide page and should be verified with the brewery.","src":[["Tanoshii Osake: characteristics of Nagasaki sake","https://tanoshiiosake.jp/9307"],["Sakidori: Nagasaki sake","https://sakidori.co/article/1623676"]]},{"cat":"sake","name":"Kawachi Shuzo and Shiratake Tsushima (河内酒造・白嶽 つしま)","ja":"河内酒造「白嶽 つしま」","prefs":[42],"text":"Kawachi Shuzo, founded in 1919, is described as the only sake brewery in Tsushima City, Nagasaki. It makes the junmai 'Shiratake Tsushima'. Because many Nagasaki guide pages cover only the mainland, this island brewery is a useful reference for remote-island sake in the prefecture.","flavor":"Junmai, described in guides as part of Nagasaki's 'southern' sake style.","use":"A regional gift and local pairing with Tsushima seafood.","craft":"The sources give foundation date and product name only; contact the brewery for rice and polishing data before putting specifics on a menu.","src":[["Tanoshii Osake: characteristics of Nagasaki sake","https://tanoshiiosake.jp/9307"],["Azumarikishi: Nagasaki sake","https://azumarikishi.co.jp/media/nagasaki"]]},{"cat":"sake","name":"Kouro and Kumamoto Prefecture Sake Brewing Research Institute (香露・熊本県酒造研究所)","ja":"香露と熊本県酒造研究所","prefs":[43],"text":"Kouro is the sake of the Kumamoto Prefecture Sake Brewing Research Institute in Kumamoto City, a research body that is also a working brewery. It brews with Aso subsoil water and uses Yamada-nishiki and the Kumamoto-original rice Hana-nishiki, which is also used by Tsujun Shuzo and Kamemasa. The institute developed Kumamoto yeast in 1952 (Showa 27), described as giving gentle acidity and bright aroma with strong fermentation at low temperatures. Every Kouro product uses it.","flavor":"Fruity ginjo aroma with a gentle acidity and a clean finish.","use":"Daiginjo and junmai ginjo served chilled; Kouro junmai also ships as hiyaoroshi.","craft":"A sake brewery run as a research institute shows how a yeast and a house style can be tied: if all lots use the same yeast, the differences you taste come from rice, polishing and temperature control.","src":[["Tanoshii Osake: Kouro and Kumamoto yeast","https://tanoshiiosake.jp/7732"],["Hyotan: Kouro","https://www.hyotan.co.jp/cnt/sake/kouro.html"]]},{"cat":"sake","name":"Kumamoto Shinriki and Kyushu Shinriki (熊本神力・九州神力)","ja":"熊本神力・九州神力","prefs":[43],"text":"Chiyo-no-sono Shuzo is credited with producing the original sake rice 'Kyushu Shinriki'. Its 'Kumamoto Shinriki' junmai ginjo is made by reviving Shinriki, described as the 'phantom' original of sake-brewing rice. The sake is described as having a mellow mouthfeel and a gentle ginjo aroma in balance.","flavor":"Mellow entry, gentle ginjo aroma, balanced.","use":"Junmai ginjo served at cool-room temperature; a heritage-rice story for Kumamoto.","craft":"A revived heritage rice behaves differently from modern cultivars in the field; ask the brewer how it was grown and what polishing ratio was used. The sources are retail descriptions only.","src":[["Tanoshii Osake: Kouro and Kumamoto yeast","https://tanoshiiosake.jp/7732"],["Azumarikishi: Kumamoto sake","https://azumarikishi.co.jp/media/kumamoto"]]},{"cat":"sake","name":"Akazake (赤酒, Kumamoto ash-preserved sake)","ja":"赤酒","prefs":[43],"text":"Akazake is a Kumamoto sake made by the hai-mochi (ash-preserving) method. Wood ash is added to the moromi before pressing to make it alkaline and improve keeping, and the ash is removed at pressing. The red colour comes from the reaction of sugars and amino acids during brewing. It was the 'okunizake' of the Higo Hosokawa domain in the Edo period; demand fell after clear sake arrived in the Meiji era. It is used for otoso and ritual sake and as a cooking sake or mirin substitute, and under the liquor tax law it is classed as zatsushu (miscellaneous). Drinking and cooking types exist, though one page's alcohol figures look inconsistent.","flavor":"Amber-red, sweet and savoury, with a distinct alkaline-aged character.","use":"Seasonal otoso, cooking sake for glazes and simmered dishes, and a mirin substitute.","craft":"Use akazake where you want both sweetness and savour; adjust sugar elsewhere in the dish. Ignore the alcohol percentages quoted on retail pages for the cooking type until you check the bottle.","src":[["MAFF Nippon Dento Shoku Zukan: Akazake","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/akazake.html"],["Akazake.com: history","https://www.akazake.com/rekisi/"],["Akazake.com: akumochi","https://www.akazake.com/akumoti/"]]},{"cat":"sake","name":"Bungo Nerinuki-zake and Asaji-zake (豊後練貫酒・麻地酒)","ja":"豊後練貫酒・麻地酒","prefs":[44],"text":"Oita's sake is traced to Bungo nerinuki-zake, recorded in the Muromachi period as a paste-like fermented rice or glutinous rice drink with a sweet-sour taste, and to asaji-zake, a cloudy sake born in Bungo in the Edo period. Present brewing is said to follow asaji-zake and to be sweet, though another source calls Oita sake tanrei amakuchi. Takakiya (Hamashima Shuzo, Bungo-ono) is cited as growing the rice for its own sake in the Ogata grain belt. About 30 breweries are claimed by one article.","flavor":"Sweet; historically sweet-sour and thick.","use":"A historical reference for Oita; modern bottlings are pressed sake.","craft":"The two historical names refer to different products, so do not treat them as one. Sources disagree on modern style (sweet versus light-sweet), so taste before describing.","src":[["Visit Oita: sake brewery tour in Bungo-ono","https://www.visit-oita.jp/magazines/detail/604"],["Takakiya (Hamashima Shuzo)","https://www.takakiya.co.jp/"]]},{"cat":"sake","name":"Sentoku Shuzo (千徳酒造, Miyazaki's sake-only brewery)","ja":"千徳酒造","prefs":[45],"text":"Sentoku Shuzo in Nobeoka was founded in 1903 and is described as Miyazaki's only sake-specialist brewery that has never made shochu. It uses Gokase River water and prefectural Yamada-nishiki and Hanakagura, a sake rice grown under contract in Miyazaki. Unkai Shuzo in Aya Town makes sake too, including the daiginjo Tokiichi, but also shochu. Small lots mean limited releases, such as 500 to 600 bottles a year of kasumi-zake and genshu.","flavor":"Clean, rice-forward sake; limited-release bottles are rare.","use":"A local pairing for Miyazaki's seafood and chicken dishes.","craft":"In a shochu prefecture, a sake-only brewery works with small lots; ask for lot details. Brewery counts depend on how one counts, so confirm with the prefectural association.","src":[["Miyazaki Sake Brewers' Association: Sentoku","https://miyazaki-sake.or.jp/nobeokahyuga/sentoku.html"],["Sakenomy: Sentoku Shuzo","https://www.sakenomy.jp/brewery/K01N045038/"]]},{"cat":"sake","name":"Kagoshima Jizake and Kurozake (鹿児島の地酒・黒酒)","ja":"鹿児島の地酒（灰持酒）・黒酒","prefs":[46],"text":"In Kagoshima 'jizake' means an ash-preserved (hai-mochi) sake. It follows the clear-sake process but wood ash is added just before pressing, and some sources add that shochu is added too. The result is amber and thick, sweet with abundant umami. It is used in cooking such as sake-zushi and satsuma-age. Many breweries made it in the Edo period, but it declined as shochu grew and rice supply stopped after the war. Higashi Shuzo is the main maker; Kurozake, its trade version, was revised in 1990 with more rice and doubled amino acids. Its legal category was not confirmed in the sources.","flavor":"Amber, viscous, sweet and savoury.","use":"Cooking sake for sake-zushi, satsuma-age and braising; ritual drinking at New Year (otoso).","craft":"Like akazake and jidenshu it relies on ash for keeping quality, so it is not pasteurised in the usual way. Descriptions of the process vary (shochu or brewer's alcohol and sugar added at the end), so confirm with the maker.","src":[["Nippon.com: Kagoshima kurozake","https://www.nippon.com/ja/japan-topics/c11608/"],["Kagoshima Sake Brewers' Association: liquors","https://kagoshima-sake.or.jp/liquor.html"],["Kurozake: about","https://kurozake.com/about/"]]},{"cat":"sake","name":"Reimei of Taiseki Shuzo (泰石酒造「黎明」, Okinawa)","ja":"泰石酒造「黎明」","prefs":[47],"text":"Taiseki Shuzo in Tairagawa, Uruma City, was long cited as Okinawa's only sake brewery, making the brand Reimei. The brand was developed with technical support from Reimei Shuzo, a former Nagasaki brewery. The founder installed four-season brewing equipment so that clear sake could be made in Okinawa's warm climate. Wikipedia states that in 2024 the business was to pass to Nanto Shuhan (Nishihara) and Seifuku Shuzo (Ishigaki), with the brewing base moving to Ishigaki.","flavor":"A subtropical-brewed clear sake.","use":"A rarity in Okinawa where awamori dominates; check current availability.","craft":"Four-season brewing with refrigeration substitutes for the winter cold-season craft of other regions. Because ownership was changing as of the sources, verify who now brews it and where.","src":[["Sake Times: Taiseki Shuzo interview","https://jp.sake-times.com/knowledge/sakagura/sake_g_okinawa_taikokushuzo"],["Wikipedia: Taiseki Shuzo","https://ja.wikipedia.org/wiki/%E6%B3%B0%E7%9F%B3%E9%85%92%E9%80%A0"],["Taiseki Shuzo official site","https://www.taikokushuzo.com/"]]},{"cat":"glossary","name":"Tokutei meisho-shu (特定名称酒, the eight designated classes)","ja":"特定名称酒","prefs":[],"text":"Tokutei meisho-shu are the sake classes whose names are regulated by the National Tax Agency's seishu labelling standard: junmai, tokubetsu junmai, honjozo, tokubetsu honjozo, ginjo, junmai ginjo, daiginjo and junmai daiginjo. The key ratios are daiginjo at 50 percent or less, ginjo at 60 percent or less, tokubetsu junmai and tokubetsu honjozo at 60 percent or less when explained by ratio, and honjozo at 70 percent or less; junmai has no ratio requirement since a 2004 revision. Junmai names forbid brewer's alcohol.","flavor":"Used as labelling vocabulary; each class implies a style but not quality.","use":"To read a label and decide on a service: junmai classes for body, ginjo and daiginjo for aroma.","craft":"A class tells you the process, not the taste. Check the polishing ratio shown beside the ingredients, and note that ratios are judged with fractions under 1 percent dropped.","src":[["NTA: outline of the Seishu labelling standard","https://www.nta.go.jp/taxes/sake/hyoji/seishu/gaiyo/02.htm"],["NTA: outline of the important labelling standard","https://www.nta.go.jp/taxes/sake/hyoji/kijun/gaiyo/04.htm"],["Gekkeikan: ginjo, junmai, honjozo","https://www.gekkeikan.co.jp/enjoy/sake/type/type01.html"]]},{"cat":"glossary","name":"Seimai-buai (精米歩合, polishing ratio)","ja":"精米歩合","prefs":[],"text":"Seimai-buai is the weight of polished rice divided by the weight of brown rice, times 100. If 100 kg of brown rice becomes 85 kg after milling, the ratio is 85 percent. A smaller number means deeper polishing, and the bran removed is the complement (at 40 percent, roughly 60 percent is removed). It is defined by NTA notification, and the ratio must be shown on the label near the ingredients.","flavor":"Spoken as a number: 'rokuju-pasento' for 60 percent.","use":"To compare how far a brewer has milled the rice; used with the class names.","craft":"It is a weight ratio, an apparent figure that does not show how evenly each grain was milled. Compare brewers by their ratio together with rice cultivar and milling method.","src":[["Kuramotokai glossary: seimai-buai","https://www.kuramotokai.com/glossary/word/%E7%B2%BE%E7%B1%B3%E6%AD%A9%E5%90%88"],["NTA: outline of the Seishu labelling standard","https://www.nta.go.jp/taxes/sake/hyoji/seishu/gaiyo/02.htm"]]},{"cat":"glossary","name":"Junmai-shu (純米酒, pure rice sake)","ja":"純米酒","prefs":[],"text":"Junmai-shu is sake made from white rice, rice koji and water only, with no brewer's alcohol. Since the 2004 revision of the labelling standard the former requirement of 70 percent polishing was removed, so junmai has no numerical polishing requirement. Junmai ginjo and junmai daiginjo add the ginjo ratios of 60 and 50 percent or less. Tokubetsu junmai requires a ratio of 60 percent or less if explained by ratio, or a special method.","flavor":"Often fuller and more rice-forward than alcohol-added types.","use":"Food sake across temperatures, especially warm.","craft":"Look for the polishing ratio, as junmai alone says nothing about milling. 'Tokubetsu' must be explained on the label, either by ratio or method.","src":[["NTA: outline of the Seishu labelling standard","https://www.nta.go.jp/taxes/sake/hyoji/seishu/gaiyo/02.htm"],["NTA: outline of the important labelling standard","https://www.nta.go.jp/taxes/sake/hyoji/kijun/gaiyo/04.htm"]]},{"cat":"glossary","name":"Honjozo-shu and brewer's alcohol (本醸造酒・醸造アルコール)","ja":"本醸造酒と醸造アルコール","prefs":[],"text":"Honjozo-shu is made from rice, rice koji, brewer's alcohol and water, polished to 70 percent or less, with koji rice at 15 percent or more. The alcohol added to honjozo and ginjo types is capped at 10 percent of the white rice weight. According to the NTA explanation, the alcohol is for flavour adjustment rather than bulk: a suitable quantity gives a higher aroma and cleaner taste and helps suppress hiochi bacteria. One consumer site says 5 to 8 percent is typical, with no source.","flavor":"Lighter and drier-feeling than junmai; clean and aromatic.","use":"Everyday sake, warm or chilled.","craft":"Alcohol addition is made before pressing and affects extraction of aroma; the 10 percent cap is an upper limit, not a recipe. Treat the typical-percentage claim as unconfirmed.","src":[["NTA: outline of the Seishu labelling standard","https://www.nta.go.jp/taxes/sake/hyoji/seishu/gaiyo/02.htm"],["Tokyo Regional Taxation Bureau: sake basics","https://www.nta.go.jp/about/organization/tokyo/sake/abc/abc-sake.htm"]]},{"cat":"glossary","name":"Ginjo-shu and Daiginjo-shu (吟醸酒・大吟醸酒)","ja":"吟醸酒・大吟醸酒","prefs":[],"text":"Ginjo-shu is sake made carefully from rice polished to 60 percent or less, with rice koji and water, or with those and brewer's alcohol. Daiginjo-shu is a ginjo made from rice polished to 50 percent or less and with a particularly good flavour and colour. The ginjo aroma comes from slow low-temperature fermentation; apple, pear and pineapple notes are attributed to ethyl caproate, and isoamyl acetate is another key ester. Low temperature raises the share of caproic acid among the fatty acids made, and keeps aroma from evaporating.","flavor":"Fruity, floral aroma with a refined, light body.","use":"Chilled in wine-type glasses; not suited to strong heating.","craft":"Ginjo-zukuri means low-temperature fermentation in the moromi, so aroma depends on temperature control as much as on polishing. Heat tends to dull aroma, so serve cool.","src":[["NTA: outline of the important labelling standard","https://www.nta.go.jp/taxes/sake/hyoji/kijun/gaiyo/04.htm"],["Kubotaya: ginjo aroma","https://magazine.asahi-shuzo.co.jp/know/7"],["Gekkeikan: history of ginjo","https://www.gekkeikan.co.jp/enjoy/sake/industry/industry04.html"]]},{"cat":"glossary","name":"Hiyaoroshi (ひやおろし, autumn mature sake)","ja":"ひやおろし","prefs":[],"text":"Hiyaoroshi is sake pressed in winter, pasteurised once in spring, matured through summer, and shipped in autumn without a second pasteurisation. No unified legal or industry definition was found. It arrives from mid-August at the earliest, with a full range by September to October, and some sources say late August to November. The name is explained as the time when outside air temperature matched that of the stored sake, so it was drawn off the cask. 'Akiagari' is a related term, used as a product name and also for a flavour state, and 9 September is promoted as Hiyaoroshi Day by the Japan Sake Youth Council.","flavor":"Rounded, matured, with softened edges and a deeper savour than spring sake.","use":"Served cool to warm with autumn fish and mushrooms.","craft":"It is a nama-zume type (one pasteurisation), so keep it refrigerated and drink it soon after opening. Check the brewery's definition because the term is not regulated.","src":[["Sekinoichi: hiyaoroshi guide","https://www.sekinoichi.com/lp-blog/articles202609/hiyaoroshi-guide.html"],["Sawanotsuru: hiyaoroshi and akiagari","https://www.sawanotsuru.co.jp/site/nihonshu-columm/enjoy/nihonshu-hiyaoroshi/"],["Kubotaya: hiyaoroshi","https://magazine.asahi-shuzo.co.jp/enjoy/53"]]},{"cat":"glossary","name":"Nama-zake, nama-zume, nama-chozo (生酒・生詰め・生貯蔵酒)","ja":"生酒・生詰め・生貯蔵酒","prefs":[],"text":"Standard sake is pasteurised twice, before storage and before shipping. Nama-zake is not pasteurised at all and needs refrigeration. Nama-zume (namadume) is pasteurised once before storage only; hiyaoroshi is the typical example. Nama-chozo is stored raw and pasteurised once before shipping, so it keeps a fresher aroma. 'Nama' means no pasteurisation; 'genshu' means no dilution, and the two are independent.","flavor":"Nama: fresh, lively, juicy. Nama-zume: rounder. Nama-chozo: fresh with some stability.","use":"Nama chilled; nama-zume cool to room temperature.","craft":"Count pasteurisations to tell types apart. Nama must be kept cold and sold with a cold chain; do not confuse nama with genshu.","src":[["Sawanotsuru: heating timing and nama types","https://www.sawanotsuru.co.jp/site/nihonshu-columm/knowledge/heating-sake/"],["Sake Times: nama-zume","https://jp.sake-times.com/knowledge/word/sake_namadume"]]},{"cat":"glossary","name":"Shiboritate (しぼりたて, freshly pressed)","ja":"しぼりたて","prefs":[],"text":"Shiboritate describes sake bottled soon after pressing. It is not a classification by number of pasteurisations: it signals freshness. Because nama-zake has had no heat treatment, it is described as the style closest to the shiboritate taste. It is a seasonal product of the new brewing year and is normally refrigerated.","flavor":"Lively, fresh, often with a slight fizz and green freshness.","use":"Chilled, in the early part of the season.","craft":"Read the label for what shiboritate actually means for that lot: nama, once-pasteurised or other. The term is not regulated, so do not assume no pasteurisation.","src":[["Sawanotsuru: heating timing and nama types","https://www.sawanotsuru.co.jp/site/nihonshu-columm/knowledge/heating-sake/"],["Nippon Access: nama-zake","https://promotion.nippon-access.co.jp/liquor/sake/comics/comic02.html"]]},{"cat":"glossary","name":"Hiya and reishu: chilled sake temperature names (冷や・冷酒・雪冷え・花冷え・涼冷え)","ja":"冷や・冷酒・雪冷え・花冷え・涼冷え","prefs":[],"text":"Chilled sake has names by 5 degree steps: yukibie (about 5 C), hanabie (10 C) and suzubie (15 C). 'Hiya' means unwarmed room-temperature sake, about 20 C, tied to the temperature of a traditional earthen floor, while 'reishu' means chilled sake. Sources give 15 to 20 C for hiya, and one source puts yukibie at 15 C, contradicting most others.","flavor":"Colder emphasises crispness and mutes sweetness; warmer opens aroma.","use":"Order 'reishu' for cold; 'hiya' in a traditional setting often arrives at room temperature.","craft":"Ask guests which they mean when they say 'hiya'. Use a thermometer for a service standard rather than relying on names.","src":[["Tanoshii Osake: hiya versus reishu","https://tanoshiiosake.jp/3255"],["Sipory: sake temperatures","https://sipory.jp/blog/sake-temperature-guide"],["Sake Times: sake by temperature","https://jp.sake-times.com/think/accomplishment/sake_temperature_2"]]},{"cat":"glossary","name":"Kanzake method: yusen, chirori and thermometer (湯煎・ちろり)","ja":"燗酒のつけ方：湯煎とちろり","prefs":[],"text":"Kanzake is warmed sake. The named stages run hinata-kan about 30 C, hitohada-kan 35 C, nuru-kan 40 C, jo-kan 45 C, atsu-kan 50 C and tobikiri-kan 55 C or more, and one source adds shimofuri-kan around 70 C. Traditional warming is by water bath (yusen) in a chirori, usually of tin, brass or silver. A cooking thermometer is recommended; a tokkuri base that feels slightly hot suggests jo-kan, 45 to 50 C.","flavor":"Warming widens sweetness and umami and softens acid; higher heat sharpens alcohol.","use":"Junmai, honjozo and aged sake in the cold months; ceramic cups hold heat.","craft":"Take the bottle out of the bath before target temperature because it keeps rising; many sources treat 45 to 50 C as the most typical band. The 'atsukan' name strictly means about 50 C, though it is also used loosely for any warm sake.","src":[["Kuramotokai glossary: kan","https://www.kuramotokai.com/glossary/word/%E7%87%97"],["Hourai Shuzo: kanzake","https://www.sake-hourai.co.jp/sakehack/column/3654/"],["Nihon Meimonshu: sake temperatures","https://www.meimonshu.jp/modules/xfsection/html/gallery2/memo/seishu/mmc_ondo.html"]]},{"cat":"glossary","name":"Choki jukusei-shu: aged sake definition (長期熟成酒)","ja":"長期熟成酒（長期熟成酒研究会の定義）","prefs":[],"text":"The Reserve Sake Association (Choki Jukusei-shu Kenkyukai) defines aged sake as clear sake, excluding sugar-added types, stored at the brewery for at least 3 years; one source says 'zojo-shu' instead of sugar-added. There is no legal definition, unlike for tokutei meisho-shu. Colour moves from pale yellow through yamabuki to amber, and aroma develops caramel, honey and dried fruit. The association groups aged sake into three types: tanjuku (ginjo-type kept cool), chukan (junmai-type kept near room temperature) and nojuku (long room-temperature ageing, deep amber).","flavor":"Caramel, honey, dried fruit and nutty; deeper colour with age.","use":"Served cool or lightly warmed with rich dishes, or after a meal.","craft":"Vintage and ageing years are not mandatory on labels, so ask the brewery. This complements the separate koshu entry.","src":[["Sake Times: aged koshu and the association","https://jp.sake-times.com/knowledge/culture/sake_g_keyword_jyukuseikoshu"],["Gekkeikan: genshu, nigori, taru, koshu","https://www.gekkeikan.co.jp/enjoy/sake/type/type04.html"],["Sawanotsuru: koshu","https://www.sawanotsuru.co.jp/site/nihonshu-columm/knowledge/koshu/"]]},{"cat":"glossary","name":"Sakekasu types: ita-kasu, bara-kasu, neri-kasu, fumikomi-kasu (酒粕の種類)","ja":"酒粕の種類","prefs":[],"text":"Sakekasu is the solid pressed from moromi. Ita-kasu is the common sheet left by the press; it is hard and is softened in water or warm water. Bara-kasu is crumbled and softer. Neri-kasu is kasu kneaded to a paste that dissolves easily, used for marinating meat, fish and vegetables, and darkens with ageing. Fumikomi-kasu is trodden into a tank and aged several months, mainly for kasuzuke. Junmai kasu is said to keep rice umami and body, suiting kasujiru; ginjo kasu is sold as bara or neri.","flavor":"Rich, sweet-yeasty, with some alcohol; varies with the sake it came from.","use":"Kasujiru, kasuzuke, amazake and baking.","craft":"Choose by form: neri for pickling beds, ita softened for soup. The notes say ageing neri-kasu for over six months deepens the flavour.","src":[["Gekkeikan: sakekasu Q&A","https://www.gekkeikan.co.jp/enjoy/qa/sake/sake03.html"],["Hacco to go: ita, neri, bara","https://haccotogo.com/sakekasuchigai/"]]},{"cat":"glossary","name":"Kasujiru (粕汁, sake lees soup)","ja":"粕汁","prefs":[],"text":"Kasujiru is miso-style soup enriched with sake lees, typically with root vegetables, fish scraps or pork. A Gekkeikan recipe softens 100 g of finely torn kasu in 400 ml of strong dashi with 3 teaspoons of sake, then adds it to a pot of simmered daikon, carrot, konnyaku and abura-age, seasoned with salt or soy sauce. Junmai kasu is recommended for its rice flavour.","flavor":"Thick, warm, yeasty-sweet with umami from the lees.","use":"A winter soup with salmon, root vegetables or pork.","craft":"Soften the kasu in advance so it dissolves without lumps; add last and avoid hard boiling. The quantities are one maker's home recipe.","src":[["Gekkeikan: sakekasu recipe, kasujiru and amazake","https://www.gekkeikan.co.jp/enjoy/enjoy/recipe/recipe04.html"],["Gekkeikan: sakekasu Q&A","https://www.gekkeikan.co.jp/enjoy/qa/sake/sake03.html"]]},{"cat":"glossary","name":"Kasuzuke (粕漬け, sake lees pickling)","ja":"粕漬け","prefs":[],"text":"Kasuzuke pickles fish, meat or vegetables in a bed of sake lees. A common bed mixes kasu with mirin, sake, miso, sugar or salt. Fish and meat are wiped of the bed before grilling. The bed can be reused. Fumikomi-kasu and aged neri-kasu are the traditional bases.","flavor":"Sweet, yeasty, savoury; the protein softens and gains aroma.","use":"Grilled kasuzuke fish and pork; vegetable pickles.","craft":"Wipe off lees before grilling to avoid burning, since the sugar and solids char. Bed composition in the sources is a home recipe; adjust salt and sugar for the item.","src":[["Pal-system Daidokolog: kasuzuke","https://daidokolog.pal-system.co.jp/recipe/12000"],["Hacco to go: ita, neri, bara","https://haccotogo.com/sakekasuchigai/"]]},{"cat":"glossary","name":"Kasu amazake (酒粕の甘酒)","ja":"酒粕の甘酒","prefs":[],"text":"Amazake from sake lees is made by dissolving kasu in water and heating. One source dissolves 200 g of kasu in 800 cc water and boils it; another simmers 50 g kasu, 2 tablespoons sugar and 300 ml water for about 10 minutes, then strains and adds ginger. Because it contains alcohol, it must be heated well. One nutrition site gives 100 g of kasu as 215 kcal, 14.9 g protein and 5.2 g fibre; values vary by source.","flavor":"Sweet, creamy and yeasty, with ginger when added.","use":"A hot winter drink.","craft":"This differs from koji amazake, which is non-alcoholic. Heat long enough to drive off alcohol and warn guests it is not alcohol-free.","src":[["Gekkeikan: sakekasu recipe, kasujiru and amazake","https://www.gekkeikan.co.jp/enjoy/enjoy/recipe/recipe04.html"],["E-Recipe: amazake from sake lees","https://erecipe.woman.excite.co.jp/detail/2e479459def2ce400f4359a0380c3e69.html"],["Calorie Slism: sakekasu nutrition","https://calorie.slism.jp/117053/"]]},{"cat":"glossary","name":"Janome-choko (蛇の目猪口, kiki-choko tasting cup)","ja":"蛇の目猪口・利き猪口","prefs":[],"text":"The janome-choko, or kiki-choko, is the sake tasting cup with a blue double ring on the inside base of a white porcelain cup. The white shows colour depth and the blue shows clarity and brilliance. The name is said to come from the ring resembling a snake's eye, with a talisman meaning in one story. Hon-kiki cups are hand-painted over the glaze; nomi-kiki cups are painted and then glazed. A retailer says the official cup is used for the national new-sake appraisal, which is unconfirmed.","flavor":"The cup is for appraisal, not flavour; the thin rim and wide mouth show aroma.","use":"Tasting at competitions and breweries.","craft":"Judge with a clean, dry cup and consistent lighting; the blue ring helps spot haze and sparkle. The age of the cup tradition is stated without a primary source.","src":[["Sawanotsuru: janome-choko and tasting","https://www.sawanotsuru.co.jp/site/nihonshu-columm/enjoy/sake-tasting/"],["Tanoshii Osake: ochoko","https://tanoshiiosake.jp/6304"],["Gagyu-gama: double circle on ochoko","https://gagyu.shop-pro.jp/?mode=f139"]]},{"cat":"glossary","name":"Ochoko, guinomi, tokkuri, katakuchi and masu (酒器の種類)","ja":"お猪口・ぐい呑み・徳利・片口・枡","prefs":[],"text":"Ochoko is a small cup drunk in one swallow; guinomi is a size larger, for several sips. Tokkuri is a pouring flask with a narrow neck and full body. Katakuchi is a bowl with one spout for decanting at the table. Masu is a square wooden box used for masu-zake or as a catch for a glass. Chirori is a metal warming vessel used for yusen. Ceramic is thick and low in heat conduction, suiting warm sake; glass looks cool and suits chilled or sparkling sake.","flavor":"Material changes perceived temperature and mouthfeel: ceramic and wood feel warm on the lip, glass and metal feel cool.","use":"Match the vessel to temperature: ceramic for kan, glass for reishu.","craft":"A guinomi suits aromatic or aged sake that benefits from a larger surface; an ochoko keeps warm sake from cooling. Claims that vessels change taste are partly subjective.","src":[["Sawanotsuru: types of sake vessel","https://www.sawanotsuru.co.jp/site/nihonshu-columm/enjoy/type-of-shuki/"],["Kogei Japonica: sakeware types","https://kogei-japonica.com/media/crafts/sakeware-types/"]]},{"cat":"glossary","name":"Tin sake vessels (錫の酒器)","ja":"錫の酒器","prefs":[],"text":"Tin is used for sake vessels such as chirori, tokkuri and cups. It conducts heat well, so it serves for both chilled and warm sake. Commonly cited benefits such as an antibacterial effect or smoother taste are described in one source as having no clearly established scientific mechanism. Nousaku is named as a long-established maker.","flavor":"Cool, smooth touch; rapid temperature transfer.","use":"Chilled sake kept cold in a tin tokkuri; chirori for warming.","craft":"Heat moves fast, so tin cools and heats the sake quickly; handle with care when hot. Do not state a taste benefit as fact.","src":[["Kubotaya: tin sakeware and Nousaku","https://magazine.asahi-shuzo.co.jp/know/82"],["Sawanotsuru: types of sake vessel","https://www.sawanotsuru.co.jp/site/nihonshu-columm/enjoy/type-of-shuki/"]]},{"cat":"shochu","name":"Kogane Sengan (the standard imo shochu sweet potato)","ja":"黄金千貫（コガネセンガン）","prefs":[46],"text":"The reference cultivar of imo shochu. Skin and flesh are yellowish-white, the tuber turns sweet when steamed, and it is rich in the starch that alcoholic fermentation needs, so the same charge yields more spirit than with lower-starch potatoes. Makers describe the resulting shochu as full, round and sweet rather than sharply aromatic. Most koji styles (white, black, yellow) are run on it.","flavor":"Plump, round sweetness with a balanced, restrained potato aroma; less perfumed than Joy White.","use":"Base cultivar for everyday and premium imo shochu alike; the first cultivar to learn when comparing potato-driven styles.","craft":"Judge the spirit against the koji and still, not the potato alone; a white-koji, atmospheric-distilled bottle is where makers say the koji character shows most plainly, black koji is described as heavier and yellow koji as lighter and more fragrant. Trimming damaged parts before steaming matters because the potato spoils quickly after harvest. Starch yield per kilo is the commercial reason it dominates.","src":[["Tanoshii Osake: Kogane Sengan","https://tanoshiiosake.jp/8350"],["Honkaku Shochu & Awamori guide: potatoes used for imo shochu","https://guide.honkakushochu-awamori.jp/types-of-potatoes-used-for-imo-shochu/"],["Sanwa Shuzo: imo shochu production process","https://sanwashuzo.com/recipe/"]]},{"cat":"shochu","name":"Joy White (shochu-only sweet potato cultivar)","ja":"ジョイホワイト","prefs":[46],"text":"A white-fleshed sweet potato bred for distilling, released in 1994. One source calls it a Kogane Sengan derivative that is not sweet when cooked and unsuited for eating. It has more starch than Kogane Sengan, and a research paper on the Brewing Society of Japan journal reports that products from this beta-amylase-deficient white-fleshed potato have a fresh citrus note attributed to linalool.","flavor":"Bright citrus and floral lift, lighter and more perfumed than Kogane Sengan.","use":"Used where a maker wants a fruity, citrus-leaning imo shochu.","craft":"The citrus character comes from monoterpene alcohols freed from potato glycosides by koji and altered in distillation, so a fruity result depends on koji and still handling as well as the cultivar. Treat claims such as 'five times the linalool of Kogane Sengan' with caution: one source shows Kogane Sengan products also contain linalool, only less.","src":[["Tanoshii Osake: Joy White imo shochu","https://tanoshiiosake.jp/6667"],["NARO/affrc: sweet potato traits and characteristic aroma of imo shochu (J. Brew. Soc. Japan)","https://agriknowledge.affrc.go.jp/RN/2010770033.pdf"],["Shochu Kikou: imo shochu cultivars","https://www.shochu-kikou.com/chishiki/genryo07.html"]]},{"cat":"shochu","name":"Murasaki Masari (purple-fleshed sweet potato shochu)","ja":"ムラサキマサリ（紫芋焼酎）","prefs":[45,46],"text":"A purple sweet potato rich in anthocyanin. In shochu making the pigment reacts with the citric acid the koji produces, which is why the mash turns deep red; Kirishima Shuzo explains the name of its Aka-Kirishima this way. Purple-potato shochu is described as having a red-wine-like, yogurt-tinged fruity aroma. Sources disagree on whether Aka-Kirishima uses black koji or leaves the koji unstated.","flavor":"Fruity, wine-like aroma, mellow sweetness, often pitched at drinkers who find ordinary imo shochu heavy.","use":"Sold as a distinct, fruity-leaning imo shochu line; Aka-Kirishima is the best-known example.","craft":"The red colour comes from anthocyanin reacting with the citric acid the koji produces. Harvest quantities of the cultivar are limited, so such bottlings are often limited or seasonal.","src":[["Tanoshii Osake: Kirishima","https://tanoshiiosake.jp/3992"],["Nishinippon: Kuro-Kirishima overview","https://www.nishinippon.co.jp/yakusake/2022/04/29/kurokirishima/"],["Tanoshii Osake: Joy White (cultivar comparison)","https://tanoshiiosake.jp/6667"]]},{"cat":"shochu","name":"Coloured-flesh potato shochu (Beni Haruka, Annō, Tamaakane)","ja":"紅はるか・安納芋・玉茜などの芋焼酎","prefs":[46,45],"text":"Besides white and purple potatoes, makers use orange-fleshed or sweet table cultivars. A shochu named Satsuma Wakashio uses Beni Haruka and is described as mellowly sweet and fresh. Annō potato, an orange-fleshed cultivar generally known for beta-carotene, is used by some makers. Kirishima's Akane-Kirishima uses an orange-fleshed potato, Tamaakane. Search results gave no detailed flavour comparison between these cultivars.","flavor":"Softer, sweeter, rounder profiles than white-fleshed Kogane Sengan; character varies by maker.","use":"Positioned as approachable imo shochu; try straight or on the rocks to read the cultivar.","craft":"Table-type potatoes are high in sugar and low in starch relative to Kogane Sengan, so they are usually showcased rather than used for volume. When tasting cultivar-labelled bottles, hold koji and still constant between samples or the comparison is meaningless.","src":[["Honkaku Shochu & Awamori guide: potatoes used for imo shochu","https://guide.honkakushochu-awamori.jp/types-of-potatoes-used-for-imo-shochu/"],["Ienomi Style: choosing imo shochu by cultivar","https://www.ienomistyle.com/sakeguide/20190414-2571"],["Tanoshii Osake: Kirishima","https://tanoshiiosake.jp/3992"]]},{"cat":"shochu","name":"Terpene aroma of imo shochu (linalool, geraniol, citronellol)","ja":"芋焼酎の香気成分（モノテルペンアルコール）","prefs":[46],"text":"The floral and citrus notes of imo shochu come largely from monoterpene alcohols. Research summarised in the Brewing Society of Japan journal describes monoterpene glycosides in the sweet potato (geraniol, nerol) being liberated by koji enzymes and converted during distillation into citronellol, linalool and alpha-terpineol. Linalool is credited for the citrus note of Joy White products.","flavor":"Rose, citrus and muscat-like lift, as opposed to the earthy, roasted-potato 'kuse'.","use":"Explains why cultivar, koji and distillation together decide whether a bottle reads fruity or earthy.","craft":"Aroma is not set by cultivar alone: raw material handling, koji and distillation conditions all move it, and the study notes Kogane Sengan products also contain linalool, only in smaller amounts than Joy White products.","src":[["NARO/affrc: sweet potato traits and characteristic aroma of imo shochu","https://agriknowledge.affrc.go.jp/RN/2010770033.pdf"],["NARO/affrc: effect of cultivation period on potato quality and shochu","https://agriknowledge.affrc.go.jp/RN/2010912373.pdf"],["Sweet Potatoes: what the 'kuse' of imo shochu is","https://sweetpotatoes.jp/imo_shotyu_kuse/"]]},{"cat":"shochu","name":"Imo shochu mash sequence (trim, steam, crush, second mash)","ja":"芋焼酎の仕込み工程（選別・蒸し・破砕・二次仕込み）","prefs":[46],"text":"Makers describe a common sequence: wash the harvested potatoes and cut off tips and damaged parts, steam them, cool to charging temperature, crush, then add the crushed potato and water to a first mash (koji, yeast and water) to make the main mash in the second stage. Yamato Shuzo adjusts cooling time to the season to hit the target charging temperature; Yoshinaga trims both ends and bad parts on a belt conveyor.","flavor":"Process entry: the quality of the trimming and steaming shows up as clean sweetness versus off, rotten notes.","use":"Reference for judging a kura's discipline during a visit or when reading its production notes.","craft":"Sweet potatoes spoil quickly after harvest, so early, piece-by-piece sorting and removal of bruised parts is the key control. Crushing evenly supports an even ferment. The first mash gets koji and yeast; the steamed, crushed potato goes into the second stage.","src":[["Ogatama (Yamato Shuzo): manufacturing process","https://www.ogatama.co.jp/manufacturing/"],["Yoshinaga Shuzo: production process","https://yoshinagashuzo.wixsite.com/index/manufacture"],["Takara Shuzo: how imo shochu is made","https://sakabanashi.takarashuzo.co.jp/cat2/sweetpotato_shochu_220311"],["Sanwa Shuzo: production process","https://sanwashuzo.com/recipe/"]]},{"cat":"shochu","name":"Shiro-koji (white koji) shochu","ja":"白麹仕込み","prefs":[46,45],"text":"White koji arose as a mutation inside black koji; Kawachi Genichiro isolated and pure-cultured it and named it, said to be around Taisho 7 (1918). Like black koji it makes citric acid, which protects the mash in hot weather, but it gives a soft, rounded, fluffy-potato character and is easier to handle because it does not blacken workspaces with spores. Sources say black and white koji together are used in about 80 percent of honkaku shochu.","flavor":"Soft, mellow, gently sweet potato aroma; easy to drink.","use":"Typical of approachable imo shochu such as Shiro-Kirishima, which uses white koji.","craft":"Because white koji lowers the pH like black koji, it brought safe mashing without the staining of black koji. The 'about 80 percent' figure is a promotional claim from a koji supplier and should be read as approximate.","src":[["Akarui Nouson: koji used in imo shochu","https://akarui-nouson.jp/koji_used_in_shochu/"],["Kawachi Kin Honpo: Kawachi Genichiro","https://www.kawauchi.co.jp/shop/pages/kawachi_genichiro"],["Kawachi Kin Honpo: yellow, white and black koji","https://www.kawauchi.co.jp/shop/pages/kawachikin"]]},{"cat":"shochu","name":"Kuro-koji (black koji) shochu","ja":"黒麹仕込み","prefs":[46,45],"text":"Black koji was the koji of Okinawan awamori. Kawachi Genichiro, noting its citric acid production, brought it to Kagoshima in Meiji 43 (1910). The acid suppresses contaminating bacteria, making mashing safe in the hot climate. It gives strong potato aroma, body and a cutting finish. Kirishima's founding shochu was black-koji made, and Kuro-Kirishima is presented as carrying on that line.","flavor":"Heavy, rich, with 'koku' and a sharp, clean finish.","use":"Used where a pronounced potato character is wanted; Kuro-Kirishima is presented as the heir of Kirishima's original black-koji shochu.","craft":"The point of black koji is acidification: citric acid lowers the mash pH and holds back bacteria, which is what yellow koji could not do in the heat. Spore blackening of the workplace is a nuisance that white koji later avoided.","src":[["Akarui Nouson: koji used in imo shochu","https://akarui-nouson.jp/koji_used_in_shochu/"],["Kuroisa (Oguchi Shuzo): the secrets of koji","https://kuroisa.jp/entry/trivia-02/"],["Kawachi Kin Honpo: Kawachi Genichiro","https://www.kawauchi.co.jp/shop/pages/kawachi_genichiro"]]},{"cat":"shochu","name":"Ki-koji (yellow koji) shochu","ja":"黄麹仕込み","prefs":[46],"text":"Yellow koji is the sake, miso and shoyu koji. Until about the end of Meiji most shochu was made with it, but it makes almost no citric acid, so in Kyushu's heat mashes often fell to bacteria and spoiled. After black and white koji took over it nearly disappeared, and it has been revived recently for a fruity, ginjo-like aroma. Nishi Shuzo's Tominohozan, made with Kogane Sengan and yellow koji at low fermentation temperature, is the best-known example.","flavor":"Fruity, floral, sake-like aroma; light and clean.","use":"Used for fruity, modern imo shochu such as Tominohozan.","craft":"With little citric acid the mash is at risk, so makers have to manage the ferment carefully; Tominohozan is described as fermented at low temperature with a ginjo yeast.","src":[["Tanoshii Osake: yellow koji shochu","https://tanoshiiosake.jp/6571"],["Akarui Nouson: koji used in imo shochu","https://akarui-nouson.jp/koji_used_in_shochu/"],["Hasegawa Saketen: Tominohozan","https://www.hasegawasaketen.com/eshop/products/detail/3944"]]},{"cat":"producer","name":"Kawachi Genichiro and Kawachi Kin Honpo (koji suppliers)","ja":"河内源一郎・河内菌本舗","prefs":[46],"text":"Called the father of modern shochu. He brought the citric-acid-producing black koji of awamori to Kagoshima in Meiji 43 (1910) and later selected a white mutant from it, pure-cultured and named white koji around Taisho 7. His company still sells koji spores (moyashi) to brewers. A claim on the supplier's own page says his white and black koji are designated as the national fungus and used in about 80 percent of honkaku shochu.","flavor":"Not applicable: a koji (moyashi) supplier rather than a spirit.","use":"Reference when reading why a mash is black, white or yellow koji, and when asking a kura where its koji comes from.","craft":"The business model is moyashi: pure-cultured spores that makers inoculate onto steamed rice. Ask which strain a kura uses; the choice of strain is as much a style decision as the potato.","src":[["Kawachi Kin Honpo: Kawachi Genichiro","https://www.kawauchi.co.jp/shop/pages/kawachi_genichiro"],["Kawachi Kin Honpo: yellow, white and black koji","https://www.kawauchi.co.jp/shop/pages/kawachikin"],["Shochu Next: 10 questions on koji at Kawachi Genichiro Shoten","https://shochu-next.com/article/13887"]]},{"cat":"shochu","name":"Genatsu (reduced-pressure) distillation","ja":"減圧蒸留","prefs":[45,46,44],"text":"Distillation in a vacuum-pumped still where pressure is cut to roughly one tenth of atmospheric, so the mash boils at about 40 to 50 degrees C instead of 85 to 95. Fewer heat-generated compounds reach the spirit, giving a light, clean, easy-drinking profile. Examples of reduced-pressure shochu named in sources include sesame Beni Otome and soba Unkai.","flavor":"Light, clean, fresh; fruit aromatics preserved, little heavy or roasted note.","use":"Chosen for lighter, cleaner spirit; e.g. Beni Otome and Unkai are reduced-pressure.","craft":"Nishi Yoichiro of Nishi Shuzo cautions against the simple rule 'atmospheric means heavy, reduced means light', and Iichiko-style makers state the right method depends on target spirit. Some distillers start atmospheric and switch to reduced pressure during the run to capture aroma, as Tominohozan is described.","src":[["Shochu Press: reduced vs atmospheric distillation","https://shochupress.com/2022/02/15/shochu_genatsu/"],["Iichiko: atmospheric vs reduced pressure","https://style.iichiko.co.jp/attraction/20220805/0154/"],["Denen Shuzo: distillation methods","https://shop.denen-shuzo.co.jp/blog/distillation-denen/"],["Shochu Next: Nishi Yoichiro on distillation","https://shochu-next.com/article/5237"]]},{"cat":"shochu","name":"Joatsu (atmospheric-pressure) distillation","ja":"常圧蒸留","prefs":[46,45,43],"text":"Distillation at normal air pressure, the mash boiling at about 85 to 95 degrees C. The heat carries over raw-material aroma plus compounds formed by heating, so the spirit tends to be full and rich, with plenty of body. Sources are not unanimous: some say atmospheric distillation can bring more off-notes, while Nishi Shuzo rejects the simple rule that atmospheric is heavy and reduced is light.","flavor":"Full-bodied, rich, roasted and sweet, with grain and potato character.","use":"Chosen for full-bodied, richly flavoured spirit.","craft":"Heating-derived components go into the spirit, so a maker's choice of cuts and still shapes the result. Wooden stills used by some kura are said to soften and thicken the spirit. Be sceptical of absolute statements: sources disagree on which method gives fewer off-flavours.","src":[["Kuge Honten: distillation methods","https://kugehonten.jp/category16/entry66.html"],["Iichiko: atmospheric vs reduced pressure","https://style.iichiko.co.jp/attraction/20220805/0154/"],["Shochu Next: Nishi Yoichiro on distillation","https://shochu-next.com/article/5237"]]},{"cat":"shochu","name":"Kame-tsubo jikomi (ceramic-jar mashing)","ja":"甕壺仕込み","prefs":[46],"text":"Mashing in buried ceramic jars rather than stainless tanks. Makers describe the first mash and second mash both being run in jars, many of them set in the ground so temperature stays stable. Satsuma Musou ferments in 500 to 600 litre jars, then distils in a wooden still; Tamura's Kametsubo Junkuro uses jars in use since its founding in Meiji 30. The round jar is said to promote convection in the mash.","flavor":"Rounded, earthy, gently thick, often described as soft.","use":"Signals a traditional, hands-on kura; read the label for which stage uses jars.","craft":"Kumamoto Regional Taxation Bureau is cited as saying there is no explicit rule for the label term 'kame-tsubo jikomi', so some makers print it only when jars are used for both mashes. Specifics such as stirring frequency were not found in the search results.","src":[["Hamada Shuzo: kame and shochu","https://www.hamadasyuzou.co.jp/denbee/column/post_8.html"],["Kame-tsubo jikomi explained","http://44471.jp.net/know/kametsubo/"],["Satsuma Musou: Kametsubo Jikomi","https://satsumamusou.co.jp/products/kametsubojikomi_1800ml"],["Akugare: charm of ceramic-jar shochu","https://www.akugare.jp/6498/"]]},{"cat":"shochu","name":"Wooden-vat still (kidaru jouryuuki)","ja":"木樽蒸留器","prefs":[46],"text":"A still made of staves of cedar over 80 years old held by bamboo hoops, with no nails or glue. One maker says only one craftsman, Tsuru Yasuro of Osumi in Soo, Kagoshima, builds them; other sources say just a few. Wood retains heat and lets some gas and alcohol seep through the joints, giving a softer, thicker, more refined spirit with a lower proof than stainless distillation. Shirakane says it lasts only 5 to 6 years, others say 4 to 5; Denbee replaces its still every 5 years.","flavor":"Soft, thick and refined, slightly woody; milder than stainless-still spirit.","use":"Seen as a marker of traditional craft; only a minority of kura use one.","craft":"Staves shrink and hoops loosen, causing leaks and rot, so replacement on a roughly 4 to 6 year cycle is the cost of the method. Of Kagoshima's 112 kura, only a few use wooden stills.","src":[["Hamada Shuzo Denbee: wooden-vat still","https://www.hamadasyuzou.co.jp/denbee/column/post_129.html"],["Shirakane Shuzo: wooden still","https://www.shirakane.jp/obsession/cask/"],["Shochu Press: wooden-vat still","https://shochupress.com/2022/01/26/shochu_kidaru/"],["Fukoku Life: wooden still craftsman Tsuru Yasuro","https://web-ic.fukoku-life.co.jp/japan-vision/127.html"]]},{"cat":"glossary","name":"Honkaku shochu vs 'kou' shochu (legal classes)","ja":"本格焼酎・甲類・乙類","prefs":[],"text":"Under the liquor tax law, continuous-still shochu (kou-rui) must be under 36 percent ABV; single-still shochu (otsu-rui, honkaku) is at 45 percent or less. Since the 2006 tax reform the legal terms are renzokushiki jouryu and tanshiki jouryu shochu. Honkaku shochu requires single distillation, grain/potato/sake-lees/brown-sugar or designated ingredients plus koji, and no additives other than water.","flavor":"Terminology: honkaku is the flavourful, ingredient-driven class; kou-rui is neutral.","use":"Read on labels; honkaku and awamori are the classes covered by the trade association.","craft":"Koji raw materials must be grain or potato. Designated ingredients may not exceed the main ingredient in quantity. 'Honkaku' is the common name for single-still spirit, but the formal tax categories decide what a label can claim.","src":[["Honkaku Shochu & Awamori Association: classification","https://www.honkakushochu-awamori.jp/about-shochu-and-awamori/classification-of-shochu-and-awamori/"],["Tanoshii Osake: kou vs otsu","https://tanoshiiosake.jp/8970"],["Tanoshii Osake: honkaku shochu definition","https://tanoshiiosake.jp/9585"],["Tokyo Regional Taxation Bureau: shochu","https://www.nta.go.jp/about/organization/tokyo/sake/abc/abc-shochu.htm"]]},{"cat":"glossary","name":"Designated ingredients (shitei butsuhin) for honkaku shochu","ja":"指定物品（本格焼酎の特殊原料）","prefs":[],"text":"Beyond grains, potatoes, sake lees and brown sugar, the NTA Commissioner designates other ingredients allowed in honkaku shochu. One source gives 49 items. Examples quoted from the NTA list include ashitaba, adzuki, aloe, pumpkin, chestnut, green peas, Asian ginseng, ginkgo nut and milk. They may not exceed the base ingredient in amount.","flavor":"Glossary: explains why shochu from chestnut, carrot or pumpkin can still be labelled honkaku.","use":"Look here when a bottle lists an unusual ingredient and ask whether it is a base or a designated additive.","craft":"Koji must still come from grain or potato. Whether soba or potato qualify under this list was not confirmed by the search results; soba is a main grain-class ingredient, so check the NTA text directly for exact status.","src":[["Shochu Next: unusual ingredient shochu","https://shochu-next.com/article/15192"],["Tanoshii Osake: honkaku shochu definition","https://tanoshiiosake.jp/9585"],["Honkaku Shochu & Awamori Association: classification","https://www.honkakushochu-awamori.jp/about-shochu-and-awamori/classification-of-shochu-and-awamori/"]]},{"cat":"glossary","name":"Shochu and awamori Geographical Indications (GI)","ja":"地理的表示（焼酎・泡盛のGI）","prefs":[],"text":"Iki (barley, Nagasaki), Kuma (rice, Kumamoto) and Ryukyu (awamori, Okinawa) were designated on 30 June 1995; Satsuma (imo shochu, Kagoshima excluding Amami city and Oshima district) on 22 December 2005; and Tokyo Shimazake on 13 March 2024, the first shochu GI in 18 years and the fifth overall. NTA records show the first three were revised on 27 February 2018. One column says Iki's trademark-law designation dates 3 October 1995.","flavor":"Glossary: origin protection, not a flavour grade.","use":"A GI on the label guarantees origin and process, such as local water and local fermentation.","craft":"Each GI fixes raw material, koji and place: Iki specifies barley only, single distillation, and rice koji; Tokyo Shimazake fixes barley koji and island water. Check the NTA standard for the exact wording.","src":[["NTA: Geographical indications of liquor (2018)","https://www.nta.go.jp/about/council/chiri-bunkakai/190331/pdf/005.pdf"],["Kokubu: geographical
