enu/menu/izumosoba_shimane.html"],["Shimane Prefecture, Shinjiko shichin","https://www.pref.shimane.lg.jp/industry/suisan/shinkou/kawa_mizuumi/yutakana/shiichin.html"],["Shimane tourism, local dishes","https://www.kankou-shimane.com/pickup/12656.html"],["Matsue Tourism Association, tea and wagashi","https://www.kankou-matsue.jp/omoshiro/ocha-wagashi"]]},{"pref":33,"history":"Okayama faces the Seto Inland Sea, whose island-studded seascape (MAFF) supports boat fishing and nori and oyster farming. The prefecture's festive cooking grew around that sea: small oily fish such as mamakari (sappa) pickled in vinegar, and a mixed-topping sushi served at celebrations. Origins of bara-zushi are disputed: one account ties it to Edo-period sumptuary edicts (one soup, one dish), another to a boatmen's 'doburoku-meshi'. Neither is firmly documented.","character":"The logic is vinegar and sweetness applied to Inland Sea fish and seasonal vegetables, built for festivals and family celebrations. Mamakari is cured in vinegar and laid on sushi rice; bara-zushi (also called matsuri-zushi or Bizen bara-zushi) mixes sea produce and colourful seasonal vegetables into or onto the rice. Alongside these the MAFF page lists dishes made with ishimochi-jako (fried drops) and akiami (small shrimp). The 20th-century counterpart is demi-katsudon: tonkatsu under hot demi-glace.","staples":[{"name":"Mamakari-zushi","ja":"ままかりずし","note":"Vinegar-pickled mamakari (sappa) on sushi rice; MAFF lists it for the Seto Inland Sea coast, best around October, a staple of festivals and family celebrations."},{"name":"Mamakari su-zuke","ja":"ママカリの酢漬け","note":"The vinegar-pickled fish on its own, listed as a separate MAFF dish; the base preparation for the sushi."},{"name":"Okayama bara-zushi","ja":"岡山ばらずし (まつりずし)","note":"Festive sushi of sea produce and seasonal vegetables; also called matsuri-zushi or Bizen bara-zushi; MAFF treats it as a dish for special days."},{"name":"Demi-katsudon","ja":"デミカツ丼","note":"Fried pork cutlet on rice with hot demi-glace; credited to Ajitsukasa Nomura (now Katsudon Nomura), founded in Showa 6 (1931); listed on MAFF's Uchi no Kyodo Ryori."},{"name":"Ishimochi-jako no otoshi-age","ja":"いしもちじゃこの落とし揚げ","note":"Fried drops of small fish (ishimochi-jako), cited by MAFF as an example of Inland Sea cooking beyond mamakari."},{"name":"Akiami dishes","ja":"アキアミ料理","note":"Dishes using akiami (small shrimp), named by MAFF among Seto Inland Sea home dishes; specific recipes not detailed in the sources seen."},{"name":"Sappa (mamakari) as ingredient","ja":"サッパ (ママカリ)","note":"Fish in the herring family caught mainly in the Inland Sea; name is said to come from eating so much rice that one had to borrow (mama kari) more from a neighbour."},{"name":"Oyster and nori (farmed)","ja":"かき・のり養殖","note":"MAFF's regional story names nori and oyster aquaculture as major local fisheries; quantities not given in the sources seen."}],"calendar":[{"season":"Spring","text":"The sources consulted give no month-by-month data for spring. Bara-zushi and mamakari-zushi are tied to festivals and family celebrations rather than to a fixed month, so they appear whenever local matsuri and family events fall."},{"season":"Summer","text":"No summer-specific items were stated in the sources reviewed. Festive sushi remains an event dish rather than a seasonal one, and the farmed fisheries (nori, oysters) named by MAFF are not dated by month in the pages seen."},{"season":"Autumn","text":"October is given as the peak for mamakari (sappa), when the fish is fattiest and best for vinegar curing; this is the one month stated in the MAFF material. Mamakari-zushi is correspondingly an autumn matsuri dish."},{"season":"Winter","text":"Sources seen give no winter items for Okayama specifically. Oysters are farmed in the Inland Sea (MAFF), but the pages reviewed do not state months or varieties; check local fishery cooperatives for season dates."}],"markets":[{"name":"Katsudon Nomura (Okayama City)","ja":"カツ丼 野村","note":"Descended from Ajitsukasa Nomura (founded Showa 6/1931), the shop credited with demi-katsudon. A restaurant rather than a market; no market data found in the sources."},{"name":"Misono-zushi (Bara-zushi recipe source)","ja":"美苑鮨 (みそのずし)","note":"Restaurant whose bara-zushi recipe is published in the 100 Selected Rural Dishes recipe series; a reference point for the dish, not a market."}],"notes":"Mamakari-zushi and bara-zushi are both among the 100 Selected Rural Dishes (Nosanson Kyodo Ryori Hyakusen, MAFF). Mamakari is now more often eaten in restaurants than made at home (Wikipedia). Origin stories for bara-zushi (sumptuary edicts, boatmen's doburoku-meshi) are traditions, not documented fact. Demi-katsudon is cited by MAFF as an Okayama local bowl. I found no market or GI details in the sources searched.","src":[["MAFF Uchi no Kyodo Ryori: Mamakari-zushi (Okayama)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/41_27_okayama.html"],["MAFF Uchi no Kyodo Ryori: Okayama regional story","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/area_stories/okayama.html"],["MAFF Uchi no Kyodo Ryori: Okayama dish list","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/area/okayama.html"],["100 Selected Rural Dishes recipe: Bara-zushi","https://www.location-research.co.jp/kyoudoryouri100/recipe/recipe/330224"]]},{"pref":34,"history":"Hiroshima Bay is fed by rivers such as the Ota and sheltered by islands and capes, calm and rich in plankton, which suits oyster farming (Hiroshima city documents). Oysters have become the prefecture's defining product; dote-nabe is said to be tied to oyster boats that sold oysters in Osaka. Anago-meshi on Miyajima began as an ekiben in the Meiji period and spread through Showa-30s tour-bus lunch boxes (MAFF).","character":"Flavour logic centres on the Inland Sea shellfish and fish, with miso, soy and sweet-savoury sauces. Dote-nabe lines the pot rim with a ridge of miso that is dissolved into the broth as oysters and vegetables cook. Anago is split along the back and grilled with kabayaki-type seasoning over rice. Okonomiyaki is built in layers on a thin spread batter rather than mixed, steamed-grilled, with noodles (soba or udon) inside.","staples":[{"name":"Hiroshima oyster","ja":"広島かき","note":"Grown by raft hanging-culture (or basket culture) mainly in central and western Hiroshima waters; 16,129 t shucked in 2023, 62.9% of national output."},{"name":"Kaki no dote-nabe","ja":"かきの土手鍋","note":"Oysters and vegetables in a pot whose inner rim is coated with miso; eaten January to February; also certified as a 100-year food; three theories for the name."},{"name":"Kaki-meshi","ja":"かき飯","note":"Oyster rice, listed on MAFF's Uchi no Kyodo Ryori for Hiroshima; details not captured in the sources seen."},{"name":"Kaki-zoni","ja":"かき雑煮","note":"Oyster New Year soup listed by MAFF for Hiroshima."},{"name":"Anago-meshi","ja":"あなご飯","note":"Kabayaki-grilled conger on rice; MAFF gives Miyajima-cho (Hatsukaichi) and Hiroshima city, debut as an ekiben in the Meiji period."},{"name":"Nigome","ja":"煮ごめ","note":"A Hiroshima home dish listed by MAFF; composition not stated in the sources seen."},{"name":"Bishu-nabe","ja":"美酒鍋","note":"A pot dish listed by MAFF for Hiroshima; recipe details not captured in the sources seen."},{"name":"Hiroshima-na pickles","ja":"広島菜漬け","note":"Large, thick-leaved traditional vegetable with a wasabi-like pungency; pickles recorded as a Hiroshima domain local food."},{"name":"Hiroshima-style okonomiyaki","ja":"広島風お好み焼き","note":"Thin batter spread, ingredients layered not mixed and steamed-grilled; contains soba or udon noodles."}],"calendar":[{"season":"Spring","text":"The sources consulted do not give month-by-month spring items. Oyster shipping is described as a seasonal fresh trade in the Hiroshima fishery guidance, but the pages seen state no spring months or dishes for the prefecture."},{"season":"Summer","text":"No summer-specific dishes were stated in the sources reviewed. Anago is described as caught near oyster rafts, where small fish gather, but no months are given in the pages seen, so season dates should be checked locally."},{"season":"Autumn","text":"Sources seen do not give autumn months for Hiroshima. Oyster farming is a long hanging-culture cycle; the pages reviewed give totals and shipping shares (about 31% fresh, 69% frozen or processed in the 2024 guidance) rather than dates."},{"season":"Winter","text":"January and February are the season given for kaki no dote-nabe (MAFF). Oyster cooking is the winter centre of the cuisine: dote-nabe, kaki-meshi and kaki-zoni, the New Year oyster soup, are all listed by MAFF."}],"markets":[{"name":"Miyajima-cho (Hatsukaichi)","ja":"宮島町 (廿日市市)","note":"MAFF names it as a main area for anago-meshi, eaten by visitors and sold as souvenir."},{"name":"Hiroshima city restaurants","ja":"広島市内","note":"Listed alongside Miyajima as an anago-meshi area by MAFF; guides name okonomiyaki as a staple here. No specific market named in the sources."}],"notes":"Hiroshima accounts for about 62 to 65% of national oyster output depending on year (61.0% to 64.6% for 2018 to 2023 in a prefectural table; sources use differing counts). Dote-nabe has three competing name theories (miso embankment, an inventor's name, oyster boats on river embankments). Anago-meshi was a Meiji ekiben before becoming Miyajima fare. Oyster output is quoted as shucked weight. The sources did not support details of lemons or Setoda.","src":[["Hiroshima City: oyster production","https://www.haff.city.hiroshima.jp/info/suisansc/oyster/production/"],["MAFF Uchi no Kyodo Ryori: Kaki no dote-nabe","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/42_4_hiroshima.html"],["MAFF Uchi no Kyodo Ryori: Anago-meshi","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/42_30_hiroshima.html"],["Hiroshima Prefecture food culture survey","https://comp.life.isct.ac.jp/gnavi/food_culture_survey/results/hiroshima/"]]},{"pref":35,"history":"Yamaguchi faces both the Sea of Japan and the Seto Inland Sea, with Shimonoseki at the strait. Choshu domain is recorded as enforcing the ban on eating fugu most strictly in the Edo period; the ban was lifted in Meiji 21 (1888). Iwakuni, a castle town of the Kikkawa domain, produced its own box-pressed sushi and ceremonial dishes. Origin stories for these are traditional, and sources differ.","character":"Winter fugu is the prefecture's headline product, handled in Shimonoseki (called fuku locally). Iwakuni cooking is built for large gatherings: oodaira, a stew of chicken, taro and lotus root in a big lidded lacquer bowl, and a multi-tier press sushi made in quantity. Kawara soba, soba noodles grilled on a roof tile, is a modern local dish with disputed origin. Ceremonial vessels and weights shape the techniques.","staples":[{"name":"Fugu (fuku)","ja":"ふぐ (ふく)","note":"Shimonoseki is called Japan's largest fugu handling centre; a winter delicacy listed first in MAFF's Yamaguchi page."},{"name":"Haedomari bag auction","ja":"南風泊の袋競り","note":"Fugu priced by hand-signs inside a black bag; only the fugu-specialist Haedomari market is said to still use it."},{"name":"Iwakuni-zushi","ja":"岩国寿司","note":"Box-press sushi layered up to five tiers under weights, dozens of portions at once; also called tonosama-zushi; tied to the Kikkawa castle town."},{"name":"Oodaira","ja":"大平","note":"Iwakuni stew of chicken, taro and lotus root served in a flat, large lidded lacquer bowl, up to about 50 cm across, at ceremonies."},{"name":"Kawara soba","ja":"瓦そば","note":"Soba grilled on a roof tile; origin credited to a Kawatana onsen ryokan or to Toyoura, Shimonoseki; Seinan War soldiers grilling meat on tiles is the anecdote."},{"name":"Uiro","ja":"ういろう","note":"Steamed confection of warabi (or kuzu) starch, red bean and sugar; said to date to Muromachi; Edo-period Mori souvenir."},{"name":"Whale dishes (Shimonoseki)","ja":"くじら料理","note":"Shimonoseki's whale cooking appeared in search results; no further detail captured."},{"name":"Fugu sashimi and nabe","ja":"ふぐ刺し・ふぐ鍋","note":"The two standard fugu preparations listed by regional guides; no recipe or ratio details in the sources seen."}],"calendar":[{"season":"Spring","text":"The sources consulted give no spring-specific data for Yamaguchi. Iwakuni-zushi and oodaira are served at gatherings and ceremonies, so they appear whenever such events fall rather than in one named month."},{"season":"Summer","text":"No summer items were stated in the sources reviewed. Kawara soba is a year-round restaurant dish in the guides seen, and natural fugu landings are not described as a summer product in the pages consulted."},{"season":"Autumn","text":"Sources seen give no autumn months. Fugu is a winter delicacy per MAFF, so autumn is the lead-up to the season; check local reports for the opening of the fugu trade and prices."},{"season":"Winter","text":"Fugu is the winter delicacy (MAFF). The new-year first auction (hatsuseri) at Shimonoseki marks the season's opening; a recent report put the first-auction volume of natural and farmed fugu at about 2,610 kg."}],"markets":[{"name":"Haedomari Market","ja":"南風泊市場","note":"Shimonoseki's fugu-only wholesale market; hosts the hand-in-bag auction and the new-year first auction."},{"name":"Shunpanro (Shimonoseki)","ja":"春帆楼","note":"Restaurant recognised as the first licensed fugu house after the lifting of the ban; its Ito Hirobumi story is contested."}],"notes":"Fugu handling requires licensed processors under Ministry of Health, Labour and Welfare guidance. The tale that Ito Hirobumi ate fugu at Shunpanro in 1887 and prompted the 1888 lifting of the ban is widely repeated but disputed by food historians; treat it as legend. Natural torafugu landings are reported to have fallen from about 2,000 t a year at the peak to about 100 t or less (testimony in a government climate-adaptation interview).","src":[["Climate adaptation platform: Shimonoseki fugu","https://adaptation-platform.nies.go.jp/data/interview/cs-062.html"],["Fugu-sakai Magazine: Haedomari bag auction","https://www.fugu-sakai.com/magazine/learn/3481/"],["MAFF Uchi no Kyodo Ryori: Oodaira (Yamaguchi)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/43_8_yamaguchi.html"],["100 Selected Rural Dishes: Yamaguchi","http://www.location-research.co.jp/kyoudoryouri100/ryouri/35.html"]]},{"pref":36,"history":"In the Iya valley of Miyoshi, in Tokushima's mountains, rice was scarce, so buckwheat grown on the slopes was eaten as a substitute (sources seen). Soba is said to have been brought by fleeing Heike warriors, a legend rather than a documented fact. The grain is eaten whole as soba-gome. The sources consulted for this page say little about the coastal side of Tokushima, so this entry covers the mountain tradition.","character":"The defining technique is eating buckwheat as a kernel: the seed is boiled in salted water, hulled and dried to make soba-gome, then simmered into a zosui with chicken and vegetables. Iya soba is the milled form: harvested buckwheat is sun-dried for about a month, threshed and ground, and served at celebrations and for guests. School meals reuse the soba-gome soup with Awa-odori chicken.","staples":[{"name":"Soba-gome zosui","ja":"そば米雑炊","note":"Porridge of whole boiled-hulled-dried buckwheat kernels with chicken and vegetables; from Iya in Miyoshi; New Year dish in the Heike legend."},{"name":"Soba-gome","ja":"そば米","note":"Buckwheat seed boiled in salted water, hulled and dried; the unmilled form is distinctive to Tokushima's cooking."},{"name":"Iya soba","ja":"祖谷そば","note":"Buckwheat sun-dried about a month after cutting, then threshed and milled; for celebrations and hospitality; Heike legend tradition."},{"name":"Soba-gome jiru (school lunch)","ja":"そば米汁","note":"Soup version of the zosui used in school lunches, smaller portion to suit rice meals."},{"name":"Awa-odori chicken","ja":"阿波尾鶏","note":"Tokushima's specialty chicken; used in school-lunch soba-gome soup."},{"name":"Iya buckwheat","ja":"祖谷のそば","note":"Slope-grown buckwheat of Miyoshi's Iya district, substitute staple where rice was scarce."}],"calendar":[{"season":"Spring","text":"The sources reviewed give no spring data for Tokushima. Soba-gome zosui is described as a household and school-lunch dish without a named season, so use local sources for spring availability."},{"season":"Summer","text":"No summer items were stated in the sources consulted. The sun-drying of cut buckwheat (about one month) is described, but the harvest months are not given in the pages seen, so dates should be confirmed locally."},{"season":"Autumn","text":"Not dated in the sources. Buckwheat is cut and dried in the sun for about a month before threshing and milling (MAFF), which implies a harvest-time job, but the pages seen do not give the month."},{"season":"Winter","text":"Legend says that defeated Heike (Genpei) warriors made soba-gome zosui at New Year to remember the capital; New Year is the occasion tied to the dish in that tradition, though not documented as fact."}],"markets":[{"name":"Iya district, Miyoshi","ja":"三好市祖谷","note":"Home of soba-gome zosui and Iya soba; the main traditional area per MAFF and related pages."},{"name":"Awa Ikeda souvenir shops","ja":"阿波池田","note":"A producer in Awa-Ikeda sells soba-gome zosui and won an agriculture minister's award; no market named in the sources."}],"notes":"Soba-gome zosui is a traditional dish of the Iya district of Miyoshi, with the prefecture as a wider area; the Heike origin is legend. Some dishes use Awa-odori chicken. Naruto wakame, sudachi and Naruto kintoki are Tokushima products I searched for but the sources returned do not support any details, so none are described here. Tokushima's coastal food culture remains to be researched.","src":[["MAFF Uchi no Kyodo Ryori: Iya soba","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/44_5_tokushima.html"],["MAFF Uchi no Kyodo Ryori: Tokushima list","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/area/tokushima.html"],["Zengakuei: Soba-gome zosui","https://www.zengakuei.or.jp/kyodosyoku/pref/tokushima_1.html"],["100 Selected Rural Dishes recipe: Soba-gome zosui","https://www.location-research.co.jp/kyoudoryouri100/recipe/recipe/360162"]]},{"pref":37,"history":"Kagawa has a warm, low-rainfall climate that suits wheat; salt, shoyu and iriko were easy to obtain locally, which is cited as the foundation of udon culture (food-culture sources). Shodoshima's shoyu brewing is linked to the island's sweet-savoury shoyu-mame. The festival dishes are bound to the calendar: an-mochi zoni was an Edo-period New Year dish in Takamatsu, though sources differ on the exact era.","character":"Iriko (dried anchovy), shoyu and sugar underlie the cuisine. Sanuki udon is built on local wheat, salt and shoyu with iriko dashi. An-mochi zoni sets anko-filled mochi in white miso and iriko stock with daikon and kintoki carrot. Shoyu-mame roasts fava beans before steeping them in a shoyu, sugar and chili liquid, giving a crumbly bite. Sugar, once a luxury, features in festive dishes.","staples":[{"name":"Sanuki udon","ja":"讃岐うどん","note":"Udon on local wheat, salt and shoyu with iriko; cited as rooted in the warm, low-rainfall climate."},{"name":"An-mochi zoni","ja":"あんもち雑煮","note":"Anko-filled mochi in white miso and iriko stock with daikon and kintoki carrot; New Year dish of Takamatsu since the Edo period."},{"name":"Shoyu-mame","ja":"しょうゆ豆","note":"Roasted fava beans steeped in shoyu, sugar and chili; keeps well; can stand in for black beans in osechi; linked to Shodoshima shoyu."},{"name":"Ibuki iriko","ja":"伊吹いりこ","note":"Iriko of katakuchi-iwashi from Ibuki-jima, used for the zoni stock."},{"name":"Shippoku udon","ja":"しっぽくうどん","note":"Winter udon with vegetables, eaten in Sanuki."},{"name":"Sawasawa","ja":"さわさわ","note":"Dish from Nio-cho, Mitoyo, made on Kobo Daishi's monthly memorial day; passed on as a home dish (MAFF)."},{"name":"Mossou-meshi","ja":"もっそうめし","note":"Communal-work meal served to local workers (MAFF)."},{"name":"Olive hamachi","ja":"オリーブハマチ","note":"A branded yellowtail developed by the prefecture; Kagawa is the origin of hamachi farming."},{"name":"Wasanbon / sanbon-to","ja":"三盆糖 (和三盆)","note":"Listed on MAFF's Kagawa page alongside dojo-jiru; no production details in the sources seen."}],"calendar":[{"season":"Spring","text":"The sources reviewed give no month-by-month spring data for Kagawa. Sawasawa is made on Kobo Daishi's monthly memorial day, so it recurs through the year rather than in one season."},{"season":"Summer","text":"No summer-specific dishes are stated in the sources consulted. Udon, the prefecture's everyday dish, is described without a season, and the pages seen do not give summer products for Kagawa."},{"season":"Autumn","text":"Not dated in the sources. Shoyu-mame is a keepable condiment made from roasted fava beans, but the pages seen do not say when it is made; check local makers for the production calendar."},{"season":"Winter","text":"Shippoku udon is a winter dish of Sanuki. In January, an-mochi zoni is served at New Year and appears in school lunches, according to MAFF; the dish dates to the Edo period in Takamatsu."}],"markets":[{"name":"Ibuki-jima (iriko source)","ja":"伊吹島","note":"Island named by MAFF as source of the katakuchi-iwashi iriko used in the zoni stock."},{"name":"Shodoshima","ja":"小豆島","note":"Linked in sources to shoyu brewing and the sweet-savoury taste of shoyu-mame."},{"name":"Takamatsu","ja":"高松","note":"City where an-mochi zoni has been eaten at New Year since the Edo period (MAFF)."}],"notes":"The origin of an-mochi zoni varies between sources: Edo-period Takamatsu New Year dish (MAFF), a late-Edo white-miso soup, or a Meiji-era wish to use sugar at New Year. Sugar was costly in the Edo period. The Sanuki sanpaku (wheat, salt, shoyu) is a common framing but was not named in the pages seen. Olive hamachi is a prefecture-developed brand, not a traditional dish.","src":[["MAFF Uchi no Kyodo Ryori: Kagawa regional story","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/area_stories/kagawa.html"],["MAFF: Kagawa school lunch, an-mochi zoni","https://www.maff.go.jp/j/pr/aff/2101/food01.html"],["MAFF Kids Navi: Shoyu-mame (Kagawa)","https://www.maff.go.jp/j/syokuiku/kodomo_navi/cuisine/cuisine6_2.html"],["Zengakuei: An-mochi zoni","https://www.zengakuei.or.jp/kyodosyoku/pref/kagawa_1.html"]]},{"pref":38,"history":"Ehime's cuisine splits along its coast. In the south, Nanyo around Uwajima, the Uwa Sea shaped fishermen's dishes such as hyuga-meshi; in the Matsuyama plain it is Inland Sea fish. Date Hidemune, first lord of Uwajima domain, is said in MAFF's children's page to have brought kamaboko craftsmen from Sendai, starting jako-ten. Ozu's imotaki is a riverbank autumn party tied to taro.","character":"Two different taimeshi share one name: in Chuyo and Toyo, grilled sea bream is cooked with the rice; in Nanyo, raw bream slices in an egg-enriched sauce go over hot rice. Jako-ten is a fried fish paste. Imotaki simmers chicken, taro, konnyaku and shiitake. Matsuyama-zushi uses Seto Inland Sea fish, anago as the baseline ingredient, varying with season.","staples":[{"name":"Uwajima taimeshi","ja":"宇和島鯛めし","note":"Sashimi bream in an egg sauce over rice; Nanyo style; said to descend from hyuga-meshi; regional collective trademark registered in January 2017 per one commentary."},{"name":"Chuyo/Toyo taimeshi","ja":"鯛めし (焼き鯛炊き込み)","note":"Grilled bream cooked in the rice; the other of the two taimeshi types; Hojo version tied to a Jingu Kogo legend."},{"name":"Hyuga-meshi","ja":"ひゅうが飯","note":"Fish steeped in sauce and poured on hot rice, Nanyo coast; origin on Hiburi-jima per MAFF-linked pages, a blog says peddlers of Akehama."},{"name":"Jako-ten","ja":"じゃこ天","note":"Fried fish paste of small fish; credited to Date Hidemune bringing kamaboko craftsmen from Sendai; name from zako or from a family name theory."},{"name":"Imotaki","ja":"いもたき","note":"Chicken, taro, konnyaku and shiitake pot; origin Ozu; held at about ten or more riverbed sites in the Nanyo area in autumn."},{"name":"Matsuyama-zushi","ja":"松山鮓","note":"Sushi with Inland Sea fish; anago is basic, other toppings change by season."},{"name":"Mikan-zushi","ja":"みかんずし","note":"Listed by MAFF for Ehime; Ehime mikan production is among the highest in Japan; recipe not detailed in the sources seen."},{"name":"Imabari yakitori","ja":"今治焼き鳥","note":"Named on MAFF's Ehime list together with bote-cha and tart; no method detail in the sources."}],"calendar":[{"season":"Spring","text":"The sources reviewed give no month-by-month spring data for Ehime. Matsuyama-zushi changes its toppings by season, with anago as the constant, but the pages seen do not itemise spring toppings."},{"season":"Summer","text":"No summer-specific entries are given in the sources consulted. Taimeshi and jako-ten are described as everyday regional foods, and the pages seen assign them no season."},{"season":"Autumn","text":"Imotaki is the autumn event: taro pots on riverbeds combined with moon viewing, held at roughly ten or more sites in Nanyo, with Ozu as the origin (MAFF). Taro is the seasonal anchor."},{"season":"Winter","text":"Not dated in the sources. Mikan is a key crop of Ehime, with production among the top in Japan (MAFF), but the pages reviewed give no harvest months or varieties."}],"markets":[{"name":"Ozu","ja":"大洲","note":"Origin of imotaki, held on the riverbed in autumn."},{"name":"Uwajima","ja":"宇和島","note":"Home of Uwajima taimeshi and jako-ten; Date-domain capital."},{"name":"Matsuyama","ja":"松山","note":"Source of Matsuyama-zushi; Hojo taimeshi is tied to the Matsuyama area."}],"notes":"'Uwajima taimeshi' is reported as a regional collective trademark registered in January 2017 (one commentary; verify with JPO). The Jingu Kogo story for Hojo taimeshi and Muromachi suigun origin for Uwajima taimeshi are legends. Wikipedia describes hyuga-meshi as a home dish that spread through restaurants in the 1970s. Jako-ten name origins are disputed (zako versus family-name theory).","src":[["MAFF Kids Navi: Jako-ten (Ehime)","https://www.maff.go.jp/j/syokuiku/kodomo_navi/cuisine/cuisine6_3.html"],["MAFF Uchi no Kyodo Ryori: Imotaki","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/imotaki_ehime.html"],["MAFF Uchi no Kyodo Ryori: Matsuyama-zushi","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/matsu_yama_zushi_ehime.html"],["Shikoku Tourism: Ehime's taimeshi","https://shikoku-tourism.com/feature/taimeshi/1"]]},{"pref":39,"history":"Kochi's fish culture is built on katsuo, the prefectural fish, eaten daily (MAFF). Tataki is said to have begun as fishermen's meal-time food, and one theory sees it as a way to eat bonito past its freshest before preservation. Sawachi-ryori goes back to the domain era and spread as banquet food in Meiji. Inaka-zushi arose in the mountains, where kombu and nori were hard to get.","character":"The cuisine pairs coastal fish with the vegetarian mountain tradition. Katsuo no tataki is the best-known dish. Sawachi-ryori piles sashimi, sushi, simmered dishes and sweets on one large platter for okyaku banquets. Inaka-zushi uses mountain vegetables (myoga, ryukyu taro stem, konnyaku) without fish. Yuzu vinegar seasons the sugata-zushi of ayu, while saba sugata-zushi is a platter staple.","staples":[{"name":"Katsuo no tataki","ja":"カツオのたたき","note":"Prefectural fish eaten daily; fishermen's meal that spread; one theory is that it let people eat less fresh bonito."},{"name":"Sawachi-ryori","ja":"皿鉢料理","note":"Sashimi, sushi, simmered dishes and sweets on a big platter for okyaku banquets; traced to domain era, spread in Meiji."},{"name":"Inaka-zushi","ja":"田舎ずし","note":"Mountain-area festive sushi with vegetables instead of fish; myoga, ryukyu (taro stem), konnyaku."},{"name":"Saba no sugata-zushi","ja":"さばの姿ずし","note":"Whole mackerel sushi; platter staple at ceremonies and Shinto events; made in many local ways."},{"name":"Ayu sugata-zushi","ja":"鮎の姿寿司","note":"Ayu sushi with yuzu vinegar; certified as a 100-year food by the Agency for Cultural Affairs."},{"name":"Katsuo no kakuni","ja":"かつおの角煮","note":"Simmered bonito listed in Zengakuei's local food series for Kochi."},{"name":"Yuzu vinegar","ja":"柚子酢","note":"Used in the sushi rice and vinegar for ayu sushi."},{"name":"Early rice and horticultural crops","ja":"早場米・園芸作物","note":"MAFF notes subtropical plants, early-harvest rice on the Kochi plain and active greenhouse horticulture."}],"calendar":[{"season":"Spring","text":"The sources reviewed give no spring months for Kochi. Katsuo is called a daily food in the prefecture, and the pages seen give no catch-season calendar, so tataki timing should be confirmed with local fishery sources."},{"season":"Summer","text":"No summer-specific entries are given in the sources consulted. Ayu sugata-zushi appears in the 100-year food list, but the pages seen do not date the ayu season; check local rivers' catch rules."},{"season":"Autumn","text":"Not dated in the sources reviewed. Sawachi-ryori and sushi platters belong to festivals and okyaku gatherings, which are tied to local Shinto events instead of a named month in the pages seen."},{"season":"Winter","text":"No winter items are stated for Kochi in the sources seen. Early-harvest rice and greenhouse horticulture are noted by MAFF, but the pages give no months for them."}],"markets":[{"name":"Kochi Nichiyo-ichi (Sunday market)","ja":"日曜市","note":"Appears in a Kochi tourism page on food culture (Sunday market and okyaku); no further detail captured."},{"name":"Tosa no Tataki participating shops (Kochi City)","ja":"土佐のたたき店 (高知市)","note":"Prefecture's list of participating tataki shops in Kochi City."}],"notes":"Okyaku are banquets built around sawachi platters, central to weddings, funerals and Shinto events. Inaka-zushi is notable as sushi without fish. Agency for Cultural Affairs 100-year food entries exist for Kochi, including the ayu sugata-zushi with yuzu vinegar. The prefecture runs a tataki shop programme. I found no GI or brand rules in the sources.","src":[["MAFF Uchi no Kyodo Ryori: Katsuo no tataki (Kochi)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/katuonotataki_kochi.html"],["MAFF Uchi no Kyodo Ryori: Sawachi-ryori","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/sawachiryori_kochi.html"],["MAFF Uchi no Kyodo Ryori: Inaka-zushi","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/inakazushi_kochi.html"],["Agency for Cultural Affairs: Kochi 100-year foods","https://www.bunka.go.jp/seisaku/shokubunka/foodculture/hyakunenfood/jirei/list_kochi.html"]]},{"pref":40,"history":"Fukuoka has four cultural zones (MAFF): Fukuoka-Hakata, industrial Kitakyushu, Chikuho post towns, and the Chikugo river plain. Chikugo was a wheat-growing area, the root of funayaki. Gameni, also called Chikuzen-ni after the old Chikuzen province, is explained either by the Hakata word gamekurikomu (to gather) or by Hideyoshi's Bunroku-era army cooking soft-shelled turtle. Mizutaki's first shop owner learned Western and Chinese cooking in Hong Kong.","character":"The cuisine combines Hakata's sea produce and poultry pots with Chikuho and Buzen festive dishes. Gameni simmers chicken and root vegetables, a prefecture-wide dish. Hakata zoni uses roasted flying-fish (ago) stock with yellowtail and katsuona. Mizutaki is a cloudy chicken-bone broth; motsu-nabe is a postwar soy-based pot with offal and nira; mentaiko is pollock roe in chili liquor; Hakata ramen is a hard-boiled pork-bone soup.","staples":[{"name":"Gameni (Chikuzen-ni)","ja":"がめ煮 (筑前煮)","note":"Prefecture-wide festive simmer; name from Hakata dialect gamekurikomu or from Hideyoshi's turtle stew; MAFF-listed."},{"name":"Hakata zoni","ja":"博多雑煮","note":"Roast flying-fish (ago) stock with yellowtail and katsuona (a takana relative); components prepared per portion."},{"name":"Funayaki","ja":"ふなやき","note":"Thin wheat-flour griddle cake of Chikugo, filled with items such as takana pickles; varies by household."},{"name":"Mizutaki","ja":"水炊き","note":"Chicken pot in cloudy stock from chicken bones; first shop's owner trained in Western and Chinese cooking in Hong Kong."},{"name":"Motsu-nabe","ja":"もつ鍋","note":"Born in postwar scarcity; offal and nira in a soy-based, sukiyaki-style soup."},{"name":"Karashi mentaiko","ja":"辛子明太子","note":"Pollock roe steeped in a chili-based liquor; chosen for MAFF's Gotochi Ninki Ryori Tokusen."},{"name":"Hakata ramen","ja":"博多ラーメン","note":"White, thick soup from pork bones boiled hard for hours; ultra-thin straight noodles, chashu, red pickled ginger, scallion."},{"name":"Yanagawa unagi no seiro-mushi","ja":"柳川うなぎのせいろ蒸し","note":"Kabayaki on sweet-salty rice, steamed in a seiro; Yanagawa has been famed for eel since the Edo period."},{"name":"Hakata goma-saba and okyuto","ja":"博多の胡麻鯖・おきゅうと","note":"Sesame-dressed mackerel and egonori jelly, named among Fukuoka-area sea dishes by MAFF."},{"name":"Nigui and dabu","ja":"にぐい・だぶ","note":"Festive stew of Buzen (Joge) called nigui; known as dabu in Chikuho."}],"calendar":[{"season":"Spring","text":"The sources reviewed give no month-by-month data for spring in Fukuoka. Items such as gameni and funayaki are described as home dishes without seasons, so timing should be checked with local sources."},{"season":"Summer","text":"No summer-specific entries are stated in the sources consulted. Hakata goma-saba and okyuto are listed as Fukuoka sea dishes, but the pages seen do not give catch months."},{"season":"Autumn","text":"Not dated in the sources. The Buzen dish nigui is described as indispensable at celebrations in Kokage town of Joge, but celebrations are not tied to a named month in the pages seen."},{"season":"Winter","text":"Hakata zoni is the New Year dish, with flying-fish stock and yellowtail. The pot dishes (mizutaki, motsu-nabe) are heated meals by nature, but the pages seen do not formally date them to a season."}],"markets":[{"name":"Hakata (Fukuoka city)","ja":"博多","note":"Home of Hakata zoni, goma-saba, okyuto, mizutaki and Hakata ramen."},{"name":"Yanagawa","ja":"柳川","note":"Eel town since the Edo period; origin of the seiro-mushi eel dish."},{"name":"Chikugo plain","ja":"筑後","note":"Wheat-growing area where funayaki developed."}],"notes":"Gameni's name origin is disputed (dialect gamekurikomu versus Hideyoshi's turtle). Karashi mentaiko appears on MAFF's Gotochi Ninki Ryori Tokusen list. Motsu-nabe and mizutaki origins come from shop and guide accounts, not archives. Katsuona is a takana relative used in zoni. The sources did not support details on amaou, Yame tea or specific markets, so none are described here.","src":[["MAFF Uchi no Kyodo Ryori: Fukuoka regional story","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/area_stories/fukuoka.html"],["MAFF Uchi no Kyodo Ryori: Gameni","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/gameni_gukuoka.html"],["MAFF Kids Navi: Gameni (Fukuoka)","https://www.maff.go.jp/j/syokuiku/kodomo_navi/cuisine/cuisine7_1.html"],["Walker Station TV: Fukuoka local gourmet","https://www.wstv.jp/gourmet/pref_40_fukuoka.html"]]},{"pref":41,"history":"Saga lies between the Ariake Sea and the Genkai Sea, and sources credit this position, plus rice farming, for its distinctive food culture. Ariake's tidal flats yield mutsugoro, esso and warasubo, delicacies hard to find elsewhere, while Yobuko in Karatsu faces the Genkai Sea and is known for squid. Suko-zushi from Shiroishi is traced to over 500 years ago, with a legend that a feudal lord served it to troops at departure for war.","character":"Two coastlines give a split palate: Ariake tidal-flat fish, simmered sweet-salty (mutsugoro in suko-zushi), and Genkai squid served live and sashimi-cut at Yobuko. Inland cooking leans on kudzu or starch-set soy milk (kure-dofu) with sesame-shoyu. The newest icon, Sicilian rice (c.1975), is a Saga city make-nai dish of rice, vegetables, meat and a sauce built around the colours green, white and red.","staples":[{"name":"Sicilian rice","ja":"シシリアンライス","note":"Began around 1975 as a staff meal in Saga city; origin of the name is disputed (Italian-flag colours vs the Godfather's Sicily); certified as a 100-year food in the 'future' category."},{"name":"Suko-zushi","ja":"須古寿司","note":"Pressed box sushi from Suko, Shiroishi, made in a wooden box (morobuta); mutsugoro simmered sweet-salty is the classic filling; 500+ years of history claimed."},{"name":"Kure-dofu","ja":"呉豆腐","note":"Centred on Arita; soy milk set with kudzu or starch rather than nigari, soft and chewy, normally eaten with sesame-shoyu."},{"name":"Yobuko ika ikizukuri","ja":"呼子のイカ活き造り","note":"Yari-ika, kensaki-ika or aori-ika cut live; Yobuko in Karatsu faces the Genkai Sea."},{"name":"Saga-gyu","ja":"佐賀牛","note":"The name is used only for the top grades of beef meeting the brand's high standard."},{"name":"Mutsugoro","ja":"ムツゴロウ","note":"Ariake tidal-flat mudskipper; simmered sweet-salty for suko-zushi."},{"name":"Esso","ja":"エソ","note":"Ariake Sea catch listed among the tidal-flat delicacies."},{"name":"Warasubo","ja":"ワラスボ","note":"Ariake Sea tidal-flat fish listed with mutsugoro as a regional delicacy."}],"calendar":[{"season":"Spring","text":"The search results gave no month-by-month data for Saga. Yobuko's morning market, counted among Japan's three great morning markets, runs through the year, and squid is its signature."},{"season":"Summer","text":"No season-specific information was found for summer in the sources consulted. Ariake tidal-flat fish (mutsugoro, esso, warasubo) are described as regional delicacies without a stated month."},{"season":"Autumn","text":"Autumn data were not found in the results. Rice, noted as part of Saga's food base, is the staple behind box sushi such as suko-zushi, which is typically a celebration dish."},{"season":"Winter","text":"No winter-specific information was found. Kure-dofu and the Genkai and Ariake seafood listed above are described without seasonal limits, so check local producers for timing."}],"markets":[{"name":"Yobuko Morning Market","ja":"呼子朝市","note":"Counted as one of Japan's three great morning markets; Yobuko is the squid town of Karatsu."},{"name":"Saga city Sicilian rice cafes","ja":"佐賀市中心街のシシリアンライス店","note":"The dish began in central Saga city; each shop's version differs and some areas serve it in school lunches."}],"notes":"Saga-gyu is reserved for the top-grade beef. Suko-zushi and Sicilian rice are on the Agency for Cultural Affairs' 100-year food lists (Sicilian rice in the 'future' category). The name of Sicilian rice has no settled origin. Sources here are tourism and recipe sites, so check ariake-sea and Karatsu details with local cooperatives.","src":[["Saga dishes overview (Ninben)","https://shop.ninben.co.jp/blog/shoku/9510/"],["Sicilian rice (Kirishima Kyushu food)","https://www.kyushufood.kirishima.co.jp/kyuaji/385/"],["Suko-zushi (Kirishima Kyushu food)","https://www.kyushufood.kirishima.co.jp/kyuaji/469/"],["MAFF: Kure-dofu with sesame-shoyu","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/45_14_saga.html"]]},{"pref":42,"history":"Nagasaki's table was shaped by its role as Japan's window to the world in the Edo period. Sources describe shippoku cuisine as born of cultural exchange in this trading port, with dishes shared from large platters, and call the result 'wakaran' (Japanese, Chinese, Dutch) cooking. Castella arrived with missionaries in the 16th century, and the Dutch brought the pie-like pasty, here adapted with soy sauce.","character":"Foreign techniques are absorbed into soy-sweet Japanese seasoning: eggs, sugar and flour for castella, pastry for pasty, Chinese noodles for champon (devised in 1899 by Chin Heijun of Shikairo). Island and coastal food runs separately: Goto udon is eaten as jigokudaki with ago (flying fish) dashi, and Omura-zushi is a pressed sushi for special occasions.","staples":[{"name":"Shippoku ryori","ja":"卓袱料理","note":"Edo-period fusion cuisine from the trading port; diners take from shared platters."},{"name":"Nagasaki champon","ja":"長崎ちゃんぽん","note":"Said to have been devised in 1899 by Chin Heijun at Shikairo; the name's origin is debated between Chinese and Portuguese."},{"name":"Sara udon","ja":"皿うどん","note":"Noodle dish listed on MAFF's Nagasaki page as a nationally known Nagasaki specialty."},{"name":"Castella","ja":"カステラ","note":"Brought by missionaries in the 16th century; Portuguese-derived name; eggs and sugar whipped, flour added, then baked."},{"name":"Pasty","ja":"パスティ","note":"Pie-like dish introduced by the Dutch during the closed-country era, seasoned with soy sauce, still served within shippoku."},{"name":"Omura-zushi","ja":"大村寿司","note":"Pressed sushi eaten at celebrations, festivals and memorial rites; origin tied to Omura Sumiie's reconquest of his territory in the Muromachi period."},{"name":"Jigokudaki (Goto udon / Shimabara somen)","ja":"地獄炊き(五島うどん・島原そうめん)","note":"Noodles lifted from the pot and dipped; the standard dip is ago dashi from flying fish caught off Goto."},{"name":"Goto udon","ja":"五島うどん","note":"Island noodle; recent research points to Zhejiang somen as a likely root."},{"name":"Hatoshi","ja":"ハトシ","note":"Named among Nagasaki local dishes; no detail in the results."},{"name":"Kakuni manju","ja":"角煮まんじゅう","note":"Pork belly in a steamed bun, listed as a Nagasaki local dish; no further detail was found."}],"calendar":[{"season":"Spring","text":"The sources I found for Nagasaki gave no month-by-month data. Omura-zushi is documented as a celebration and festival dish rather than for a particular month."},{"season":"Summer","text":"No summer-specific data were found. Jigokudaki with Goto udon or Shimabara somen is listed on MAFF's page as a regional dish without a stated season."},{"season":"Autumn","text":"No autumn-specific data were found. Shippoku is described as a formal shared-platter meal, served by restaurants such as Ryotei Kagetsu using local seasonal ingredients."},{"season":"Winter","text":"No winter-specific data were found in the results. Check local fishing cooperatives for seasonal fish; the sources here covered dishes and history, not harvest calendars."}],"markets":[{"name":"Shikairo (champon's birthplace)","ja":"四海樓","note":"Restaurant of Chin Heijun, credited in sources with devising champon in 1899; the results gave restaurants, not markets."},{"name":"Ryotei Kagetsu","ja":"料亭 花月","note":"Nagasaki restaurant that serves shippoku in a traditional setting, adapting local seasonal ingredients."},{"name":"Nagasaki station-front Goto udon shops","ja":"長崎駅前の五島うどん店","note":"Examples serve jigokudaki with ago-dashi ponzu; individual shops are the point of access in the sources."}],"notes":"Terms to know: wakaran (Japanese-Chinese-Dutch) for fusion cooking. Both Goto udon and Shimabara somen are served as jigokudaki. Omura-zushi has an official prefectural and city write-up. The origins of 'champon' and shippoku details vary by source, so avoid stating either as settled fact.","src":[["Nagasaki Adventure: Wa-ka-ran dishes","http://boken.nagasaki.jp/spot/boken497.html"],["Shokuiku Encyclopedia: Nagasaki champon","https://shokuiku-daijiten.com/lc-024/"],["MAFF: Omura-zushi","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/46_5_nagasaki.html"],["MAFF: Jigokudaki","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/46_12_nagasaki.html"]]},{"pref":43,"history":"Kumamoto's food stories are tied to its feudal lords. Karashi renkon is said to have been devised for the sickly first lord Hosokawa Tadatoshi by the monk Genta of Suizenji, around Kan'ei 9 (some say 350-360 years ago), and kept secret because a lotus cross-section resembles the Hosokawa kuyo crest; commoners ate it only after the Meiji Restoration. Basashi is tied by legend to Kato Kiyomasa eating army horses in Korea.","character":"The cuisine runs on flour-dumpling soups, mustard-stuffed lotus root and raw horse meat. Dago-jiru uses flat flour dumplings in a miso or shoyu vegetable soup. In Aso, chopped takana pickle is stir-fried into rice. Taipien is a Fujian-derived noodle soup made with fried egg and harusame in place of bird's nest; ikinari dango wraps raw sweet potato and bean paste in dough and steams it.","staples":[{"name":"Karashi renkon","ja":"辛子蓮根","note":"Lotus root stuffed with mustard-miso and fried; Hosokawa-associated, secret recipe until the Meiji era per sources."},{"name":"Basashi","ja":"馬刺し","note":"Raw horse meat; sources trace it to Kato Kiyomasa's Korean campaigns, though origins are disputed."},{"name":"Taipien","ja":"太平燕","note":"Fujian dish brought by Chinese residents in the Meiji era via Nagasaki; fried boiled egg and harusame replace bird's nest."},{"name":"Dago-jiru","ja":"だご汁","note":"Flat flour dumplings simmered with napa cabbage, daikon, carrot and sometimes meat; seasoned with miso or shoyu."},{"name":"Ikinari dango","ja":"いきなり団子","note":"Kikuchi-area sweet; sweet potato and sweet bean paste in a dough, steamed; made at home in sweet-potato season, per MAFF."},{"name":"Takana-meshi","ja":"高菜めし","note":"Aso speciality: chopped Aso takana pickle stir-fried and mixed into rice."},{"name":"Aso takana-zuke","ja":"阿蘇高菜漬け","note":"Pickled takana from Aso; one shop grows and pickles its own."},{"name":"Kumamoto three great specialties","ja":"熊本三大名物","note":"Commonly listed as basashi, karashi renkon and ikinari dango."}],"calendar":[{"season":"Spring","text":"The sources consulted gave no month-by-month data for Kumamoto. Karashi renkon and basashi are sold throughout the year as gift items, without a stated season."},{"season":"Summer","text":"No summer-specific information was found in the results. Taipien and dago-jiru are described as everyday dishes with no stated season."},{"season":"Autumn","text":"Ikinari dango is made at home in the sweet-potato season, which MAFF's description places in the harvest period. The Aso takana pickling cycle was not detailed in the results."},{"season":"Winter","text":"No winter-specific information was found. Dago-jiru, a hot dumpling and vegetable soup, is a typical home dish, but sources do not give dates or a harvest calendar."}],"markets":[{"name":"Karashi renkon makers","ja":"辛子蓮根の製造元","note":"Makers such as Higo Shokuhin sell the product; one article describes a hands-on making experience."},{"name":"Aso takana-zuke shops","ja":"阿蘇の高菜漬け店","note":"Aso shops grow takana in their own fields and pickle it themselves, per a travel article."}],"notes":"Karashi renkon's origin dates are inconsistent in sources (Kan'ei 9 versus 350-360 years ago). Basashi's origin is told differently in different texts and is linked to the Kato rather than the Hosokawa family. Ikinari dango and takana-meshi appear in official Kumamoto and MAFF materials, but the sources here do not give protected-name rules.","src":[["Mizota: karashi renkon and basashi history","https://mizota-ks.com/blog/blog-1059/"],["Kumamoto's local dishes (Akamatsu)","https://akamatsu.com/blog/3246/"],["MAFF: Ikinari dango","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/ikinari_dango_kumamoto.html"],["Kumamoto Guide: dago-jiru and takana-meshi","https://kumamoto.guide/brand/foods/foods_05.html"]]},{"pref":44,"history":"Oita's best-documented foods are fish from the Hayasui Seto and chicken. Saganoseki at the eastern tip of Oita city faces Cape Sada in Ehime across the Bungo Channel; fishermen of the Saganoseki branch of the Oita Fisheries Cooperative line-catch aji and saba there, and the names Seki-aji and Seki-saba were trademarked after imitations appeared following the late-1980s boom. Oita city also tops national household chicken consumption (2019 survey).","character":"The flavour logic is fish eaten fresh and meat fried, finished with citrus. Seki-aji and Seki-saba are single-line-caught in strong currents. Toriten is chicken tempura served with ponzu or kabosu and mustard, and dango-jiru is a miso soup with hand-kneaded flour dumplings. Oita produces roughly 96 percent of Japan's kabosu, used as a seasonal acid.","staples":[{"name":"Toriten","ja":"とり天","note":"Chicken tempura; ponzu or kabosu and mustard are common; MAFF cites Oita city's 2019 number-one ranking in household chicken consumption."},{"name":"Dango-jiru","ja":"だんご汁","note":"Miso soup full of vegetables with hand-kneaded flour dumplings; on MAFF's Oita list."},{"name":"Tori-jiru","ja":"鶏汁","note":"Chicken soup, listed with dango-jiru and toriten on MAFF's Oita page."},{"name":"Seki-aji","ja":"関あじ","note":"Maaji line-caught by Saganoseki co-op fishermen off Saganoseki in the Hayasui Seto; name is restricted to fish landed there."},{"name":"Seki-saba","ja":"関さば","note":"Masaba from the same grounds and rules; combined Seki-aji and Seki-saba catch was about 300 t in FY2009."},{"name":"Kabosu","ja":"かぼす","note":"Oita holds about 96 percent of national output; main areas Usuki, Taketa, Bungo-ono."},{"name":"Ryukyu-don","ja":"琉球丼","note":"Raw fish rice-bowl sold at a local diner alongside Seki-aji; no authoritative description in the results."},{"name":"Tori-meshi","ja":"鶏めし","note":"Chicken rice listed on a local restaurant's menu; origin and recipe not detailed."}],"calendar":[{"season":"Spring","text":"Greenhouse (house) kabosu circulate from March; the sources did not give catch calendars for Seki-aji and Seki-saba, so check the Saganoseki co-op for seasons."},{"season":"Summer","text":"House kabosu run to August, then the first outdoor (rojii) kabosu appear from the end of August. Dango-jiru and toriten are eaten year-round, no season is stated."},{"season":"Autumn","text":"Outdoor kabosu are at their best from late August to late September, with the prefecture's own page citing August to September. From October, stored kabosu take over."},{"season":"Winter","text":"Stored kabosu are on sale from October through about February. Toriten with ponzu and kabosu and hot dango-jiru are the winter table; sources give no more precise dates."}],"markets":[{"name":"Saganoseki Fishing Port","ja":"佐賀関漁港","note":"Landing port of Seki-aji and Seki-saba; fish must be caught off and landed at Saganoseki to bear the name."},{"name":"Oita Fisheries Cooperative, Saganoseki branch","ja":"大分県漁業協同組合 佐賀関支店","note":"Holds the Seki-aji and Seki-saba brand and trademark; runs a brand page."}],"notes":"Seki-aji and Seki-saba may only name fish caught off Saganoseki by branch fishermen and landed there; the co-op applied for the trademark after imitations. Kabosu is sold in three stages (outdoor, stored, greenhouse). The sources did not confirm GI status for any Oita product. Some Oita dishes (ryukyu, toriten) have several local variations.","src":[["MAFF: Toriten","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/toriten_oita.html"],["MAFF: Oita dishes","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/area/oita.html"],["Oita Prefecture: Seki-aji and Seki-saba","https://www.pref.oita.jp/soshiki/10400/tokusanhin-sekiajisekisaba.html"],["Oita Kabosu: about","https://oitakabosu.com/about/"]]},{"pref":45,"history":"The sources emphasise summer cooling and chicken. Hiyajiru is said to descend from a Kamakura-era record, spread nationally by monks but survived only where climate suited it; MAFF names Miyazaki's plains as its centre. Chicken nanban is reported to originate in Nobeoka, from a yoshoku restaurant's staff meal in mid-Showa. Miyazaki also developed a method for tree-ripened mango.","character":"The flavour logic is toasted miso, dried fish and cooling cold dishes for summer: hiyajiru has toasted mugi miso blended with ground iriko, diluted with dashi and poured over cold barley rice with tofu, cucumber and shiso. Chicken is the second pillar: nanban (fried in egg batter, dipped in sweet vinegar, topped with tartar) and charcoal-grilled jidori.","staples":[{"name":"Hiyajiru","ja":"冷や汁","note":"Chilled miso soup poured over barley rice; MAFF calls it an instant poured soup centred on Miyazaki's plains."},{"name":"Yaki-miso","ja":"焼き味噌","note":"Base of hiyajiru: ground iriko mixed into mugi miso and baked at low heat, which removes miso odour and adds aroma."},{"name":"Cold mugi-meshi","ja":"麦飯","note":"Chilled barley rice is the usual carrier for hiyajiru."},{"name":"Hiyajiru fish variants","ja":"冷や汁の魚","note":"Grilled aji or saba flakes are used in some homes; a luxury version uses fresh sea bream."},{"name":"Chicken nanban","ja":"チキン南蛮","note":"Fried chicken in egg batter, sweet-sour dip, tartar sauce; reported to come from Nobeoka, mid-Showa."},{"name":"Tartar-sweet vinegar finish","ja":"南蛮酢とタルタル","note":"The defining flavour pair of Miyazaki-style chicken nanban."},{"name":"Jidori sumibi-yaki","ja":"地鶏の炭火焼き","note":"Charcoal-grilled local chicken; chosen in the Rural Food 100 selections, but the results gave no detail."},{"name":"Miyazaki mango","ja":"宮崎マンゴー","note":"Tree-ripened fruit caught in nets as it falls, said to have originated in Miyazaki; one seller gives late April to late June."}],"calendar":[{"season":"Spring","text":"Mango season begins in late April according to one seller; the results gave no further spring data. Hiyajiru is generally not stated as a spring dish."},{"season":"Summer","text":"Hiyajiru is the summer dish of Miyazaki, valued for cooling, and mango stays in season to late June per one seller; chicken nanban is eaten year-round."},{"season":"Autumn","text":"No autumn-specific information was found in the results; chicken nanban and charcoal-grilled jidori are year-round dishes with no stated seasonal limit."},{"season":"Winter","text":"No winter-specific information was found. The summaries confirm only that yaki-miso can be made in batches and kept chilled as miso balls for hiyajiru."}],"markets":[{"name":"Nobeoka chicken nanban restaurants","ja":"延岡のチキン南蛮店","note":"Nobeoka is cited as the birthplace; Ogura Asahigaoka is one restaurant whose recipe MAFF-related material uses."},{"name":"Miyazaki mango growers","ja":"宮崎のマンゴー産地","note":"Where tree-ripened mango is netted; sold as gift fruit."}],"notes":"Hiyajiru and chicken nanban are both in MAFF's database, and jidori sumibi-yaki is among the Rural Food 100. Recipes vary: hiyajiru bases differ by home, and mango season varies by grower. The results contained no figures for Miyazaki beef, Hyuganatsu timing or protected names, so those are deliberately omitted.","src":[["MAFF: Miyazaki dishes","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/area/miyazaki.html"],["Hiyajiru (Zipang Club)","https://www.toretabi.jp/zipangclub/page/localcuisine004.html"],["Chicken nanban recipe (Location Research)","https://www.location-research.co.jp/kyoudoryouri100/recipe/recipe/450236"],["Miyazaki mango (Funasho)","https://www.funasho-group.co.jp/salute/fruit_vegetable/3157/"]]},{"pref":46,"history":"Kagoshima's prefectural food-culture page and MAFF list satsuma-jiru, keihan and kibinago as core dishes. Satsuma-jiru is explained in popular sources as a result of cockfighting in Edo-period Satsuma, where the losing bird was made into soup. Keihan is said to come from Amami people entertaining Satsuma officials in the Edo period. Kurobuta is credited to Shimazu Iehisa, who is said to have brought pigs from Ryukyu about 400 years ago (sources differ).","character":"The cooking is built on chicken, pork and kibinago in miso, soy and sweet-salty preparations. Satsuma-jiru is a miso soup with chicken, dried shiitake, konnyaku, burdock, carrot, daikon, taro and leek; keihan is chicken rice-soup of Amami. Pork was improved in the Meiji era by crossing with Berkshire. The prefecture named 18 mainland and 10 Amami items as the 'Kagoshima flavours' in 2015.","staples":[{"name":"Satsuma-jiru","ja":"さつま汁","note":"Miso soup with chicken, dried shiitake, konnyaku, burdock, carrot, daikon, taro and leek; MAFF lists it as prefecture-wide."},{"name":"Keihan","ja":"鶏飯","note":"Amami chicken-and-rice dish, said to date from hospitality for Satsuma officials; in the Rural Food 100."},{"name":"Kibinago","ja":"きびなご","note":"About 10 cm fish, seasons spring to early summer and winter; Koshikijima is the main source; sashimi, tempura or salt-grilled."},{"name":"Tsukeage","ja":"つけあげ","note":"Local fried fish cake, the Satsuma-age; in the Rural Food 100."},{"name":"Kurobuta","ja":"黒豚","note":"Black pig; introduced from Ryukyu about 400 years ago per some sources; improved with Berkshire in the Meiji era."},{"name":"Kagoshima kuro-ushi","ja":"鹿児島黒牛","note":"Wagyu brand promoted as a national-contest winner."},{"name":"Kurozu","ja":"黒酢","note":"Black vinegar from Fukuyama, Kirishima, brewed in a mild climate with good water and long ageing."},{"name":"Imo-jochu","ja":"芋焼酎","note":"Sweet-potato spirit, the prefecture's representative speciality drink."},{"name":"Satsuma-ebi zoni","ja":"さつまえび雑煮","note":"New-year soup listed on MAFF's Kagoshima page."},{"name":"Gane","ja":"がね","note":"Sweet-potato dish listed on MAFF's Kagoshima page."}],"calendar":[{"season":"Spring","text":"Kibinago has a spring to early-summer season, one of two annual peaks, and is eaten as sashimi, tempura and salt-grilled."},{"season":"Summer","text":"Kibinago season runs into early summer. The sources gave no other summer-specific data for Kagoshima."},{"season":"Autumn","text":"No autumn data were found in the results. Satsuma-jiru is a year-round miso soup made with chicken and root vegetables; the sources state no month."},{"season":"Winter","text":"Kibinago has a second season in winter. Satsuma-ebi zoni is a New Year dish on MAFF's list, though the results gave no further details."}],"markets":[{"name":"Koshikijima","ja":"甑島","note":"Main source of kibinago."},{"name":"Fukuyama, Kirishima","ja":"霧島市福山町","note":"District where kurozu is brewed, on the inner Kinko Bay."},{"name":"Kagoshima Prefecture Specialty Products Association","ja":"鹿児島県特産品協会","note":"Trade body that lists prefectural food products."}],"notes":"The 2015 prefectural vote produced the 'Kagoshima flavours' (18 mainland, 10 Amami). Keihan is among the Rural Food 100 with kibinago dishes and tsukeage. Sources disagree on when the black pig arrived and the stories of satsuma-jiru and keihan come from popular sources, not documents; do not present them as proven.","src":[["MAFF: Satsuma-jiru","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/satsumajiru_kagoshima.html"],["Kagoshima Prefecture: food culture","http://www.pref.kagoshima.jp/kids/bunka/shokubunka.html"],["E-Recipe: kibinago and keihan","https://erecipe.woman.excite.co.jp/article/E1747267708471/"],["Kagoshima black foods (Gururi)","https://gururi-japan.com/apps/note/food/meat/kuro-kagoshima/"]]},{"pref":47,"history":"Okinawa's prefecture describes Ryukyu cuisine as arising in the kingdom period from banquets for Chinese investiture envoys (sappo-shi) and Satsuma officials, then spreading to ordinary homes after the Meiji era; modern food rests on both court and folk cooking. Pork, a luxury for commoners, appeared in court food, including trotter dishes (tibichi). Konbu is eaten heavily but comes entirely from Hokkaido, linked in some accounts to trade with China.","character":"The logic is pork, konbu and long simmering. Rafute is skin-on pork belly simmered in awamori, kokuto and shoyu, tied to Chinese tong po rou. Kubu-irichi stir-fries and simmers konbu with pork. Okinawa soba is made without buckwheat, with a soup of pork bone, katsuobushi and konbu. Goya champuru is the everyday stir-fry.","staples":[{"name":"Kubu-irichi","ja":"クーブイリチー","note":"Konbu stir-simmered with pork; 'irichi' is stir then simmer; festive dish, with konbu's 'yorokobu' pun for celebrations."},{"name":"Rafute","ja":"ラフテー","note":"Skin-on pork belly simmered in awamori, kokuto and shoyu; roots in court dish tong po rou."},{"name":"Tibichi","ja":"ティビチ","note":"Simmered pig trotter; served at court banquets for Chinese envoys per the prefecture."},{"name":"Okinawa soba","ja":"沖縄そば","note":"Wheat noodle soup, no buckwheat; soup of pork bone, katsuobushi and konbu."},{"name":"Goya champuru","ja":"ゴーヤーチャンプルー","note":"Stir-fry of goya, tofu, vegetables and pork; classic home dish; goya is grown in home gardens."},{"name":"Nakami-jiru","ja":"中味汁","note":"Pork-offal soup served in the market's second-floor food halls, handed down from the kingdom period per a tourism source."},{"name":"Awamori","ja":"泡盛","note":"Distilled spirit; also used in cooking rafute."},{"name":"Kusu (aged awamori)","ja":"古酒","note":"Awamori aged three years or more is called kusu."},{"name":"Shima-yasai","ja":"島野菜","note":"Okinawa selected 28 'traditional agricultural products' as island vegetables."}],"calendar":[{"season":"Spring","text":"Goya is listed as in season April to July in one ingredient guide, which would put its first harvest in spring; another source gives June to August."},{"season":"Summer","text":"Goya is mainly a summer vegetable, harvested in home gardens, and the cultivar 'Shiokaze' tolerates cold and can be grown through the year. Summer also appears in the 28-item shima-yasai list."},{"season":"Autumn","text":"No autumn data in the results beyond the year-round items. Konbu dishes such as kubu-irichi are cooked for celebrations rather than a season."},{"season":"Winter","text":"A winter shima-yasai feature exists (Orion Beer story), but its details were not in the results. Goya is still available through the winter by cultivar choice."}],"markets":[{"name":"Daiichi Makishi Public Market","ja":"第一牧志公設市場","note":"Opened by Naha City in 1950 from postwar black markets; rebuilt and reopened March 2023."},{"name":"Makishi 'mochiage' system and food hall","ja":"持ち上げ・2階食堂","note":"Buy at a first-floor stall and have it cooked on the second floor; sales are face to face."}],"notes":"Ryukyu cuisine (kingdom-era) is distinguished from Okinawa cuisine (postwar influences) by some sources. All konbu in Okinawa comes from Hokkaido. Kusu is awamori of three years or more. Shima-yasai refers to a 28-item prefectural selection. I did not find legal definitions for 'Okinawa soba' or awamori GI in these results.","src":[["Okinawa Prefecture: traditional food culture","https://www.pref.okinawa.lg.jp/bunkakoryu/bunkageijutsu/1022485/1009626.html"],["MAFF: Kubu-irichi","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/47_2_okinawa.html"],["Cabinet Office: public markets","https://www8.cao.go.jp/okinawa/8/2023/okinawahukki50/content/eat01.html"],["Okinawa ingredient guide","https://www.okinawastory.jp/feature/shokuzaizukan/"]]}]})||{ items: [], fish: [], prefpages: [] };
const PREFPAGES = {};
(function () {
  const have = new Set(ITEMS.map(i => i.name.toLowerCase()));
  for (const it of GEN.items) {
    const key = it.name.toLowerCase(); if (have.has(key)) continue; have.add(key);
    ITEMS.push({ id: "g" + ITEMS.length, cat: it.cat, name: it.name, ja: it.ja, prefs: it.prefs || [], text: it.text, flavor: it.flavor, use: it.use, craft: it.craft, src: it.src });
  }
  const fid = new Set(FISH.map(f => f.id));
  for (const f of GEN.fish) { if (fid.has(f.id)) continue; fid.add(f.id); FISH.push(f); }
  for (const p of GEN.prefpages) PREFPAGES[p.pref] = p;
  const add = (id, label, ja, intro) => { if (!CATS.find(c => c.id === id)) CATS.push({ id, label, ja }); if (!CAT_INTRO[id]) CAT_INTRO[id] = intro; };
  add("fruit", "Fruit", "果物", "Japanese fruit is sold by cultivar, grade and orchard: the name on the box tells you the variety and the price tells you the selection.");

}
function panelItem(it) {
  return `<button class="back" data-clear>&larr; All ${esc(catById[it.cat].label.toLowerCase())}</button>
  <h2>${esc(it.name)}</h2><div class="ja">${esc(it.ja)}</div>
  <p>${esc(it.text)}</p>
  <div class="box g"><b>Flavour</b>${esc(it.flavor)}</div>
  <div class="box"><b>Use</b>${esc(it.use)}</div>
  ${it.craft ? `<div class="box k"><b>Craft notes</b>${esc(it.craft)}</div>` : ""}
  ${it.prefs.length ? `<h3>Where</h3>${chips(it.prefs)}` : ""}${townChips(TOWNS.filter(t => t.items.includes(it.id)).map(t => t.id))}${srcList(it.src)}` + note();
}
function panelFish(f) {
  const sel = S.hoverSys;
  let h = `<button class="back" data-clear>&larr; All fish</button><h2>${esc(f.en)}</h2><div class="ja">${esc(f.ja)} · <i>${esc(f.latin)}</i></div><p>${esc(f.intro)}</p>
  <h3>Names by region</h3><div class="muted" style="font-size:12.5px;color:var(--muted);margin:-4px 0 8px">Tap a zone to focus it on the map.</div>`;
  h += f.systems.map((s, i) => `<div class="sys ${sel === i ? "on" : ""}" data-sys="${i}"><div class="h"><i class="sw" style="background:${SYS_COLORS[i % SYS_COLORS.length]}"></i>${esc(s.label)}</div>${ladderHTML(s.names)}<div style="margin-top:8px;font-size:13px;color:var(--muted)">${esc(s.names.filter(n => n.t).map(n => n.n + ": " + n.t).slice(0, 2).join(" "))}</div></div>`).join("");
  h += `<h3>Season</h3><div class="cal">${f.months.map((m, i) => `<div class="m${m}${S.month === i + 1 ? " cur" : ""}"></div>`).join("")}</div><div class="calm">${MONTHS.map(m => `<span>${m}</span>`).join("")}</div>`;
  if (S.month) { const act = activeSeasons(f); h += `<div class="box g"><b>${MONTH_NAMES[S.month - 1]}</b>${badge(f)} ${act.length ? act.map(a => esc(a.n + " (" + a.j + "): " + a.t)).join("<br>") : "No special seasonal name this month."}</div>`; }
  h += f.seasons.map(s => `<div class="season"><b>${esc(s.n)}</b> <span class="ja">${esc(s.j)}</span><br>${esc(s.t)}</div>`).join("");
  h += `<div class="box g"><b>Flavour</b>${esc(f.flavor)}</div><div class="box"><b>Use</b>${esc(f.use)}</div>`;
  if (f.craft) h += `<div class="box k"><b>Craft notes</b>${esc(f.craft)}</div>`;
  return h + townChips(TOWNS.filter(t => t.fish.includes(f.id)).map(t => t.id)) + srcList(f.src) + note();
}
function panelPref(p) {
  const r = regById[p.reg]; const fish = fishFor(p.id); const items = itemsFor(p.id);
  const order = [S.layer, ...CATS.map(c => c.id).filter(c => c !== S.layer)];
  const pg = PREFPAGES[p.id];
  let h = `<button class="back" data-closepref>&larr; Back</button><h2>${esc(p.en)}</h2><div class="ja">${esc(p.ja)} · <button class="chip" data-region="${r.id}">${esc(r.en)}</button></div><p>${esc(p.sum)}</p>`;
  if (pg) {
    h += `<h3>Food culture</h3><p>${esc(pg.character)}</p><h3>History</h3><p>${esc(pg.history)}</p>`;
    h += `<h3>Staples</h3><div class="stp">${pg.staples.map(x => `<div><b>${esc(x.name)}</b><i>${esc(x.ja)}</i><p>${esc(x.note)}</p></div>`).join("")}</div>`;
    h += `<h3>Through the year</h3>${pg.calendar.map(x => `<div class="season"><b>${esc(x.season)}</b><br>${esc(x.text)}</div>`).join("")}`;
    h += `<h3>Markets &amp; food streets</h3><div class="stp">${pg.markets.map(x => `<div><b>${esc(x.name)}</b><i>${esc(x.ja)}</i><p>${esc(x.note)}</p></div>`).join("")}</div>`;
    h += `<h3>Good to know</h3><p>${esc(pg.notes)}</p>`;
    h += srcList(pg.src);
  }
  h += `<h2 style="font-size:17px;margin-top:26px">Entries from this prefecture</h2>`;
  for (const cid of order) {
    if (cid === "fish") {
      if (!fish.length) continue;
      h += `<h3>Fish names here</h3>` + fish.map(({ f, s, i }) => `<button class="card" data-fish="${f.id}"><div class="t"><b>${esc(f.en)}</b><span class="ja">${esc(s.label)}</span>${badge(f)}</div><p>${esc(s.names.map(n => n.n).join(" → "))}</p></button>`).join("");
    } else {
      const list = items.filter(i => i.cat === cid); if (!list.length) continue;
      h += `<details class="grp" ${cid === S.layer || list.length <= 3 ? "open" : ""}><summary>${esc(catById[cid].label)}<span class="cnt">${list.length}</span></summary>` + list.map(i => `<button class="card" data-item="${i.id}"><div class="t"><b>${esc(i.name)}</b><span class="ja">${esc(i.ja)}</span></div><p>${esc(i.flavor)}</p></button>`).join("") + `</details>`;
    }
  }
  h += townChips(TOWNS.filter(t => t.pref === p.id).map(t => t.id));
  if (!fish.length && !items.length) h += `<p class="empty">No entries yet for this prefecture in the current layers.</p>`;
  return h + note();
}
function panelRegion(r) {
  const m = r.meter;
  return `<button class="back" data-clear>&larr; All regions</button><h2>${esc(r.en)}</h2><div class="ja">${esc(r.ja)}</div><p><b>${esc(r.tag)}.</b></p><p>${esc(r.text)}</p>
  <h3>Flavour sketch</h3><div class="meter">${meter("Salt", m.salt)}${meter("Sweet", m.sweet)}${meter("Dashi", m.dashi)}${meter("Richness", m.rich)}</div>
  <div style="font-size:12px;color:var(--muted)">An editorial impression to compare regions, not a measurement.</div>
  <h3>Prefectures</h3>${chips(r.prefs)}` + note();
}
function note() {
  return `<div class="note">Entries marked 'sourced' were cross-checked against Japanese sources (ministries, trade associations, makers and local governments), which are linked on each page. Regional names are traditions, not borders: sizes and boundaries differ by source, port and generation, and where sources disagree the page says so. Map shapes are simplified; Okinawa is shown in an inset.</div>`;
}
const mb = $("#monthbar");
function monthbar() {
  mb.classList.toggle("on", S.layer === "fish");
  mb.innerHTML = `<b>Month</b><button data-m="0" aria-pressed="${!S.month}">All</button>` + MON3.map((m, i) => `<button data-m="${i + 1}" aria-pressed="${S.month === i + 1}">${m}</button>`).join("");
}
mb.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.month = +b.dataset.m || null; render(true); });
function render(keepScroll) {
  const top = panel.scrollTop;
  let h;
  if (S.pref) h = panelPref(prefById[S.pref]);
  else if (S.town) h = panelTown(TOWNS.find(x => x.id === S.town));
  else if (S.fish) h = panelFish(fishById[S.fish]);
  else if (S.item) h = panelItem(itemById[S.item]);
  else if (S.region) h = panelRegion(regById[S.region]);
  else h = panelHome();
  panel.innerHTML = h; panel.scrollTop = keepScroll ? top : 0;
  paint(); legend(); monthbar(); applyVB(); writeHash();
}
panel.addEventListener("click", e => {
  const t = e.target.closest("[data-item],[data-fish],[data-pref],[data-region],[data-clear],[data-closepref],[data-sys],[data-town]"); if (!t) return;
  const d = t.dataset;
  if (d.town) selectTown(d.town);
  else if (d.item) selectItem(d.item);
  else if (d.fish) selectFish(d.fish);
  else if (d.pref) selectPref(+d.pref);
  else if (d.region) selectRegion(d.region);
  else if (d.sys !== undefined) zoomSys(+d.sys);
  else if (d.clear !== undefined) clearSel();
  else if (d.closepref !== undefined) { S.pref = null; render(); (S.item || S.fish || S.region || S.town) ? null : viewAll(); }
});
$("#regionbar").innerHTML = REGIONS.map(r => `<button data-r="${r.id}">${esc(r.en.split(" ")[0])}</button>`).join("");
$("#regionbar").addEventListener("click", e => { const b = e.target.closest("button"); if (b) fitTo(unionBox(regById[b.dataset.r].prefs)); });

/* ---------- search ---------- */
const index = [];
for (const p of PREFS) index.push({ k: [p.en, p.ja].join(" ").toLowerCase(), label: p.en + " " + p.ja, sub: "Prefecture", go: () => selectPref(p.id) });
for (const f of FISH) {
  index.push({ k: [f.en, f.ja, f.alt, f.latin].join(" ").toLowerCase(), label: f.en + " " + f.ja, sub: "Fish", go: () => selectFish(f.id) });
  for (const s of f.systems) for (const n of s.names) index.push({ k: (n.n + " " + n.j).toLowerCase(), label: n.n + " " + n.j, sub: `${f.en} name · ${s.label}`, go: () => { selectFish(f.id); } });
}
for (const t of TOWNS) index.push({ k: [t.en, t.ja, t.line].join(" ").toLowerCase(), label: t.en + " " + t.ja, sub: "Town · " + prefById[t.pref].en, go: () => selectTown(t.id) });
for (const i of ITEMS) index.push({ k: [i.name, i.ja, i.text, i.craft || ""].join(" ").toLowerCase(), label: i.name + " " + i.ja, sub: catById[i.cat].label, go: () => selectItem(i.id) });
const q = $("#q"), res = $("#results");
q.addEventListener("input", () => {
  const v = q.value.trim().toLowerCase(); if (v.length < 2) { res.style.display = "none"; return; }
  const seen = new Set(), hits = [];
  for (const e of index) { if (e.k.includes(v) && !seen.has(e.label + e.sub)) { seen.add(e.label + e.sub); hits.push(e); if (hits.length >= 8) break; } }
  res.innerHTML = hits.length ? hits.map((h, i) => `<button data-i="${i}">${esc(h.label)}<small>${esc(h.sub)}</small></button>`).join("") : `<button disabled>No matches<small>Try a fish, a prefecture or a food</small></button>`;
  res.style.display = "block"; res._hits = hits;
});
res.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { res._hits[+b.dataset.i].go(); res.style.display = "none"; q.value = ""; } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.style.display = "none"; });

/* ---------- theme ---------- */
$("#theme").onclick = () => {
  const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

/* ---------- url state ---------- */
function writeHash() {
  const p = new URLSearchParams(); if (S.layer !== "regions") p.set("l", S.layer);
  if (S.month) p.set("m", S.month); if (S.item) p.set("item", S.item); if (S.fish) p.set("fish", S.fish); if (S.pref) p.set("pref", S.pref); if (S.town) p.set("town", S.town); if (S.region) p.set("region", S.region);
  const s = p.toString(); try { history.replaceState(null, "", s ? "#" + s : location.pathname + location.search); } catch (e) {}
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const l = p.get("l"); if (l && (l === "regions" || l === "towns" || catById[l])) S.layer = l;
  if (+p.get("m") >= 1 && +p.get("m") <= 12) S.month = +p.get("m");
  if (p.get("item") && itemById[p.get("item")]) { S.item = p.get("item"); S.layer = itemById[S.item].cat; }
  if (p.get("fish") && fishById[p.get("fish")]) { S.fish = p.get("fish"); S.layer = "fish"; }
  if (p.get("town") && TOWNS.find(t => t.id === p.get("town"))) { S.town = p.get("town"); S.layer = "towns"; }
  if (p.get("region") && regById[p.get("region")]) S.region = p.get("region");
  if (p.get("pref") && prefById[+p.get("pref")]) S.pref = +p.get("pref");
}

/* ---------- init ---------- */
readHash(); buildLayers();
const ar0 = () => svg.clientHeight / svg.clientWidth || 1;
requestAnimationFrame(() => { vb = { ...base }; clampVB(); viewAll(); render();
  if (S.town) { const [x, y] = TOWNS.find(t => t.id === S.town).xy; fitTo({ x: x - 45, y: y - 45, w: 90, h: 90 }, false); } else if (S.pref) fitTo(bbox[S.pref], false); else if (S.item) fitTo(unionBox(itemById[S.item].prefs), false); else if (S.fish) fitTo(unionBox([...new Set(fishById[S.fish].systems.flatMap(s => s.prefs))]), false);
});
})();
</script>
</body>
</html>
