 indication origins","http://shochu.kokubu.co.jp/article/chiritekihyouji.html"],["Shochu Kikou: GI shochu","https://www.shochu-kikou.com/chishiki/nyumon13.html"],["Shimazake: Tokyo Shimazake designated","https://shimazake.com/853/"]]},{"cat":"shochu","name":"Satsuma GI (Satsuma imo shochu)","ja":"薩摩（地理的表示・芋焼酎）","prefs":[46],"text":"Designated 22 December 2005 as a GI for imo shochu of Kagoshima prefecture, excluding Amami city and Oshima district, where kokuto shochu is the local spirit. Per NTA material the area is Kagoshima apart from the Amami islands. It sits alongside the earlier Iki, Kuma and Ryukyu designations, from 1995.","flavor":"Origin label; the style is broad, from full black-koji to fruity yellow-koji potato spirits.","use":"Look for it to confirm the shochu is Kagoshima-grown, mashed and distilled imo shochu.","craft":"The excluded Amami area is the reason kokuto shochu is not 'Satsuma': two separate legal territories sit inside Kagoshima prefecture.","src":[["NTA: Geographical indications of liquor (2018)","https://www.nta.go.jp/about/council/chiri-bunkakai/190331/pdf/005.pdf"],["Kokubu: geographical indications","http://shochu.kokubu.co.jp/article/chiritekihyouji.html"],["Shochu Kikou: GI shochu","https://www.shochu-kikou.com/chishiki/nyumon13.html"]]},{"cat":"shochu","name":"Tokyo Shimazake (Izu Islands GI)","ja":"東京島酒","prefs":[13],"text":"Shochu of the Izu Islands, designated a GI on 13 March 2024. The NTA production standard recognises three types, all using barley koji: imo shochu, barley shochu, and an imo-barley blend. Sweet potatoes must be domestic, water must be drawn within the islands, and fermentation, distillation and storage are done on the islands. Island paddy was scarce, so barley and millet were grown and barley koji became the norm. Islands include Oshima, Toshima, Niijima, Kozushima, Miyakejima, Hachijojima and Aogashima.","flavor":"Toasty, roasted-barley fragrance from barley koji, with potato-cultivar-dependent aromatics; some taste like baked sweet potato.","use":"Island regional spirit; ask the kura for its recommended serving.","craft":"Barley koji is the distinguishing feature written into the GI standard. Tradition says Tanso Shoemon, a Satsuma merchant exiled to Hachijo in the late Edo period, taught distilling to islanders.","src":[["NTA: Tokyo Shimazake production standard","https://www.nta.go.jp/taxes/sake/hyoji/chiri/240313_tokyo_besshi01.htm"],["Ritokei: Tokyo Shimazake designated GI","https://ritokei.com/keizai/31226"],["Shimazake: GI Tokyo Shimazake","https://shimazake.com/853/"]]},{"cat":"shochu","name":"Hachijojima distilleries (Hachijo Shuzo, Sakashita Shuzo) and Aogashima 'Seichu'","ja":"八丈島の焼酎蔵と青ヶ島の青酎","prefs":[13],"text":"The Hachijojima tourism association lists four shochu makers on the island. Hachijo Shuzo, founded in 1915, is described as the oldest on the island; Sakashita Shuzo dates to Taisho 14 (1925). On Aogashima, Aogashima Shuzo makes the local 'Seichu'. Distilling is traced to Tanso Shoemon, a Satsuma merchant exiled to Hachijo late in the Edo period. Barley koji is the island norm.","flavor":"Roasted, toasty barley-koji aroma with potato sweetness.","use":"Small-volume island spirit; best bought on the island or from the kura.","craft":"Supply is small; visitors drink it locally. Check each kura's own page, since information in tourist and retailer sources may be out of date.","src":[["Hachijojima Tourism Association: island shochu","https://www.hachijo.gr.jp/specials/shochu/"],["Tanoshii Osake: shochu from Tokyo","https://tanoshiiosake.jp/2784"],["Ritokei: Tokyo Shimazake","https://ritokei.com/keizai/31226"]]},{"cat":"shochu","name":"Kasutori shochu (sake-lees shochu) of northern Kyushu","ja":"粕取り焼酎","prefs":[40,41],"text":"Shochu distilled from sake lees. Fukuoka's shochu making began in the Edo period with kasutori: lees left over from rice sake were distilled to give shochu and the residue (shimokasu) was used as fertiliser in a recycling farm cycle. Per the Honkaku Shochu Association, traditional making mixes lees with a little water, ferments several months, then distils. Fukuoka's old form pelletises the lees, coats them with rice husk, and steams them in a seiro (solid-mash steam distillation). A 17th-century document is said to describe shochu then made from lees or spoiled sake.","flavor":"Varies by type: traditional husk-steamed versus fresh ginjo lees.","use":"See the seicho and ginjo kasutori entries for serving; the style is a farm-country by-product spirit of northern Kyushu.","craft":"Rice husk keeps the lump open so steam passes evenly; thorough mixing of lees with water matters. Origin of the seiro-type still is debated: Miyazaki Yasusada is said to have introduced the idea from China, but nothing is certain.","src":[["Honkaku Shochu & Awamori Association: kasutori recycling","https://www.honkakushochu-awamori.jp/shochu-column/column/meguri/meg_32.html"],["Tanoshii Osake: kasutori shochu","https://tanoshiiosake.jp/13545"],["Fukuoka no Sake: Fukuoka shochu","https://fukuokanosake.com/fukuoka-shochu/"],["NTA: history of shochu and awamori","https://www.nta.go.jp/taxes/sake/koujikin/pdf/0021012-102_04.pdf"]]},{"cat":"shochu","name":"Seicho kasutori (traditional rice-husk lees shochu)","ja":"正調粕取焼酎","prefs":[40,41],"text":"The older type of lees shochu: lees are mixed with rice husk and steamed in a seiro, as opposed to ginjo kasutori made from fresh ginjo lees. Mori no Kura of Kurume is presented as a kasutori specialist founded in Meiji 31 (1898), and Hikari Shuzo is a shochu-first kura that makes 'Ogame' as seicho kasutori. A Saga example: Tenzan Shuzo of Ogi, which brews sake 'Tenzan', also makes the lees shochu 'Shichida'.","flavor":"Traditional lees-spirit character; no tasting notes were found in the sources.","use":"Traditional spirit of the sake-lees cycle; ask the kura for its serving advice.","craft":"Husk keeps the lees lumps open to steam. The distinction between seicho (husk, old) and ginjo (fresh lees, modern) is how makers classify the styles.","src":[["Seicho Kasutori: tracing its source","https://note.com/seicho_kasutori/n/n3c10e3a76b84"],["Tanoshii Osake: kasutori shochu","https://tanoshiiosake.jp/13545"],["Fukuoka no Sake: Fukuoka shochu","https://fukuokanosake.com/fukuoka-shochu/"],["Vokka: kasutori shochu","https://vokka.jp/5560/"]]},{"cat":"shochu","name":"Ginjo kasutori (fresh ginjo-lees shochu)","ja":"吟醸粕取焼酎","prefs":[40],"text":"Lees shochu made from fresh ginjo sake lees, as distinguished from seicho kasutori, which mixes the lees with rice husk. Examples named in search results: Muhomatsu Shuzo of Kitakyushu and Hana no Tsuyu of Kurume.","flavor":"Described as a gentler counterpart of traditional kasutori; no tasting notes found in the sources.","use":"Made by kura that also brew ginjo-class sake; ask the maker for serving advice.","craft":"Uses fresh lees without husk, in contrast to the husk-steamed seicho type.","src":[["Tanoshii Osake: kasutori shochu","https://tanoshiiosake.jp/13545"],["Seicho Kasutori: tracing its source","https://note.com/seicho_kasutori/n/n3c10e3a76b84"],["Vokka: kasutori shochu","https://vokka.jp/5560/"]]},{"cat":"shochu","name":"Chichibu Kiko (Buko Shuzo sake-lees shochu)","ja":"秩父紀行（武甲酒造）","prefs":[11],"text":"A honkaku sake-lees shochu from Buko Shuzo, an old kura in Chichibu, Saitama, distilled in a single-still. Saitama's Chichibu area also produces shochu from sake lees, a by-product of sake brewing.","flavor":"Sake-lees character; no tasting notes were found in the sources.","use":"Neat or with water; a regional curiosity for Saitama.","craft":"A sake kura distilling its own lees follows the same cycle as northern Kyushu, a reminder that kasutori is a by-product spirit wherever sake is brewed.","src":[["Tanoshii Osake: Chichibu Kiko (Buko Shuzo)","https://tanoshiiosake.jp/8482"]]},{"cat":"shochu","name":"Ryuudon cask-aged imo shochu (Chichibu, Saitama)","ja":"龍呑樽貯蔵（秩父）","prefs":[11],"text":"A honkaku imo shochu from Chichibu Kikusui, listed by the Saitama sake association: made from Chichibu-grown sweet potato, aged in whisky casks and bottled unfiltered. Saitama's other shochu includes a rice shochu 'Danbee' from the Chichibu area.","flavor":"Cask-influenced, with potato sweetness and woody depth.","use":"Straight or on the rocks, as one would a lightly aged spirit.","craft":"Unfiltered bottling keeps oils and body; check the colour against the legal limit for shochu (see the cask-aging entry).","src":[["Saisake: Ryuudon cask-aged honkaku shochu","https://saisake.com/products/%E6%9C%AC%E6%A0%BC%E7%84%BC%E9%85%8E-%E9%BE%8D%E5%91%91%E6%A8%BD%E8%B2%AF%E8%94%B5/"],["Tanoshii Osake: Saitama shochu","https://tanoshiiosake.jp/8482"]]},{"cat":"shochu","name":"Nijo barley (two-row barley) for shochu","ja":"二条大麦","prefs":[44,42],"text":"The standard barley for shochu since the late twentieth century. Two-row barley has large grains that polish well and a high starch content, which also suits barley koji. In Iki, a trial of Miyazaki two-row barley in 1947 is cited as a step towards its spread, after which domestic and imported barley were used.","flavor":"Barley-grain character; no separate sensory notes in the sources.","use":"Underlies both Iki-style rice-koji and Oita-style barley-koji shochu.","craft":"Polish ratio and grain starch affect yield and cleanliness; two-row barley is chosen for its large kernel and starch rather than for flavour alone.","src":[["Takara Shuzo: history and making of barley shochu","https://sakabanashi.takarashuzo.co.jp/cat2/barley_shochu_220323"],["Ikikankou: Iki, birthplace of barley shochu","https://www.ikikankou.com/feature/shochu"],["Shochu Press: Iki shochu","https://shochupress.com/2022/01/09/iki_shochu/"]]},{"cat":"shochu","name":"Rice-koji barley shochu (Iki) vs barley-koji barley shochu (Oita)","ja":"壱岐の米麹麦焼酎と大分の麦麹麦焼酎","prefs":[42,44],"text":"Iki's tradition uses rice koji with barley; the GI fixes barley as the only grain and rice koji only, at roughly 1 koji to 2 grain by weight, commonly described as two-thirds barley to one-third rice koji. Origin is placed in the 16th century, and under Edo-period heavy taxation by Hirado domain barley became the islanders' staple. Barley koji became mainstream from the 1970s, and many Oita brands use it, in contrast to Iki. Sources differ on exact dates.","flavor":"Style contrast: rice-koji Iki versus barley-koji Oita; no sensory notes in the sources.","use":"Compare the two styles side by side.","craft":"Koji grain is the label to read: rice koji (kome-koji) or barley koji (mugi-koji). Broken Thai rice or domestic rice is used for Iki koji.","src":[["Takara Shuzo: barley shochu","https://sakabanashi.takarashuzo.co.jp/cat2/barley_shochu_220323"],["Ikikankou: Iki shochu","https://www.ikikankou.com/feature/shochu"],["Shochu Next: Iki shochu, the origin of barley shochu","https://shochu-next.com/article/8186"],["Shochu Press: Iki shochu","https://shochupress.com/2022/01/09/iki_shochu/"]]},{"cat":"shochu","name":"Hadaka-mugi shochu (Ehime naked barley)","ja":"はだか麦焼酎（愛媛）","prefs":[38],"text":"Ehime is the largest naked-barley producing prefecture, said to grow about 40 percent of the national crop. Makers distil shochu from it: Sakura Uzumaki Shuzo of Matsuyama, mainly a sake kura, took a shochu licence in 1959 and makes a hadaka-mugi barley shochu; Matsada Shuzo of Seiyo makes 'Houzenbou' from hadaka-mugi. The aroma is compared with 'mugi choco' and 'kaki no tane' snacks.","flavor":"Roasted, sweet and nutty, in the manner of roasted barley.","use":"On the rocks, mizuwari or soda; pairs with Ehime fish dishes.","craft":"Ehime's share of national naked-barley output (about 40 percent) is the selling point; judge by comparing against other barley shochu.","src":[["Tanoshii Osake: Sakura Uzumaki (Ehime)","https://tanoshiiosake.jp/10599"],["Sakekaitori: Ehime shochu","https://www.sakekaitori.com/knowledge/20211006-syotyu-ehimw/"]]},{"cat":"shochu","name":"Ehime specialty-ingredient shochu (chestnut, shiitake, rice-barley)","ja":"愛媛の変わり種焼酎（栗・椎茸）","prefs":[38],"text":"Hime-bayashi, described as the only shochu-specialist maker in Shikoku, uses rice, chestnut and barley and makes chestnut shochu 'Okuri Okura'. Ogata Shuzo of Nomura makes a shiitake shochu, 'Ren', from rice and barley. A retailer lists an Ehime imo shochu 'Setomusubi' made with local potato.","flavor":"Not described in the sources.","use":"Gift and conversation spirits; neat or on the rocks.","craft":"These rely on the designated-ingredient rules: the base grain still carries the fermentation. Source quality here is retailer-level, so verify before quoting.","src":[["Sakekaitori: Ehime shochu picks","https://www.sakekaitori.com/knowledge/20211006-syotyu-ehimw/"],["Tanoshii Osake: Sakura Uzumaki (Ehime)","https://tanoshiiosake.jp/10599"]]},{"cat":"shochu","name":"Dabada Hiburi (chestnut shochu, Kochi)","ja":"ダバダ火振（栗焼酎）","prefs":[39],"text":"Chestnut shochu from Muteki Muka (Shimanto town, Kochi), a sake kura founded in Meiji 26 (1893). Around 1985 the town asked the kura to use chestnuts, because boars attracted by fallen chestnuts raided fields. It obtained a chestnut-limited distilling licence and worked out the product. The maker states chestnut makes up 50 percent of the raw material, with barley and rice, and distils slowly at low temperature; 25 percent ABV. Hiburi refers to the torch fishing of ayu on the Shimanto river.","flavor":"Gentle chestnut sweetness and toasty aroma with restrained alcohol.","use":"On the rocks or mizuwari; popular as a gift.","craft":"Uses many non-standard chestnuts. Early sales were poor; wider fame came after an airline in-flight catalogue. Sources vary on the origin of 'Dabada'.","src":[["Kochike: the secret of Dabada Hiburi","https://kochike.jp/column/299/"],["Marugoto Kochi magazine: Dabada Hiburi","https://magazine.kochi-gaisho.com/magazine/115/"],["Muteki Muka: Dabada Hiburi","https://mutemuka.com/shochu/dabadahiburi.html"]]},{"cat":"shochu","name":"Beni Otome (sesame shochu, Kurume)","ja":"紅乙女（胡麻焼酎）","prefs":[40],"text":"The first sesame shochu, born in 1978 at Beni Otome Shuzo in Kurume, Fukuoka, by founder Hayashida Haruno. Roasted sesame, stated as at least 10 percent and Fukuoka-grown, is added to a mash of barley and rice koji in the first stage; sesame has little starch, so grain is needed. It is distilled under reduced pressure and the process is patented. Gold is a 38 percent long-aged version, said to have won a three-star taste award in 2006.","flavor":"Faint sesame aroma with soft, mellow flavour; Gold is richer.","use":"Standard 25 percent and long-aged 38 percent Gold are the main lines.","craft":"Sesame is added at the first mash, not later. Product ratios vary: some sources say 10 percent, others 20.","src":[["Tanoshii Osake: sesame shochu","https://tanoshiiosake.jp/11595"],["Fukuoka Sake Brewers Assoc: Beni Otome","http://www.fukuoka-sake.org/map/detail.php?ID=73"],["Beni Otome complete guide","https://kaka-1834.com/beniotome-shochu-complete-guide/"]]},{"cat":"shochu","name":"Soba shochu and Unkai (Gokase, Miyazaki)","ja":"そば焼酎・雲海","prefs":[45],"text":"Unkai Shuzo of Gokase, Miyazaki, founded in 1967 as Gokase Shuzo, launched Unkai in October 1973, Japan's first soba shochu. Soba hulls are removed after heat treatment; soba ferments weakly, so rice or barley koji is combined with it. Unkai is listed as soba, barley koji and rice, white koji, reduced-pressure distillation, using Gokase river water. Variants include black-koji Unkai and one with a yeast from the 'Unkai' soba flower.","flavor":"Faint soba aroma, clean and easy-drinking.","use":"Ask the kura for its recommended serving.","craft":"Cold climate allows slow fermentation for finer umami. Miyazaki and Nagano are the centres of soba shochu.","src":[["Tanoshii Osake: Unkai","https://tanoshiiosake.jp/3995"],["Tanoshii Osake: soba shochu","https://tanoshiiosake.jp/9059"],["Unkai Shuzo: facilities","https://www.unkai.co.jp/learn/facility"]]},{"cat":"shochu","name":"Kokuto shochu: the 1953 reversion exemption","ja":"黒糖焼酎の特例（1953年）","prefs":[46],"text":"When Amami returned to Japan in 1953, kokuto liquor risked being taxed like rum; islanders asked that it be treated as shochu. The compromise: adding rice koji to the process let it be classed as shochu, a concession limited to the Oshima tax office district (Amami). Brown sugar alone would make it a spirit. Production is on five islands: Amami Oshima, Kikaijima, Tokunoshima, Okinoerabu, Yoron. Sources disagree on whether the basis was a notice or a law revision.","flavor":"Brown-sugar-derived character; see the kura entry for atmospheric versus reduced-pressure styles.","use":"Production covers five islands; ask the individual kura for serving advice.","craft":"The rice-koji requirement is the legal basis of the category. Make sure labels say kokuto shochu and not a rum-style spirit.","src":[["Amami Bussan: history of kokuto shochu","https://www.amamibussan.jp/info/kokuto/distilled-spirits-history/"],["Sakelog: Amami kokuto shochu history","https://sakelog.jp/history/"],["Tensei Shuzo: kokuto shochu","https://tensei-shuzo.com/tenpedia/%E9%BB%92%E7%B3%96%E7%84%BC%E9%85%8E/"],["Amami Horizon: kokuto shochu history","https://amami-horizon.com/culture/food/history-of-kokuto-shochu"]]},{"cat":"shochu","name":"Amami kokuto shochu kura and their styles","ja":"奄美黒糖焼酎の蔵と銘柄","prefs":[46],"text":"Amami Oshima Shuzo (founded 1957) makes Hamachidori no Uta, Takakura and Jougo; Tomita Shuzojo makes Ryugu, atmospheric-distilled in large jars; Amami Oshima Kaiun makes Lento, aged to classical music; Machida Shuzo's Sato no Akebono is described as Japan's first reduced-pressure kokuto shochu; Asahi Shuzo of Kikaijima makes Asahi, atmospheric-distilled from local cane. Niiro Shuzo of Okinoerabu makes Tenkaichi from island brown sugar.","flavor":"Varies by kura and still type.","use":"A way to compare atmospheric and reduced-pressure kokuto styles.","craft":"Claims from retailer and ranking sites conflict (e.g. one source says Sato no Akebono is also three-year stored). Verify with the kura.","src":[["Ritokei: Amami kokuto shochu kura guide","https://ritokei.com/voice/2463"],["Sakelog: Amami kura list","https://sakelog.jp/brewery-list/"]]},{"cat":"shochu","name":"Why awamori uses Thai long-grain rice","ja":"泡盛とタイ米","prefs":[47],"text":"Awamori is made of broken Thai indica rice. Rice prices in Okinawa rose in the early 1920s and makers looked for a quality overseas rice. Sources list reasons: crushed grain presents a large surface for black koji, it is firmer than sticky japonica and easier to handle, it steams non-sticky so mycelium can reach the interior and mash temperature is easier to control. One personal answer says price was the main reason.","flavor":"Aroma and body of awamori; rich fragrance reported.","use":"Explains why awamori is 'kome-koji' only, no other grain.","craft":"Non-sticky rice is easier to spread on a koji tray and keep from clumping. Check source: some reasons come from blogs and Q&A.","src":[["MLIT multilingual tourism DB: why Thai rice","https://www.mlit.go.jp/tagengo-db/R1-01302.html"],["Tanoshii Osake: awamori raw material","https://tanoshiiosake.jp/11321"],["Shochu Data: awamori ingredients","https://shochu-data.com/awamori-ingredients/"]]},{"cat":"shochu","name":"Zen-koji jikomi (all-koji, single-stage mash) of awamori","ja":"全麹仕込み","prefs":[47],"text":"Awamori is mashed with all the rice converted to black koji, in one stage, instead of the two-stage koji-then-steamed-grain mash used for shochu. The black koji produces abundant citric acid, suppressing contaminating bacteria in Okinawa's hot, humid climate; with two stages the acid would be diluted, which is the stated reason all-koji mashing took root.","flavor":"Rich, citric-acid-protected ferment of a full-koji mash.","use":"Foundation of awamori; read on the label as 'raw material: rice koji'.","craft":"Labels of awamori list only rice koji. The ferment is a single stage with full koji; citric acid is the safety net.","src":[["MLIT multilingual tourism DB: Thai rice and black koji","https://www.mlit.go.jp/tagengo-db/R1-01302.html"],["Sakesen: how awamori is made","https://sakesen-media.com/how-to-make-awamori/"],["Tanoshii Osake: awamori raw material","https://tanoshiiosake.jp/11321"]]},{"cat":"shochu","name":"Awamori kusu (koshu) labelling rule","ja":"泡盛の古酒（クース）表示基準","prefs":[47],"text":"Only awamori stored at least three years may be labelled koshu. The Okinawa awamori association tightened labelling: earlier a blend with at least 50 percent of 3-year-or-older awamori could be called koshu; the tightened rule requires all of the content to be 3 years or older. Some current articles still repeat the old 50 percent figure.","flavor":"Mellow, sweet, with vanilla-like aroma after years of storage.","use":"Look for 'koshu' and years on the label; sip neat or with water.","craft":"Verify with the Fair Competition Code for awamori labels. Mixed-age bottles must show ages truthfully.","src":[["Okinawa Awamori association FAQ","https://www.awamori.or.jp/user_data/awamorifaq"],["Nikkei: koshu labelling tightened","https://www.nikkei.com/article/DGXNASJC1001T_Q3A011C1ACY000/"],["Tanoshii Osake: kusu glossary","https://tanoshiiosake.jp/7379"]]},{"cat":"shochu","name":"Shitsugi (awamori solera-style topping up)","ja":"仕次ぎ","prefs":[47],"text":"A method of ageing awamori by topping up old jars with younger spirit. Okinawa research modelling it found vanillin concentration after 8 shitsugi rounds about 1.5 times that without shitsugi. The same studies found 4-vinylguaiacol dropped greatly in storage but only a few to a dozen percent converted to vanillin. A distiller says koshu forms fastest at 5 to 7 years, with shitsugi from year 7.","flavor":"Vanilla and sweet roundness; rough edges soften.","use":"Used by kura and home growers for long-aged koshu.","craft":"Use a good parent spirit; the process lets old spirit lend character to young. Do not assume vanillin rises by storage alone.","src":[["Okinawa Times: effect of shitsugi analysed","https://www.okinawatimes.co.jp/articles/-/810589"],["Okinawa Prefecture Industrial Technology Center: study of shitsugi and ageing (2017)","https://www.pref.okinawa.jp/_res/projects/default_project/_page_/001/019/805/h29houkoku002.pdf"],["Ryukyu Shimpo: growing koshu at home","https://ryukyushimpo.jp/living-style/entry-793733.html"]]},{"cat":"shochu","name":"Origins of awamori (Siam, Shuri Sanka)","ja":"泡盛の起源と歴史","prefs":[47],"text":"Most accounts say distilling reached Ryukyu from Siam (Thailand) in the 15th century, some say late 14th. Higashionna Kanjun's 1941 'Awamori Zakko' proposed Thai 'lao long' as the origin. In 1460 King Sho Taikyu sent a 'Tenjiku liquor' to Korea, thought to be palm-based. Under the Ryukyu Kingdom production was restricted to the three Shuri villages (Shuri Sanka). Black koji and a local climate-adapted process made it distinct.","flavor":"Historical entry.","use":"Cultural context for a bottle from Okinawa's southern history.","craft":"Dates and routes vary by source; this is a hypothesis rather than a settled record.","src":[["Wikipedia: Awamori","https://ja.wikipedia.org/wiki/%E6%B3%A1%E7%9B%9B"],["Ryukyu Shimpo: what is awamori","https://ryukyushimpo.jp/news/economics/entry-3620941.html"],["Okinawa Navi: awamori history","https://okinawa-navi.jp/magazine/awamori-history/"]]},{"cat":"shochu","name":"Hanazake of Yonaguni (60 percent awamori)","ja":"与那国の花酒","prefs":[47],"text":"Hanazake is awamori of about 60 percent ABV made only on Yonaguni. It is the first distillate, from the same raw materials and process as awamori. Because tax law caps awamori at 45 degrees, it is treated for tax as raw alcohol. The name hanazake is used only for 60-degree-class spirit on the island. Some bottles are made with no dilution, just filtered; ordinary Yonaguni awamori is diluted to 43 or below. Donan is the best-known brand (Kokusen Awamori, Thai rice, black koji).","flavor":"Strong aroma and distinctive taste, per the maker's description of Donan.","use":"Used in rites (shinji) on Yonaguni; sip in small amounts.","craft":"Sources vary: '60 degrees', 'above 60', 'around 60'. 'Japan's strongest' is a sales line.","src":[["Tanoshii Osake: Yonaguni hanazake","https://tanoshiiosake.jp/3512"],["Tanoshii Osake: Donan","https://tanoshiiosake.jp/5132"],["Ritokei: 60 degree hanazake","https://ritokei.com/ritokeiblog/9158"]]},{"cat":"shochu","name":"Awamori kura by region (Zuisen, Kumesen, Kikunotsuyu, Tarakawa, Yaeizumi)","ja":"泡盛の蔵元（瑞泉・久米仙・菊之露・多良川・八重泉）","prefs":[47],"text":"Zuisen (Shuri, Naha) was founded 1887 near Shuri castle and is known for pot-aged koshu, rice and black koji, atmospheric distillation. Kikunotsuyu (Miyako, 1928) is described as moving to a modern taste and sells a reduced-pressure 25 percent pack. Tarakawa (Miyako, 1948). Yaeizumi (Ishigaki, 1955) is known for direct-fire distillation, \"Kuroshinju\", and early long storage in Western casks. Kumesen's founding is cited as both 1949 and 1952 in one guide, so check with the maker. A guide counts 47 awamori kura in Okinawa.","flavor":"Varies by kura.","use":"A map for regional comparison tastings.","craft":"Years and methods in retail and ranking sources conflict; use the kura's own site for firm dates.","src":[["Okinawa Navi: 47 awamori kura guide","https://okinawa-navi.jp/magazine/awamori-factory-visit/"],["Kumesen: cask-aged awamori of Yaeizumi","https://kumesen.co.jp/magazine/241009/"],["Taragawa: about awamori","https://taragawa.shop/?tid=8&mode=f9"]]},{"cat":"shochu","name":"Oyuwari and 'rokuyon' (6:4 hot water dilution)","ja":"お湯割り・ロクヨン","prefs":[46],"text":"Oyuwari is Kagoshima's most familiar way to drink shochu. Denen Shuzo's basic rule is hot water first, then shochu, and the classic ratio is 6 shochu to 4 water ('rokuyon'), giving about 15 percent ABV. The finished drink at human body temperature or slightly hotter (40 to 45 degrees C) opens the aroma; another source says about 70 degree water. Temperature advice differs by source.","flavor":"Warm; aroma opens with heat per makers.","use":"Common in Kagoshima; hot water first, then shochu.","craft":"Hot water goes in first and shochu after (Denen Shuzo). Final drink temperature advice varies from about 40 to 45 degrees C to hotter.","src":[["Denen Shuzo: how to make oyuwari","https://www.denen-shuzo.co.jp/learn/03.htm"],["Tanoshii Osake: oyuwari and maewari","https://tanoshiiosake.jp/2567"],["Sake Oyaji: oyuwari","https://sakeoyaji.com/shochu-oyuwari/"]]},{"cat":"shochu","name":"Maewari (pre-mixed shochu, rested overnight)","ja":"前割り","prefs":[46],"text":"Mix shochu and water ahead of time and let them rest, at least overnight per Takara Shuzo, so the two blend. The most common ratio in Kyushu is 6 shochu to 4 water, with 7:3 or 5:5 by preference. Denen Shuzo presents it as a traditional Kagoshima practice. It is served cold, at room temperature or warmed.","flavor":"Blended and softened by resting, per Takara Shuzo.","use":"Serve as is or warmed; also the base for kuro-joka.","craft":"Rest at least overnight; ratio commonly 6:4, adjustable to 7:3 or 5:5.","src":[["Takara Shuzo: how to drink","https://www.takarashuzo.co.jp/products/shochu/nomikata/index.htm"],["Tanoshii Osake: oyuwari and maewari","https://tanoshiiosake.jp/2567"],["Denen Shuzo: oyuwari","https://www.denen-shuzo.co.jp/learn/03.htm"]]},{"cat":"shochu","name":"Kuro-joka (flat clay kettle for warming shochu)","ja":"黒千代香（くろぢょか）","prefs":[46],"text":"A flat black earthenware pot with a spout. According to Denen Shuzo, the old way is to put pre-mixed shochu in the kuro-joka, warm it, and drink from small cups (choko). Written 黒千代香 and read 'kurojoka', it belongs with maewari as a Kagoshima tradition.","flavor":"Gentle warmth.","use":"Warming maewari shochu at table.","craft":"Pre-mixed shochu goes in the pot and is warmed (Denen Shuzo); no further technique was found in the sources.","src":[["Denen Shuzo: oyuwari","https://www.denen-shuzo.co.jp/learn/03.htm"],["Tanoshii Osake: oyuwari and maewari","https://tanoshiiosake.jp/2567"]]},{"cat":"shochu","name":"Cask-aged shochu and the colour limit","ja":"樽貯蔵焼酎と着色度規制","prefs":[44,45,40],"text":"Oak casks turn clear shochu amber with caramel and vanilla notes. Denen Shuzo says only shochu with over 50 percent of 3-year-plus stored spirit may be called 'long-term stored' (choki chozo). Honkaku shochu has a colour (absorbance) limit; a spirit past it cannot be sold as shochu and falls under liqueur. Oishi Shuzo keeps cask and tank stocks apart and measures absorbance before shipping. The exact limit was not found in search.","flavor":"Amber, vanilla and caramel, sometimes whisky-like.","use":"Neat or on the rocks.","craft":"Blend cask-aged with tank-aged spirit to hold colour below the limit. Check absorbance.","src":[["Denen Shuzo: long-term storage","https://www.denen-shuzo.co.jp/denen/01.htm"],["Shochu Press: why age shochu","https://shochupress.com/2021/12/15/shochu_jyukusei/"],["Shochu Next: 20 cask-aged shochu and awamori","https://shochu-next.com/article/2557"]]},{"cat":"shochu","name":"Hyakunen no Kodoku (Kuroki Honten, Takanabe)","ja":"百年の孤独（黒木本店）","prefs":[45],"text":"A long-aged barley shochu from Kuroki Honten in Takanabe, Koyu district, Miyazaki. Barley only (barley and barley koji), 40 percent, aged in white oak casks for 3, 4 and 5 years and blended. Amber and whisky-like. Founding is given as Meiji 18 (1885) in one article and Meiji 37 in a retailer page. No release year found.","flavor":"Amber, mellow, complex, rich.","use":"Neat or on the rocks.","craft":"Blending several cask years is the craft.","src":[["Tanoshii Osake: Hyakunen no Kodoku","https://tanoshiiosake.jp/10372"],["Nishinippon: Hyakunen no Kodoku","https://www.nishinippon.co.jp/yakusake/2022/07/18/hyakunennokodoku-miyazakishochu/"]]},{"cat":"shochu","name":"Kirishima Shuzo (Kuro, Shiro, Aka Kirishima)","ja":"霧島酒造（黒・白・赤霧島）","prefs":[45],"text":"Kirishima Shuzo of Miyakonojo, Miyazaki, founded 1916. Its first shochu was black-koji. Kuro-Kirishima is described as sweet and sharp-finishing; Shiro-Kirishima is white-koji with Heisei Miyazaki yeast for a sweet aroma; Aka-Kirishima uses Murasaki Masari purple potato. Akane-Kirishima uses Tamaakane. Release years were not found in the results.","flavor":"Kuro: thick sweetness, sharp end; Shiro: soft; Aka: fruity.","use":"Three-bottle sets of Aka, Kuro and Shiro Kirishima are sold for comparison.","craft":"Compare koji and potato effects across the line.","src":[["Tanoshii Osake: Kirishima","https://tanoshiiosake.jp/3992"],["Nishinippon: Kuro-Kirishima","https://www.nishinippon.co.jp/yakusake/2022/04/29/kurokirishima/"]]},{"cat":"shochu","name":"Nishi Shuzo and Tominohozan","ja":"西酒造・富乃宝山","prefs":[46],"text":"Nishi Shuzo, founded 1845 in Fukiage, Hioki, Kagoshima. Tominohozan uses Kogane Sengan with yellow koji, ferments at low temperature, and switches from atmospheric to reduced pressure during distillation. Citrus fragrance, smooth, with a sharp finish. Retailers call it a trigger of the third shochu boom, but no primary source confirmed this.","flavor":"Citrus fragrance and smoothness, per sellers.","use":"On the rocks, soda, mizuwari.","craft":"Low-temperature fermentation and the mid-run switch of distillation are the two process choices.","src":[["Imadeya: Nishi Shuzo","https://imadeya.co.jp/blogs/brewery/nishi"],["Hasegawa Saketen: Tominohozan","https://www.hasegawasaketen.com/eshop/products/detail/3944"]]},{"cat":"glossary","name":"The five JAS types of shoyu (goshurui)","ja":"しょうゆ五種類（濃口・淡口・溜・再仕込み・白）","prefs":[],"text":"Japanese Agricultural Standard classification divides shoyu into five types: koikuchi, usukuchi, tamari, saishikomi and shiro. Koikuchi is the standard type and is described as roughly 80% of Japanese output; usukuchi is a little over 10% and favoured in Kansai. Tamari is brewed with little brine and little or no wheat, mainly in the Chubu region (Aichi, Gifu, Mie). Saishikomi uses raw shoyu instead of brine, so it needs about twice the raw material and time. Shiro is the palest, wheat-dominant, amber type. Salt-level figures differ between sources.","flavor":"Five distinct profiles: balanced (koikuchi), salty and pale (usukuchi), thick and umami-heavy (tamari), intense and sweet-rounded (saishikomi), light and sweet-wheaty (shiro).","use":"Choose by role: koikuchi as the all-round seasoning, usukuchi where colour must be kept, tamari for sashimi, grilled senbei and glazes, saishikomi as a finishing or dipping shoyu, shiro for pale sauces and clear dishes.","craft":"Do not trust quoted salt percentages blindly: sources give about 16% for koikuchi and 18-19% for usukuchi, but they vary. Usukuchi is paler yet saltier than koikuchi, so substituting it 1:1 for colour changes seasoning. Taste before use, and note that the same word may cover very different regional styles within one type.","src":[["Mi-Journey: five types of shoyu","https://mi-journey.jp/foodie/11153/"],["Higashimaru: various shoyu","https://www.higashimaru.co.jp/enjoy/oshiete/etc.html"],["Japan Shoyu Association: JAS","https://www.soysauce.or.jp/knowledge/jas"]]},{"cat":"glossary","name":"Seikiku (shoyu koji making)","ja":"製麹（醤油麹づくり）","prefs":[],"text":"Seikiku is the first brewing stage. Soybeans are steamed and wheat is roasted, then seed koji (tanekoji) is mixed in and the mass is held in a koji room under controlled temperature and humidity for about three days, with periodic turning (teire). The product is shoyu koji, which supplies the enzymes that later break down protein and starch in the moromi. Kikkoman's description gives steamed soy and roasted wheat as the standard koikuchi inputs.","flavor":"Koji itself is mild and dry; quality shows later in the moromi as clean umami and aroma.","use":"Understood as the quality-determining step for enzyme activity, which governs how much of the soy protein ends up as flavour in the finished shoyu.","craft":"Koji temperature, humidity and the timing of turning (teire) are the control points; exact room temperatures were not in the sources seen and should be taken from the maker.","src":[["Kikkoman Soy Sauce Museum: how shoyu is made","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/making.html"],["Honjozo shoyu production process","https://www.eonet.ne.jp/~shoyu/mametisiki/mame04-a.html"],["Hakko Blend: shoyu basics","https://www.hakko-blend.com/study/hakkofood/01.html"]]},{"cat":"glossary","name":"Moromi (shoyu mash fermentation and ageing)","ja":"諸味（もろみ）","prefs":[],"text":"Moromi is made by mixing shoyu koji with brine (salt water). Fermentation and ageing in tank or barrel run roughly six months to a year according to the manufacturer pages seen; kioke Shodoshima shoyu is stated at about one year for koikuchi, against 4 to 8 months in stainless tanks. Yeast and lactic bacteria work together with koji enzymes in the mash. Tamari and saishikomi change the recipe: tamari uses less brine, saishikomi uses raw shoyu in place of brine.","flavor":"Fresh moromi is thick, salty and savoury with strong aroma; the character is set here.","use":"The mash is the stage where producers adjust style by brine ratio, vessel and time before pressing.","craft":"Brine ratio is the main lever: one source puts koikuchi brine at 50 to 100% of the koji volume and tamari lower. Ageing time varies by maker (about 6 months to 2.5 years in the sources seen). No stirring schedule or temperatures were found in the sources.","src":[["Japan Shoyu Association: process","https://www.soysauce.or.jp/knowledge/process"],["Marue Shoyu: shoyu making","https://www.marue-shoyu.co.jp/quality/shoyu/"],["Shodoshima Town: oke-jikomi shoyu","https://www.town.shodoshima.lg.jp/gyousei/kakuka/shokokanko/4/891.html"]]},{"cat":"glossary","name":"Assaku and kiage (pressing, raw shoyu)","ja":"圧搾・生揚げ","prefs":[],"text":"After ageing the moromi is pressed to separate liquid from solids. The liquid is called kiage (生揚げ), raw shoyu, and the cake that remains is shoyu-kasu. Kikkoman's description describes pressing the moromi to obtain raw shoyu, which then goes to settling, filtration and heating. First-pressed (ichiban shibori) shoyu is sometimes marketed separately, for example by Ishimago Honten in Akita.","flavor":"Raw kiage is fragrant, lively and slightly raw-tasting compared with fired shoyu.","use":"Kiage is the base for nama-shoyu and for fired shoyu; it is also the liquid used in place of brine for saishikomi.","craft":"Settle and remove the oil that rises from raw shoyu before bottling; keep kiage cold if held, as it is still microbially active. 'Ichiban shibori' claims are marketing language, not a JAS grade. Pressing equipment and cycle times are not given in the sources I saw.","src":[["Kikkoman Soy Sauce Museum: how shoyu is made","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/making.html"],["Honjozo shoyu process","http://www.eonet.ne.jp/~shoyu/mametisiki/sm-shoyu04.html"],["Biglobe: Akita shoyu","https://food.biglobe.ne.jp/rankings/22072/"]]},{"cat":"glossary","name":"Hiire (heat treatment of shoyu)","ja":"火入れ","prefs":[],"text":"Hiire is the heat treatment applied to raw shoyu (kiage) after pressing. It sterilises the product, stops enzymes and microbes, and develops the final colour and aroma. After heating the shoyu is clarified and filtered before bottling. Sources describe it as heating to sterilise and to adjust fragrance and colour. Shoyu sold without hiire but with equivalent microbial removal may be called nama-shoyu.","flavor":"Heat gives the familiar roasted, caramel-like fragrance and deeper colour.","use":"Defines the difference between standard bottled shoyu and unfired nama (ki) shoyu.","craft":"Heating temperature and time are tuned by maker to balance aroma against colour; sediment (ori) forms during firing and is removed by settling and filtering. I do not have specific temperatures from the sources seen.","src":[["Kikkoman Soy Sauce Museum: how shoyu is made","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/making.html"],["Honjozo shoyu process","https://www.eonet.ne.jp/~shoyu/mametisiki/mame04-a.html"],["Kikkoman: various shoyu","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/various.html"]]},{"cat":"glossary","name":"Nama-shoyu (unpasteurised shoyu)","ja":"生しょうゆ（なましょうゆ）","prefs":[],"text":"Kikkoman explains that shoyu drawn straight from pressed moromi is kiage-shoyu, and that 'nama shoyu' is a name allowed for shoyu not heat-treated but given an equivalent microbial removal. Makers such as Kikkoman (Shiboritate Nama Shoyu) and Nihon Shoyu Kogyo sell it. The maker lists 18 months from manufacture for a 1 L bottle, and it must be refrigerated after opening. Description: fresh colour, soft saltiness, gentle aroma.","flavor":"Pale, bright colour, soft salt, gentle aroma, less roasted than fired shoyu.","use":"Dressings, sashimi, tofu and other dishes where aroma should stay light; add late rather than cooking it.","craft":"Refrigerate once open, because aroma and colour decline faster than in fired shoyu; one Q&A says koji organisms remain alive but that is anonymous and unreliable. Avoid prolonged high heat, which would erase the point of buying it.","src":[["Kikkoman: various shoyu","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/various.html"],["Kikkoman Shiboritate Nama Shoyu","https://www.kikkoman.co.jp/products/K05/detail/K050300.html"],["Nihon Shoyu Kogyo: nama shoyu 1 L","https://www.kikkonihon.co.jp/products/fresh-soy-sauce-1l"]]},{"cat":"glossary","name":"Honjozo, konkō-jozo and konkō labelling","ja":"本醸造・混合醸造・混合","prefs":[],"text":"Under JAS, shoyu is made by one of three methods and the label shows it: honjozo (本醸造), konkō-jozo (混合醸造) and konkō (混合). Honjozo shoyu has no amino acid liquid added; one explanation says amino acid liquid in the mix puts it in the other groups. 'Tokkyu' (special grade) is allowed only on honjozo shoyu, with an exception for konkō-jozo saishikomi. Tennen jozo, a non-JAS claim, additionally means no enzyme added to speed fermentation and no food additives.","flavor":"Honjozo: fuller, more rounded umami; konkō types vary with maker.","use":"Read the label when sourcing: for a kitchen needing authentic fermentation flavour, honjozo is the baseline; konkō products are often cheaper and sweeter.","craft":"The grade (tokkyu, jokyu, hyojun) and the method are independent labels. Check the ingredient list for amino acid liquid, sweeteners and alcohol. 'Tennen jozo' is advertised, not a JAS category, so ask the maker. Sources disagree on some nitrogen values; consult the JAS text.","src":[["Japan Shoyu Association: JAS","https://www.soysauce.or.jp/knowledge/jas"],["Shoyu labels and quality indications","http://www.eonet.ne.jp/~shoyu/mametisiki/mame14-a.html"],["Fujijin: shoyu quality labelling","https://www.fujijin.co.jp/qa/470/"],["Ono Murasaki: classification by method","https://www.oonomurasaki.jp/pages/34/"]]},{"cat":"glossary","name":"Shoyu grades (tokkyu, jokyu, hyojun)","ja":"しょうゆの等級（特級・上級・標準）","prefs":[],"text":"JAS-marked shoyu must show a grade: tokkyu (special), jokyu (superior) or hyojun (standard). Grading depends mainly on total nitrogen, the umami indicator, along with colour and salt-free soluble solids. For koikuchi, one source gives total nitrogen of at least 1.50% for tokkyu, 1.35% for jokyu and 1.20% for hyojun. 'Tokusen' above tokkyu is a higher claimed nitrogen level. Sources differ on tamari and saishikomi values, so check the JAS text.","flavor":"Higher grade means more total nitrogen, so rounder umami and body, but not necessarily a better fit.","use":"A buying guide for consistent umami level; choose by dish rather than by grade alone.","craft":"Grade measures nitrogen and not flavour quality or freshness; a tokkyu shoyu that is oxidised or old will lose to a hyojun fresh bottle. The 2014 MAFF revision document is old, so confirm the current JAS wording before quoting figures.","src":[["Kotowari: shoyu grades","https://www.kotowari-cooking.com/note/ingredients/seasonings/soy-sauce/japanese/grade"],["Fujijin: quality labelling","https://www.fujijin.co.jp/qa/470/"],["MAFF: JAS revision for shoyu (2014)","https://www.maff.go.jp/j/jas/kaigi/pdf/140529_sokai_c.pdf"]]},{"cat":"shoyu","name":"Kioke-jikomi shoyu (wooden-barrel brewing)","ja":"木桶仕込み醤油","prefs":[37],"text":"Shoyu fermented in cedar barrels. Shodoshima Town describes its oke-jikomi shoyu as long-brewed: about one year for koikuchi and two for saishikomi, against 4 to 8 months in stainless tanks. A barrel is about 2.2 m across the top, 1.7 m deep, about 5,800 L, and old ones are over 100 years old. Raw materials are Kyushu whole soybeans and wheat from Kagawa and Hokkaido, according to the town page. Microbes living in the barrel and kura (shoyu yeast, lactic bacteria) are said to give each brewery its taste.","flavor":"Deeper, more complex and rounded aroma than tank-brewed shoyu, with a lingering finish.","use":"Finishing shoyu for sashimi, tofu, rice and dishes that show the shoyu itself.","craft":"Barrels and kura carry resident microbes, so replacing or cleaning them changes the flavour; barrels ferment at different speeds, so makers judge each one. Barrel-making skill is a limiting factor for the craft. Ageing periods vary between sources (1 to 3 years quoted), so ask the maker.","src":[["Shodoshima Town: oke-jikomi shoyu","https://www.town.shodoshima.lg.jp/gyousei/kakuka/shokokanko/4/891.html"],["Kotowari: kioke shoyu","https://www.kotowari-cooking.com/note/ingredients/seasonings/soy-sauce/japanese/kioke-shoyu"],["Shima Shoyu: Shodoshima features","https://shima-shoyu.com/point/"]]},{"cat":"producer","name":"Yamaroku Shoyu (Shodoshima kioke brewery)","ja":"ヤマロク醤油","prefs":[37],"text":"A Shodoshima brewery profiled by Ryori Tsushin for keeping kioke brewing alive; the fifth-generation owner apprenticed with a barrel maker. He judges each barrel's fermentation speed and ripeness and presses the moromi on a 2 to 2.5 year cycle, according to the piece. Its saishikomi-style 'Tsuru-bishio' is reported to make up about 80% of its output, though accounts of its ageing differ (2 to 2.5 years in one, 4 years in another).","flavor":"Deep, round, sweet-savoury; Tsuru-bishio is dense and mellow.","use":"Used as finishing shoyu at the table and in simple dishes that benefit from a barrel-aged profile.","craft":"Barrel-by-barrel judgement of ripeness, not a fixed calendar, drives pressing. Source accounts of Tsuru-bishio ageing disagree, so confirm with the maker.","src":[["Ryori Tsushin: Yamaroku Shoyu","https://r-tsushin.com/journal/japan/hakko_33_yamaroku_shoyu/"],["Hanako: Shodoshima barrel shoyu","https://hanako.tokyo/food/132552/"]]},{"cat":"shoyu","name":"Kura-zuki microbes of Shodoshima shoyu","ja":"蔵付き酵母・乳酸菌","prefs":[37],"text":"Shodoshima shoyu is described as shaped by shoyu yeast and lactic acid bacteria that have lived in barrels and kura for generations, which gives each kura its own flavour. Another explanation is that the wood fibre lets kura-specific microbes settle. Shima Shoyu and the town page both raise it as the reason barrel shoyu differs from tank shoyu.","flavor":"Complex, layered aroma and rounded acidity that differ from kura to kura.","use":"Compare kura side by side when selecting a house shoyu.","craft":"Do not scrub barrels in a way that removes resident microbes; replacement of barrels can reset flavour. Claims about specific microbial composition should be treated as maker statements unless supported by lab data.","src":[["Shodoshima Town: oke-jikomi shoyu","https://www.town.shodoshima.lg.jp/gyousei/kakuka/shokokanko/4/891.html"],["Kotowari: kioke shoyu","https://www.kotowari-cooking.com/note/ingredients/seasonings/soy-sauce/japanese/kioke-shoyu"]]},{"cat":"shoyu","name":"Yuasa 1535 Osaka shipment and Kishu protection","ja":"湯浅醤油の大坂出荷（1535年）","prefs":[30],"text":"Yuasa (Wakayama) is billed as the birthplace of shoyu brewing. Tourism material relates that tamari liquid pooling in kinzanji miso was found to taste good, and the Yuasa-kanko page says brewer Akagiri Saburogoro shipped about 100 koku of shoyu by fishing boat to Osaka in Tenbun 4 (1535). The Yuasa shoyu trade is also said to have prospered under special protection of the Kishu domain. The founding story is told mainly by local tourism and company sources.","flavor":"Tamari-leaning, deeply savoury old-style shoyu.","use":"Cultural and historical reference when discussing the origin of Japanese shoyu.","craft":"Treat origin claims as tradition: the 1535 date is from local sources and Kakushin's return date from China varies (1249 or 1254).","src":[["Yuasa Tourism Association: first drop","https://www.yuasa-kankokyokai.com/article/1161/"],["Japan Heritage: Yuasa","https://japan-heritage.bunka.go.jp/ja/stories/story047/"],["Wakayama Tourism: roots of shoyu","https://www.wakayama-kanko.or.jp/features/detail_492.html"]]},{"cat":"shoyu","name":"Kinzanji miso and Kakushin (origin legend of Yuasa tamari)","ja":"金山寺味噌と覚心","prefs":[30],"text":"The MAFF page says Kakushin (Hotto Kokushi) of Yura learned the kinzanji miso method in Song China and brought it to Japan in 1249; the Japan Heritage page gives his return as Kenchō 6 (1254). The method spread from Kokoku-ji to the Yuasa area, whose water suited miso and shoyu. The liquid pooling from the vegetables, 'tamari', tasted good as a seasoning, and later shoyu was brewed on purpose.","flavor":"Salty-sweet miso with vegetable pieces; liquid on top is savoury and mellow.","use":"Cultural reference. Kinzanji miso is eaten as a topping or with rice.","craft":"The two dates conflict (1249 vs 1254); present as tradition. Do not claim this is the only origin theory.","src":[["MAFF: Kinzanji miso (Wakayama)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kinzanji_miso_wakayama.html"],["Japan Heritage: Yuasa","https://japan-heritage.bunka.go.jp/ja/stories/story047/"]]},{"cat":"shoyu","name":"Noda shoyu (Chiba)","ja":"野田醤油","prefs":[12],"text":"Noda shoyu began, per Chiba Prefecture and kotobank, with Iida Ichirobei making clarified 'tamari' in the Eiroku era (1558-70). Full-scale production started in Kanbun (1661-73) centred on the Mogi and Takanashi families, shipping to Edo along the Edo River. Proximity to Edo and river transport are credited. Noda output overtook Choshi towards the end of the Edo period, in one account.","flavor":"Clean, balanced koikuchi with sweet-savoury roundness.","use":"General cooking and table use; the style that defined Edo-period taste.","craft":"Distinguish between local legend and later company history; Kikkoman's page is a better source for corporate chronology.","src":[["Chiba Prefecture: Tone River transport and shoyu","https://www.pref.chiba.lg.jp/kyouiku/bunkazai/sonohoka/kyoudo/tonegawa/shouyu.html"],["Kotobank: Noda shoyu","https://kotobank.jp/word/%E9%87%8E%E7%94%B0%E9%86%A4%E6%B2%B9-1576043"],["Kikkoman: history of shoyu","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/history.html"]]},{"cat":"shoyu","name":"Choshi shoyu (Chiba)","ja":"銚子醤油","prefs":[12],"text":"Choshi brewing is said to have started earlier than Noda. A tradition gives 1616 (Genna 2) as the year Tanaka Genba began brewing on the advice of Manabe Kuemon of Nishinomiya. By the end of the Edo period Noda's output exceeded Choshi's, per one account. In 1914 Higeta, the Tanaka family and others merged as Choshi Shoyu; Yamasa took its company name from the Hamaguchi Gihei shop, incorporated 1928, according to Wikipedia.","flavor":"Koikuchi, rounded and savoury.","use":"Reference for the Kanto koikuchi style; look at Yamasa and Higeta for modern examples.","craft":"The 1616 date is tradition; Wikipedia is a secondary source, so check maker histories. Choshi's position on the Tone River estuary served shipping to Edo.","src":[["Wikipedia: Choshi shoyu brewing","https://ja.wikipedia.org/wiki/%E9%8A%9A%E5%AD%90%E3%81%AE%E9%86%A4%E6%B2%B9%E9%86%B8%E9%80%A0"],["Chiba Prefecture: shoyu and mirin","https://www.pref.chiba.lg.jp/kyouiku/bunkazai/sonohoka/kyoudo/tonegawa/shouyu.html"]]},{"cat":"shoyu","name":"Edo jimawari koikuchi (Kanto shoyu)","ja":"地廻り醤油・関東濃口","prefs":[12,13],"text":"Until early Edo, Kansai towns such as Tatsuno, Yuasa and Shodoshima led production. Edo people preferred a sweeter, stronger shoyu, and Kanto brewers rose. In 1821 (Bunsei 4), of 1.25 million barrels of shoyu in Edo, 1.23 million were Kanto shoyu and only 20,000 Kansai. This 'jimawari' (local) koikuchi shaped Edo cooking.","flavor":"Sweet-salty, aromatic, assertive, built for strong tare.","use":"Basis for tare, simmering and grilling in Kanto-style cooking.","craft":"The barrel figures come from a single source; verify before citing publicly.","src":[["Jimawari shoyu and Edo food culture","http://www.eonet.ne.jp/~shoyu/mametisiki/reference-17.html"],["Kikkoman: history","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/history.html"]]},{"cat":"shoyu","name":"Tatsuno usukuchi shoyu (Hyogo)","ja":"龍野の淡口醤油","prefs":[28],"text":"Tatsuno (now Tatsuno city) is the home of usukuchi shoyu. The Food Culture No.28 piece says Enoo-ya Magoemon developed the usukuchi method in 1666. One theory holds that moromi was added to amazake because raw sake spoiled, giving good flavour. In 1672 the Tatsuno lord Wakisaka Yasumasa encouraged the industry. Tatsuno's soft, low-iron water suited it. Usukuchi production was briefly banned as a luxury during wartime control.","flavor":"Pale amber, high in salt, light aroma, gentle sweetness from amazake.","use":"For clear soups, simmered vegetables and dishes where colour matters in Kansai cuisine.","craft":"Salt is higher than koikuchi, so season by salinity; iron-poor water is key to its pale colour. The amazake explanation is a tradition, not proven history.","src":[["Higashimaru: history of usukuchi","https://www.higashimaru.co.jp/enjoy/oshiete/history.html"],["Kikkoman Food Culture No.28 (PDF)","https://www.kikkoman.com/jp/kiifc/publication/foodculture/pdf/no28_j_006_010.pdf"],["Tatsuno Tourism: usukuchi","https://www.tatsuno.or.jp/%E5%9C%B0%E5%A0%B4%E7%94%A3%E6%A5%AD/%E6%B7%A1%E5%8F%A3%E9%86%A4%E6%B2%B9/"],["Hyogo Pref: shoyu","https://web.pref.hyogo.lg.jp/sr09/jibasan/05.html"]]},{"cat":"shoyu","name":"Tokai tamari brewing (miso-dama koji, kumikake)","ja":"東海のたまり醤油の製法","prefs":[23,21,24],"text":"Tamari is produced mainly in the Chubu region (Aichi, Gifu, Mie) from nearly all soybeans. According to the Japan Shoyu Association, steamed material is formed into miso-dama balls for koji, brined and brewed, with liquid pooled at the bottom ladled over the top (kumikake) for about a year. Tamari is made with little brine, giving viscosity and richness. Another site says 2 to 3 years, and one gives umami as about twice koikuchi by nitrogen; these are single-source claims.","flavor":"Thick, dark, concentrated umami with little sharpness.","use":"Sashimi dip, teriyaki and senbei glaze, hearty simmering.","craft":"Brine is minimal, so control of temperature and salt matters to avoid spoilage. Check whether a 'tamari' has wheat: many contain some. Ageing period varies by maker.","src":[["Japan Shoyu Association: process","https://www.soysauce.or.jp/knowledge/process"],["Shoyu Knowledge: tamari making","https://s-shoyu.com/knowledge/1101/"],["Jozo Navi: tamari shoyu","https://jozo-navi.jp/soy-sauce/tamari-shoyu-towa/"],["Tamariya: tamari shoyu","https://tamariya.com/?mode=f3"]]},{"cat":"shoyu","name":"Hekinan shiro-tamari (white shoyu, Aichi)","ja":"碧南の白醤油","prefs":[23],"text":"White shoyu originated in Hekinan, Aichi, per the Japan Shoyu Association. Its main material is wheat. Yamashin Jozo is described as using a ratio of 9 wheat to 1 soy, producing a pale, sugar-rich liquor. The association says it is kept cool for about three months and turns amber. It is a distinct product from darker tamari.","flavor":"Pale amber, sweet, light-bodied with wheat aroma.","use":"Suited to clear soups, chawanmushi, pale sauces and dishes where colour must be kept.","craft":"Colour darkens with age and light, so store cool and dark. Soy proportion is low, so umami is lighter than koikuchi; season with salt carefully.","src":[["Japan Shoyu Association: process","https://www.soysauce.or.jp/knowledge/process"],["Shoyu Knowledge: Yamashin Jozo","https://s-shoyu.com/kura/yamashin/"],["Waraku Web: Hekinan shiro-tamari","https://intojapanwaraku.com/rock/gourmet-rock/54421/"]]},{"cat":"shoyu","name":"Yanai kanro shoyu (Yamaguchi saishikomi)","ja":"柳井の甘露醤油","prefs":[35],"text":"Yamaguchi's kanro shoyu, associated with the Yanai area, is made as saishikomi: raw shoyu is used in place of brine in the mash, with no sweetener added. The ALIC report says long ageing rounds off the saltiness and gives a mellow sweetness. Production is limited by the doubling of materials and time of saishikomi.","flavor":"Thick, mellow, naturally sweet, intense aroma.","use":"Dipping shoyu for sashimi and tofu, finishing on grilled fish.","craft":"Sweet taste comes from fermentation and ageing, not added sugar, if made as described. Check labels for sweeteners, as many Kyushu products add them.","src":[["ALIC: sweet shoyu of Yamaguchi and Kyushu","https://www.alic.go.jp/joho-s/joho07_002775.html"],["Jozo Navi: saishikomi shoyu","https://jozo-navi.jp/soy-sauce/saishikomi-shoyu-towa/"]]},{"cat":"shoyu","name":"Sugar Road theory of Kyushu sweet shoyu","ja":"シュガーロードと九州の甘い醤油","prefs":[42,41,40],"text":"One explanation for Kyushu's sweet shoyu is sugar landed at Dejima, Nagasaki, and moving along the Sugar Road (Nagasaki, Saga, Kokura), making sugar easy to obtain. Another idea ties it to sugar cultivation close at hand, and a third to coal miners and steelworkers in northern Kyushu preferring sweet, strong tastes. Kyushu shoyu is often brewed by konkō methods, unlike Kanto koikuchi. The crossroadfukuoka and walkerplus pages present these as theories.","flavor":"Sweet, thick, mellow with low sharpness.","use":"Sashimi, simmered dishes and grilled fish in Kyushu cooking.","craft":"These are cultural hypotheses, not documented history; when matching to dishes, treat Kyushu shoyu as seasoned and sweet, so reduce sugar or mirin.","src":[["Walker Plus: why Kyushu shoyu is sweet","https://www.walkerplus.com/article/1079167/"],["Crossroad Fukuoka: sweet shoyu","https://www.crossroadfukuoka.jp/feature/soysauce"],["ALIC: sweet shoyu","https://www.alic.go.jp/joho-s/joho07_002775.html"],["Wikipedia: Kyushu shoyu","https://ja.wikipedia.org/wiki/%E4%B9%9D%E5%B7%9E%E9%86%A4%E6%B2%B9"]]},{"cat":"shoyu","name":"Ono shoyu of Kanazawa (Ishikawa)","ja":"金沢大野の醤油","prefs":[17],"text":"Ono-machi in Kanazawa is a shoyu district with about 22 makers, led by Yamato Shoyu and Naogen Shoyu per one page. Local taste favours relatively pale, sweet shoyu essential to Kaga cuisine. Around Wajima on the Noto peninsula even sweeter shoyu is used. Sweet mixed shoyu is typical of Hokuriku, as of Kyushu.","flavor":"Light colour, sweet, gentle.","use":"Kaga cuisine, simmered dishes, sashimi.","craft":"Check for added sweeteners and konkō method; the numbers of makers are a single-source statement.","src":[["Shoyu Knowledge: Ishikawa","https://s-shoyu.com/knowledge/0403/"],["Kikkoman: regional characteristics","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/area.html"],["Shoyu Knowledge: why sweet shoyu is liked","https://s-shoyu.com/knowledge/0401/"]]},{"cat":"shoyu","name":"Tohoku sweet shoyu and dashi-shoyu","ja":"東北の甘い醤油とだし醤油","prefs":[2,3,4,5,6,7],"text":"Kikkoman's regional description says Tohoku makes mainly konkō shoyu, with slightly sweet shoyu favoured along the coast, and dashi-shoyu and concentrated tsuyu spread from the 1970s onwards (Showa 50s). In Akita a sweet type is said to be the most popular. Akita also makes shottsuru, a fish sauce from hatahata or sardines, which is not soy-based.","flavor":"Mild, sweet and savoury.","use":"Everyday seasoning, simmered dishes and noodle tsuyu.","craft":"Aomori, Niigata and San'in details were not found in my searches, so I make no claims about them.","src":[["Kikkoman: regional characteristics","https://www.kikkoman.co.jp/enjoys/soysaucemuseum/area.html"],["Biglobe: Akita shoyu","https://food.biglobe.ne.jp/rankings/22072/"],["Kikkoman Food Culture No.26 (PDF)","https://www.kikkoman.com/jp/kiifc/publication/foodculture/pdf/no26_j_008_025.pdf"]]},{"cat":"shoyu","name":"Ishimago Honten Hyakuju (Akita kioke koikuchi)","ja":"石孫本店「百寿」","prefs":[5],"text":"A koikuchi shoyu from Ishimago Honten, Akita, presented as first-press shoyu aged one year in wooden barrels. The sources seen give only that short description.","flavor":"Not described in the sources seen.","use":"Table and cooking shoyu for Akita dishes.","craft":"Details of materials and ratios were not in the search results; consult the maker.","src":[["Biglobe: Akita shoyu ranking","https://food.biglobe.ne.jp/rankings/22072/"]]},{"cat":"whisky","name":"Asaka Distillery (Sasanokawa Shuzo, Koriyama)","ja":"安積蒸溜所（笹の川酒造）","prefs":[7],"text":"Whisky arm of Sasanokawa Shuzo, a sake brewery founded in 1765. Its predecessor Yamazakura Shuzo took the whisky licence in 1946; 'Cherry Whisky' sold well in the 1980s and production stopped in 1989. Pot stills were installed in 2015, the 250th anniversary, and distilling restarted in 2016. The Yamazakura brand (named after the predecessor's trade name) was released from old stock in 2014; one source says 2015.","flavor":"Sources consulted give no tasting notes; the house style is presented through blends built on Asaka malt, bottled at 47%.","use":"Sold as Yamazakura World Blended (Asaka malt as key malt, 47%) and as Asaka-distilled single releases; a sake-brewery whisky from Tohoku.","craft":"Check the label: Yamazakura bottlings from the 2014 stock era and blends that include imported whisky differ from pure Asaka-distilled spirit. Release year of the brand is given as 2014 or 2015 depending on the source, so verify with the maker.","src":[["Sasanokawa Shuzo - Asaka Distillery story","https://www.sasanokawa.co.jp/asaka-distillery/contents/story.html"],["JWIC - Asaka Distillery","https://jwic.jp/distillery/asaka/"],["WHISKY Magazine Japan - Asaka Distillery","https://whiskymag.jp/sasa_asaka/"]]},{"cat":"whisky","name":"Nagahama Distillery (AMAHAGAN)","ja":"長濱蒸溜所","prefs":[25],"text":"One of Japan's smallest whisky distilleries, run by Nagahama Roman Beer in Nagahama, Shiga, and operating since November 2016. Motto 'one brew, one cask': each batch yields about 200-250 litres of new make and roughly 350 batches are run a year. Two wash stills and one spirit still of alembic type with narrow necks. Water is Mt. Ibuki snowmelt. Brands: Single Malt Nagahama, Single Cask Nagahama and AMAHAGAN.","flavor":"Narrow-necked alembic stills are described as giving a delicate, clear spirit.","use":"Bottled and labelled by hand; sold as Single Malt Nagahama and single cask releases; the brewery restaurant and the distillery sit next to JR Nagahama station.","craft":"Scale is the point: a batch fills about one cask, so lots are tiny and cask-to-cask variation is expected. The yearly volume figure (about 80,000 litres) comes from one source only; treat it as indicative.","src":[["Nagahama Roman Beer - Whisky","https://www.romanbeer.com/whisky/"],["Nagahama Distillery (Wikipedia JA)","https://ja.wikipedia.org/wiki/%E9%95%B7%E6%BF%B1%E8%92%B8%E6%BA%9C%E6%89%80"],["Buzaemon - AMAHAGAN","https://shop.buzaemon.jp/collections/amahagan"]]},{"cat":"whisky","name":"Kanosuke Distillery (Komasa Jozo)","ja":"嘉之助蒸溜所","prefs":[46],"text":"Whisky distillery of the shochu maker Komasa Jozo, on the Fukiagehama coast in Hioki, Kagoshima; the new whisky licence dates to 2017. It runs three pot stills of different shapes and ages part of its spirit in casks that previously held long-aged shochu (the 'Mellow Kozuru' casks). Part of the barley is Kagoshima 'Hoshun' barley, malted locally. Diageo invested in 2021 and the single malt won gold at the 2023 International Spirits Challenge.","flavor":"The maker describes a rich, sweet spirit; shochu-cask influence is described as gentle sweetness, mint and umeshu-like Japanese notes.","use":"Single Malt Kanosuke (including a Kagoshima-only 48% bottling); also sold through lottery at retail.","craft":"One explanation holds that a fermentation that grows lactic acid bacteria fast suppresses the metallic note that young spirit tends to show; this is a secondary account, so confirm with the distillery. Founding year and still details differ between blogs and the maker.","src":[["Premium Japan - Kanosuke Distillery","http://www.premium-j.jp/spotlight/20240528_36083/"],["Goethe - Kanosuke","https://goetheweb.jp/gourmet/article/20231214-kanosuke"],["Kyodo OVO - Kanosuke","https://ovo.kyodo.co.jp/news/culture/a-1957881"]]},{"cat":"whisky","name":"Saburomaru Distillery (Wakatsuru Shuzo)","ja":"三郎丸蒸留所（若鶴酒造）","prefs":[16],"text":"Distillery of the sake brewery Wakatsuru Shuzo in Toyama, the only whisky distillery in Hokuriku. It obtained its whisky licence in 1952, stopped for a period and resumed in July 2017. Re-equipment was funded by crowdfunding of 38 million yen, about 75% from local backers. Sake is brewed in winter and whisky distilled in summer. It is known for peated, smoky malt and for a cast-iron pot still reported in 2019 as the world's first cast still.","flavor":"Smoky, peated style is its stated specialty.","use":"Sold as Saburomaru single malt and related bottlings; a retailer lists very small annual output (about 25 casks).","craft":"The seasonal split (sake in winter, whisky in summer) shapes the production calendar. The cast-iron still ('ZEMON') claim was only partly visible in the sources, so cite it as reported rather than verified.","src":[["Saburomaru Distillery (Wikipedia JA)","https://ja.wikipedia.org/wiki/%E4%B8%89%E9%83%8E%E4%B8%B8%E8%92%B8%E7%95%99%E6%89%80"],["JWIC - Saburomaru","https://jwic.jp/distillery/saburomaru/"],["Info Toyama - Saburomaru","https://www.info-toyama.com/attractions/80413"]]},{"cat":"whisky","name":"Sakurao Distillery (Chugoku Jozo, Hatsukaichi)","ja":"桜尾蒸溜所（中国醸造）","prefs":[34],"text":"Distillery of Chugoku Jozo (founded 1918) at Sakurao, Hatsukaichi, Hiroshima. The company stopped whisky in 1989 once imported whisky spread, and opened the present distillery in 2017 (2018 in some sources). Centrepiece is a German Holstein hybrid still; accounts differ on whether it is stainless with a copper column. Malt is peated and unpeated. Maturation is at Sakurao and in a disused rail tunnel at Togouchi, Akiota. Also makes Sakurao Gin from Hiroshima botanicals.","flavor":"Not given in the sources; the hybrid still is presented as giving a layered, complex aroma.","use":"Whisky and gin; the 'Sakurao Gin Limited' uses 100% Hiroshima botanicals: lemon, navel orange, yuzu, daidai, hinoki, oyster shell and Miyajima red pine.","craft":"Hybrid still means pot and column functions in one rig, a design said to draw on shochu know-how. Verify opening year (2017 vs 2018) and still material before quoting.","src":[["JWIC - Sakurao","https://jwic.jp/distillery/sakurao/"],["West JR Temite - Sakurao Brewery and Distillery","https://www.westjr-temite.jp/feature_article/post2150/"],["Ginlab Japan - Sakurao","https://ginlab-japan.com/4862/"]]},{"cat":"whisky","name":"Yasato Distillery (Kiuchi Brewery, Ishioka)","ja":"八郷蒸溜所（木内酒造）","prefs":[8],"text":"Kiuchi Brewery (founded 1823, maker of Hitachino Nest) began whisky in 2016 at its Nukata brewery and opened Yasato Distillery in Ishioka in 2020, in a renovated former community hall. Two Forsyths pot stills with narrow necks and downward-angled arms, for a heavier, grain-forward spirit. Four wooden washbacks: two oak (Slavonian and French) and two French acacia. Stated capacity is 300,000 litres a year, about 4,000 casks. Brand: Hinomaru Whisky.","flavor":"Wooden washbacks are said to give a wash that is both weighty and fruity.","use":"Hinomaru Whisky releases, including bottlings finished in Islay-malt casks and casks with sakura (cherry wood) heads.","craft":"Mash tun and lauter tun are separate, a choice credited to Kiuchi's brewing since 1996. Casks are bourbon, sherry and red wine, plus imported casks refitted with cherry-wood heads. Malting at Ishioka and local grain were described as plans.","src":[["JWIC - Yasato","https://jwic.jp/distillery/yasato/"],["Yomiuri Travel - Yasato Distillery","https://tabiyomi.yomiuri-ryokou.co.jp/article/004361.html"],["Hinomaru Whisky - Distillery","https://hinomaruwhisky.com/pages/distillery"]]},{"cat":"whisky","name":"Niigata Kameda Distillery","ja":"新潟亀田蒸溜所","prefs":[15],"text":"Niigata small distillery making single malt from barley malt only. Equipment: two Forsyths pot stills. Process water is Agano River underflow. The house aim is a fruity, light spirit. Niigata-grown 'Yukihana Rokujo' barley is named as an intended raw material, but one source says current products mainly use Scottish barley, so check the batch.","flavor":"Fruity and light, per the maker's stated aim.","use":"Single malt including new-born (new make) bottlings such as 'Niigata Kameda New Born 2 years' at 55%, and a peated new-born.","craft":"Verify barley origin per release: local-barley intent and imported-barley practice are both reported. Young bottlings of 2 years are sold as 'new born', not as aged whisky.","src":[["Things Niigata - Niigata Kameda Distillery","https://things-niigata.jp/other/niigatakamedajoryujo/"],["Banshaku Zukan - Niigata Kameda Distillery","https://banshakuzukan.com/producer/niigata-kameda-distillery/"],["Superior Brand Library - Kameda","https://superiorbrand-library.com/Whisky/Japanese/Kameda.html"]]},{"cat":"whisky","name":"Yoshida Denzai Distillery (grain whisky, Murakami)","ja":"吉田電材蒸留所","prefs":[15],"text":"A distillery in Murakami, Niigata, that specialises in grain whisky, which is rare in Japan. It uses corn, rye and other grains; product examples use Hokkaido dent corn as the main grain. Grain whisky is generally milder than malt. Retail listings link it with the Niigata small-scale distillery company (Niigata Kameda), so the two names appear together; verify which entity made a given bottle.","flavor":"Described as pure, transparent new make that is aged to amber; grain style is mild.","use":"Sold as young grain new make with a peated option; a Niigata Nippo feature covers the distillery.","craft":"A grain-only house is useful to blenders who need a local grain component. Details of still type and capacity were not in the sources, so they are left out.","src":[["Niigata Nippo - Yoshida Denzai Distillery","https://www.niigata-nippo.co.jp/articles/-/240082"],["Sake no Matsuzawa - Kameda Newborn Peated","https://sakenomatsuzawa.com/yoshidadenzai-grain-whiskey-distillery-1/"]]},{"cat":"whisky","name":"Nikka Coffey Grain and Coffey Malt (Miyagikyo Coffey stills)","ja":"ニッカ カフェグレーン／カフェモルト","prefs":[4],"text":"Nikka runs Coffey continuous stills at the Miyagikyo distillery. They were already outdated when installed in the early 1960s; Taketsuru Masataka chose them because they leave grain flavour in the spirit. Another source says the first unit went in at Nishinomiya in 1963 and was moved to Miyagikyo in 1999; two Coffey stills stand at Miyagikyo, one renewed. Mainly corn for Coffey Grain; barley malt for Coffey Malt; also Coffey Gin and Coffey Vodka.","flavor":"Sweet grain aroma, creamy body and gentle sweetness, unlike neutral modern grain whisky.","use":"Grain component for blends and bottled as Nikka Coffey Grain and Nikka Coffey Malt.","craft":"Less efficient and needs skilled operation compared with modern continuous stills, because congeners carry through and must be turned into pleasant grain character by technique.","src":[["Nikka - Coffey Malt","https://www.nikka.com/products/grain/coffeymalt/"],["Nikka Miyagikyo official X post","https://x.com/nikka_miyagikyo/status/1839485888142975328"],["Taru Blog - Miyagikyo visit","https://whisky-taru-blog.com/%E3%80%902026%E5%B9%B48%E6%9C%88%E3%80%91%E5%AE%AE%E5%9F%8E%E5%B3%A1%E8%92%B8%E6%BA%9C%E6%89%80%E8%A6%8B%E5%AD%A6%E3%83%AC%E3%83%9D%E3%83%BC%E3%83%88%EF%BD%9C%E3%83%8B%E3%83%83%E3%82%AB%E3%82%A6/"]]},{"cat":"glossary","name":"Japanese Whisky labelling standard (2021)","ja":"ジャパニーズウイスキーの表示基準","prefs":[],"text":"Voluntary standard published by the Japan Spirits and Liqueurs Makers Association on 16 February 2021. 'Japanese whisky' must use malted grain, grain and water collected in Japan; saccharification, fermentation and distillation must be in a Japanese distillery; the spirit must age at least 3 years in wooden casks of 700 litres or less in Japan. Names, place names, flags and era names that evoke Japan are restricted unless the label makes clear they do not apply. It is an industry rule, not in the tax law. Start date reports differ: April 2021 with a grace period to 31 March 2024, or April 2024.","flavor":"Rule term; not a flavour.","use":"Read it when judging a bottle labelled 'Japanese whisky'; world blends with imported whisky must not use Japan-evoking names.","craft":"Check cask size (700 L or under), three years' ageing in Japan and the origin of the raw materials; a pre-2024 bottle may fall under the grace period.","src":[["SSNP - Labelling standard announced","https://www.ssnp.co.jp/liquor/250940/"],["JWIC - Definition of Japanese whisky","https://jwic.jp/story/definition/210916_01/"],["Nikkei - Definition drafted by industry group","https://www.nikkei.com/article/DGXZQODZ164LF0W1A210C2000000/"]]},{"cat":"whisky","name":"Muscat Bailey A","ja":"マスカット・ベーリーA","prefs":[15,19,6],"text":"Red grape bred by Kawakami Zenbei at Iwanohara Vineyard, Niigata (vineyard founded 1890). A cross of American Bailey with European Muscat Hamburg, usually dated to 1927, first fruiting 1931 and released 1940; sources vary. Kawakami made over 10,000 crosses and registered 22 varieties. Bred for the humid climate, resistant to powdery mildew and downy mildew and to cold and wet. Second to Koshu in Japanese wine-grape area, mainly in Yamanashi and Yamagata. OIV-listed in 2013.","flavor":"Strawberry and candy aroma with a foxy character linked to furaneol; low tannin, light to medium body, fruity.","use":"Light reds, rose, sparkling; also eaten fresh.","craft":"Low tannin and strong sweet-fruit aroma suit light styles; oak and extraction change character. Years of crossing and release differ by source.","src":[["Enoteca - Muscat Bailey A","https://www.enoteca.co.jp/article/archives/4346/"],["Japan Winery Association - Iwanohara Vineyard","https://www.winery.or.jp/travel/8599/"],["Iwanohara Vineyard - Zenbei's grapes","https://www.iwanohara.sgn.ne.jp/grape/index.html"]]},{"cat":"whisky","name":"Yamasachi (Ikeda, Tokachi wine grape)","ja":"山幸（十勝ワイン）","prefs":[1],"text":"Cold-hardy red wine grape bred by the Ikeda Town Grape and Wine Research Institute, Hokkaido. Work began in 1978; it descends from 'Kiyomi' (a clone selected from the French hybrid Seibel 13053, 1969) crossed with native mountain grape (yamabudo). Cold and frost tolerance mean the vines need no winter burial, which cuts labour. Sister variety: Kiyomai. Listed by the OIV in November 2020. Sources vary on Kiyomi's parentage.","flavor":"Herbaceous, wild-fruit aroma from the yamabudo parent, with strong acidity.","use":"Red wine of Tokachi Wine; also gift and tax-donation sets.","craft":"Strong acid and herbal profile; the viticultural gain is skipping burial of vines in Tokachi's severe winters.","src":[["Tokachi Wine - Yamasachi OIV registration","https://www.tokachi-wine.com/topics/7665.html"],["Tokachi General Subprefectural Bureau - Tokachi wine","https://www.tokachi.pref.hokkaido.lg.jp/ss/srk/shokusangyo/wine.html"],["Wine Link - Yamasachi","https://wine-link.net/dictionary/detail/2715"]]},{"cat":"whisky","name":"Kerner (Hokkaido, Yoichi)","ja":"ケルナー（北海道）","prefs":[1],"text":"White grape bred in 1929 at a Württemberg institute from the black grape Trollinger and Riesling, named for the poet-physician Justinus Kerner. German plantings peaked in 1992 and were about 2,032 ha in 2022. Seedlings reached Hokkaido from Germany in 1973 and it is now Hokkaido's largest white wine grape. Popular in Yoichi. Ripens late, mid to late September.","flavor":"More body than Riesling with softer acidity and aromatic fruit.","use":"Dry whites, also sparkling and late-harvest; bottled by Hokkaido wineries including Yoichi estates.","craft":"Late ripening needs a long season; plantings are matched to cool zones. Local area figures for Hokkaido or Yoichi were not found in the sources.","src":[["Enoteca - Kerner","https://www.enoteca.co.jp/article/archives/16660/"],["ADV - Kerner explained","https://www.adv.gr.jp/blog/kaisetsu-kerner/"],["Sapporo Beer Wine - Kerner","https://wine.sapporobeer.jp/article/kerner/"]]},{"cat":"whisky","name":"Delaware (wine and table grape, Yamagata and Yamanashi)","ja":"デラウェア","prefs":[6,19],"text":"American natural hybrid named in 1855 at Delaware, Ohio, introduced to Japan in 1872. The seedless table form depends on gibberellin: Yamanashi's fruit research station succeeded with seedless Delaware in 1959. Yamagata's Okitama area is the leading Delaware region, and in Takahata growers increasingly skip gibberellin and keep seeds for wine, which saves labour. Yamanashi is second in prefectural area for the variety.","flavor":"Sweet, foxy, light; wine versions are fresh and easy.","use":"Table grape and wine, including seeded fruit for wine in Takahata.","craft":"Seedless treatment is a hormone step; seeded fruit for wine avoids it. Production figures for wine use were not in the sources.","src":[["ADV - Delaware explained","https://www.adv.gr.jp/blog/kaisetsu-delaware/"],["Yamanashi Prefecture - grapes","https://www.pref.yamanashi.jp/oishii-mirai/nochikusanbutsu/budou.html"],["JATAFF - seedless grapes","https://www.jataff.or.jp/senjin/dera.htm"]]},{"cat":"whisky","name":"Yamagata Wine (Kaminoyama, Nanyo, Takahata)","ja":"山形ワイン","prefs":[6],"text":"Yamagata wine history: the first Tohoku winery, Sakai Winery, opened in Akayu, Nanyo in 1892, and Takeda Winery in Kaminoyama began wine in 1920. One article counts 14 wineries, six in Murayama and six in Okitama. Kaminoyama, a basin with large day-night swings, is known for early European varieties such as Cabernet Sauvignon, Merlot and Chardonnay. Takahata Winery (1990) is the largest in Tohoku, and its contract farmers are said to grow about 10% of Japan's Chardonnay. Yamagata holds a wine GI.","flavor":"Basin climate gives concentrated fruit; Takahata Bordeaux-style reds are meant for long ageing.","use":"Cabernet and Merlot reds, Chardonnay, Delaware whites; winery visits with hot springs.","craft":"Winery counts and the Chardonnay share are from one article and can date; confirm before citing.","src":[["Enoteca - Yamagata wine","https://www.enoteca.co.jp/article/archives/13471/"],["Nihonwine.jp - Yamagata","https://nihonwine.jp/enjoy-nihon-wine/about-nihon-wine/yamagata-prefecture-wine-information-basics/"],["Wine Kingdom - Takahata Winery","https://www.winekingdom.co.jp/_ct/17807589"]]},{"cat":"glossary","name":"Japan Wine and wine GI (Yamanashi, Hokkaido, Nagano, Yamagata, Osaka)","ja":"日本ワイン・地理的表示（GI）","prefs":[],"text":"'Japan Wine' (nihon wine) is wine made from Japan-grown grapes, set apart from 'kokusan wine'. GI Yamanashi (July 2013) was Japan's first wine GI: grapes only from Yamanashi, brewed, stored and bottled in the prefecture, with stricter production standards from June 2017. GI Hokkaido was second (grapes only from Hokkaido). Nagano, Yamagata and Osaka were designated together later, making five. The 2015 NTA labelling notice sets thresholds such as 85% for a named variety.","flavor":"Rule term; used when reading labels.","use":"Check label for variety, harvest place and GI when choosing domestic wine for a list.","craft":"The 85% threshold applies to variety and place claims under the notice. Year of the three-prefecture designation was not clear in the sources.","src":[["Nikkei - Hokkaido wine GI","https://www.nikkei.com/article/DGXMZO32312370X20C18A6L41000/"],["Nikkei - Nagano, Yamagata, Osaka","https://www.nikkei.com/article/DGXZQOUC0752H0X00C21A7000000/"],["MAFF - Japan Wine","https://www.maff.go.jp/j/pr/aff/2101/spe1_01.html"],["Tokyo Regional Taxation Bureau - GI Yamanashi","https://www.nta.go.jp/taxes/sake/event/pdf/event17_4.pdf"]]},{"cat":"whisky","name":"Hitachino Nest Beer (Kiuchi Brewery)","ja":"常陸野ネストビール（木内酒造）","prefs":[8],"text":"Craft beer of Kiuchi Brewery, a sake maker in Naka, Ibaraki, founded in 1823 (maker of Kikumori). After the 1994 tax revision cut the minimum beer volume from 2,000 kL to 60 kL, the first Hitachino Nest was brewed in 1996 at the head brewery. 'Nest' comes from Kounosu, the place name, and from owls nesting in a garden tree. The Nukata brewery took over beer production in 2008; Korea and Hong Kong operations followed (Hong Kong 2016).","flavor":"Not described in the sources consulted.","use":"Exported widely; Kiuchi also makes shochu, umeshu, wine and, since 2016, whisky.","craft":"The company brings sake and beer brewing under one house; its Yasato distillery re-uses brewing practice (separate mash and lauter tuns).","src":[["Hitachino - brewery history","https://hitachino.cc/brewery/history.html"],["J-marketing - Kiuchi Brewery case","https://www.jmrlsi.co.jp/scto/case/2018/kiuchibrewery.html"],["Japan Hop Committee - Kiuchi","https://japanhop.jp/brewery/5139/"]]},{"cat":"whisky","name":"Yo-Ho Brewing (Yona Yona Ale, Karuizawa)","ja":"ヤッホーブルーイング（よなよなエール）","prefs":[20],"text":"Ale brewery in Karuizawa, Nagano. Its own site says it was founded in 1996; Yona Yona Ale is dated 1997 in many sources and the company profile gives 1997. Early investment came from Hoshino Yoshiharu and the first brewery was in the Hoshino
