 the character of kanzuri.","craft":"Timing depends on snowfall; the step is weather-dependent.","src":[["MAFF - Kanzuri, Niigata","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kanzuri_niigata.html"],["Taberugo - What is kanzuri","https://taberugo.net/3168"]]},{"cat":"glossary","name":"Shirashita-to (wasanbon intermediate)","ja":"白下糖","prefs":[36,37],"text":"The crystalline mass produced after cane juice is boiled, skimmed of scum and cooled; it is the raw material from which wasanbon is made. It is wrapped in cloth and pressed in an oshibune to drive out molasses, then kneaded with a little water (togi).","flavor":"Process term.","use":"Starting material for wasanbon.","craft":"Careful skimming matters because the cane is rich in scum.","src":[["Wikipedia - Wasanbon","https://ja.wikipedia.org/wiki/%E5%92%8C%E4%B8%89%E7%9B%86"],["Baikodo - Temahima of wasanbon","https://www.baikodo.com/temahima/"],["Delish Kitchen - Wasanbon","https://delishkitchen.tv/articles/2231"]]},{"cat":"glossary","name":"Oshibune and togi (wasanbon pressing and kneading)","ja":"押し船と研ぎ","prefs":[36,37],"text":"Oshibune is the weighted press that squeezes liquid molasses out of cloth-wrapped shirashita-to. Togi is the hand kneading with a little water that follows. The pair is repeated roughly three to five times; the name wasanbon is said to come from repeating pressing and kneading three times, though that is stated as tradition.","flavor":"Process term; result is fine, melt-in-mouth sugar.","use":"Explains why wasanbon is fine-grained.","craft":"Molasses is not removed completely; the maker's judgement sets the amount remaining.","src":[["Pearl Ace - Wasanbon craftsmanship","https://www.pearlace.co.jp/know-and-fun/tips/post-129.html"],["Toraya - What is wasanbon","https://support.toraya-group.co.jp/hc/ja/articles/31921455243284--%E5%92%8C%E4%B8%89%E7%9B%86%E7%B3%96-%E3%81%A8%E3%81%AF%E3%81%A9%E3%81%AE%E3%82%88%E3%81%86%E3%81%AA%E7%A0%82%E7%B3%96%E3%81%A7%E3%81%99%E3%81%8B"],["NIHONMONO - Okada Seito-sho","https://nihonmono.jp/article/14181/"]]},{"cat":"glossary","name":"Chikuto (bamboo cane for wasanbon)","ja":"竹糖","prefs":[36,37],"text":"Chikuto is the slender sugar cane variety used for wasanbon, distinct from the cane used for Okinawan kokuto. It is pressed and boiled with careful scum removal to make shirashita-to.","flavor":"Delicate, clean sweetness in the finished sugar.","use":"Raw material for wasanbon in Tokushima and Kagawa.","craft":"Variety and handling shape the finish; ask the maker where the cane is grown.","src":[["macaroni - Wasanbon","https://macaro-ni.jp/44433"],["Delish Kitchen - Wasanbon","https://delishkitchen.tv/articles/2231"]]},{"cat":"glossary","name":"Ichimi, shichimi and nanairo togarashi","ja":"一味・七味・七色唐辛子","prefs":[],"text":"Ichimi is chili alone. Shichimi has no strict definition: each shop has its own blend. One source says shichimi is mainly roasted chili powder while nanairo is mainly dried chili. Yawataya Isogoro's shichimi lists chili, sansho, ginger, hemp seed, sesame, chinpi and shiso. Yagenbori in Asakusa uses two chilies including roasted; Shichimiya Honpo in Kyoto uses aromatic non-chili ingredients.","flavor":"Heat from chili, numbing from sansho, citrus and herbal notes from the rest.","use":"Udon, soba, oyakodon, yakitori, soups.","craft":"Compare blends for chili proportion and sansho level; store sealed and add at the table to keep aroma.","src":[["Yawataya Isogoro - Ingredients","https://www.yawataya.co.jp/about/ingredient/"],["Yawataya Isogoro - Origin of shichimi","https://www.yawataya.co.jp/about/history/"],["Three great shichimi review","https://menmi-danna-blog.com/seasoning03/"]]},{"cat":"glossary","name":"Kanmitsu-to (molasses-retaining sugar)","ja":"含蜜糖","prefs":[],"text":"Sugar that keeps its cane molasses. Kokuto is the clearest example; Okinawa's cooperative restricts the name to cane juice boiled down with no other processing. Wasanbon is also described as leaving a measured amount of molasses, unlike refined white sugar, which removes it entirely.","flavor":"Mineral, deeper sweetness.","use":"Select kanmitsu-to when molasses flavor should be part of the dish.","craft":"Amounts of molasses change both flavor and moisture, so adjust quantities when substituting for refined sugar.","src":[["Wikipedia - Kurozato","https://ja.wikipedia.org/wiki/%E9%BB%92%E7%A0%82%E7%B3%96"],["MAFF GI register No. 172","https://www.maff.go.jp/j/shokusan/gi_act/register/0172/index.html"],["macaroni - Wasanbon","https://macaro-ni.jp/44433"]]},{"cat":"dashi","name":"Arabushi (unmolded katsuobushi)","ja":"荒節","prefs":[22,46,39],"text":"Arabushi is katsuobushi dried to its target moisture without any mold (kabi) stage. It is the dark, smoke-scented form of the product and the base of most commercial shavings: items sold as katsuo kezuri-bushi or hana-katsuo are described as unmolded arabushi, and most supermarket shavings are arabushi. The traditional regional styles are named Yaizu, Satsuma, Tosa and Izu.","flavor":"Strong smoky aroma and a forceful, direct katsuo taste; darker, blackish surface.","use":"Dashi where power and smoke are wanted, and the usual stock for soba and udon shops, hot pots and everyday cooking; also the starting material that is later scraped and molded into karebushi.","craft":"Judge by colour: blackish means no mold, brown means molded karebushi. Because tar and fat remain on the surface, arabushi gives a heavier, smokier stock than honkarebushi, so check the smoke note against the dish before choosing it.","src":[["Kobayashi Foods - honkarebushi explained","https://www.kobayashi-foods.co.jp/washoku-no-umami/honkare"],["Menso - arabushi vs karebushi","https://menso.jp/column/arabushi-honkarebushi/"],["Yoshida Kyo Shoji - katsuobushi","https://yoshida-kyo.co.jp/special/997/"]]},{"cat":"dashi","name":"Karebushi and honkarebushi (mold-cured katsuobushi)","ja":"枯節・本枯節","prefs":[46],"text":"Karebushi is made from arabushi by scraping off the tar and surface fat and then applying mold and drying at least twice. Honkarebushi repeats the mold-and-dry cycle further; sources give about 4 to 6 cycles as common, though there is no strict rule, and completion takes from 3 months to more than half a year. Ibusuki-Yamakawa in Kagoshima is cited as Japan's top producer of honkarebushi.","flavor":"Mellow, refined, rounder aroma than arabushi; lighter smoke, deeper cured note.","use":"Premium ichiban dashi and clear soups where clarity and elegance are required; shaved fresh at the counter in high-end kitchens.","craft":"Brown, molded surface (not the black of arabushi) is the first visual cue. Ask the maker how many mold cycles were applied; the count is not standardised, so grade claims differ between makers.","src":[["Kobayashi Foods - honkarebushi explained","https://www.kobayashi-foods.co.jp/washoku-no-umami/honkare"],["Katsuobushiou - karebushi vs honkarebushi","https://katsuobushiou.com/difference/"],["Menso - arabushi vs karebushi","https://menso.jp/column/arabushi-honkarebushi/"]]},{"cat":"dashi","name":"Regional katsuobushi styles (Yaizu, Satsuma, Tosa, Izu)","ja":"焼津節・薩摩節・土佐節・伊豆節","prefs":[22,46,39],"text":"Katsuobushi is traditionally classified by production region as Yaizu-bushi, Satsuma-bushi, Tosa-bushi and Izu-bushi. The source adds that Kochi, which gave Tosa-bushi its name, now produces mostly soda-bushi rather than katsuobushi. Details of how each style differs were not given in the sources consulted.","flavor":"Regional character varies by maker; no standard comparison in the sources.","use":"The regional name is used on packaging and by wholesalers to indicate the origin of the katsuobushi.","craft":"Treat the regional label as origin information, not a grade. Compare by arabushi/karebushi type and shaving, since the sources give no standard that separates the four regional styles.","src":[["Koizumi Press - types of bushi and dashi","https://koizumipress.com/archives/4816"],["MAFF - fushi-rui (bushi products)","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/bunrui/fushirui.html"]]},{"cat":"dashi","name":"Soda-bushi (frigate mackerel bushi)","ja":"宗田節","prefs":[39],"text":"Soda-bushi is made from soda-gatsuo (frigate mackerel), centred on Tosashimizu in Kochi. It has a high proportion of blood meat, so the dashi is dense in flavour and aroma. Sources describe it as less suited to delicate refined cooking and as mainly used for soba dashi; soba shops often use soda for the dipping sauce of mori-soba.","flavor":"Dense, heavy kokumi with a strong aroma and noticeable blood-meat richness.","use":"Soba tsuyu, especially for cold mori-soba dipping sauce; blended with other fushi in commercial dashi; thick-shaved soda gives a stock with rich koku and aroma compared with thick-shaved katsuo.","craft":"Because the flavour is strong, use it where it has to stand up to kaeshi (soy-sweet base); the usual shop practice cited is soda for mori, saba-bushi for kake soba.","src":[["Kobayashi Foods - soda-bushi","https://www.kobayashi-foods.co.jp/washoku-no-umami/what-is-soda-clause"],["Fushitaka - katsuo, maguro, soda and saba bushi","https://www.fushitaka.com/cont/mutter/katsuo3.html"],["Koizumi Press - types of bushi","https://koizumipress.com/archives/4816"]]},{"cat":"glossary","name":"Saba-bushi (mackerel bushi)","ja":"鯖節","prefs":[],"text":"Saba-bushi is dried and smoked mackerel processed in the style of katsuobushi. Sources describe a strong umami and little aroma, with sweetness and depth; they disagree on acidity, one saying there is no sourness and another a slight sourness.","flavor":"Strong umami, sweet and deep, light aroma; possible faint acidity.","use":"Broth for kake-soba and udon; often blended with uruime-bushi; soba shops commonly pair saba for kake and soda for mori.","craft":"Because sources disagree on acidity, taste each lot rather than assuming; its low aroma makes it a good body-builder in mixed fushi.","src":[["Fushitaka - katsuo, maguro, soda and saba bushi","https://www.fushitaka.com/cont/mutter/katsuo3.html"],["Solomeshi - differences of bushi","https://solomeshi.net/entry/bushi-chigai"],["Hyoki - saba-bushi and maguro-bushi","https://hyoki.jp/blog_kyobashi/%E3%82%AB%E3%83%84%E3%82%AA%E7%AF%80%E4%BB%A5%E5%A4%96%E3%81%AE%E3%80%8C%E7%AF%80%E3%80%8D%E3%82%B5%E3%83%90%E7%AF%80%E3%80%81%E3%83%9E%E3%82%B0%E3%83%AD%E7%AF%80/"]]},{"cat":"glossary","name":"Uruime-bushi (round herring bushi)","ja":"うるめ節","prefs":[],"text":"Uruime-bushi is a bushi made from uruime-iwashi (round herring). It is described as having a rich kokumi and in the Kansai region is used for udon dashi; it is generally blended with saba-bushi rather than used alone.","flavor":"Full-bodied, rich koku.","use":"Udon dashi in Kansai; component of blended fushi.","craft":"Blend ratio against saba-bushi is the maker's decision; the sources give no fixed proportion.","src":[["Solomeshi - differences of bushi","https://solomeshi.net/entry/bushi-chigai"],["Fushitaka - bushi types","https://www.fushitaka.com/cont/mutter/katsuo3.html"]]},{"cat":"glossary","name":"Maguro-bushi (tuna bushi)","ja":"まぐろ節","prefs":[],"text":"Maguro-bushi is bushi made from tuna. The stock is pale and mild, described as suited to delicate clear soups (suimono); versions with the blood meat removed give an even lighter colour and a refined finish.","flavor":"Light colour, mild, clean taste.","use":"Clear soups and dishes where colour must stay pale.","craft":"Choose blood-meat-removed (chiai-nuki) for the palest result; sources describe it as lighter than katsuo stocks.","src":[["Fushitaka - katsuo, maguro, soda and saba bushi","https://www.fushitaka.com/cont/mutter/katsuo3.html"],["Hyoki - saba-bushi and maguro-bushi","https://hyoki.jp/blog_kyobashi/%E3%82%AB%E3%83%84%E3%82%AA%E7%AF%80%E4%BB%A5%E5%A4%96%E3%81%AE%E3%80%8C%E7%AF%80%E3%80%8D%E3%82%B5%E3%83%90%E7%AF%80%E3%80%81%E3%83%9E%E3%82%B0%E3%83%AD%E7%AF%80/"]]},{"cat":"glossary","name":"Kongo-bushi (blended fushi for professional dashi)","ja":"混合節・業務用だし","prefs":[],"text":"Kongo-bushi, also sold as gyomu dashi, is a blend of several shaved bushi, typically soda-bushi, saba-bushi and uruime-bushi. Professional shops use it because it has stronger umami than katsuobushi, a rounded sweetness and koku, and a lower price.","flavor":"Heavy, sweet, kokumi-driven; less delicate than katsuo-only stock.","use":"Noodle shop and casual restaurant dashi in volume.","craft":"Check the label for which bushi are included and in what order; the blend determines whether it suits mori (soda-heavy) or kake (saba-heavy).","src":[["Tenmaya Shoten - kezuribushi guide","https://www.tenmayashouten.com/blog/dashi-kezuribushi/"],["Solomeshi - differences of bushi","https://solomeshi.net/entry/bushi-chigai"]]},{"cat":"glossary","name":"Hana-katsuo and kezuribushi labelling","ja":"花かつお・削り節","prefs":[],"text":"On retail packs, products labelled katsuo kezuri-bushi or hana-katsuo are described as unmolded arabushi shavings, and most supermarket shavings are arabushi. A shaving labelled soda or katsuo atsu-kezuri (thick shaving) yields a stock with more body: soda atsu-kezuri gives rich koku and aroma, katsuo atsu-kezuri the characteristic katsuo aroma and umami.","flavor":"Thin shavings give a quick, fragrant extraction; thick shavings give a richer, longer stock.","use":"Choose thin shavings for quick finishing, thick for stock kettles.","craft":"Read the species and the mold status on the label; the shaving thickness suits the dashi time.","src":[["Kobuya - not-hana-katsuo shavings","https://www.kobuya.net/kb/%E3%80%8C%E8%8A%B1%E3%81%8B%E3%81%A4%E3%81%8A%E3%80%8D%E3%81%98%E3%82%83%E3%81%AA%E3%81%84%E5%89%8A%E3%82%8A%E7%AF%80%E3%81%AE%E3%81%8A%E8%A9%B1/"],["Yoshida Kyo Shoji - katsuobushi","https://yoshida-kyo.co.jp/special/997/"],["Koizumi Press - types of bushi","https://koizumipress.com/archives/4816"]]},{"cat":"dashi","name":"Ibuki iriko (Ibukijima niboshi)","ja":"伊吹いりこ","prefs":[37],"text":"Iriko from Ibukijima in Kagawa Prefecture is made from katakuchi iwashi (Japanese anchovy). Each net-owner (amimoto) carries out the whole chain from catch through steaming to drying, and production runs from June to September. It is the regional specialty used for Sanuki udon dashi.","flavor":"Clear, sweet iriko stock suited to udon.","use":"Sanuki udon dashi; miso soup; any iriko stock.","craft":"Because the catch, steam and dry are done by one house, ask the amimoto for freshness and harvest date; oxidised fat (abura-yake) is the main defect to check for.","src":[["Tabechoku - Ibuki Island Project","https://www.tabechoku.com/producers/20817"],["Odashi - niboshi types and dashi","https://odashi.co.jp/niboshi/"]]},{"cat":"dashi","name":"Nagasaki niboshi","ja":"長崎の煮干し","prefs":[42],"text":"The Nagasaki Prefecture fisheries federation states that Nagasaki niboshi are cooked in seawater. Niboshi in general are mostly made from katakuchi iwashi; larger fish give a fuller dashi with more fat and koku, and smaller fish a lighter one.","flavor":"Larger fish: rich koku; smaller: light.","use":"Miso soup, noodle broths and general dashi; choose size by desired body.","craft":"Seawater cooking is the origin-specific detail cited; for dashi, head and guts are the source of bitterness, so remove them when serving to customers.","src":[["Nagasaki Prefecture Fisheries Federation","https://www.nsgyoren.jf-net.ne.jp/nutritionalinformation/"],["Odashi - niboshi types and dashi","https://odashi.co.jp/niboshi/"]]},{"cat":"glossary","name":"Hirako-iwashi niboshi","ja":"平子いわしの煮干し","prefs":[],"text":"Hirako-iwashi are small iwashi niboshi with small heads and guts. The source describes the dashi as free of bitterness and off-notes, with koku and a refined character, so they can be used whole.","flavor":"Rich but clean, without bitterness.","use":"Whole in mizudashi or simmered; refined miso soup and noodle broth.","craft":"Their small viscera mean heads and guts matter less, but check each lot for oxidation.","src":[["Odashi - hirako-iwashi niboshi dashi","https://odashi.co.jp/hirakoiwashi-howto/"],["Odashi - niboshi types and dashi","https://odashi.co.jp/niboshi/"]]},{"cat":"glossary","name":"Niboshi preparation: heads, guts, mizudashi","ja":"煮干しの下処理と水出し","prefs":[],"text":"Heads and guts of niboshi are the main source of bitterness and off-notes, so they are normally removed before making dashi; for dishes served to customers the advice is to prepare properly. Cold-water extraction (mizudashi) is said to give a cleaner stock. A quoted guideline is 25 to 30 g of niboshi per litre, about 5 fish per bowl of miso soup. Some say pretreatment is unnecessary in mizudashi because less scum comes out.","flavor":"Cleaner, rounder stock from pre-treated fish; stronger and rougher from whole.","use":"Niboshi dashi for miso soup, udon and ramen bases.","craft":"Tear off heads, split and remove the black guts, optionally dry-roast; mizudashi in the fridge. Sources differ on whether pre-treatment is needed in cold extraction.","src":[["Odashi - niboshi pre-treatment","https://odashi.co.jp/niboshi-pretreatment/"],["Konbu-log - iriko preparation","https://konbu-log.com/iriko-shitasyori"],["Odashi - niboshi types and dashi","https://odashi.co.jp/niboshi/"]]},{"cat":"glossary","name":"Donko and koshin (dried shiitake grades)","ja":"どんこ・香信","prefs":[],"text":"Donko (冬菇) are thick-fleshed dried shiitake whose caps are only 50 to 60 percent open, with a rounded cap and fine cracks on the surface. Koshin (香信) are thinner with fully opened caps and rehydrate faster.","flavor":"Donko: meaty and concentrated; koshin: lighter.","use":"Donko for simmered dishes and as a showpiece; koshin for dashi and quick preparations.","craft":"Judge the cap thickness and the cracking pattern; note that rehydration time depends on the type.","src":[["Furutaya - donko vs koshin","https://www.furutaya.com/blog/donko-shiitake-mushrooms/"],["E-cha - koshin shiitake","https://www.e-cha.co.jp/contents/koushin_shiitake/"]]},{"cat":"glossary","name":"Dried shiitake cold rehydration (5-5-10 rule)","ja":"干し椎茸の水戻し","prefs":[],"text":"Producer groups describe a 5-5-10 rule: 5 degrees C cold water, about 5 hours for thin koshin and 10 hours for thick donko. Cold water is said to preserve the enzyme activity that forms guanylic acid, while hot water or microwave rehydration is said to reduce umami. Another source recommends 24 hours in cold water for donko, so recommended times differ.","flavor":"Cold-soaked liquor is rich in umami; the mushroom stays plump.","use":"Shiitake dashi and simmered shiitake; keep the soaking liquid.","craft":"Fridge, covered, fully submerged; start earlier for donko. Sources disagree on time (10 h vs 24 h), so test with your own product.","src":[["Agriture - dried shiitake rehydration 5-5-10","https://agriture.jp/sustainable/dried-shiitake-guide/"],["Furutaya - proper rehydration","https://www.furutaya.com/blog/%E5%B9%B2%E3%81%97%E6%A4%8E%E8%8C%B8%E3%81%AE%E6%9C%AC%E5%BD%93%E3%81%AB%E3%81%8A%E3%81%84%E3%81%97%E3%81%84%E6%88%BB%E3%81%97%E6%96%B9/"],["Kagome - rehydrating dried shiitake","https://www.kagome.co.jp/vegeday/eat/201711/8501/"]]},{"cat":"dashi","name":"Kanpyo (dried gourd strips)","ja":"干瓢","prefs":[9],"text":"Kanpyo is yugao (bottle gourd) flesh peeled into ribbons and sun-dried. Tochigi accounts for nearly all of Japan's output: 209 t of a national 210 t in 2020, and 164 t, 99.4 percent, in FY2022 per the MAFF survey cited. National output has fallen from 447 t in 2000 to 258 t in 2018. The centre is Shimotsuke, Oyama and Mibu; one gourd of about 7 kg yields about 150 to 200 g. The main cultivar named is Kawachi-shiro.","flavor":"Mild, sweet, slightly fibrous; takes up dashi and soy.","use":"Binding and filling for makizushi and futomaki; ties for kombu-maki and fukuro dishes; simmered in dashi.","craft":"Figures differ by year and source. Imported kanpyo is also on the market, though the claim that over 80 percent is Chinese was not verified.","src":[["Shimotsuke - how kanpyo is made","https://shimotsuke-pr.jp/making_kanpyou/"],["Region Case - kanpyo output ranking 2020","https://region-case.com/rank-r2-product-kanpyo/"],["Urahyoji - kanpyo production ranking","https://urahyoji.com/crops-kanpyo-d/"]]},{"cat":"dashi","name":"Hotate hoshi-kaibashira (dried scallop adductor)","ja":"ホタテ干し貝柱","prefs":[1],"text":"Dried scallop adductors from Hokkaido's Okhotsk coast are salt-boiled then dried. According to MAFF, larger pieces have richer umami while small pieces taste saltier. Saroma-ko scallops are noted for size; inner-lagoon scallops are said to be creamy-sweet and outer-sea ones crisp. The Hokkaido fisheries federation grades by individual weight: LL 12 g to under 16 g, L 8.6 g to under 12 g.","flavor":"Concentrated sweet umami; firm, chewy.","use":"Soaked and shredded into soups, rice dishes and XO-style sauces; the soaking liquid is kept as stock.","craft":"Judge firm flesh, colour, gloss and fragrance; select size by saltiness and richness.","src":[["MAFF - dried scallop adductor","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/hotatehosikaibasira.html"],["Saroma Town - Saroma-ko scallops","https://www.town.saroma.hokkaido.jp/shoukai/hotate.html"],["E-D1 - dried scallop grades","https://e-d1.co.jp/kanbutsu/hotatekikaku/"]]},{"cat":"glossary","name":"Tama-rei (frozen scallop adductor)","ja":"玉冷","prefs":[],"text":"Tama-rei is the shucked scallop adductor frozen on its own, sold in size grades such as 2S and 3S; a 1 kg pack of 2S is about 36 to 40 pieces. It is the raw material from which dried adductors are made.","flavor":"Sweet, clean raw scallop flavour.","use":"Sashimi, sushi, grilling, and as raw material for kaibashira.","craft":"Size code reflects count per kg; check thawed texture and drip.","src":[["Suguremon Hokkaido - tama-rei 2S","https://www.suguremon-hokkaido-shinkins.com/seafood/scallop/item136/"],["Saroma Town - Saroma-ko scallops","https://www.town.saroma.hokkaido.jp/shoukai/hotate.html"]]},{"cat":"dashi","name":"Kuragakoi kombu (cellar-aged kombu)","ja":"蔵囲昆布","prefs":[18,1],"text":"Kuragakoi is a traditional Tsuruga method of ageing kombu in a storehouse. Okui Kaiseido revived it in 1989, applying it to Rishiri kombu from Fukahama in Rebun; they age for a minimum of 1 year and up to 2 to 3 years or more. The maker states that this removes the kombu and sea smell and increases umami. Aged lots can be kept even longer.","flavor":"Rounder, less marine smell, more umami as claimed by the maker.","use":"Kaiseki and high-end ichiban dashi.","craft":"The time is the maker's claim; compare aged and fresh lots by taste.","src":[["Okui Kaiseido - kuragakoi kombu","https://www.konbu.jp/kuragakoi/"],["JBpress - kuragakoi vintage kombu","https://jbpress.ismedia.jp/articles/-/39293"],["MAFF aff 2015.09","https://www.maff.go.jp/j/pr/aff/1509/treat05.html"]]},{"cat":"glossary","name":"Hine-mono and ohine (aged kombu terms)","ja":"囲物・大囲","prefs":[],"text":"One Hidaka kombu seller calls kombu aged one year hinemono (囲物), and aged two or more years ohine (大囲). This is a single seller's classification, not an official one.","flavor":"Aged: mellower.","use":"Reading kombu labels.","craft":"Terms are seller-defined; always ask age.","src":[["Dashi Koubou - Hidaka kombu","https://odashi-koubou.com/?mode=grp&gid=2734215"]]},{"cat":"glossary","name":"Ittoken (first-grade inspection) kombu","ja":"一等検","prefs":[],"text":"Kombu quality is partly determined by the shore (hama) where it is harvested, with the best called betsukaku hama and graded first class. One retailer states that first-grade Rishiri kombu is about 1 m long, with shorter pieces graded second and third. This is a retailer description, not an official standard.","flavor":"First grade: well-formed, long, clean blades.","use":"Reading grade labels.","craft":"Grade reflects shore and size; verify with supplier.","src":[["Hoshitako - Rishiri kombu ittoken","https://www.hoshitako.co.jp/publics/index/25/detail=1/b_id=55/r_id=10/"],["Diamond - kombu wholesalers","https://diamond.jp/articles/-/50367?page=3"]]},{"cat":"dashi","name":"Tsuruga tesuki oboro kombu (hand-shaved)","ja":"敦賀の手すきおぼろ昆布","prefs":[18],"text":"Hand-shaved oboro kombu is made by softening kombu in vinegar and shaving the surface by hand, one sheet at a time; mechanisation is difficult. Tsuruga's oboro process was registered as a national intangible folk cultural property in March 2025. Tsuruga kombu processing is said to date to the Horeki era in the 18th century. Tororo is machine-shaved from the sides of a compressed block of vinegared kombu.","flavor":"Silky, delicate, dissolving; faint acidity from vinegar.","use":"Wrapped around rice balls, floated in clear soup.","craft":"Check thinness and whether it is hand-shaved (tesuki).","src":[["Tsuruga kombu - about oboro","https://tsuruga-konbu.com/about/"],["MAFF - tororo kombu","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/tororo_konbu.html"],["Kanbutsuman - oboro kombu craftsmen","https://kanbutuman.hatenablog.com/entry/konnbu-oboro-syokuninn"]]},{"cat":"glossary","name":"Shio-kombu (shiofuki kombu)","ja":"塩昆布・汐吹昆布","prefs":[],"text":"Shio-kombu is kombu simmered down in a soy-based liquid. One maker says a similar recipe existed in the Heian period, and the dry salt-bloomed kind (shiofuki kombu) came from wartime rationing, when drying was used to distinguish it from tsukudani. This is a single maker's account.","flavor":"Salty-sweet, umami-dense.","use":"Rice topping, pickling aid, seasoning.","craft":"Salt bloom indicates dry shiofuki type.","src":[["Honpo - shiofuki kombu method","https://seaweed.co.jp/pages/35/"],["Kurakon - kombu processed foods","https://www.kurakon.jp/ency_kombu/08.html"]]},{"cat":"seaweed","name":"Arame (Ise arame)","ja":"荒布","prefs":[24,18],"text":"Arame is a brown seaweed of the kelp order with a branching blade. Mie Prefecture produces most of Japan's supply, about 200 t a year. It is wild only (not cultivated) and harvested July to September, then sun-dried to remove astringency, steamed, pressed, cut and dried. In Obama, Fukui it is simmered sweet for Buddhist observances.","flavor":"Mild, soft, slightly sweet.","use":"Simmered with aburaage and vegetables; shredded and dressed with soy.","craft":"A soak of 5 to 10 minutes is the guideline; do not confuse with hijiki.","src":[["Ise Kanbutsu - about arame","https://www.isekanbutsu.co.jp/aramenohanasi.html"],["Waraku - arame","https://intojapanwaraku.com/rock/gourmet-rock/205915/"],["JA Fukui - arame simmered","https://www.ja-fukuiken.or.jp/topics/detail.php?id=29"]]},{"cat":"seaweed","name":"Kajime","ja":"カジメ","prefs":[17],"text":"Kajime is a kelp-order brown seaweed eaten in Okunoto, Ishikawa. It is mucilaginous. Sources conflict on edibility: one says only young astringency-free kajime is eaten while another says arame is edible and kajime is not, but local eating is documented. A guideline is to soak in fresh water about 2 hours if it tastes astringent.","flavor":"Mucilaginous, slightly astringent.","use":"Raw chopped with soy; soups.","craft":"Taste raw first; soak if astringent.","src":[["Okunoto seaweed - kajime","https://www.noto-yamashita.jp/article/13679180.html"],["Marusa Kaiso - kajime","https://www.marusa-kaisou.com/single-post/%E3%81%8B%E3%81%98%E3%82%81%E3%80%81%E3%81%A8%E3%82%8D%E3%82%8D%E3%82%81%E3%80%81%E3%83%8D%E3%83%90%E3%83%8D%E3%83%90%E6%B5%B7%E8%97%BB%E3%81%AE%E3%81%94%E7%B4%B9%E4%BB%8B"],["Zukan Bouz - arame","https://www.zukan-bouz.com/kaisou/kassou/konbu/arame.html"]]},{"cat":"glossary","name":"Ichiban dashi, soba-shop method","ja":"蕎麦屋の一番だし","prefs":[],"text":"A soba-oriented method published by Nisshin: bring kombu to 60 degrees C, hold on very low heat for 1 to 2 hours until sweet, remove it, heat to 80 degrees C (83 for frozen fushi) and add 15 to 20 g of shavings per litre without stirring. Home recipes elsewhere give 60 degrees C kombu extraction and say 70 degrees and above brings off-flavours.","flavor":"Sweet kombu base with clean katsuo.","use":"Kaeshi dilution for soba tsuyu.","craft":"Do not stir the bushi, let it sink; do not exceed 80 degrees C.","src":[["Nisshin - Fushiki Nobuaki soba dashi","https://www.nisshin.com/entertainment/otokonoryouri/column/index14.html"],["Odashi - ichiban dashi","https://odashi.co.jp/ichiban-dashi-howto/"]]},{"cat":"glossary","name":"Niban dashi (second dashi)","ja":"二番だし","prefs":[],"text":"Niban dashi is made from the kombu and bushi left after ichiban dashi. Published methods differ: one heats to 70 to 80 degrees C and keeps it low for 3 to 4 hours; another boils then simmers about 10 minutes.","flavor":"Lighter, rounder.","use":"Simmered dishes and miso soup.","craft":"Methods differ; settle on a time by tasting.","src":[["Nisshin - Fushiki Nobuaki soba dashi","https://www.nisshin.com/entertainment/otokonoryouri/column/index14.html"],["Nakashimaya - basic dashi","https://www.nakasima-inc.com/dashi-meister/torikata"]]},{"cat":"miso","name":"Kome miso (rice-koji miso)","ja":"米味噌","prefs":[1,2,5,17],"text":"Miso made from soybeans, rice koji and salt; the type that dominates northern and Hokuriku Japan (Hokkaido, Tsugaru, Akita, Kaga/Noto appear among the examples in the sources). Sources give salt as roughly 5 to 13 percent and ageing as anywhere from a few months to about a year, with another source giving one month to one year; the figures differ by site because the category spans white to red styles.","flavor":"Ranges from sweet and pale (high koji, low salt) to deep, salty and red (low koji, long age); rounded, grain-sweet koji aroma.","use":"The default miso-soup and general seasoning miso; style is chosen by koji ratio, salt and age rather than by the grain alone.","craft":"Read three numbers together: koji ratio, salt percentage and ageing time. At constant salt a higher koji ratio makes a sweeter miso. Sources disagree on ageing ranges, so judge by the maker's stated figures, not the category label.","src":[["Hikari Miso, miso encyclopedia: types","https://www.hikarimiso.co.jp/enjoy-miso/encyclopedia/type.html"],["Kotowari Cooking, overview of Japanese miso","https://www.kotowari-cooking.com/note/ingredients/seasonings/miso/japanese/overview"],["Furunavi, types and regional distribution of miso","https://furunavi.jp/discovery/knowledge_food/202505-miso/"]]},{"cat":"miso","name":"Mame miso (soybean-koji miso)","ja":"豆味噌","prefs":[21,23,24],"text":"Miso whose koji is made from soybeans alone (mame koji), with salt and water; produced mainly in the three Tokai prefectures Aichi, Mie and Gifu and also called Sanshu miso. Sources give ageing as roughly one to three years and salt around 10 to 12 percent, and describe it as firm, rich and relatively low in moisture.","flavor":"Dark reddish-brown, dense, savoury and bitter-astringent with little sweetness.","use":"Miso soup and akadashi blends in the Tokai region; its strength suits long cooking (specific dishes not given in the sources seen).","craft":"No grain koji means the whole mash is protein: it is stiff, so little water is added and weight (stones) is needed to press it. Check hardness, colour depth and that bitterness is balanced by age, not mere salt.","src":[["Kotowari Cooking, overview of Japanese miso","https://www.kotowari-cooking.com/note/ingredients/seasonings/miso/japanese/overview"],["Jozo Navi, miso types and differences","https://jozo-navi.jp/miso/miso-types-differences/"],["Kobayashi Foods, akadashi explained","https://www.kobayashi-foods.co.jp/washoku-no-umami/aka-dashi-japanese-miso"]]},{"cat":"miso","name":"Mugi miso (barley-koji miso)","ja":"麦味噌","prefs":[38,40,43,46],"text":"Miso fermented with barley koji; the sources place it mainly in the Chugoku, Shikoku and Kyushu regions of western Japan, with salt given as about 9 to 13 percent. Sweet-leaning types are listed at a koji ratio of 15 to 25 and salt of 9 to 11 percent, although no source gives a ratio specific to one regional style.","flavor":"Distinct barley fragrance, gentle sweetness, often with visible koji grains.","use":"Everyday miso soup in the west of Japan (specific dishes not given in the sources seen).","craft":"Barley koji needs pearled or pressed grain handled so the husk does not make the miso rough; check grain texture and the sweetness-to-salt balance. Numbers vary between sources, so verify with the maker.","src":[["Shizen Shokuhin, barley miso (western Japan)","https://www.shizensyokuhin.jp/archives/articles/76"],["Hikari Miso, miso encyclopedia: types","https://www.hikarimiso.co.jp/enjoy-miso/encyclopedia/type.html"],["Marumanjozo Fukushima, types and character of miso","https://www.marumanjouzou.fukushima.jp/blog/%E5%91%B3%E5%99%8C%E3%81%AE%E7%A8%AE%E9%A1%9E%E3%81%A8%E7%89%B9%E5%BE%B4/"]]},{"cat":"miso","name":"Shiro miso (white miso, Kansai-style)","ja":"白味噌","prefs":[26,27,37],"text":"The pale, sweet end of the colour scale: a high-koji, low-salt miso with a very short fermentation, listed in sources at about one week to three months. Examples named include Fuchu miso of Osaka and Sanuki miso of Kagawa (salt about 5 percent, one to two weeks). One source states that Kansai white miso suits miso-zuke of fish and meat because of its sweetness.","flavor":"Pale cream to light yellow, clearly sweet, low salt, smooth.","use":"Kyoto and Kansai soups and simmered dishes, and miso-zuke beds for fish and meat.","craft":"Low salt and short ageing mean poor keeping: store cold and use fresh. Sweet types are given at koji ratio 15 to 25 and salt 5 to 7 percent in one source; treat as a guide. Check for browning, which signals age or heat.","src":[["Furunavi, types and regional distribution of miso","https://furunavi.jp/discovery/knowledge_food/202505-miso/"],["Hankyu Food, miso types and regional list","https://web.hh-online.jp/hankyu-food/blog/lifestyle/detail/001696.html"],["Kotobank, miso-zuke","https://kotobank.jp/word/%E5%91%B3%E5%99%8C%E6%BC%AC-138740"]]},{"cat":"glossary","name":"Koji-buai (koji ratio)","ja":"麹歩合","prefs":[],"text":"The ratio of rice or barley koji to soybeans in a miso mash, a key index of whether the miso turns out sweet or dry. At constant salt, a higher koji ratio gives a sweeter miso. Sources give dry miso as koji ratio about 5 to 10 with salt 11 to 14 percent, and sweet miso as about 15 to 25 (another source 12 to 17) with salt 5 to 12 percent. Traditional Tsugaru miso is cited at about 6.","flavor":"Spoken as a number: koji-buai juu (ten) or hachi-wari (eight tenths) depending on region and maker.","use":"Used to specify and compare miso recipes and to judge sweetness before tasting.","craft":"The figures are conventions that differ by source and by region: some state it as a ratio to beans by volume, others by weight, so always confirm the maker's basis before comparing two misos.","src":[["Hankyu Food, miso types and regional list","https://web.hh-online.jp/hankyu-food/blog/lifestyle/detail/001696.html"],["Furunavi, types and regional distribution of miso","https://furunavi.jp/discovery/knowledge_food/202505-miso/"],["Olive Hitomawashi, Tsugaru miso","https://www.olive-hitomawashi.com/column/2019/12/3-69.html"]]},{"cat":"glossary","name":"Miso colour classes (shiro / tanshoku / aka)","ja":"白味噌・淡色味噌・赤味噌","prefs":[],"text":"Miso is commonly split by colour into white, light-coloured (tanshoku) and red. Colour mainly reflects ageing, darkening as time passes. Sources give white as about one week to three months, light as three to six months, and red as six months to three years or so. Aka-miso is a colour term, not a grain type: rice, barley and bean misos can all be red.","flavor":"Colour word used on labels and menus; it implies sweetness and age, not a single recipe.","use":"Used to choose miso for soups and dishes, e.g. white for sweet Kansai styles and red for stronger soups.","craft":"Do not equate red miso with Hatcho or with soybean miso. Durations differ by source, so use them as indicative bands only.","src":[["Hankyu Food, miso types and regional list","https://web.hh-online.jp/hankyu-food/blog/lifestyle/detail/001696.html"],["Kobayashi Foods, akadashi explained","https://www.kobayashi-foods.co.jp/washoku-no-umami/aka-dashi-japanese-miso"],["Furunavi, types and regional distribution of miso","https://furunavi.jp/discovery/knowledge_food/202505-miso/"]]},{"cat":"glossary","name":"Amakuchi / karakuchi (sweet and dry miso)","ja":"甘口・辛口","prefs":[],"text":"The sweet to dry axis used for miso, driven chiefly by koji ratio and salt. Dry types are given as koji ratio roughly 5 to 10 and salt 11 to 14 percent; sweet types as ratio 12 to 25 and salt 5 to 12 percent depending on source. Karakuchi here means salty and strong, not hot. Hokkaido miso is called dry yet mellow because it is well matured.","flavor":"Amakuchi is round and sweet; karakuchi is salty and savoury.","use":"A quick label for choosing miso for soup strength and seasoning level.","craft":"Salt percentage alone does not tell sweetness; compare it with koji ratio. Ranges cited by sellers vary, so rely on the maker's analysis.","src":[["Hankyu Food, miso types and regional list","https://web.hh-online.jp/hankyu-food/blog/lifestyle/detail/001696.html"],["Furunavi, types and regional distribution of miso","https://furunavi.jp/discovery/knowledge_food/202505-miso/"],["Olive Hitomawashi, Hokkaido miso","https://www.olive-hitomawashi.com/column/2019/12/post-7692.html"]]},{"cat":"miso","name":"Tsugaru miso (Tsugaru three-year miso)","ja":"津軽味噌","prefs":[2],"text":"A red, dry rice miso of Aomori, long aged to concentrate umami and said to need three summers' doyo: the saying is that good miso is not made without passing the summer doyo three times. Traditionally the koji ratio is low (about 6) and salt high (about 13 percent); some modern products use ratios of 7 to 10 and about 12.5 percent salt. The name Tsugaru miso is said to have spread in the mid-Meiji period, when the miso went to Hokkaido settlements.","flavor":"Deep red, salty, concentrated and savoury with mature aroma.","use":"Base for the Tsugaru country dish kenojiru and robust soups.","craft":"With low koji and high salt, the miso depends on time; check that colour and aroma show real ageing. Figures vary by maker. One explanation links long ageing to famine reserves, but that is an interpretation, not a documented fact.","src":[["Olive Hitomawashi, Tsugaru miso and kenojiru","https://www.olive-hitomawashi.com/column/2019/12/3-69.html"],["Kato Miso Shoyu, about Tsugaru miso","https://www.tsugaru-yamatou.com/%E9%86%B8%E9%80%A0%E5%85%83/"],["Miso Dare, what is Tsugaru miso","https://miso-dare.com/faq/744/"]]},{"cat":"miso","name":"Tsugaru onsen miso (hot-spring-heat miso)","ja":"津軽温泉味噌","prefs":[2],"text":"A Tsugaru miso presented by its seller as the only miso in Japan fermented and aged using hot-spring heat. The claim of uniqueness comes from the vendor's own page and I found no independent confirmation. It sits within the Tsugaru tradition of a red, long-aged, dry rice miso.","flavor":"Not described in the sources seen.","use":"Sold as a Tsugaru-style miso for soup and cooking.","craft":"Treat the hot-spring method as a maker's claim; ask for fermentation temperature and duration to compare with ordinary seasonal fermentation.","src":[["Kodawari Choumiryou, Tsugaru onsen miso","https://kodawari-choumiryou.com/tugaruonsenmiso"],["Olive Hitomawashi, Tsugaru miso and kenojiru","https://www.olive-hitomawashi.com/column/2019/12/3-69.html"]]},{"cat":"miso","name":"Hokkaido miso","ja":"北海道味噌","prefs":[1],"text":"A dry rice miso, red as the typical style though light-coloured versions are also common, with a slightly high koji ratio and a mild, clean flavour. Salt is on the high side, yet it is well matured so harshness is limited. Sources say a full production plan existed in the late Edo period but did not proceed, and real production began in the Meiji era. The cold climate meant mainland methods did not work, so long ageing and turning of the mash (kirikaeshi) are credited with shaping its character.","flavor":"Mellow, savoury, dry but not harsh; simple taste that lets ingredients show.","use":"Miso soup and general cooking in Hokkaido.","craft":"Where the winter is cold, fermentation is slow, so maturation time and mash turning matter. Confirm ratio and salt with the maker because they differ.","src":[["Miso Press, Hokkaido miso","https://miso-press.jp/study/15743/"],["Olive Hitomawashi, Hokkaido miso","https://www.olive-hitomawashi.com/column/2019/12/post-7692.html"]]},{"cat":"miso","name":"Akita miso","ja":"秋田味噌","prefs":[5],"text":"A red, dry rice miso of Akita, reddish-brown in colour. One account describes steaming soybeans overnight, pounding them, mixing with koji and salt, and fermenting in a tub for over a year, with three-year miso particularly prized. Records indicate households made miso in the Edo period, and the name Akita miso is said to have been first used in 1910 by Kodama Gomei. It goes into dama-ko mochi and chilled miso soup.","flavor":"Reddish-brown, dry, with strong koji presence for a dry miso.","use":"Dama-ko soup (dama-ko mochi) and hiyashi miso soup.","craft":"Sources describe a relatively high koji ratio for a dry miso, but no figure was found; ask the maker. Long tub ageing is the quality marker.","src":[["Wikipedia, Akita miso","https://ja.wikipedia.org/wiki/%E7%A7%8B%E7%94%B0%E5%91%B3%E5%99%8C"],["Miso Press, miso types by region","https://miso-press.jp/study/types/13945/"]]},{"cat":"miso","name":"Kaga miso (Kaga and Noto miso)","ja":"加賀味噌","prefs":[17],"text":"Rice miso of Ishikawa. Per the Kaga Miso cooperative, it was produced as a military storage food in the roughly 300 years after Maeda Toshiie entered Kanazawa Castle in 1583. Another account says temples such as Oyama Gobo already made miso and the Maeda controlled production. Sources agree on a long-aged, higher-salt dry type with plentiful rice koji, originally red, though today many pale low-salt versions are sold. Place names like Misogura-machi are cited as evidence of an early miso trade. The cooperative of 10 local makers is said to produce about two thirds of the prefecture's miso, a claim from its own side. Accounts of the origin conflict in detail.","flavor":"Rich, full, with koji sweetness and savoury depth; modern versions lighter.","use":"Soups and dishes with seafood, said to suit rich fish ingredients in the region.","craft":"Compare traditional long-aged dry types with modern low-salt light ones; label does not tell you which.","src":[["Kaga Miso Shokuhin Kogyo Kyogyo Kumiai","https://kagamiso.or.jp/"],["Ishikawa Miso Kogyo Kyodo Kumiai, features","https://www.miso-ishikawaken.jp/feature/"],["Shizen Shokuhin, Kaga and Noto miso","https://www.shizensyokuhin.jp/archives/articles/60"],["Mytabi Ishikawa, Kaga miso","https://ishikawa.mytabi.net/kagamiso.php"]]},{"cat":"miso","name":"Fuchu miso (Osaka white miso)","ja":"府中味噌","prefs":[27],"text":"A sweet, pale white miso of Osaka. The source describes it as high in koji, low in salt, with a short fermentation. It belongs to the Kansai white-miso family, which one source says is sweet enough to suit miso-zuke of fish and meat. No dates or production figures appeared in the results.","flavor":"Sweet, pale, light salt.","use":"Soups and simmered dishes in Kansai; miso-zuke beds.","craft":"Low salt and short ageing make it perishable; keep chilled.","src":[["Furunavi, types and regional distribution of miso","https://furunavi.jp/discovery/knowledge_food/202505-miso/"],["Hankyu Food, miso types and regional list","https://web.hh-online.jp/hankyu-food/blog/lifestyle/detail/001696.html"]]},{"cat":"miso","name":"Satsuma miso","ja":"薩摩味噌","prefs":[46],"text":"A barley miso of Kagoshima, light to red in colour and sweet in taste. Ageing is relatively short to bring out barley sweetness, the barley fragrance is prominent, and koji grains often remain visible. No source gave a Satsuma-specific koji ratio; general sweet barley miso is quoted at koji ratio 15 to 25 and salt 9 to 11 percent. It is the standard miso for satsuma-jiru.","flavor":"Sweet, barley fragrance, grainy.","use":"Satsuma-jiru, the regional soup, and sweet miso cooking.","craft":"Check that visible koji grains and fragrance are clean; the sweetness depends on short ageing, so it does not keep as long as red miso.","src":[["Shizen Shokuhin, barley miso (western Japan)","https://www.shizensyokuhin.jp/archives/articles/76"],["Furunavi, types and regional distribution of miso","https://furunavi.jp/discovery/knowledge_food/202505-miso/"],["Tokyo Gas, miso types and storage","https://uchi.tokyo-gas.co.jp/topics/3618"]]},{"cat":"miso","name":"Okinawa miso (miisu)","ja":"沖縄味噌","prefs":[47],"text":"Miso made in Okinawa from rice, barley and soybeans, including turmeric (ukon) miso; some makers use Okinawan salt. It has been eaten since the Ryukyu Kingdom and was an important preserved food. The subtropical climate is warm with small temperature swings, so fermented foods can be made year-round. Cycad miso is also made on some islands. Local makers continue to store in old wooden barrels.","flavor":"Gentle, round sweetness.","use":"Okinawan miso soup and abura-miso.","craft":"Check the grain mix (rice, barley, soybean) and salt per maker; sources give no ratios.","src":[["Orion Beer, Okinawa miso","https://www.orionbeer.co.jp/story/okinawa-miso/"],["BRUTUS meets Be.Okinawa, miso","https://beokinawa.jp/jp/brutus/6/"],["Japan Word, Okinawa miso","https://japan-word.com/okinawamiso"],["Cookbiz, fermented foods of Okinawa","https://cookbiz.jp/soken/culture/okinawa_hakkoushoku/"]]},{"cat":"miso","name":"Tamanaha miso of Shuri","ja":"玉那覇味噌","prefs":[47],"text":"A Shuri maker said to have supplied the Ryukyu court. It brews with soybeans, rice, island salt (shima-maasu) and barley in wooden tubs by natural fermentation. After the war destroyed the factory, it was rebuilt by exploiting the koji microbes remaining in the surviving pillars, per one account. It is described as making its own koji, which is said to be unique in Okinawa; that is a claim from the source.","flavor":"Not described in detail in the sources seen.","use":"Okinawan miso soup and cooking.","craft":"In-house koji and wooden tubs are the points to ask about when judging a maker. Details of ratio and ageing time were not found.","src":[["into the local, Shuri miso","https://into-the-local.com/archives/okinawa/1681"],["BRUTUS meets Be.Okinawa, miso","https://beokinawa.jp/jp/brutus/6/"]]},{"cat":"miso","name":"Abura-miso (Okinawan oil miso)","ja":"油味噌","prefs":[47],"text":"A cooked relish in which miso is fried with pork or seafood; in hot, humid Okinawa where food spoils quickly, miso and pork fat were valued preserved foods. Also called andansu. It is known for the richness of pork or fish fat with miso and a gentle sweetness. Sold as a rice accompaniment.","flavor":"Rich with fat, gently sweet, savoury.","use":"Eaten as a rice accompaniment.","craft":"Fat acts as a seal; check how much sugar and fat the maker uses, as it sets keeping and sweetness.","src":[["Shizen Shokuhin, abura-miso of Okinawa","https://www.shizensyokuhin.jp/archives/articles/66"],["Misonoko Shokuhin, abura-miso","https://misonoko.net/"],["Orion Beer, Okinawa miso","https://www.orionbeer.co.jp/story/okinawa-miso/"]]},{"cat":"miso","name":"Sotetsu miso (cycad miso)","ja":"ソテツ味噌","prefs":[46,47],"text":"A miso made from cycad nuts, brown rice and soybeans, produced in the Amami region and Okinoerabu islands of Kagoshima and on Aguni island in Okinawa. Cycad nuts need special treatment; the sources seen did not describe it. Known from a single source.","flavor":"Not described.","use":"Island household miso.","craft":"Cycad seeds are toxic unless properly processed; buy only from makers who process them correctly (general caution, not from the cited page).","src":[["Shizen Shokuhin, abura-miso of Okinawa","https://www.shizensyokuhin.jp/archives/articles/66"]]},{"cat":"miso","name":"Akadashi (red dashi miso blend)","ja":"赤だし","prefs":[23,21,24],"text":"A blended miso: bean miso with rice miso and seasoning, popular around Nagoya. Despite the name some products contain dashi and some do not. It differs from the term akamiso, which is a colour class. One explanation says that in akadashi the dashi is the lead, whereas in plain miso soup the miso flavour leads.","flavor":"Deep, savoury, bean-miso richness softened by rice miso.","use":"Miso soup with nameko, clams or tofu; check if dashi is included before seasoning.","craft":"Check the label: if dashi is blended in, reduce additional dashi and salt in the pot. Do not equate with Hatcho miso.","src":[["Kobayashi Foods, akadashi explained","https://www.kobayashi-foods.co.jp/washoku-no-umami/aka-dashi-japanese-miso"],["Marushin Honke, red, white and akadashi","https://www.marushinhonke.com/f/miso-kiso"],["Kokonoe Miso, akamiso vs akadashi","https://www.kokonoemiso.com/miso/akamiso-akadashi/"]]},{"cat":"glossary","name":"Ishi-zumi (stone stacking)","ja":"石積み","prefs":[],"text":"The craft of piling stones in a cone on a large wooden miso tub as weight, as done for Hatcho miso at Okazaki. The stones also help the mash circulate in the tub. Because Hatcho has little water, the weight needed is about half the miso weight; one account gives about 3 tons of stone for a 6 ton charge. It takes about ten years to become a full-fledged stacker. Ageing runs for at least two summers and two winters (nika nito).","flavor":"Spoken as ishizumi shokunin; craft term.","use":"Used for Hatcho-style bean miso production.","craft":"Stones must be stacked so the weight is even across the surface and does not slide; a collapsed pile lets the mash dry or mould. Confirm quantity relative to batch.","src":[["Furusato Ikiru, Okazaki stone stacking","https://furusato-ikiru.com/chapter/aichi/detail-1433/"],["Ryoritsushin, Hatcho miso nika nito","https://r-tsushin.com/journal/japan/hattori_yukio21/"],["Okazaki Tourism, Hatcho production area","https://okazaki-kanko.jp/feature/hayawakari/miso"]]},{"cat":"glossary","name":"Kioke (wooden fermentation tub)","ja":"木桶","prefs":[],"text":"The large wooden tub in which traditional miso is mashed and aged. At Hatcho miso houses, bean koji, salt and water are packed into wooden tubs, weighted with stones and aged naturally for at least two summers and two winters. In Okinawa, Tamanaha miso and Ocho miso are said to use wooden barrels from before the war. Wood is used by some makers and not by others, which is a point to ask about.","flavor":"Craft term.","use":"Used in natural, unheated fermentation and ageing.","craft":"Ask whether the tub is wood or stainless steel, how it is cleaned, and how the mash is weighted.","src":[["Ryoritsushin, Hatcho miso nika nito","https://r-tsushin.com/journal/japan/hattori_yukio21/"],["Furusato Ikiru, Okazaki stone stacking","https://furusato-ikiru.com/chapter/aichi/detail-1433/"],["BRUTUS meets Be.Okinawa, miso","https://beokinawa.jp/jp/brutus/6/"]]},{"cat":"glossary","name":"Hatcho miso and the GI dispute","ja":"八丁味噌 地理的表示","prefs":[],"text":"Hatcho miso is a bean miso of soybeans, salt and water made since the early Edo period in the former Hatcho village of Okazaki, Aichi. Under the Geographical Indication system, only miso meeting state-set standards of method, ingredients and ageing may use the name. A 2018 Palsystem article raised the concern that traditional makers might be unable to use the name. The details of the dispute were not in the summaries I saw.","flavor":"Legal and trade term.","use":"Read labels: the name Hatcho may be restricted by GI standards.","craft":"Look at the GI register and the maker's disclosed process before assuming a product is Hatcho.","src":[["Palsystem KOKOCARA, GI and Hatcho miso","https://kokocara.pal-system.co.jp/2018/09/03/geographical-indications-hacho-miso/"],["Kobayashi Foods, akadashi explained","https://www.kobayashi-foods.co.jp/washoku-no-umami/aka-dashi-japanese-miso"]]},{"cat":"miso","name":"Namemiso (okazu miso, eating miso)","ja":"なめ味噌","prefs":[30],"text":"Miso eaten as a side dish rather than dissolved in soup. Before miso soup began in the Kamakura period, miso was set on the tray and eaten as a relish. Kinzanji miso of Wakayama is the classic example and is said to have come from China in the Kamakura era. Tai miso and yuzu miso are secondary processed products, excluded from ordinary miso classification.","flavor":"Sweet-salty, thick, relish-like.","use":"On rice, with sake, with cucumbers (moro-kyu) and as a dip.","craft":"Quality depends on the underlying miso and added ingredients; a trade paper on namemiso quality is in the Journal of the Brewing Society of Japan.","src":[["J. Brew. Soc. Japan, factors affecting namemiso quality","https://www.jstage.jst.go.jp/article/jbrewsocjapan1988/94/11/94_11_890/_pdf"],["J. Brew. Soc. Japan, nationwide miso formulation","https://www.jstage.jst.go.jp/article/jbrewsocjapan1915/62/3/62_3_224/_pdf/-char/ja"],["Marushin Honke, Kinzanji miso history","https://www.marushinhonke.com/f/history"]]},{"cat":"miso","name":"Miso-zuke (miso-pickled foods)","ja":"味噌漬け","prefs":[26],"text":"The practice of curing vegetables, meat or fish in miso, and the pickle that results. Kyoto's Saikyo-zuke is the most noted fish and meat example, using Kansai white miso, whose sweetness is said to suit it. How-to details such as bed ratio or duration did not appear in the results.","flavor":"Salty-sweet, miso fragrance.","use":"Fish, meat and vegetable cures, grilled or served as pickles.","craft":"Scrape off or wipe excess miso before grilling, since sugars burn quickly (general practice, not from sources).","src":[["Kotobank, miso-zuke","https://kotobank.jp/word/%E5%91%B3%E5%99%8C%E6%BC%AC-138740"],["Kai Group, types of miso","https://www.kai-group.com/media/kitchen/1062/"]]},{"cat":"miso","name":"Saikyo-zuke (Kyoto miso-cured fish and meat)","ja":"西京漬け","prefs":[26],"text":"Kyoto's representative miso-cure for fish and meat, which uses sweet Kansai white miso. It is described as turning fish or meat excellent, and the dictionary-level sources I found give no more procedural detail such as cure time or ratios.","flavor":"Sweet, gently salty, soft texture.","use":"Fish and meat cured in sweet white miso, then cooked.","craft":"Cure time and sugar content in the bed change burn risk; ask the maker.","src":[["Kai Group, types of miso","https://www.kai-group.com/media/kitchen/1062/"],["Kotobank, miso-zuke","https://kotobank.jp/word/%E5%91%B3%E5%99%8C%E6%BC%AC-138740"]]},{"cat":"rice","name":"Ginpu (吟風, Hokkaido sake rice)","ja":"吟風","prefs":[1],"text":"Hokkaido's first sake rice with a shinpaku (white core) and, per prefectural sources, the most widely brewed of the three Hokkaido sake rices today. Bred at the Hokkaido Central Agricultural Experiment Station from a 1990 cross, [(Hattanishiki No.2 x Joiku 404) F1] x Kirara397, line name Kuiku 158, and adopted as a Hokkaido recommended variety in March 2000. A second source gives the cross in a different parent order, so quote the pedigree from the station's original report.","flavor":"Rounded, full and tending sweet; the richer end of the Hokkaido trio.","use":"Junmai to ginjo class sake from Hokkaido breweries such as Otokoyama and Kamikawa Taisetsu; also bought by breweries outside Hokkaido.","craft":"The station report names weak cold tolerance and large year-to-year yield variation as its flaws, which is why Kitashizuku was bred afterwards. Because shinpaku expression is good, the grain dissolves readily; check each harvest's protein and water uptake before fixing polishing ratio and steaming. Expect a fuller, sweeter result than Suisei at the same polishing.","src":[["HRO: Breeding of the new sake rice Ginpu","https://www.hro.or.jp/agricultural/center/publication/syuhou/2k/82-1.html"],["Hokuren: sake-only rice varieties","https://www.hokuren.or.jp/_greenweb_/oishii_wa_yell/?p=196"],["Sake Street: What is Ginpu","https://sakestreet.com/ja/media/what-is-ginpu"],["J-STAGE: Hokkaido sake rices Ginpu, Suisei, Kitashizuku","https://www.jstage.jst.go.jp/article/jbrewsocjapan/114/10/114_609/_article/-char/ja"]]},{"cat":"rice","name":"Suisei (彗星, Hokkaido sake rice)","ja":"彗星","prefs":[1],"text":"Hokkaido-bred sake rice with low protein content, a heavy thousand-grain weight (large grains) and high yield. In brewing comparisons it sits at the clean, dry (tanrei) end of the Hokkaido trio, opposite the richer Ginpu. The search results gave no breeding year or cross for Suisei, so none is stated here.","flavor":"Light, clean, dry-leaning, with few off-notes.","use":"Tanrei karakuchi junmai and ginjo from Hokkaido breweries; frequently put side by side with Ginpu in tasting flights.","craft":"Low protein supports high polishing and a clean finish, but it also means a lighter body, so a brewer who wants weight adjusts koji ratio and fermentation rather than expecting it from the rice. Large heavy grains need uniform soaking, timed by stopwatch rather than by feel. Read the cultivar on the label when comparing against Ginpu or Kitashizuku.","src":[["Hokkaido Rice Sales Expansion Committee: Suisei","https://www.hokkaido-kome.gr.jp/variety/suisei/"],["Hokuren: sake-only rice varieties","https://www.hokuren.or.jp/_greenweb_/oishii_wa_yell/?p=196"],["J-STAGE: Hokkaido sake rices Ginpu, Suisei, Kitashizuku","https://www.jstage.jst.go.jp/article/jbrewsocjapan/114/10/114_609/_article/-char/ja"]]},{"cat":"rice","name":"Kitashizuku (きたしずく, Hokkaido sake rice)","ja":"きたしずく","prefs":[1],"text":"Hokkaido sake rice released in 2014 (Heisei 26), bred after Ginpu's weak cold tolerance and yearly variability became a problem. The HRO breeding report lists high cold tolerance among its traits. Brewers place it between Ginpu (dissolves readily, gives flavour) and Suisei (clean and dry), and one brewer calls it the best of both.","flavor":"Between Ginpu's fullness and Suisei's cleanness; balanced and moderately round.","use":"Junmai and ginjo for Hokkaido breweries, e.g. Otokoyama's Kitashizuku junmai.","craft":"Choose it when you want Ginpu-like flavour with Suisei-like finish and a more reliable harvest. As a newer cultivar its brewing data are still accumulating, so keep batch records per rice lot and polishing ratio.","src":[["HRO: Breeding of the new sake rice Kitashizuku (PDF)","https://www.hro.or.jp/upload/14389/104-1.pdf"],["Sakebayashi: Kitashizuku","https://www.sakebayashi.com/sake-sakamaibetsu-kitashizuku"],["Otokoyama: Kitashizuku junmai","https://www.otokoyama.com/blog/recommend/1668"]]},{"cat":"sake","name":"Otokoyama and Asahikawa soft water (男山と旭川の水)","ja":"男山と旭川の仕込み水","prefs":[1],"text":"Otokoyama of Asahikawa presents its sake as brewed with Daisetsuzan permanent-snow subsoil water, drawn from a spring in front of the main brewery and from a well; its style is described as tanrei karakuchi. The city of Asahikawa reports tap-water hardness of about 20 to 40 mg/L (Ishikari River plant 23.0, Chubetsu River plant 40.3), i.e. soft; below 120 mg/L is generally counted as soft. One article notes a Tokachi brewery using medium-hard water, so Hokkaido water is not uniform.","flavor":"Clean, light and dry; soft water gives an unobtrusive profile.","use":"Reference case for Hokkaido soft-water, tanrei karakuchi sake.","craft":"Hardness figures here are municipal tap water, not the brewery's own well, so ask the brewery for its own analysis. Soft water ferments more gently and tends toward a delicate result; adjust koji and temperature management rather than assuming style.","src":[["Asahikawa City: water quality note","https://www.city.asahikawa.hokkaido.jp/kurashi/440/441/4421/p008471.html"],["Otokoyama: about","https://www.otokoyama.com/about/"],["Jizake Kuramotokai: Otokoyama water, rice, skill","https://www.kuramotokai.com/kikou/4/water"],["Tanoshii Osake: Hokkaido sake","https://tanoshiiosake.jp/9202"]]},{"cat":"rice","name":"Hanafubuki (華吹雪, Aomori junmai sake rice)","ja":"華吹雪","prefs":[2],"text":"Large-grained Aomori sake rice bred at the Aomori Agricultural Experiment Station and used mainly for junmai sake, described as giving a rich yet clean taste. Its shinpaku tends to sit off-centre, so it does not suit very high polishing. Sources disagree on the date: one says it was bred in 1985, another that use began in 1986. It was later the pollen parent of Hanaomoi.","flavor":"Koku (body) with a clean, crisp finish.","use":"Junmai and tokubetsu junmai from Aomori breweries; blended with Hanaomoi in some top bottlings.","craft":"Keep polishing in junmai range and use Hanaomoi when you need 40% polishing. Off-centre shinpaku raises the risk of cracking if over-milled, so check the broken-grain rate after each polishing run.","src":[["Wikipedia JA: Hanafubuki","https://ja.wikipedia.org/wiki/%E8%8F%AF%E5%90%B9%E9%9B%AA"],["Aomori Specialty Guide: local sake","https://www.umai-aomori.jp/specialtygoods-pbook/processed/sake.html"],["Sake Times: Aomori sake rice","https://jp.sake-times.com/special/pr/pr_aomori-sakamai"]]},{"cat":"rice","name":"Hanaomoi (華想い, Aomori daiginjo sake rice)","ja":"華想い","prefs":[2],"text":"Aomori sake rice for ginjo and daiginjo. The registration record states it was bred in 1987 at the Aomori Agricultural Experiment Station by crossing Yamadanishiki with Aomori-kei Sake 97 (later named Hanafubuki), and registered on 9 March 2006 (No. 13863); the name dates from about 2002. Small dot- or line-shaped shinpaku and low protein allow 40% polishing, comparable to Yamadanishiki. Wikipedia says Hanafubuki was the pollen parent and Yamadanishiki the seed parent, the aim being to bring in Hanafubuki's lodging resistance.","flavor":"Clean, umami-rich and crisp, with a distinct shinpaku-derived body.","use":"Junmai daiginjo from Aomori breweries, e.g. Denshu Junmai Daiginjo 140 (Hanaomoi, Yamadanishiki, Hanafubuki).","craft":"Use Hanaomoi when you need a local rice for 40% polishing, which Hanafubuki cannot take. Treat steaming and koji-making as you would for Yamadanishiki but test each lot's water absorption.","src":[["MAFF variety registration gazette: Hanaomoi (PDF)","https://www.hinshu2.maff.go.jp/gazette/touroku/contents/186gaiyou.pdf"],["Aomori Industrial Technology Center: Hanaomoi","https://www.aomori-itc.or.jp/marche/d13_mar_hanaomoi.html"],["Wikipedia JA: Hanaomoi","https://ja.wikipedia.org/wiki/%E8%8F%AF%E6%83%B3%E3%81%84"]]},{"cat":"rice","name":"Ginebōshi and Hana-sayaka (吟烏帽子・華さやか, newer Aomori sake rices)","ja":"吟烏帽子・華さやか","prefs":[2],"text":"Two newer Aomori sake rices. Ginebōshi was designated a prefectural variety in 2018 (Heisei 30); it tolerates cold, can be grown in cool districts, and gives a showy aroma with a clean taste. Hana-sayaka is described as lower in amino acid content than Hanafubuki and Hanaomoi, bred with sake-style diversity in mind. The results did not include their breeding records.","flavor":"Ginebōshi: fragrant and clean. Hana-sayaka: light, low amino-acid character.","use":"Prefectural brand sake for brewers wanting a lighter or more aromatic Aomori style.","craft":"Low amino acids in Hana-sayaka point to a cleaner, drier finish and less need to manage umami and acid. Both are recent, so request the prefecture's brewing data and run trial lots before committing a whole season.","src":[["Aomori Specialty Guide: local sake","https://www.umai-aomori.jp/specialtygoods-pbook/processed/sake.html"],["Sake Times: Aomori sake rice tasting","https://jp.sake-times.com/special/pr/pr_aomori-sakamai"],["Narumi Jozoten: Aomori sake rice","https://narumijozoten.com/blog/22894/"]]},{"cat":"sake","name":"Mahoroba Hana yeast (まほろば華酵母, Aomori)","ja":"まほろば華酵母","prefs":[2],"text":"A yeast developed jointly by an Aomori research institution and the Brewing Society of Japan. Aomori sources describe the Mahoroba yeasts as aromatic and as a deciding factor in the character of Aomori sake. The results gave no strain number, development date or fermentation data, so only its role is recorded.","flavor":"Aromatic, fruity ginjo character.","use":"Aomori ginjo and junmai ginjo, often paired with prefectural rices such as Hanaomoi.","craft":"Ask the individual brewery or the Aomori technology institute for the exact strain and temperature recommendation, since the sources give no process numbers.","src":[["Aomori Specialty Guide: local sake","https://www.umai-aomori.jp/specialtygoods-pbook/processed/sake.html"],["Sake Times: Aomori sake rice tasting","https://jp.sake-times.com/special/pr/pr_aomori-sakamai"]]},{"cat":"sake","name":"Tsugaru Toji (津軽杜氏, Aomori brewing masters)","ja":"津軽杜氏","prefs":[2],"text":"The toji of the Tsugaru region, mostly from Hirosaki, who with the Nambu toji supported Aomori's local sake. The Tsugaru Toji Association no longer exists because breweries decreased, and few toji trained in it remain. One explanatory article, written about ten years before it was read, said there were about ten such toji in the 1980s and about five then; the figure is undated, so treat it as approximate.","flavor":"A farming-and-brewing tradition rather than a flavour style.","use":"Context when reading Aomori bottlings or visiting Hirosaki-area breweries.","craft":"Historically a toji farmed in summer and brewed in winter, a pattern that is fading. As union training lapsed, newer toji come from owner-brewers and other routes, so ask each brewery who the toji is and where they trained.","src":[["Marugoto Aomori: Tsugaru toji Kamekichi","https://www.marugotoaomori.jp/blog/2008/03/2529.html"],["Aomori Specialty Guide: local sake","https://www.umai-aomori.jp/specialtygoods-pbook/sake"],["Sake and Utensil Science: three great toji groups","https://sake.science/%E6%97%A5%E6%9C%AC%E4%B8%89%E5%A4%A7%E6%9D%9C%E6%B0%8F%EF%BD%9E%E6%9D%9C%E6%B0%8F%E3%81%A8%E8%94%B5%E4%BA%BA%E3%81%AE%E5%BD%B9%E5%89%B2%E3%81%A8%E6%AD%B4%E5%8F%B2%EF%BD%9E/"]]},{"cat":"sake","name":"Nambu Toji (南部杜氏, Iwate master brewers' guild)","ja":"南部杜氏","prefs":[3],"text":"One of Japan's three great toji groups, originating in Shiwa, Iwate and based in Ishidoriya, Hanamaki. Narrative sources trace its start to around 1600, when Nambu domain merchants brought Itami's large-batch cask method. The guild began with 220 members, rose to 500 and then 1,000 within a few years of the Taisho era (the source's Western dates are inconsistent), peaked at 4,153 in 1965, and stood at 554 members including 175 toji in May 2026. It became the Nambu Toji Association in 1948 and an incorporated association in 1953.","flavor":"Associated with soft, clean, rice-driven sake from low-temperature, long fermentation.","use":"Check the guild affiliation of the toji when selecting Tohoku sake; influential in Miyagi as well.","craft":"The association runs training and a toji qualification exam. A brewery blog lists requirements as full membership, age 27 or over, a completed special course, and experience as kashira, koji-maker or moto-maker; this is not an official statement. About 300 people gather for the July seminar.","src":[["Nambu Toji Association","https://nanbutoji.jp/"],["Nambu Toji Association: about","https://nanbutoji.jp/about/"],["Wikipedia JA: Nambu Toji","https://ja.wikipedia.org/wiki/%E5%8D%97%E9%83%A8%E6%9D%9C%E6%B0%8F"],["Serai: Iwate sake and Nambu toji","https://serai.jp/gourmet/1268136"]]},{"cat":"sake","name":"GI Iwate (地理的表示「岩手」)","ja":"地理的表示「岩手」","prefs":[3],"text":"National Tax Agency geographical indication for Iwate sake, designated 25 September 2023. The production standard defines it as sake with a soft mouthfeel and rice-derived rich umami, supported by Iwate's famous waters and Nambu toji skill, stressing mineral-rich subsoil water and a cold climate suited to low-temperature fermentation. A news report says a stricter tier, 'GI All Iwate', additionally requires Iwate-grown rice.","flavor":"Soft entry with rice-derived richness; styles range from rich-sweet to clean.","use":"Look for the GI mark when sourcing sake guaranteed to be brewed in Iwate to the standard.","craft":"The GI guarantees the production standard, while the All Iwate tier tightens rice origin; read the exact label wording, since the two are different claims. Check the full standard on the NTA page for water and rice conditions.","src":[["NTA: GI Iwate production standard","https://www.nta.go.jp/taxes/sake/hyoji/chiri/230925_iwate_besshi01.htm"],["Nikkei: GI for Iwate sake","https://www.nikkei.com/article/DGXZQOCC178UI0X11C23A0000000/"],["NTA: list of GI for alcohol","https://www.nta.go.jp/taxes/sake/hyoji/chiri/ichiran.htm"]]},{"cat":"rice","name":"Ginginga and Ginotome (吟ぎんが・ぎんおとめ, Iwate sake rices)","ja":"吟ぎんが・ぎんおとめ","prefs":[3],"text":"Iwate Agricultural Research Center sake rices. Ginginga is a mid-season variety with strong cold tolerance and good brewing suitability, a standard Iwate sake rice. Ginotome is an early variety suited to central and northern Iwate. Both were aimed at ginjo sake at around 50% polishing, which is why brewers later asked for a daiginjo rice and Yui no Ka was bred.","flavor":"Clean, soft Iwate profile; ginjo-friendly.","use":"Junmai and ginjo from Iwate breweries; the prefecture's staple sake rices.","craft":"Both are designed for roughly 50% polishing, so move to Yui no Ka or Yamadanishiki for daiginjo. One summary gave parentage inconsistently, so it is omitted here.","src":[["Iwate Sake Brewers Association: Iwate sake rice","https://iwatesake.jp/ginginga/"],["Iwate Prefecture: Yui no Ka breeding report (PDF)","https://www.pref.iwate.jp/agri/_res/projects/project_agri/_page_/002/004/379/houbun_17-03.pdf"]]},{"cat":"rice","name":"Yui no Ka (結の香, Iwate daiginjo sake rice)","ja":"結の香","prefs":[3],"text":"Iwate daiginjo rice, a cross of Yamadanishiki with Aomori-kei Sake 140, selected over ten years and numbered Iwate Sake 98. Developed by the Iwate Industrial Technology Center with the brewers' association, farmers and the agricultural research center, aiming to rival Yamadanishiki when brewers wanted a daiginjo rice beyond the 50% grade of Ginginga and Ginotome. It has a shorter culm than Ginginga and gives clear sake with little off-flavour.","flavor":"Clear and clean, with few off-notes.","use":"Iwate junmai daiginjo and daiginjo, marketed as Iwate's top rice.","craft":"Shorter culm than Ginginga helps against lodging in the field; in the brewery treat it as a high-polish rice and check lot protein. Confirm the label states Iwate-grown Yui no Ka.","src":[["Iwate Prefecture: Yui no Ka breeding report (PDF)","https://www.pref.iwate.jp/agri/_res/projects/project_agri/_page_/002/004/379/houbun_17-03.pdf"],["Nanbu Bijin: Yui no Ka","https://www.nanbubijin.co.jp/tres_bon_mariage/sakamai-yuinoka/"],["Iwate Sake Brewers Association: sake rice","https://iwatesake.jp/ginginga/"]]},{"cat":"sake","name":"Reimei Heisen koji (黎明平泉, Iwate original koji mold)","ja":"黎明平泉","prefs":[3],"text":"An Iwate-original koji mold described by the Iwate Sake Brewers Association as made by combining two original koji molds and suited to Iwate rice. It is the koji counterpart to the prefecture's sake rices. The results did not give strain parents or the year of release.","flavor":"Intended to complement Iwate rices; style not described in the source.","use":"Used by Iwate breweries as a prefectural identity marker alongside local rice and water.","craft":"Ask whether Reimei Heisen is used for all koji or only part of the batch; the brewers' association page is the reference for the current official description.","src":[["Iwate Sake Brewers Association: Iwate yeast and koji","https://iwatesake.jp/kouji/"]]},{"cat":"sake","name":"Miyagi Junmai-shu no Ken declaration (みやぎ・純米酒の県)","ja":"みやぎ・純米酒の県宣言","prefs":[4],"text":"In November 1986 the Miyagi Sake Brewers Association declared Miyagi a 'junmai-shu prefecture', and all 52 member companies began brewing junmai from 100% Sasanishiki, a table rice known for its taste. It is reported as the only such prefecture-wide declaration. The share of tokutei meisho-shu is quoted as 92%, 94% or 96% depending on the source.","flavor":"Clean, light, dry (tanrei karakuchi), the typical Miyagi profile.","use":"Explains why Miyagi shops and menus lean toward junmai; Ichinokura's Sasanishiki junmai daiginjo is an example.","craft":"When quoting tokutei meisho percentages, cite source and year because the figures differ. Sasanishiki is a table rice, so ask a brewery how it handles it for sake and what polishing it uses.","src":[["Miyagi Shunsen Tanbo: why Miyagi sake is good","https://shunsentanbou.pref.miyagi.jp/feature/detail_52.html"],["Kahoku: Miyagi junmai-shu declaration","https://kahoku.news/articles/20220131khn000021.html"],["Tanoshii Osake: Miyagi junmai prefecture","https://tanoshiiosake.jp/2826"],["Ichinokura: Sasanishiki junmai daiginjo","https://ec.ichinokura.co.jp/products/%E3%82%B5%E3%82%B5%E3%83%8B%E3%82%B7%E3%82%AD%E7%B4%94%E7%B1%B3%E5%A4%A7%E5%90%9F%E9%86%B8"]]},{"cat":"rice","name":"Kura no Hana (蔵の華, Miyagi sake rice)","ja":"蔵の華","prefs":[4],"text":"Miyagi's first prefectural sake rice, registered as a recommended variety in 1997. It is large-grained and absorbs water well, has low acidity and amino acids and low protein, and tolerates cold and lodging. Many Miyagi breweries use it, and it gives light, crisp sake. It is also one of the two parents of Yamagata's Yukimegami.","flavor":"Light, crisp and clean.","use":"Miyagi junmai and ginjo; basis of the tanrei karakuchi Miyagi style.","craft":"Good water absorption and easy dissolving mean you manage soaking and koji ratio to avoid over-melting. Low amino acids give a clean finish, so body must come from process if wanted.","src":[["Miyagi Shunsen Tanbo: why Miyagi sake is good","https://shunsentanbou.pref.miyagi.jp/feature/detail_52.html"],["ZEN-NOH Miyagi: Miyagi sake","https://www.zennoh.or.jp/mg/agriculture/rice/sake.html"],["Miyagi Prefecture: Ginno Iroha announcement (PDF)","https://www.pref.miyagi.jp/documents/577/775416_1.pdf"]]},{"cat":"rice","name":"Ginno Iroha (吟のいろは, Miyagi sake rice)","ja":"吟のいろは","prefs":[4],"text":"Newer Miyagi-bred sake rice that appeared in 2020, the first new prefectural sake rice since Kura no Hana. The name was chosen by a naming committee centred on the Furukawa Agricultural Experiment Station. It is easier to grow than Kura no Hana and is described as giving rounder, softer, fuller sake.","flavor":"Soft, rounded and full-bodied.","use":"Miyagi junmai ginjo and similar; positioned as the successor to Kura no Hana.","craft":"Its selling point is cultivation ease plus a softer, fuller result than Kura no Hana; compare lots side by side when choosing a rice for a house style.","src":[["Miyagi Prefecture: Ginno Iroha announcement (PDF)","https://www.pref.miyagi.jp/documents/577/775416_1.pdf"],["Miyagi Shunsen Tanbo: why Miyagi sake is good","https://shunsentanbou.pref.miyagi.jp/feature/detail_52.html"]]},{"cat":"sake","name":"Miyagi tanrei karakuchi and Nambu-toji tradition (宮城の淡麗辛口)","ja":"宮城の淡麗辛口と南部杜氏","prefs":[4],"text":"Miyagi sake is generally described as tanrei karakuchi (light, dry), attributed to the low-temperature, long fermentation of the Nambu toji, who spread brewing culture in the early Edo period and remain the mainstream. Serai traces Miyagi brewing to patronage by the Sendai domain lords.","flavor":"Light, dry and crisp; made for food.","use":"Food-pairing sake in Sendai, consistent with the prefecture's junmai focus.","craft":"To reproduce the style, control the moromi temperature curve for a long, low fermentation and avoid over-extracting amino acids. The sources give no figures.","src":[["Miyagi Shunsen Tanbo: why Miyagi sake is good","https://shunsentanbou.pref.miyagi.jp/feature/detail_52.html"],["Serai: Miyagi junmai sake and Sendai domain","https://serai.jp/gourmet/1239688"]]},{"cat":"rice","name":"Akita Sake Komachi (秋田酒こまち)","ja":"秋田酒こまち","prefs":[5],"text":"Akita's prefectural sake rice, bred in 2001 at the Akita Agricultural Experiment Station by crossing Akikei Sake 251 and Akikei Sake 306, and made a recommended variety in 2003. Large-grained with a small shinpaku, it takes high polishing and suits ginjo and daiginjo. Descriptions give rice umami, elegant sweetness and rich aroma.","flavor":"Rice umami with refined sweetness and a rich aroma.","use":"Akita ginjo and daiginjo; also junmai at lower polishing, e.g. Mansaku no Hana Akita Sake Komachi 70.","craft":"The small shinpaku allows high polishing without much cracking. As a recent cultivar, ask each brewery for polishing ratio and check lot protein before ginjo-grade batches.","src":[["Sake Concierge: Akita Sake Komachi","https://sakeconcierge.com/genealogy-of-sake-rice-akita-sake-komachi/"],["theDANN: Akita Sake Komachi","https://contents.thedann.com/entry/%E9%85%92%E7%B1%B3%EF%BC%88%E9%85%92%E9%80%A0%E5%A5%BD%E9%81%A9%E7%B1%B3%EF%BC%89%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6%E5%BE%B9%E5%BA%95%E8%A7%A3%E8%AA%AC/%E7%A7%8B%E7%94%B0%E9%85%92%E3%81%93%E3%81%BE%E3%81%A1"],["Hinomaru Jozo: Mansaku no Hana Akita Sake Komachi 70","https://hinomaru-sake.com/item/junmai-mansaku-akitasakekomachi70"]]},{"cat":"sake","name":"AK-1 Akita Ryuka-bana yeast (秋田流花酵母)","ja":"秋田流花酵母 (AK-1)","prefs":[5],"text":"Akita's own ginjo yeast, born in 1990 (Heisei 2) from joint research between the prefecture and the Akita Sake Brewers Cooperative that began in 1987, ahead of the nationwide ginjo boom. It corresponds to Kyokai yeast No. 1501. It gives refreshing, light sake with moderate ginjo aroma and a light aftertaste.","flavor":"Refreshing, light, moderate ginjo aroma, light finish.","use":"Akita ginjo and junmai ginjo.","craft":"A moderate-aroma yeast, so keep fermentation cool and long in the Akita style to preserve the light finish. Do not confuse with Kyokai No. 6, which the cooperative site credits to the Shinsei (Aramasa) brewery.","src":[["Akita Sake Brewers Cooperative: yeast story (2)","https://osake.or.jp/secret09/"],["Government of Japan Online: Akita sake","https://www.gov-online.go.jp/eng/publicity/book/hlj/html/202011/202011_12_jp.html"]]},{"cat":"sake","name":"Akita-style cold-season brewing (秋田流寒造り, low-temperature long fermentation)","ja":"秋田流寒造り(低温長期醗酵)","prefs":[5],"text":"The Akita Sake Brewers Cooperative presents Akita-style kanzukuri (low-temperature, long fermentation) as the basis of its ginjo brewing. Winter snow stabilises brewery temperature so the moromi ferments slowly at low temperature. Koji is made in a room kept at 25-35 C for about two days even in midwinter. The cooperative says good brew water has moderate minerals and little iron and manganese. One brewery describes a season starting in November and peaking from December to February.","flavor":"Smooth, clean and light, as the cooperative describes the result.","use":"Reference process for understanding Akita ginjo and why the region favours long cold fermentation.","craft":"Key checks: koji room temperature through the cold season, brew water iron and manganese, and a moromi temperature curve that stays low for a long time. Ratios and exact temperatures were not given in the sources.","src":[["Akita Sake Brewers Cooperative: secrets of Akita sake","https://osake.or.jp/technology/secret/"],["Akita Sake Brewers Cooperative: brewing process","https://osake.or.jp/secret03/"],["Sake Times: Akita cold-season brewing","https://jp.sake-times.com/special/recommend/sake_matome_akita-01"]]},{"cat":"sake","name":"Sannai Toji (山内杜氏, Akita master brewers)","ja":"山内杜氏","prefs":[5],"text":"Toji from the Sannai district of Yokote, Akita. The association was founded in 1922 as the Sannai Toji Training Association, resumed in 1949 as the Sannai Village Toji Association after wartime suspension, and took its present name in 1959. Its aims were training toji, improving technique and supplying brewery workers. In 2022 it marked 100 years with 145 members, and its annual summer s
