eminar reached its 95th run.","flavor":"A guild tradition tied to Akita's cold-season style.","use":"Context for Akita breweries, many of which now use a local or owner toji.","craft":"The seminar is held in Yokote before the Obon holiday. Association coverage says the traditional group form has declined in favour of owner-toji, local hires and young and female toji, so check each brewery's current toji.","src":[["Sakigake: Sannai Toji 100 years","https://www.sakigake.jp/special/2022/sannaitoji/"],["Akita Sake Brewers Cooperative: Akita toji","https://osake.or.jp/secret11/"],["Sake World: Dainagawa and Tenka","https://sakeworld.jp/sakebrewery/2412-akita-dainagawa/"]]},{"cat":"rice","name":"Dewa Sansan (出羽燦々, Yamagata sake rice)","ja":"出羽燦々","prefs":[6],"text":"Yamagata's first original sake rice, from Misayama-nishiki x Hanafubuki, and the most grown in the prefecture, mainly for ginjo. Its shinpaku is of medium size and protein slightly low. The birth year differs by source: 1994 (JA), 1995, or 1985 (theDANN), so quote the year with its source. Line name Yamagata Sake 49.","flavor":"Fragrant and soft.","use":"Ginjo and junmai ginjo; the required rice for DEWA33 certification.","craft":"Medium shinpaku and low protein give soft, aromatic sake that works well with Yamagata yeast. Track grain size and polishing break rate by lot.","src":[["ZEN-NOH Yamagata: sake rice","https://www.zennoh-yamagata.or.jp/rice/sakamai"],["Oishii Yamagata: brewing rice","https://www.yamagata.nmai.org/crops/umaimono/rice/brewers-rice.html"],["Sake Street: Dewa Sansan","https://sakestreet.com/ja/media/what-is-dewasansan"]]},{"cat":"rice","name":"Yukimegami (雪女神, Yamagata daiginjo rice)","ja":"雪女神","prefs":[6],"text":"Yamagata's first daiginjo-class rice, line Yamagata Sake 104, from Dewa no Sato x Kura no Hana. A newspaper reports development began in FY2010 with full use from 2017, while Wikipedia says it began in 2001. Thousand-grain weight about 26.9 g, roughly 1 g above Dewa Sansan, with higher shinpaku expression and lower protein. Dewazakura sells a 48% polished version.","flavor":"Clean, with little off-flavour.","use":"Junmai daiginjo and daiginjo; the basis of the Yamagata Sanka brand.","craft":"Small point-shaped shinpaku allows polishing above 50% without cracking; Yamagata's YK009 yeast was designed for it. Confirm development years with Yamagata's technology centre because sources disagree.","src":[["Wikipedia JA: Yukimegami","https://ja.wikipedia.org/wiki/%E9%9B%AA%E5%A5%B3%E7%A5%9E"],["Kahoku: Yamagata first in national new sake","https://kahoku.news/articles/20230524khn000043.html"],["Dewazakura: Yukimegami 48","https://www.dewazakura.co.jp/item/cat02/yukimegami48.html"],["Yamagata Sake Brewers: DEWA33, Sanka, Dewa no Sato, Yukimegami","https://yamagata-sake.or.jp/pages/139/"]]},{"cat":"rice","name":"Dewa no Sato (出羽の里, Yamagata junmai rice)","ja":"出羽の里","prefs":[6],"text":"Yamagata rice developed as the successor to Dewa Sansan for junmai sake. It has large grains, a shinpaku that tends to sit at the centre, and low protein. It is also one of the two parents of Yukimegami.","flavor":"Soft, clean junmai character.","use":"Yamagata junmai and junmai ginjo.","craft":"A central shinpaku is more forgiving than an off-centre one; test its water absorption separately from Dewa Sansan, since grain size differs.","src":[["Yamagata Sake Brewers: DEWA33, Sanka, Dewa no Sato, Yukimegami","https://yamagata-sake.or.jp/pages/139/"],["ZEN-NOH Yamagata: sake rice","https://www.zennoh-yamagata.or.jp/rice/sakamai"]]},{"cat":"sake","name":"DEWA33 (Yamagata junmai ginjo standard)","ja":"DEWA33","prefs":[6],"text":"A Yamagata Sake Brewers Association certification: 100% Dewa Sansan, junmai ginjo, polishing 55% or less, Yamagata yeast and the original Oryze Yamagata koji mold. Passing the tasting panel earns the DEWA33 title and a certificate. The name comes from the 33 peaks over 1,400 m in the prefecture and from Dewa Sansan. Many bottles are polished to 50%.","flavor":"Fruity, soft junmai ginjo.","use":"Look for DEWA33 on the label as a brewery's local-resource junmai ginjo.","craft":"Sake Street adds in-prefecture brew water as a condition, but the association page does not state it. Polishing of 55% is an upper limit, so 50% bottles exceed the requirement.","src":[["Yamagata Sake Brewers: DEWA33, Sanka, Dewa no Sato, Yukimegami","https://yamagata-sake.or.jp/pages/139/"],["Sake Street: Dewa Sansan","https://sakestreet.com/ja/media/what-is-dewasansan"],["Kigawaya: Dewazakura DEWA33","https://www.kigawaya.com/sake/dewa/dewa33.html"]]},{"cat":"sake","name":"Yamagata Sanka (山形讃香)","ja":"山形讃香","prefs":[6],"text":"A prestige junmai daiginjo brand developed by Yamagata Prefecture and the Yamagata Sake Brewers Association, aiming at the highest peak of Japanese sake. The raw rice is gold-medal entry rice from a Yukimegami competition. The polishing ratio was not confirmed in the results.","flavor":"Top-grade clean junmai daiginjo.","use":"Top-class Yamagata bottle for gifting and competitions.","craft":"The brand ties rice quality to contest-winning lots; verify the current standard on the association page before quoting figures.","src":[["Yamagata Sake Brewers: DEWA33, Sanka, Dewa no Sato, Yukimegami","https://yamagata-sake.or.jp/pages/139/"],["ZEN-NOH Yamagata: sake rice","https://www.zennoh-yamagata.or.jp/rice/sakamai"]]},{"cat":"sake","name":"Yamagata KA and YK009 yeasts (山形KA酵母・YK009)","ja":"山形KA酵母・YK009","prefs":[6],"text":"The Yamagata Prefecture Industrial Technology Center developed a high-aroma yeast by selecting cerulenin-resistant strains from a distributed parent strain, producing Yamagata KA yeast. A brewery source says KA gives pear and banana-like aroma and a later Yamagata yeast (2008) gives ripe apple. YK009 is a newer strain made for Yukimegami, balancing ethyl caproate (apple) and isoamyl acetate (banana) at low acidity.","flavor":"KA: pear and banana aroma, refined. YK009: balanced apple and banana, low acidity.","use":"Yamagata ginjo and daiginjo; YK009 for Yukimegami.","craft":"Names overlap (Yamagata yeast, KA, NF-KA, YK009), so ask which strain a brewery used. The sources give no fermentation temperatures.","src":[["Yamagata Industrial Technology Center: high-aroma yeast (PDF)","https://agriknowledge.affrc.go.jp/RN/2010911042.pdf"],["Yamagata Industrial Technology Center: YK009 (PDF)","https://yrit.jp/wp-content/uploads/2021/12/R1_07_new_yeast.pdf"]]},{"cat":"sake","name":"GI Yamagata (地理的表示「山形」)","ja":"地理的表示「山形」","prefs":[6],"text":"Geographical indication for Yamagata sake, designated 16 December 2016. The production standard requires domestic rice and rice koji, water taken within Yamagata, no sugar additions, and brewing, storage and bottling within the prefecture.","flavor":"Not a flavour standard; a regional origin guarantee.","use":"Check the label for GI Yamagata; it signals in-prefecture brewing and water.","craft":"The standard covers materials and location, not style. Read the full text on the NTA page before making label claims.","src":[["NTA: GI Yamagata production standard","https://www.nta.go.jp/taxes/sake/hyoji/chiri/161216_besshi01.htm"],["NTA: list of GI for alcohol","https://www.nta.go.jp/taxes/sake/hyoji/chiri/ichiran.htm"]]},{"cat":"rice","name":"Yume no Ka (夢の香, Fukushima sake rice)","ja":"夢の香","prefs":[7],"text":"Fukushima's original sake rice bred at the Fukushima agricultural centre and registered in 2003. Parents are Hattanishiki No.1 and Yamagata Sake 49 (Dewa Sansan). It was bred to replace Gohyakumangoku, is somewhat more cold and lodging tolerant, and has a large but crack-resistant shinpaku, suiting ginjo and daiginjo. Another source says crossing began in 2000.","flavor":"Fragrant, clean ginjo character.","use":"Fukushima ginjo, e.g. Aizu Chujo Junmai Ginjo Yume no Ka and Kokken.","craft":"Low breakage in polishing allows high polishing. It is paired with Utsukushima Yume yeast in the Fukushima brand scheme.","src":[["Wikipedia JA: Yume no Ka","https://ja.wikipedia.org/wiki/%E5%A4%A2%E3%81%AE%E9%A6%99"],["NANAME KIKAKU: Yume no Ka","https://note.com/nanamekikaku/n/n88dcc04f4398"],["Fukushima Sake Brewers: brand sake Yume no Ka","http://sake-fukushima.jp/?page_id=25"]]},{"cat":"rice","name":"Fukunoka (福乃香, Fukushima sake rice)","ja":"福乃香","prefs":[7],"text":"Second Fukushima original sake rice, added in 2019. One parent is Homarefuji, which came from Yamadanishiki irradiated with gamma rays, so the rice carries Yamadanishiki blood from both sides. Retail pages pair it with Yume no Ka, as in Tenmei's Fukunoka x Yume no Ka bottling.","flavor":"Not described in the sources.","use":"Fukushima junmai ginjo and similar premium bottlings.","craft":"The sources give no brewing data, so ask the brewery for polishing ratio and tasting notes. The word 'hybrid' used by a shop was not confirmed in the results.","src":[["Jizake.com: Tenmei Fukunoka x Yume no Ka","https://www.jizake.com/c/sake/tenmei/ns290005c00"],["Fukushima original sake rice project team","https://ninki.co.jp/blog/20240917-2116/"]]},{"cat":"sake","name":"Utsukushima Yume yeast and Fukushima Brand Sake (うつくしま夢酵母)","ja":"うつくしま夢酵母・ブランド酒","prefs":[7],"text":"The Fukushima Sake Brewers Cooperative's 'dream rice, dream sake' brand: sake made with Yume no Ka rice and Utsukushima Yume yeast, produced only inside the prefecture. One page spells the yeast differently (Utsukushima Kira yeast), and the cooperative's name is written shuzo kyodo kumiai on its site.","flavor":"Fragrant ginjo style.","use":"Look for the brand mark on Fukushima bottles.","craft":"The brand pairs a local rice with a local yeast; ask the brewery about koji and polishing, which the sources do not specify.","src":[["Fukushima Sake Brewers: brand sake Yume no Ka","http://sake-fukushima.jp/?page_id=25"],["Tsurunoe Shuzo: Aizu Chujo Yume no Ka","https://www.tsurunoe.com/products/2"]]},{"cat":"sake","name":"Aizu Toji (会津杜氏)","ja":"会津杜氏","prefs":[7],"text":"Aizu toji association founded in 1989 (Heisei 1) to train brewing skill and successors. Aizu once invited Echigo and Nambu toji for the brewing season; now owner-toji and local toji lead many breweries. The association says Aizu brewers contributed to Fukushima leading gold-award counts, and members include a Modern Master Craftsman awardee and a Medal with Yellow Ribbon recipient.","flavor":"A guild tradition rather than a flavour style.","use":"Context for Aizu breweries.","craft":"A column credits Aizu-Wakamatsu brewing's early development to the Aizu domain's protection in the Edo period.","src":[["Aizu Toji Association","https://aizusake.jp/touji"],["Irodori: Aizuwakamatsu sake series","https://irodori.sukagawagas.co.jp/blogs/column/fukushima-sake-series-01-aizuwakamatsu"]]},{"cat":"sake","name":"Fukushima gold-award record and Sake Academy","ja":"福島の全国新酒鑑評会金賞と清酒アカデミー","prefs":[7],"text":"At the 114th National New Sake Appraisal (announced May 2026) Fukushima took 20 gold medals, the most of any prefecture, for the second year running; Niigata and Nagano followed with 16 and Hyogo had 14. The local paper counts it as Fukushima's 13th top finish and says it held nine in a row to 2022. Training centres on the Fukushima Sake Academy, a vocational school run by the prefectural brewers' association. A mission document puts Fukushima fourth nationally in brewery count, with over 60 in Hamadori, Nakadori and Aizu (undated).","flavor":"Gold-award sake is a ginjo style prepared for the contest.","use":"A signal of ginjo technique concentration in Fukushima.","craft":"Contest sake is a special ginjo and does not equal the daily product; judge in the cup.","src":[["Fukushima Minyu: second year number one","https://www.minyu-net.com/news/detail/2026052108335850017"],["Shokuhin Net: gold awards ranking","https://shokuhin.net/145106/2026/05/21/inryou/sake/"]]},{"cat":"rice","name":"Hitachi Nishiki (ひたち錦, Ibaraki sake rice)","ja":"ひたち錦","prefs":[8],"text":"Ibaraki's first original sake rice. Breeding started in 1991 and it was registered as a variety in 2003. Low protein reduces off-flavour and suits a clean style.","flavor":"Clean, light.","use":"Ibaraki junmai and junmai ginjo, e.g. Aoki Shuzo's Gokeiji, which uses Hitachi Nishiki and a prefectural yeast.","craft":"Low protein gives a clean base; adjust koji and acid if more body is wanted.","src":[["Ibaraki Prefecture: Hitachi Nishiki","https://www.pref.ibaraki.jp/nourinsuisan/nosose/cont/h_nishiki.html"],["Sake Meguri: Hitachi Nishiki","https://sakemeguri.com/hitachi-nishiki/"],["Tanoshii Osake: Ibaraki sake","https://tanoshiiosake.jp/9273"]]},{"cat":"sake","name":"Pure Ibaraki (ピュア茨城)","ja":"ピュア茨城","prefs":[8],"text":"Ibaraki Sake Brewers Association's all-Ibaraki junmai project, started in 2003 (Heisei 15). The association lists four rices: Hitachi Nishiki, Fukumaru, Ichibanboshi and Yumehitachi. Brewery pages describe Hitachi Nishiki 100% with Ibaraki's own 'Hitachi yeast' and 32 participating breweries under one specification. Polishing of 55% is common but is a per-brewery spec rather than a confirmed common rule.","flavor":"Rice-forward junmai that shows brewery character.","use":"Standard-grade local junmai; look for Pure Ibaraki on the label.","craft":"Rice lists differ by source; read the label for the rice and yeast actually used.","src":[["Ibaraki Sake Brewers: Pure Ibaraki","http://www.ibaraki-sake.or.jp/pure/index.html"],["Isaka Shuzo: Pure Ibaraki Satomi","https://www.isakasyuzou.co.jp/product/%E7%89%B9%E5%88%A5%E7%B4%94%E7%B1%B3-%E3%83%94%E3%83%A5%E3%82%A2%E8%8C%A8%E5%9F%8E-%E9%87%8C%E7%BE%8E/"]]},{"cat":"sake","name":"Hitachi Toji (常陸杜氏)","ja":"常陸杜氏","prefs":[8],"text":"Ibaraki's toji certification, launched in 2019 by the Ibaraki Sake Brewers Association with the prefectural industrial innovation centre, to train local toji and brand Ibaraki sake; three people were certified first. The exam is held about once a year. A sake-information article lists the requirements as 3 or more years as production manager (7 or more in the production site otherwise), completion of the prefecture's sake college toji course, first-class sake brewing technician or intent to obtain it, 40 points in the brewer career register, and an employer's recommendation.","flavor":"Not a flavour style.","use":"Context when assessing Ibaraki breweries that no longer depend on outside toji.","craft":"The requirements come from a private article from around 2020, so confirm current rules with the association.","src":[["Sake Meguri: Hitachi Toji exam","https://sakemeguri.com/hitachi-toji-exam/"],["Tanoshii Osake: Ibaraki sake","https://tanoshiiosake.jp/9273"]]},{"cat":"sake","name":"Shimotsuke Toji (下野杜氏, Tochigi)","ja":"下野杜氏","prefs":[9],"text":"Tochigi's prefecture-wide toji qualification, created by the Tochigi Sake Brewers Association in FY2006 with the Tochigi Industrial Technology Center, which sets the curriculum and exams (practical, sensory and written). Nikkei calls it a 21st-century toji group. One article says the system joined the national toji federation in 2012; that date is unconfirmed. Unlike migrant toji, they are in the brewery year-round.","flavor":"Not a flavour style.","use":"The association holds an annual Shimotsuke Toji new sake showing, with a 2026 Osaka event reporting 18 breweries.","craft":"Year-round employment changes the staffing model compared with seasonal migrant guilds; ask who holds the toji role in a brewery.","src":[["Nikkei: 21st-century Shimotsuke Toji","https://www.nikkei.com/article/DGXMZO46674650X20C19A6L60000/"],["Tochigi Sake Brewers: What is Shimotsuke Toji","http://sasara.lib.net/news.html"],["Sake World: Tochigi sake","https://sakeworld.jp/special/2502-tochigi-sake/"],["Sake Times: Shimotsuke Toji new sake 2026","https://jp.sake-times.com/special/press/p_202605_tochigi-new-sake-2026-osaka"]]},{"cat":"sake","name":"Tochigi prefectural yeasts (T-1, T-Delta)","ja":"栃木県産酵母","prefs":[9],"text":"By 1993 four Tochigi original yeasts existed, including T-Delta and T-1, which have gold-award records. They were developed by Okamoto Takemi of the Tochigi Industrial Technology Center, who visited about 40 breweries, collected some 2,000 to 3,000 house-yeast samples and selected through repeated brewing trials over about two years. Sources do not give strain characteristics.","flavor":"Not described in the sources.","use":"Tochigi-only profile for breweries wanting a locally derived yeast.","craft":"The strains came from brewery-resident yeast selection, so each strain's behaviour should be requested from the technology centre.","src":[["Shimotsuke Shimbun: Tochigi yeast story","https://www.shimotsuke.co.jp/articles/-/1261526"],["Tochigi Prefecture: local sake (PDF)","https://www.pref.tochigi.lg.jp/c01/documents/kenmin302.pdf"]]},{"cat":"rice","name":"Yume Sasara (夢ささら, Tochigi sake rice)","ja":"夢ささら","prefs":[9],"text":"Tochigi's sake rice from Yamadanishiki (mother) x T-Sake 25 (disease-resistant father), started in 2005 and taking 13 years under the working name Tochigi Sake 27. Registered February 2018. It matures earlier and resists lodging better than Yamadanishiki, has a shinpaku as large as or larger than Yamadanishiki, and is higher in crude protein, potassium and umami amino acids. In 2019, 27 Tochigi breweries brewed it simultaneously.","flavor":"Umami and sweetness from amino acids.","use":"Daiginjo and junmai ginjo from Tochigi breweries.","craft":"Higher protein and amino acid content than Yamadanishiki means more body; adjust polishing and fermentation for the style wanted. It does not crack easily when polished.","src":[["Sake Times: Yume Sasara 2019 report","https://jp.sake-times.com/enjoy/report/sake_g_tochigi-yumesasara-2019"],["Nikkei: Tochigi new sake rice","https://www.nikkei.com/article/DGXMZO27457810X20C18A2L60000/"],["Tochigi Sake Brewers: Sasara","https://sasara.pto.co.jp/osakezukuri.html"]]},{"cat":"rice","name":"Maikaze and Gunma KAZE yeast (舞風・群馬KAZE酵母)","ja":"舞風・群馬KAZE酵母","prefs":[10],"text":"Maikaze is a Gunma-bred sake rice registered with MAFF in March 2011. The 'all-Gunma' Maikaze brand, developed with the Gunma Sake Brewers Association, the Agricultural Technology Center and the Industrial Technology Center, requires 100% Maikaze, a Gunma yeast such as Gunma KAZE yeast or Gunma G2 yeast, Gunma water and junmai. Product labels cite Gunma KAZE yeast No. 2.","flavor":"Not described in the sources.","use":"All-Gunma junmai, junmai ginjo and daiginjo.","craft":"The yeast's development year and aroma profile were not in the results; check the strain designation on the label.","src":[["Gunma Prefecture: Maikaze","https://www.pref.gunma.jp/site/sake/500052.html"],["Gunma Maikaze","https://sake.pref.gunma.jp/maikaze.html"],["Gunma Maikaze 2025 campaign","https://www.gunma-saketsugu.jp/maikaze2025/"]]},{"cat":"rice","name":"Wakamizu (若水)","ja":"若水","prefs":[8,9,10],"text":"Sake rice bred in Aichi in 1983 from Aichi-kei Sake 101 (seed parent) and Gohyakumangoku (pollen parent). It resists lodging and cold but is weak to disease and is grown from Ibaraki, Tochigi and Gunma to Oita. A page says Gunma Wakamizu was the first Kanto rice certified as sake rice. Wakamizu is also the father of Saitama's Sake Musashi.","flavor":"Rice umami, deep and concentrated.","use":"Kanto prefectural sake in Ibaraki, Tochigi, Gunma, Kanagawa and elsewhere.","craft":"Disease susceptibility makes crop quality year-dependent, so judge each harvest. Aichi sources give the pedigree; check against the registration record.","src":[["Wikipedia JA: Wakamizu","https://ja.wikipedia.org/wiki/%E8%8B%A5%E6%B0%B4_(%E7%B1%B3)"],["J-STAGE: Aichi sake rice breeding","https://www.jstage.jst.go.jp/article/jbrewsocjapan1988/88/4/88_4_250/_pdf/-char/ja"]]},{"cat":"rice","name":"Sake Musashi (さけ武蔵, Saitama sake rice)","ja":"さけ武蔵","prefs":[11],"text":"Saitama sake rice developed in 2004 by the prefecture's agriculture research centre from Kairyo Hattanryu (mother) and Wakamizu (father), over 12 years. Large grain and large shinpaku, but soft, so unsuitable for high polishing; it dissolves and breaks easily and is awkward to handle. It yields a rounded, clean sake. 17 Saitama breweries use it, and Kagamiyama won a gold award with it.","flavor":"Rounded, clean, with good swell of flavour.","use":"Saitama junmai and ginjo, including Kagamiyama's Sake Musashi bottlings.","craft":"Because it is soft and dissolves readily, consider short soaking and a restrained koji and steaming approach. The prefecture's technology centre ran analysis and brewing trials to document its handling.","src":[["Saitama Industrial Technology Center: Sake Musashi","https://www.pref.saitama.lg.jp/saitec/kenkyukaihatsu/shienjire/sakemusashi.html"],["Sake Times: Kagamiyama Sake Musashi","https://jp.sake-times.com/knowledge/sakagura/sake_g_kagamiyama_sakemusashi"]]},{"cat":"sake","name":"Saitama yeast and Saitama G yeast (埼玉酵母・埼玉G酵母)","ja":"埼玉酵母・埼玉G酵母","prefs":[11],"text":"The Saitama Industrial Technology Center North Institute in Kumagaya has developed, managed and distributed Saitama yeast since the 1960s, mainly to prefectural breweries. Saitama G yeast, a ginjo yeast developed jointly with RIKEN, is described as giving a gorgeous aroma and umami. One brewery uses Saitama G for ginjo-type sake.","flavor":"Gorgeous aroma with umami.","use":"Saitama ginjo and junmai ginjo.","craft":"Distribution is to Saitama sake producers, so a bottle naming Saitama G signals a prefectural-resource product; check the technology centre for strain details.","src":[["Saitama: yeast distribution","https://www.pref.saitama.lg.jp/saitec/shien/koubo/index.html"],["Saitama: what is Saitama yeast","https://www.pref.saitama.lg.jp/saitec/shien/koubo/saitama_koubo.html"]]},{"cat":"sake","name":"Chichibu sake and Mt. Bukou water (秩父の酒)","ja":"秩父の酒と武甲山伏流水","prefs":[11],"text":"Chichibu has three to four breweries depending on the source. Bukou Shuzo (Bukou Masamune, founded 1753, Horeki 3) uses Mt. Bukou subsoil water, selected as one of Heisei's 100 famous waters; Yao Honten (Chichibu Nishiki) dates from 1749 (Kanen 2); Taisei's Chichibu Kojiro is a third label. Sources disagree on the water: one calls it soft, another says it is rare medium-hard water rich in minerals because it passes through a limestone mountain.","flavor":"Not described reliably in the sources.","use":"Chichibu brewery visits and local pairing.","craft":"Because softness is disputed, request the brewery's own hardness figure rather than relying on an article.","src":[["isilk: Chichibu sake brewery guide","https://isilk.jp/blog/4115/"],["Web Guide Chichibu: Bukou Shuzo","https://www.chichibu.co.jp/benri/%E6%AD%A6%E7%94%B2%E9%85%92%E9%80%A0/"],["Chichibu Kanpai Republic: breweries","https://www.chichibu-omotenashi.com/kanpai/sakegura/"]]},{"cat":"rice","name":"Fusa no Mai (総の舞, Chiba sake rice)","ja":"総の舞","prefs":[12],"text":"Chiba's own sake rice, from Shiratae-nishiki (mother, sake rice) and Chubu 72 (father, table rice), created because Chiba had relied on outside rice for ginjo. It is a mid-season rice resistant to lodging, cold damage and blast, and is grown only in Chiba; output was recorded as 83 t in 2015. Dates differ: development from 1993, variety registration in 2000 per one source, or 2001 breeding / Heisei 12 per others.","flavor":"Not described in detail in the sources.","use":"Takeoka Tokubetsu Junmai (Wakura Shuzo), Kidoizumi's Junmai Nama AFS from Isumi-grown Fusa no Mai, and a 55% Katori junmai ginjo.","craft":"Chiba's association defines ginjo as 60% or less and daiginjo 50% or less. Koizumi Shuzo grows it itself from 2024 with Kanozan-system water.","src":[["Sake Concierge: Fusa no Mai","https://sakeconcierge.com/fusanomai-genealogy-of-sake-rice/"],["Chiba Sake: 38 breweries","https://chibasake.com/blogs/topics/0526"],["Wakura Shuzo: Takeoka","https://wakura-sake.jp/takeoka/"],["Chiba Sake Brewers: sake guide","https://chiba-sake.jp/guide/index.html"]]},{"cat":"sake","name":"Kidoizumi high-temperature yamahai and AFS (木戸泉)","ja":"木戸泉の高温山廃・AFS","prefs":[12],"text":"Kidoizumi Shuzo of Chiba (Isumi) developed a high-temperature yamahai moto, adopted from 1956 (Showa 31) under its third head. One source puts the moto temperature at 55 C, explained as saccharifying starch while heat-sterilising; another says it removes unwanted microbes. AFS is a thick, high-acid sake pressed from a single-stage mash with lactic acid use. In 1965 the brewery succeeded in sake able to age long term and began making aged sake; it holds 5, 10 and 40+ year stocks.","flavor":"Thick, high acid, lactic and aged character.","use":"Aged sake and acid-forward bottlings, e.g. AFS Old Reserve.","craft":"The unusual part is a hot moto, a single-stage mash, and long ageing; these defy standard three-stage practice. Details like ratios should come from the brewery.","src":[["Sake Street: Kidoizumi","https://sakestreet.com/ja/media/sakagura-kidoizumi-shuzo-chiba"],["Tanoshii Osake: Kidoizumi","https://tanoshiiosake.jp/5257"],["Sakegocochi: Kidoizumi","https://sakegocochi.com/?p=322"],["Imadeya: Kidoizumi","https://imadeya.co.jp/blogs/brewery/kidoizumi"]]},{"cat":"sake","name":"Ozawa Shuzo and the two waters of Ome (小澤酒造・澤乃井)","ja":"小澤酒造と澤乃井の二つの水","prefs":[13],"text":"Ozawa Shuzo (Sawanoi, Sawai, Ome) was founded in 1702 (Genroku 15). It uses two waters: a cave spring from a lateral well hand-dug about 140 m into Chichibu Paleozoic rock behind the brewery, medium-hard and mineral-rich, said to give vigorous fermentation and a firm, crisp sake; and a soft mountain well water from roughly 4 km away (other pages say several km) across the Tama River. Using both lets the brewery range from dry to sweet, and sources say the soft water is used for kimoto.","flavor":"Medium-hard water: firm, crisp. Soft water: gentle.","use":"A reference case for blending waters of different hardness in one brewery.","craft":"No hardness values in mg/L were given, so obtain the brewery's analysis. Choosing the water per brew is a deliberate quality tool.","src":[["and trip: two springs of Ozawa Shuzo","https://www.andtrip.jp/article/003790.html"],["Sushi Blog: Sawanoi tour","https://sushi-blog.com/sakelog/tour-sawanoi/"],["LiqLog: two waters of Okutama","https://liqlog.com/post/maker/%E3%80%8C%E5%A5%A5%E5%A4%9A%E6%91%A9%E3%81%AE%E8%87%AA%E7%84%B6%E3%81%8B%E3%82%89%E3%81%AE%E8%B4%88%E3%82%8A%E7%89%A9%E3%80%8D%E6%80%A7%E8%B3%AA%E3%81%AE%E9%81%95%E3%81%86%E3%81%B5%E3%81%9F%E3%81%A4/"],["Sawanoi (Ozawa Shuzo)","https://www.sawanoi-sake.com/"]]},{"cat":"sake","name":"Tama sake of Tokyo (東京多摩の酒)","ja":"東京多摩の酒","prefs":[13],"text":"The Tokyo Sake Brewers Association lists one brewery in the 23 wards and nine in Tama; one article counts only nine in all, and the list also shows Tsuchiya Shuzo as suspended. Ozawa Shuzo (Sawanoi, Ome) was founded in 1702, Ishikawa Shuzo (Tamajiman, Fussa) began making sake in 1863, and Toshimaya Shuzo (Higashimurayama) makes Okunokami. Tama is described as having soft water from the Chichibu mountain system.","flavor":"Delicate, soft-water profile as described by regional guides.","use":"Tama brewery visits and urban-edge pairing.","craft":"Counts vary by source and date, so check the association list before quoting a number.","src":[["Tokyo Sake Brewers: breweries","https://www.tokyosake.or.jp/brewery/"],["Sawanoi","https://www.sawanoi-sake.com/"],["Serai: Tokyo breweries","https://serai.jp/gourmet/1258380"]]},{"cat":"sake","name":"Tokyo Port Brewery and Edo Kaijo (東京港醸造)","ja":"東京港醸造・江戸開城","prefs":[13],"text":"The only brewery in the 23 wards, in a four-storey building in Shiba, Minato. Toji Terasawa Yoshimi, with over 40 years' experience, developed the compact 'craft kura' brewing equipment. It began with doburoku in 2011 and received a seishu licence in September 2016; its main label is Edo Kaijo. A Nikkei headline says it brews with Minato ward tap water. Yeast origin differs by source: dancyu says a home-cultured No. 9-type yeast; another article credits an original 'Tokyo yeast' developed with a vocational school in Ota ward.","flavor":"Not described in the sources.","use":"A case study in small-footprint urban brewing.","craft":"One blog notes that yeasts named Tokyo or Edo in the Kyokai lineage were named in 1908 and may not be Tokyo-derived, so do not assume origin from the name.","src":[["Dancyu: Edo Kaijo","https://dancyu.jp/read/2020_00002774.html"],["Hands On Local: Tokyo Port Brewery","https://hands-on-local.com/blogs/sakebrewer/tokyo-minato"],["Nikkei: Edo Kaijo from Minato tap water","https://www.nikkei.com/article/DGXZQOCD201E10Q5A120C2000000/"]]},{"cat":"sake","name":"Tanzawa-water sake of Kanagawa (丹沢の水と神奈川の酒)","ja":"神奈川の酒と丹沢伏流水","prefs":[14],"text":"Many Kanagawa breweries use Tanzawa subsoil water, giving a clear, transparent taste. Brewery count is 14 on the prefecture page, 13 on the association page, and 12 to 15 elsewhere. The association says junmai share is high among mostly small breweries; a ranking site notes higher average polishing than other prefectures and rices such as Yamadanishiki, Misayama-nishiki and Wakamizu.","flavor":"Clear, clean and tending dry.","use":"Food-pairing sake; the 12 breweries' autumn festival in Yokohama.","craft":"Counts differ by source, so cite the source and date.","src":[["Kanagawa Prefecture: local sake","https://www.pref.kanagawa.jp/docs/u5r/cnt/f550/osake.html"],["Sake Time: Kanagawa ranking","https://www.saketime.jp/ranking/kanagawa/"],["Kanagawa Jizake Association: guide","https://www.kanagawa-jizake.or.jp/guide/"]]},{"cat":"sake","name":"Izumibashi estate-grown rice (泉橋酒造・いづみ橋)","ja":"泉橋酒造のいづみ橋","prefs":[14],"text":"Izumibashi Shuzo of Ebina, founded 1857, polishes all its rice in-house and grows 90% of it locally in Ebina. Its Megumi Blue Label junmai ginjo uses 100% locally grown Yamadanishiki, polished to 58%; the name Megumi is explained as coming from the moral teaching go-on go-kei (五恩五恵).","flavor":"Not described in the sources.","use":"A model of grower-brewer integration in the Kanto plain.","craft":"The key control is in-house polishing combined with local cultivation, which lets the brewer track a lot from field to bottle.","src":[["Kanagawa Prefecture: Izumibashi Shuzo","https://www.pref.kanagawa.jp/docs/u5r/cnt/f550/tabi-061_trachi.html"],["Izumibashi shop: Megumi Blue Label","https://shop.izumibashi.com/products/megumi-bleulabel-720ml"],["Sakenomy: Izumibashi Shuzo","https://www.sakenomy.jp/brewery/K01N014012/"]]},{"cat":"sake","name":"S. tokyo yeast of Nakazawa Shuzo (S.tokyo酵母)","ja":"S.tokyo酵母","prefs":[14],"text":"Saccharomyces tokyo Nakazawa, discovered in 1909 by Dr Nakazawa Ryoji of Tokyo University of Agriculture. Sources disagree on where: Munich brewing institute, or isolated from a moto. Described as the second oldest surviving sake yeast and never used in sake until release. Nakazawa Shuzo's 11th head, Kagiwada Akira, obtained it from the university's culture collection and released Matsumidori Junmai Ginjo S.tokyo in October 2018, fermenting slowly at 14 C because it is unsuited to usual cold fermentation.","flavor":"Compared to white wine in a news headline.","use":"A heritage-yeast bottling from the Ashigara area.","craft":"Fermentation at 14 C rather than the usual low range is the key setting. One interview page spells the discoverer's given name 亮二 where most sources write 亮治.","src":[["Town News: Nakazawa Shuzo","https://www.townnews.co.jp/0608/2018/10/06/451943.html"],["Kanaloco: Nakazawa Shuzo","https://www.kanaloco.jp/news/life/entry-36835.html"],["Matsumidori: S.tokyo","https://www.matsumidori.jp/products-2/s-tokyo%E3%81%AE%E3%81%94%E7%B4%B9%E4%BB%8B/"]]},{"cat":"glossary","name":"Kan-zake temperature names (燗酒の温度名称)","ja":"燗酒の温度名称","prefs":[],"text":"Common warming names: hinata-kan about 30 C, hitohada-kan 35 C, nuru-kan 40 C, jo-kan 45 C, atsu-kan 50 C, tobikiri-kan 55 C or higher. These are informal rather than an industry standard; sources vary on hitohada (35 to 37 C) and jo-kan (45 to 50 C).","flavor":"Rises from rice aroma and umami to a sharper, drier edge as temperature goes up.","use":"Used when ordering and serving kan-zake.","craft":"Touch test: a tokkuri base that feels slightly hot to the finger is about 45 to 50 C.","src":[["Jizake Kuramoto-kai: kan","https://www.kuramotokai.com/glossary/word/%E7%87%97"],["Nihon Meimonshu-kai: temperatures","https://www.meimonshu.jp/modules/xfsection/html/gallery2/memo/seishu/mmc_ondo.html"],["Watanabe Shuzoten: kanzake","https://www.sake-hourai.co.jp/sakehack/column/3654/"]]},{"cat":"sake","name":"Gohyakumangoku (sake rice of Niigata)","ja":"五百万石","prefs":[15,16,18],"text":"Sake-brewing rice bred at the Niigata Agricultural Experiment Station in 1938. It was named in 1957 to mark Niigata's rice crop reaching 5 million koku (about 750,000 t). It is the rice behind the clean, dry Niigata style and is also a mainstay in Toyama and Fukui; one Fukui-oriented source says Fukui ranks second nationally in Gohyakumangoku volume.","flavor":"Clean, light, crisp; little aromatic ornament, dry finish.","use":"Core rice for futsu-shu through ginjo in Niigata, Toyama and Fukui; chosen when the goal is a tight, quiet cup that sits behind food.","craft":"Sources describe the grain as somewhat hard and slow to dissolve, so it is not suited to very high polishing; it takes koji well and absorbs water readily. Judge by how the moromi melts late and cleanly: it tends to give a thin, dry body rather than richness, so brewers use it where lightness is the aim rather than trying to force depth from it.","src":[["Niigata sake guide: Gohyakumangoku","https://www.niigata-sake.net/niigata-goku-nihonsyu/"],["Sake Times: Gohyakumangoku","https://jp.sake-times.com/knowledge/word/sake-brewing-rice-gohyakumangoku"]]},{"cat":"sake","name":"Koshitanrei (Niigata ginjo rice, Niigata Sake No. 72)","ja":"越淡麗","prefs":[15],"text":"Niigata's own ginjo rice, Yamada-nishiki x Gohyakumangoku (mother Yamada-nishiki, father Gohyakumangoku), developed under an 'All Niigata' concept so that rice, water and skill all come from the prefecture. It is a late cultivar, heading and ripening about 15 days after Gohyakumangoku. The name joins 'Koshi' (Niigata) with 'tanrei'. Registration date is given inconsistently: a prefectural research page lists registration no. 15536 on 7 Aug 2007, while another article says 2004.","flavor":"Fine, soft, clean; the idea is an elegant tanrei profile in the daiginjo range.","use":"Junmai ginjo to junmai daiginjo from Niigata kura; sold as a regional-pride rice.","craft":"Large grain with low brown-rice protein, said to withstand polishing to 40 percent or less, which is why it targets daiginjo. Check protein and grain size per harvest; because it heads late, harvest timing and field weather swing quality more than with early Gohyakumangoku.","src":[["Niigata Agricultural Research Institute: Koshitanrei","https://www.ari.pref.niigata.jp/nourinsui/seika04/hukyu/01/040101.html"],["Breeding Science note on Koshitanrei (J-STAGE)","https://www.jstage.jst.go.jp/article/jsbbr/8/2/8_55/_pdf"],["NG Life: 10th anniversary of Koshitanrei","https://ng-life.jp/food/4477/"],["Asahi Shuzo magazine: Koshitanrei","https://magazine.asahi-shuzo.co.jp/know/529"]]},{"cat":"sake","name":"Echigo toji (Niigata brewing guild)","ja":"越後杜氏","prefs":[15],"text":"One of Japan's major toji (master brewer) groups, born in Niigata. It originated in the Edo period when farmers idle under heavy snow went to breweries for winter work, and grew after the 1754 'katte-zukuri' deregulation shifted brewing toward winter kan-zukuri. The modern organization was formed in 1958 and sits under a prefectural federation of brewery employees. The Kariwa-gun area is cited as the origin of the guild. Sources divide the sub-schools differently, as three (Mishima, Kariwa, Kubiki) or four with Koshiji and Notsumi added.","flavor":"The Niigata ideal: clean, lean and smooth rather than heavy.","use":"Understanding who runs the kura: many Niigata breweries are traditionally staffed by Echigo toji and kurabito.","craft":"Training now runs through the Niigata Sake School, founded in 1984 in Niigata City for successor development. Figures for membership vary by source and year, so confirm with the federation before quoting numbers.","src":[["Wikipedia: Echigo toji","https://ja.wikipedia.org/wiki/%E8%B6%8A%E5%BE%8C%E6%9D%9C%E6%B0%8F"],["Niigata Bunka Monogatari: Echigo toji and brewing songs","https://n-story.jp/topic/85/"],["Sake Times: the three great toji groups","https://jp.sake-times.com/knowledge/word/toji_sandai"]]},{"cat":"sake","name":"Yukimuro and snow-storage aging (Niigata)","ja":"雪室貯蔵・雪中貯蔵","prefs":[15],"text":"Niigata kura store sake in snow rooms or snow-covered stores, using the stable low temperature of the snowpack. Reported conditions vary: Hakkaisan says its yukimuro holds about 3 degrees C, one Echigo store cites about 2 degrees C and 90 percent humidity, and Takanoi (Ojiya) describes 0 degrees C and 100 percent humidity inside the snow. Tamagawa Shuzo says snow-aging research began in the 1980s and its oldest surviving bottle dates from 1985.","flavor":"Rounded, softened, mellow; sharp edges are said to be reduced.","use":"Aged junmai ginjo and daiginjo, served chilled; limited volumes because the snow rooms are small.","craft":"Hakkaisan brews special sake for its 3-year and 8-year yukimuro releases rather than using its regular products, which signals that base-sake design matters. The claim that snow aging gives mellowness is the makers' description, not a measured result; judge by tasting against the same sake held conventionally.","src":[["Hakkaisan: Yukimuro storage 3 years","https://www.hakkaisan.co.jp/sake/yukimurocyozousyu/"],["Niigata Sake Brewers: Tamagawa Shuzo","https://www.niigata-sake.or.jp/interview/k37.html"],["Echigo Yukikura long snow storage daiginjo","https://www.niigata-sake.net/choukisecchuchozou-daiginjogenshu-echigoyukikura/"],["UX Niigata TV21: Takanoi snow storage","https://www.uxtv.jp/ux-news/%E7%B4%846000l%E3%81%AE%E9%85%92%E3%82%92%E6%81%92%E4%BE%8B%E3%81%AE%E3%80%8E%E9%9B%AA%E4%B8%AD%E8%B2%AF%E8%94%B5%E3%80%8F%E5%B0%8F%E5%8D%83%E8%B0%B7%E5%B8%82%E3%81%AE%E9%85%92%E8%94%B5%E3%81%A7/"]]},{"cat":"sake","name":"Oyamanishiki (Toyama sake rice)","ja":"雄山錦","prefs":[16],"text":"Toyama Prefecture's sake rice, bred at the Toyama Agricultural Technology Center: crossed in 1986 from Hidahomare (mother) and Akita Sake 33 (father), given the local number 'Toyama Sake 45', named Oyamanishiki in October 1998 and adopted as a recommended sake rice in July 1999. Aim was an early-maturing, high-shinpaku rice, since Gohyakumangoku lodges and is hard to polish for ginjo. It matures a few days after Gohyakumangoku, is slightly taller but lodging-resistant and high yielding.","flavor":"Clean and moderately full, with a fine structure at high polish.","use":"Junmai ginjo and daiginjo from Toyama; 100 percent Toyama-grown bottlings are sold as an all-Toyama product.","craft":"Large thousand-grain weight and good shinpaku favor koji growth; absorbs water fast and resists breaking at high polish, so soaking must be watched closely by the second. Registration dates differ across sources (the 1986 cross to 1998 naming and a later registration), so cite the naming year when quoting.","src":[["MAFF research results: Oyamanishiki","https://agresearcher.maff.go.jp/seika/show/214278"],["CiNii: breeding of Oyamanishiki","https://cir.nii.ac.jp/crid/1050001338662945152"],["JA Zen-Noh Toyama: all-Toyama junmai ginjo Oyama","https://www.zennoh.or.jp/ty/topics/2022/92752.html"]]},{"cat":"sake","name":"Toyama sake: Tateyama meltwater and Etchu style","ja":"富山の酒（立山の伏流水）","prefs":[16],"text":"Toyama sake is tied to snowmelt from the Tateyama range and the sub-surface flow of rivers such as the Joganji and Sho. Trade guides say many breweries use soft water from this source and local rice such as Oyamanishiki, Gohyakumangoku and Yamada-nishiki. Style is not uniform: some sources call it tanrei-karakuchi, others mellow and flavorful. Claims of national rankings for named waters come mainly from commercial articles and were not backed by official statistics in the results.","flavor":"Soft water gives a gentle, round texture; character varies by kura from crisp to mellow.","use":"Chosen as a clean, water-led sake for meals; style differs by kura, so taste the specific bottling before pairing.","craft":"Soft water ferments fast and tends to be mild on mineral backbone, so check acidity and ageing potential rather than assuming structure. Treat the water-ranking and rice-share claims as unverified until confirmed with the Toyama brewers' association.","src":[["Hokuriku Umaimono: Toyama sake guide","https://hokuriku-umaimono.com/toyama-sake/"],["Tanoshii Osake: Hokuriku sake guide","https://tanoshiiosake.jp/3705"],["Azumarikishi: Toyama sake ranking","https://azumarikishi.co.jp/media/toyama"]]},{"cat":"sake","name":"Hyakumangoku-no-shiro (Ishikawa sake rice, Ishikawa Sake No. 68)","ja":"百万石乃白","prefs":[17],"text":"Ishikawa's own daiginjo rice, developed by the Ishikawa Agriculture and Forestry Research Center over about 11 years from 2005 at breweries' request for a prefectural rice for daiginjo; the earlier Ishikawa-mon (2009) targeted ginjo, while daiginjo mostly used Yamada-nishiki. Releases began in April 2020. Lineage is described variously: one shop describes a cross of Hitohana and Koshitanrei with Yamada-nishiki, while others only give the code 'Ishikawa Sake 68'.","flavor":"Light yet substantial; low protein gives a clean, smooth mouthfeel.","use":"Daiginjo and junmai ginjo from Ishikawa kura, sold as an Ishikawa-grown daiginjo.","craft":"Sources say it resists cracking at high polish and has a small shinpaku, tolerating polishing past 50 percent. One account also calls the grain small, hard and slow to absorb water, so soaking time and steaming should be set by trial. Maker experience is still accumulating.","src":[["Bon appetit Ishikawa: Hyakumangoku-no-shiro (part 2)","https://ishikawafood.com/report/706/"],["Bon appetit Ishikawa: Hyakumangoku-no-shiro (part 1)","https://ishikawafood.com/report/707/"],["Honno Hitotoki: Ishikawa original sake rice","https://note.com/honno_hitotoki/n/n69fc5c099960"],["Nikkei: Sogen Shuzo junmai ginjo","https://www.nikkei.com/article/DGXMZO61012300R00C20A7LB0000/"]]},{"cat":"sake","name":"Kaga no Kikuzake and Kikuhime yamahai junmai","ja":"加賀の菊酒・菊姫 山廃純米","prefs":[17],"text":"'Kaga no kikuzake' is a late-Muromachi sake from Kaga said in documents to have been sent to Kyoto. Kikuhime (Hakusan) uses Tedori River water from Mt Hakusan, and its name comes from Kukurihime, deity of the Shirayama shrine. Makers' accounts say it sold the first junmai labelled yamahai in 1978 under toji Noguchi Naohiko, with a yamahai ginjo the next year. Its yamahai junmai uses Yamada-nishiki from the Tokku-A zone of Yoshikawa, Miki, at 70 percent polish.","flavor":"Rich, full, strongly rice-driven with firm acidity.","use":"Sipped at room temperature or warmed; suited to strong flavors such as simmered dishes and cured fish.","craft":"Yamahai means skipping the pole-ramming (yamaoroshi) step, which lengthens and complicates acid development; the style needs a seasoned toji. Founding-year and Muromachi claims are from the makers' profiles and not independently confirmed in these results.","src":[["Sakagura Press: Kikuhime","https://www.sakagura-press.com/sake/kikuhime2023/"],["Nihon Meimonshu: Kikuhime","https://www.meimonshu.jp/modules/xfsection/html/gallery2/kura/seishu/kikuhime/outline_kikuhime16.html"],["Sake Times: Kikuhime Sakiippai","https://jp.sake-times.com/knowledge/description/sake_kikuhime"],["NANAME KIKAKU: Ishikawa sake points","https://note.com/nanamekikaku/n/n8e2c0742b9c4"]]},{"cat":"sake","name":"Sakahomare (Fukui daiginjo rice)","ja":"さかほまれ","prefs":[18],"text":"Fukui's new sake rice, developed from 2010 by the prefectural agricultural station together with the Fukui Sake Brewers' Association, aimed at daiginjo; the name carries the wish for 'Japan's best sake'. Reported to be polishable to 35 percent. It is grown under the prefecture's special cultivation certification, with chemical pesticides and fertilizer cut by at least half and organic fertilizer used. Seventeen Fukui kura released daiginjo from it on a single national date, 19 April.","flavor":"Refined sweetness and aroma at high polish.","use":"Daiginjo, usually with prefecture-bred Fukui yeast; the 17-brewery release was sold as a group launch.","craft":"Paired with Fukui yeasts FK-501 (clean), FK-801C and FK-802 (aromatic). Verify the polishing ratio and brown-rice quality per lot since the rice is new and grown under reduced-chemical rules.","src":[["Fukui tourism: Sakahomare","https://www.fuku-e.com/feature/sakahomare-jizake"],["Sake Times: 17 Fukui kura Sakahomare daiginjo","https://jp.sake-times.com/special/press/pp_sakahomare"]]},{"cat":"sake","name":"Kuzuryu rice (Fukui revived sake rice)","ja":"九頭竜（復活米）","prefs":[18],"text":"Kuzuryu is a rare Fukui sake-rice variety revived after about ten years of absence, used by Tanabe Shuzo in its 'Echizen Misaki' revived-rice junmai. At Nibu Shuzo in Echizen, the toji grows Kuzuryu himself and brews it by kimoto in the 'Asukai' line; another maker uses Eiheiji-grown Kuzuryu at 100 percent. The rice name is not the same as the 'Kuzuryu' brand from Kokuryu Shuzo (founded 1804), which is a second label.","flavor":"Not detailed in sources; sold as a restrained junmai style.","use":"Junmai, often kimoto, as a Fukui local-rice story.","craft":"Cultivar characteristics such as aroma and polishing behavior were not found in the results, so evaluate lot by lot. Do not confuse the rice (Kuzuryu) with the Kokuryu brand (Kuzuryu).","src":[["Nibu Shuzo: Asukai","https://www.asukai1716.com/"],["Shukojin: Echizen Misaki revived-rice Kuzuryu","https://shukojin-sakayasan.com/product/%E6%97%A5%E6%9C%AC%E9%85%92%E3%80%80%E8%B6%8A%E5%89%8D%E5%B2%AC%E3%80%80%E6%A7%BD%E6%90%BE%E3%82%8A%E7%B4%94%E7%B1%B3%E3%80%80%E5%BE%A9%E6%B4%BB%E7%B1%B3%E4%B9%9D%E9%A0%AD%E7%AB%9C%E3%80%80%E7%81%AB-2/"],["Sake Time: Kuzuryu (Kokuryu)","https://www.saketime.jp/brands/3678/"]]},{"cat":"sake","name":"Fukui FK yeasts (FK-501, FK-801C, FK-802)","ja":"福井県酵母 FK系","prefs":[18],"text":"Fukui Prefecture has its own FK-series sake yeasts. FK-501 is described as giving a clean, crisp style, while FK-801C and FK-802 are described as giving a showy aroma. Breweries use them with Fukui rice: Obama Shuzo ferments daiginjo with FK-801C at long low temperature, Tanabe Shuzo uses FK801 with Koshi-no-shizuku, and Nibu Shuzo uses FK801 with Sakahomare. Notation (FK-801, FK801, FK-801C) varies by seller, and the results do not say whether they are the same strain.","flavor":"FK-501 clean; FK-801C and FK-802 fragrant.","use":"Choose by target: FK-501 for light food-friendly sake, FK-801C or FK-802 for aromatic ginjo and daiginjo.","craft":"Confirm the exact strain code with the supplier before specifying a recipe, and do not assume FK-801 and FK-801C behave identically.","src":[["PR Times: all-Fukui daiginjo","https://prtimes.jp/main/html/rd/p/000000002.000072505.html"],["Fukui tourism: Sakahomare","https://www.fuku-e.com/feature/sakahomare-jizake"],["Nibu Shuzo: Asukai","https://www.asukai1716.com/"]]},{"cat":"sake","name":"Shichiken (Hakushu, Yamanashi) and Kaikoma meltwater","ja":"七賢（白州・山梨銘醸）","prefs":[19],"text":"Yamanashi Meijo in Hakushu-cho, Hokuto is credited with a founding in 1750 (Kankyo 3), and sits at the foot of Mt Kaikoma, inside the Minami Alps Biosphere Reserve (certified 2014). Its brewing water is Kaikoma sub-surface flow, which the brewery presents as about 85 percent of the product. It says it uses 95 percent or more local rice from contract farms. The flagship is junmai daiginjo 'Kinu no Aji', and it makes a bottle-fermented sparkling 'Shichiken Sparkling'. Hokuto city and the prefecture list Daikan, Shun-o-ten and Shichiken as the South Alps water breweries.","flavor":"Soft, gentle and rounded; the brewery stresses a calm, comfortable drinking character.","use":"Table sake; the sparkling is an aperitif.","craft":"Soft mountain water suits slow, careful fermentation; judge softness, not weight. Figures for water share and local rice are the brewery's own statements.","src":[["Sakagura Press: Shichiken","https://www.sakagura-press.com/sake/yamanashimeizyo2023/"],["Yamanashi Tourism: South Alps meltwater sake","https://www.yamanashi-kankou.jp/special/2020_nihonshu_southalps.html"],["Hokuto City: Mizu no Yama column","https://www.city.hokuto.yamanashi.jp/mizunoyama/columns/003.html"],["NIHONMONO: Yamanashi Meijo","https://nihonmono.jp/article/43006/"]]},{"cat":"sake","name":"Miyamanishiki (Nagano cold-region sake rice)","ja":"美山錦","prefs":[20],"text":"Bred at Nagano's agricultural experiment station by selecting a radiation-induced mutant of Takane-nishiki. By 2022 it was third in national sake-rice production after Yamada-nishiki and Gohyakumangoku. It tolerates cold, so it is grown in cold regions as well as Nagano. Brews are described as modest in aroma, with little off-note and a tanrei style.","flavor":"Light, crisp, clean; restrained aroma.","use":"Junmai, honjozo and ginjo across the cold north; the standard rice for Nagano's clear style.","craft":"A stable, cold-tolerant cultivar, so supply is reliable. Because aroma is modest, yeast choice drives the character in ginjo.","src":[["Wikipedia: Miyamanishiki","https://ja.wikipedia.org/wiki/%E7%BE%8E%E5%B1%B1%E9%8C%A6"],["Sake Street: What is Miyamanishiki","https://sakestreet.com/ja/media/what-is-miyamanishiki"]]},{"cat":"sake","name":"Hitogokochi (Nagano sake rice)","ja":"ひとごこち","prefs":[20],"text":"Nagano-born sake rice, larger than Miyamanishiki and with good shinpaku expression. It is cold tolerant and resists lodging in wind, so it is easy to grow. The sake is described as clean tanrei with some range. The large shinpaku also means it is not well suited to heavy polishing.","flavor":"Crisp, light, with breadth in flavor.","use":"Junmai and junmai ginjo at moderate polish.","craft":"Large shinpaku means a strong koji growth but a risk of breaking when polished hard; match polish ratio to the grain rather than chasing daiginjo numbers.","src":[["theDANN: Hitogokochi","https://contents.thedann.com/entry/%E9%85%92%E7%B1%B3%EF%BC%88%E9%85%92%E9%80%A0%E5%A5%BD%E9%81%A9%E7%B1%B3%EF%BC%89%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6%E5%BE%B9%E5%BA%95%E8%A7%A3%E8%AA%AC/%E3%81%B2%E3%81%A8%E3%81%94%E3%81%93%E3%81%A1"],["Go Nagano: sake rice comparison","https://www.go-nagano.net/theme/id=17857"]]},{"cat":"sake","name":"Kinmon-nishiki (Nagano 'phantom' sake rice)","ja":"金紋錦","prefs":[20],"text":"A cross of Takane-nishiki and Yamada-nishiki, known as a 'phantom rice' in Nagano. Described as having complex umami and aroma, flavor that opens with time and suitability for aging, used in premium junmai daiginjo. One source says it is grown only in Kijimadaira Village, while another says it is now grown in various places in the prefecture.","flavor":"Complex, deep umami with aroma; ages well.","use":"Premium junmai ginjo and daiginjo; candidates for aging.","craft":"Described as difficult to grow and to brew; quantities are small, so lock in supply early.","src":[["Go Nagano: sake rice comparison","https://www.go-nagano.net/theme/id=17857"]]},{"cat":"sake","name":"Nagano's seven approved sake-rice cultivars","ja":"長野県の産地品種銘柄（酒米7品種）","prefs":[20],"text":"Nagano permits the origin-and-cultivar label for seven sake rices: Takane-nishiki, Kinmon-nishiki, Shirakaba-nishiki, Hitogokochi, Miyamanishiki, Yamae-nishiki and Yamada-nishiki. Nagano's brewers' association counted 80 kura as of 19 Aug 2025, second in Japan, while GI Nagano says 78 and a 2018 tax survey says 75, so the count depends on date and source.","flavor":"Range from clean Miyamanishiki to deep Kinmon-nishiki.","use":"Labeling and sourcing: a regional-rice list used to specify provenance on a menu or in purchasing.","craft":"The list is reported secondhand; confirm the current official list with the Nagano brewers' association. Note the rice name 'Shirakaba-nishiki' and 'Yamae-nishiki' are less documented here.","src":[["Go Nagano: sake rice comparison","https://www.go-nagano.net/theme/id=17857"],["Nagano Prefecture: 80 kura, 2nd nationally","https://blog.nagano-ken.jp/nihonichi/processed_food/3245.html"],["GI Nagano: Nagano sake","https://www.gi-nagano.or.jp/info"]]},{"cat":"sake","name":"Alps yeast (Nagano C yeast)","ja":"アルプス酵母（長野C酵母）","prefs":[20],"text":"A yeast developed by the Nagano food industry test station, now called Nagano C yeast. It produces a lot of apple-like aroma, cited as one reason Nagano sake is called fruity. It sits alongside the Kyokai No. 7 yeast, which originated at Miyasaka Brewing in Suwa.","flavor":"Apple-like fruity aroma.","use":"Ginjo and junmai ginjo with a fruity profile.","craft":"Aroma is yeast-driven; watch fermentation temperature to keep it from tipping into solvent notes.","src":[["Sake-5: Nagano sake overview","https://sake-5.jp/15-recommended-japanese-sake-brewed-in-nagano-prefecture/"],["GI Nagano: Nagano sake","https://www.gi-nagano.or.jp/info"]]},{"cat":"sake","name":"Hidahomare (Gifu sake rice)","ja":"ひだほまれ","prefs":[21],"text":"A Gifu original sake rice bred in 1972 at the Gifu Highland Agricultural Experiment Station. Grains are large with a very high shinpaku rate and low protein. It is also the mother of Toyama's Oyamanishiki. Local brewers say balance and ease of drinking are its strengths.","flavor":"Balanced, easy-drinking, with little coarseness.","use":"Junmai ginjo and ginjo-type styles from Hida and Gifu.","craft":"High water absorption and solubility suit junmai ginjo; adjust steeping to avoid over-melting.","src":[["NANAME KIKAKU: Hidahomare","https://note.com/nanamekikaku/n/n875c6a704139"],["theDANN: Hidahomare","https://contents.thedann.com/entry/%E9%85%92%E7%B1%B3%EF%BC%88%E9%85%92%E9%80%A0%E5%A5%BD%E9%81%A9%E7%B1%B3%EF%BC%89%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6%E5%BE%B9%E5%BA%95%E8%A7%A3%E8%AA%AC/%E3%81%B2%E3%81%A0%E3%81%BB%E3%81%BE%E3%82%8C"],["Tenryo Shuzo: Hidahomare junmai ginjo","https://www.tenryou.co.jp/product/56"]]},{"cat":"sake","name":"Gifu G yeast series (G, G2, NFG)","ja":"岐阜県G酵母","prefs":[21],"text":"Gifu's own yeast series. The name is tied to the Gifu brewers' quality-guarantee G mark (GOOD, GOLD, GIFU). A foam-free version called NFG was developed and is used in commercial sake. G2 was designed to raise ethyl caproate to more than three times the base G yeast; sales to 15 Gifu breweries started in fiscal 2018. NFG is restricted to Gifu businesses; in Feb 2026 a Mizunami craft brewery issued the first beer using it.","flavor":"G2 emphasizes fruity ethyl caproate aroma.","use":"Aromatic ginjo and junmai ginjo from Gifu breweries.","craft":"The foam-free strain reduces tank overflow and eases volume management at high filling.","src":[["J-STAGE: Gifu yeast screening","https://www.jstage.jst.go.jp/article/jbrewsocjapan/114/1/114_43/_article/-char/ja"],["Gifu Food Science Institute","https://www.food.rd.pref.gifu.lg.jp/"],["PR Times: NFG yeast craft beer","https://prtimes.jp/main/html/rd/p/000000006.000143305.html"]]},{"cat":"sake","name":"Shizuoka yeast (HD-1 and NEW-5)","ja":"静岡酵母（HD-1・NEW-5）","prefs":[22],"text":"Shizuoka's prefectural yeasts, said to be used by over 80 percent of the prefecture's makers. HD-1 was isolated in 1978 by Kawamura Denbei from day-13 moromi at Kaiun's daiginjo kura; it gives a high ginjo aroma with somewhat higher acidity and is said to have driven Shizuoka's mass awards at the 1986 national new sake appraisal. NEW-5 is a hybrid with HD-1 as a parent: lighter, softer aroma and acidity about 0.2 lower.","flavor":"HD-1: melon-like ginjo aroma and firm acid; NEW-5: lighter, low-acid, clean.","use":"HD-1 for ginjo and daiginjo; NEW-5 for junmai ginjo that pairs well with food.","craft":"Choose NEW-5 when you need lower acidity without losing a soft fragrance; HD-1 when you want a stronger aromatic and acid frame.","src":[["Shizuoka Sake: yeast","http://sakesizuoka.omiki.com/tokuchou/koubo.html"],["Seibutsu Kogaku Kaishi special issue (J-STAGE)","https://www.jstage.jst.go.jp/article/seibutsukogaku/102/10/102_102.10_512/_pdf/-char/ja"],["Kaiun: Shizuoka yeast HD-1","https://ameblo.jp/hd-1kaiun/entry-11033010758.html"],["Shidaizumi: yeast","http://shidaizumi.com/yeast/yeast.htm"]]},{"cat":"sake","name":"Homarefuji (Shizuoka sake rice)","ja":"誉富士","prefs":[22],"text":"Shizuoka's first original sake rice, bred at the Shizuoka Agriculture and Forestry Research Institute by gamma-irradiating Yamada-nishiki seed from 1998 and selecting a mutant. Variety registration was approved in March 2009. Sources differ on the number of seeds or individuals screened (100,000 vs 98,000). It is shorter than Yamada-nishiki and resists lodging, with a larger shinpaku that tolerates high polish.","flavor":"Fruity top aroma, fresh and light.","use":"Junmai ginjo and ginjo; the 'all-Shizuoka' formula pairs it with Shizuoka yeast and local water.","craft":"Easier to grow than Yamada-nishiki; the large shinpaku helps koji growth, but verify polishing yield per lot.","src":[["Shizuoka Sake rice improvement","https://www.shizuoka-sake.jp/toyama/"],["Homarefuji: about the rice","https://homarefuji.com/%E8%AA%89%E5%AF%8C%E5%A3%AB%E3%81%AB%E3%81%A4%E3%81%84%E3%81%A6/"]]},{"cat":"sake","name":"Wakamizu (Aichi sake rice)","ja":"若水","prefs":[23],"text":"Sake rice developed in Aichi, adopted as a recommended variety in 1983 per one source (another says the 1980s). It is described as high in umami, suited to non-cold regions, large grained and easily dissolved in the moromi. It is easy to grow on flat ground with short culms. Compared with Yamada-nishiki it is hard to polish and breaks if polished too far.","flavor":"Umami-rich, full.","use":"Junmai and honjozo with body; not for daiginjo-level polish.","craft":"Cap the polish ratio; dissolves readily so control temperature and koji to avoid heavy, sticky finishes.","src":[["Wakamizu vs Yumeginga","https://xn--u9jwc972kl1tbsr0w2b.com/sakagura/wakamizu_yumeginga"],["Mantenya: Aichi sake rice","https://mantenya.jp/blog/trivia/%E6%97%A5%E6%9C%AC%E9%85%92%E3%82%92%E8%84%85%E3%81%8B%E3%81%99%E3%82%82%E3%81%AE%E2%91%A3-%E6%84%9B%E7%9F%A5%E7%9C%8C%E3%81%AE%E9%85%92%E9%80%A0%E5%A5%BD%E9%81%A9%E7%B1%B3/"]]},{"cat":"sake","name":"Yumeginga (Aichi sake rice)","ja":"夢吟香","prefs":[23],"text":"A cross of Yamada-nishiki and Wakamizu developed by the Aichi Agricultural Research Center. Its shinpaku is smaller than Wakamizu's, so it can be polished higher, and its brewing suitability is rated on par with Yamada-nishiki. It resists leaf-stripe disease and suits flat ground, notably the Chita Peninsula and West Mikawa. Dates conflict: one source says developed in 2010, another says crossed in 2001 and registered in 2012.","flavor":"Fresh with umami.","use":"Junmai ginjo and regional all-Aichi releases.","craft":"Higher polish than Wakamizu is feasible; confirm the heading date for your field.","src":[["Wakamizu vs Yumeginga","https://xn--u9jwc972kl1tbsr0w2b.com/sakagura/wakamizu_yumeginga"],["Kinshachi: Yumeginga","https://www.kinshachi.co.jp/%E5%A4%A2%E5%90%9F%E9%A6%99"],["Handa: Chita sake with Yumeginga","https://handa-cp.co.jp/%E3%81%8A%E9%85%92%E3%82%82%E5%9C%B0%E7%94%A3%E5%9C%B0%E6%B6%88%E3%80%82%E6%84%9B%E7%9F%A5%E3%81%AE%E9%85%92%E9%80%A0%E5%A5%BD%E9%81%A9%E7%B1%B3%E3%80%8C%E5%A4%A2%E5%90%9F%E9%A6%99%E3%80%8D%E3%82%92/"]]},{"cat":"sake","name":"Kami-no-ho (Mie sake rice)","ja":"神の穂","prefs":[24],"text":"A Mie original sake rice, developed in 2007 and registered in 2010 at the request of breweries. A toji describes its character as 'clean aroma and swelling flavor'. It takes up water slowly, which makes brewing difficult. It is commonly paired with Mie's MK yeasts, and used in junmai ginjo and daiginjo.","flavor":"Clean aroma with a rounded, expanding taste.","use":"Junmai ginjo and daiginjo from Mie kura.","craft":"Slow water absorption demands precise soaking and steaming; judge by feel and weight.","src":[["Ienomi: Kami-no-ho","https://column.ienomi-life.com/exploration/post-218/"],["Bungo no Bonjovi: Mie MK yeast and Kami-no-ho","https://bungo-no-bonjovi.com/mie/"],["Sipory: Mie sake guide","https://www.sipory.jp/blog/mie-sake-guide"]]},{"cat":"sake","name":"Ise-nishiki (Mie heritage sake rice)","ja":"伊勢錦","prefs":[24],"text":"A landrace-type rice found in Taki, Mie, called one of Japan's oldest sake-rice lines and linked to Yamada-nishiki's ancestry. It lapsed for a time. It is now grown at only about 15 t a year. An older Mie University-linked description says sake from it is lighter and more refreshing than from Yamada-nishiki, but this comes from an old website.","flavor":"Light, refreshing.","use":"Rare junmai ginjo releases.","craft":"Very small volume means high cost and little buffer; secure contracts early.","src":[["Komekko: Ise-nishiki 722","https://komekko.blogspot.com/2021/03/722.html"],["Sipory: Mie sake guide","https://www.sipory.jp/blog/mie-sake-guide"],["Saku Ise-nishiki junmai ginjo","https://www.jizake.com/c/sake/zaku/ns030027c00"]]},{"cat":"sake","name":"Mie MK yeasts (MK1, MK3, MK5, MK7)","ja":"三重県酵母（MK酵母）","prefs":[24],"text":"Yeasts developed by the Mie Prefecture Industrial Research Institute and distributed to makers. The institute describes MK1 as suited to junmai and ginjo with low acid; MK3 as ginjo-type with strong ethyl caproate; MK5 as junmai-type rich in succinic acid. In a comparison study MK1 gave more isoamyl acetate than Kyokai yeasts and MK3 higher alcohol and aroma. MK7 was designed for a high-acid, wine-like sake.","flavor":"MK1 mild; MK3 apple-fruity; MK5 full; MK7 sharply acidic.","use":"Select by target profile; MK3 with Kami-no-ho is a common junmai daiginjo pairing.","craft":"Read the supplier sheet for the strain's acid and ester profile and dial fermentation temperature accordingly.","src":[["Mie Prefecture: yeast distribution","https://www.pref.mie.lg.jp/kougi/hp/78883032951.htm"],["Mie30: Mie yeast and craft","https://www.mie30.jp/feature/6442"],["Comparison of components of Mie yeast sake","https://jglobal.jst.go.jp/detail?JGLOBAL_ID=202002227112681885"]]},{"cat":"sake","name":"Shiga Watarifune No. 6","ja":"滋賀渡船6号","prefs":[25],"text":"A heritage sake rice from Shiga, said to have been bred in 1916 at the Shiga Agricultural Experiment Station by pure-line selection from the older Watarifune. A blog notes that No. 6 was the easier to grow of the Watarifune lines, so seed remained at the station. Culm-length records disagree between Hyogo and Fukui trials, and relation to the 'short-culm Watarifune' (father of Yamada-nishiki) is debated. Makers describe rich rice umami and sweetness; it is lodging-prone and hard to grow.","flavor":"Rich umami and sweetness, rounded.","use":"Yamahai and junmai bottled as heritage-rice sake.","craft":"Lodging risk means yield and rice quality swing by year; the yamahai pairing is common.","src":[["Komekko: Shiga Watarifune 2 and 6","https://komekko.blogspot.com/2020/02/26.html"],["Shiga sake lover: Watarifune 6","http://ahiru-ie.way-nifty.com/s2/2006/10/6_80ff.html"],["Komekko: Tanga Watarifune","https://komekko.blogspot.com/2019/07/90.html"]]},{"cat":"sake","name":"Ginfubuki (Shiga sake rice)","ja":"吟吹雪","prefs":[25],"text":"A Shiga sake rice with Yamada-nishiki as mother and Tamasakae as father, developed mainly to improve Yamada-nishiki's tall, lodging-prone growth. It is used in Maibara for the local 'Hananoibuki' with Ibuki mountain water, described as mellow with a crisp finish.","flavor":"Mellow rice umami with a crisp finish.","use":"Junmai ginjo and local-ingredient releases.","craft":"Easier to grow than Yamada-nishiki; judge culm height and lodging.","src":[["Sake Concierge: Ginfubuki","https://sakeconcierge.com/gin-fubuki-genealogy-of-sake-rice/"],["Maibara: Ginfubuki","https://furusato-maibara.com/2024/02/24/1740/"]]},{"cat":"sake","name":"Omi sake: lakeside breweries of Shiga","ja":"近江の酒（滋賀）","prefs":[25],"text":"Shiga's brewing grew along the Tokaido and Nakasendo crossroads and the Lake Biwa water routes, with Omi merchants carrying trade east. Notable old houses include Tomita Shuzo (1534, called the fifth oldest sake company), Fujii Honke (1831), Kita Shuzo (1820) and Uehara Shuzo (1862). Tomita uses Okuibuki sub-surface water, Kitajima Shuzo uses Suzuka range water. Dates vary by page.","flavor":"Varies by kura; soft mountain water supports gentle, rounded sake.","use":"Regional pairing with lake fish such as funa-zushi.","craft":"Check each house's water source and rice; a single 'Omi style' does not exist.","src":[["Sake World: Shiga breweries","https://sakeworld.jp/special/2411-shiga-sake/"],["Discover Japan: Tomita Shuzo","https://discoverjapan-web.com/article/86017"],["Made in Local: Shiga sake","https://madeinlocal.jp/area/shiga/knowledge/035"]]},{"cat":"sake","name":"Iwai (Kyoto original sake rice)","ja":"祝（京都の酒米）","prefs":[26],"text":"Kyoto's own sake rice, born in 1933 at the Tango branch of the Kyoto Prefectural Agricultural Experiment Station and grown on over 600 ha by 1936. It faded in postwar food-increase policy (JA says it stopped in 1973 because tall straw did not suit machine harvest). The Fushimi Sake Brewers' Association revived it from 1992 (Heisei 4) with farmers, and it was certified as a Kyoto brand product in fiscal 2012. Only Kyoto breweries use it.","flavor":"Fine-grained, soft and full.","use":"Ginjo and daiginjo; Saito Shuzo makes a junmai daiginjo polished to 35 percent.","craft":"Tall plants and low yield limit supply; confirm cultivar supply and polish target.","src":[["Fushimi Sake Brewers: Iwai","https://www.fushimi.or.jp/guide/iwai.html"],["JA Kyoto: Iwai and Kyo no Sake","https://ja-kyoto.jp/kyoyasai/kyonosake.html"],["Usui: Kyoto sake rice Iwai","https://www.s-usui.jp/kyoto_sakemai/iwai.html"]]},{"cat":"sake","name":"Kyoto yeasts (Kyo no Koto, Hana, Saki, Haku, Koi)","ja":"京都酵母","prefs":[26],"text":"Five yeasts developed by the Kyoto Municipal Institute of Industrial Technology and Culture, which has developed, managed and distributed sake yeast since the 1950s-60s. Distribution is limited to Kyoto breweries. Kyo no Saki is rich in malic acid with muscat aroma; Kyo no Haku makes extra succinic acid for warmed (kan) sake; Kyo no Koi (distributed since 2020, parent Kyo no Koto) gives a fruity, sweet-sour profile.","flavor":"Saki: muscat and crisp; Haku: umami for warmed sake; Koi: fruity.","use":"Specify Haku for jo-kan service; Saki and Koi for chilled sake.","craft":"Properties of Kyo no Koto and Kyo no Hana were not found in the results; check with the institute.","src":[["Kyoto Yeast information","https://tc-kyoto.or.jp/top-kyotokobo/know-kyotokobo/"],["Sake World: Kyoto yeast lab visit","https://sakeworld.jp/special/20240409-kyoto-koubo/"],["Sake Times: Kyoto yeast sake set","https://jp.sake-times.com/special/press/p_kyoto-yeast_sake-selection"]]},{"cat":"sake","name":"Ikeda-zake and the Hokusetsu breweries (Osaka)","ja":"池田酒と北摂の蔵","prefs":[27],"text":"Ikeda and Itami sake were shipped in quantity to Edo in the early Edo period, ahead of Nada and Fushimi. One source says Ikeda had 33 breweries at its mid-Edo peak. Today Osaka's association lists about 12 kura across Hokusetsu (Nose, Ikeda, Takatsuki, Ibaraki), Kawachi and Senshu; examples are Kure-haru, Kotobuki-sakazuki, Kuninocho, Naniwa Masamune and Sen no Rikyu. Founding years conflict (Kure-haru 1701 vs 1751).","flavor":"Varies by kura.","use":"Context for sourcing Osaka sake.","craft":"Use association pages for current kura lists.","src":[["Sipory: Osaka sake guide","https://sipory.jp/blog/osaka-sake-guide"],["Osaka Sake Brewers: kura list","http://osaka-sake.com/kura.php"],["Sake Time: Osaka ranking","https://www.saketime.jp/ranking/osaka/"]]},{"cat":"sake","name":"Akishika (Nose, Osaka) own-field yamahai","ja":"秋鹿（能勢）自営田山廃","prefs":[27],"text":"Akishika Shuzo in Nose is said to have been founded in 1886 and brews only junmai. Its own rice fields grew from 3 a to 13 ha, farmed pesticide-free in a circular system reusing rice bran, hulls and sake lees. It sells yamahai junmai from its own-field Yamada-nishiki, including a 70 percent polish fire-treated bottling and a draw-straight namagenshu.","flavor":"Fresh with a soft lactic acidity and concentrated rice flavor; green apple on the unpasteurized version.","use":"Food sake; the shop pages recommend it with meals.","craft":"Estate rice, yamahai acid and a junmai-only policy are the identifiers. Specs come from retail pages and vary.","src":[["Sipory: Osaka sake guide","https://sipory.jp/blog/osaka-sake-guide"],["Noseden: Akishika Shuzo","https://noseden.hankyu.co.jp/guide/spot/bu9si67bpb/"],["Todoroki Saketen: Akishika yamahai","https://shop.todoroki-saketen.com/shopdetail/000000006457/"],["Nobori: Akishika own-field series","https://www.nobori-sake.com/shouhin/zenkoku_nihonsyu/akisikasyuzou/jiei.html"]]},{"cat":"sake","name":"Yamada-nishiki (Hyogo, king of sake rice)","ja":"山田錦","prefs":[28],"text":"Born in 1936 at the Hyogo Prefectural Agricultural Experiment Station from a cross of Yamada-ho (also written Yamada-no-tane in some sources) and Tanga-watarifune. February 2026 marked its 90th anniversary. Miki city is cited as the country's top producer, with production concentrated in North Harima and the Hanshin area.","flavor":"Full, elegant, fine aromatic structure.","use":"Daiginjo, junmai daiginjo and top-grade sake across Japan.","craft":"Tall, lodging-prone; quality depends on zone, so ask for district.","src":[["Hyogo Prefecture: Hyogo sake rice","https://web.pref.hyogo.lg.jp/nk12/af11_000000025.html"],["Yamada-nishiki 90th anniversary","https://yamada-nishiki.jp/yamadanishiki_90th/"],["JA Zen-Noh Hyogo: 80th anniversary","https://www.hg.zennoh.or.jp/agriculture/kome-mugi/pdf/80th_anniversary.pdf"],["Furusato Choice: Miki Yamada-nishiki","https://www.furusato-tax.jp/feature/detail/28215/12661"]]},{"cat":"sake","name":"Tokku-A district Yamada-nishiki (Yokawa, Tojo, Yashiro)","ja":"特A地区の山田錦","prefs":[28],"text":"The top-grade Yamada-nishiki zone lies north of the Rokko range, in Miki and Kato. Sources vary on the exact list: some name Yokawa, Tojo and Yashiro as 'Tokku-A a', others Yokawa, Kuchi-Yokawa, Tojo and eastern Yashiro. Yokawa is said to be the origin of the village-rice system with Nada kura. Large day-night temperature differences and clay soil are cited, giving large, plump grain with good shinpaku.","flavor":"Large, plump grain; full-bodied sake.","use":"Premium sake-rice specification.","craft":"Zone boundaries vary by source; verify against the JA grading sheet.","src":[["Tojo Yamada-nishiki Promotion Society","https://www.tojo-yamadanishiki.com/index.php?aid=posts&mid=yamadanishiki"],["Nagomi Field: Yokawa-cho","https://www.nagomi-field.com/info/yokawa-cho.html"],["Noraya: Tokku-A history","https://www.noraya-gorilla.com/about-area/"]]},{"cat":"sake","name":"Hyogo-Kitanishiki (Hyogo sake rice)","ja":"兵庫北錦","prefs":[28],"text":"A Hyogo sake rice from Nadahikari and Gohyakumangoku (parental roles not specified in the source), suited to Tajima and Tamba. The prefecture says it has large grain, good shinpaku and high brewing suitability, and strong lodging resistance.","flavor":"Not described in the source.","use":"Junmai and ginjo from northern Hyogo.","craft":"Strong lodging resistance suits the cooler north.","src":[["Hyogo Prefecture: Hyogo sake rice","https://web.pref.hyogo.lg.jp/nk12/af11_000000025.html"]]},{"cat":"sake","name":"Hyogo-Yumenishiki (Hyogo sake rice)","ja":"兵庫夢錦","prefs":[28],"text":"A Hyogo sake rice from the F2 of Kikuei x Yamada-nishiki and Hyogo line 23, targeted for West Harima. The prefecture states it has large grain, good shinpaku and high brewing suitability.","flavor":"Not described in the source.","use":"Junmai and ginjo from West Harima.","craft":"Little published data, so confirm lot specs.","src":[["Hyogo Prefecture: Hyogo sake rice","https://web.pref.hyogo.lg.jp/nk12/af11_000000025.html"]]},{"cat":"sake","name":"Tamba toji (Hyogo guild)","ja":"丹波杜氏","prefs":[28,27],"text":"A brewing guild from the Tamba-Sasayama basin, Hyogo. The oldest record, per Sasayama city, is Shoemon of Hioki who served as toji for Yamatoya Honten in the Ikeda district, brewing 'Yamajirushi' and 'Taki no Mizu'. Origin dates vary among 1705, 1755 and 1775. Peak registration is cited as 5,000 people. After the mid-Edo period Tamba toji also worked in Ikeda, Itami, Nada and Imazu.","flavor":"Associated with Nada's firm style.","use":"Context for who has staffed Nada and Ikeda kura.","craft":"Toji organizations are cooperatives handling employment and succession.","src":[["Sasayama City: Toji monogatari","https://www.city.tambasasayama.lg.jp/photo_history/2/rekishi/13287.html"],["Nada: Tamba toji","http://www.nada-ken.com/main/jp/index_ta/482.html"],["Wikipedia: Toji kumiai","https://ja.wikipedia.org/wiki/%E6%9D%9C%E6%B0%8F%E7%B5%84%E5%90%88"]]},{"cat":"sake","name":"Tajima toji (northern Hyogo guild)","ja":"但馬杜氏","prefs":[28],"text":"One of Japan's four great toji groups from Mikata-gun (Kami and Shinonsen) in snowy northern Hyogo. Its predecessor, the Mikata-gun Brewing Association, was founded 1 Oct 1911. Toji enter the kura after harvest in October and live in until March, six to seven months. It was 240 toji in 1989; in 2025 the prayer ceremony covered 29 toji and 52 kurabito, and a 2024 report counted 53 members working in 2 urban prefectures and 10 prefectures.","flavor":"Known for adapting to every method.","use":"Context for northern Hyogo and out-of-region kura staffing.","craft":"'One kura, one toji': each toji's style differs. Membership figures vary by year.","src":[["Tajima Toji","https://tajimatoji.com/tajimatoji/"],["Nippon News: Tajima toji prayer","https://www.nnn.co.jp/articles/-/617223"],["Buntaro: Tajima toji","https://www.buntaro.co.jp/p/00005"],["The Tajima: Tajima toji","https://the-tajima.com/spot/377/"]]},{"cat":"sake","name":"Itami morohaku (Itami clear sake)","ja":"伊丹諸白","prefs":[28],"text":"Itami in Hyogo claims to be the birthplace of seishu on the strength of a Konoike shrine stele recording that in 1600 (Keicho 5) Yamanaka Shinroku Yukimoto first brewed clear sake; the lineage with Yamanaka Shikanosuke is tradition. 'Morohaku' means polished rice for both koji and kake-mai. Itami's chushaku shochu addition is cited as an origin of alcohol addition. The Nara temple origin of clear sake is acknowledged. Itami morohaku and Nada kiippon was recognized as Japan Heritage in 2020.","flavor":"Historic: clear, high-class sake.","use":"Historical context for Edo kudari-zake.","craft":"Dates and lineage rest on a stele and local tradition.","src":[["Japan Heritage: Itami morohaku and Nada kiippon","https://japan-heritage.bunka.go.jp/ja/stories/story097/"],["Itami and Nada-go-go story","https://itami-nadagogo.com/ja/story"],["Hyogo Sake: history","https://hyogo-sake.or.jp/history.html"]]},{"cat":"sake","name":"Bodaimoto (Shoryakuji, Nara)","ja":"菩提酛","prefs":[29],"text":"Called Japan's oldest sake starter, recorded in the Muromachi 'Goshu no Nikki' as Bodaisen, from Bodaisenji (Shoryakuji) in Nara. A lactic-acid soaking water (soyashi-mizu) is made first, then steamed rice and koji are added. Today the soyashi-mizu uses lactic acid bacteria found in the temple's rock-spring water. The research group formed in 1986 per Wikipedia (1996 per another site); bacterial discovery dates 1998 vs 1999. The starter is made in January at the Bodaimoto Seishu Festival.","flavor":"Distinct lactic acidity.","use":"Sake from member Nara kura.","craft":"The soyashi-mizu step distinguishes it from kimoto; follow temperature records rigorously.","src":[["Bodaimoto Kenkyukai","https://bodaimoto.org/kenkyukai/"],["Nara Prefecture: Shoryakuji","https://www.pref.nara.jp/miryoku/ikasu-nara/seishu/shoryakuji/"],["Nara City Tourism: Nara shrines and sake","https://narashikanko.or.jp/feature/narari33-feature01"],["Wikipedia: Bodaisen","https://ja.wikipedia.org/wiki/%E8%8F%A9%E6%8F%90%E6%B3%89"]]},{"cat":"sake","name":"Nanto morohaku (Nara temple sake)","ja":"南都諸白","prefs":[29],"text":"Sake brewed in Nara's temples (soboshu) from the Muromachi period, especially at Bodaisenji (Shoryakuji). In the Azuchi-Momoyama period morohaku methods with polished rice emerged as Nanto morohaku. The Tamon-in Nikki (1478-1618) mentions Shoryakuji brewing, multi-step addition, morohaku and pasteurization. After clerical power was suppressed, the technology spread to other brewers and toji.","flavor":"Historic.","use":"Historical context.","craft":"Dating depends on historical documents.","src":[["Nara City: Nanto morohaku history","https://www.city.nara.lg.jp/site/bunkazai/5690.html"],["Wikipedia: Nanto morohaku","https://ja.wikipedia.org/wiki/%E5%8D%97%E9%83%BD%E8%AB%B8%E7%99%BD"],["Nara Prefecture: Nara tradition","https://www.pref.nara.jp/35818.htm"]]},{"cat":"sake","name":"Wakayama: Heiwa Shuzo (Kid) and Nate Shuzo (Kuroushi)","ja":"和歌山の蔵（平和酒造・名手酒造店）","prefs":[30],"text":"Heiwa Shuzo (Kainan) was founded in 1928 and named in memory of regaining its permit to brew after the war; its 'Kid' brand dates from 2007 and a profile says the brewers average in their 30s and Kid won gold at the IWC. Nate Shuzo (Kainan) makes 'Kuroushi' using filtered well water; one profile says over 95 percent of shipments are junmai ginjo.","flavor":"Kid: modern and fruity; Kuroushi: mellow with depth.","use":"Wakayama sake with fresh and contemporary styles.","craft":"Claims are from tourism and lifestyle media; confirm specs with kura.","src":[["Tanoshii Osake: Kid","https://tanoshiiosake.jp/6170"],["Rokaru Wakayama: eight sake","https://rokaru.jp/matome/168131/"],["Azumarikishi: Wakayama sake","https://azumarikishi.co.jp/media/wakayama"]]},{"cat":"glossary","name":"Kimoto (kimoto-zukuri, traditional starter)","ja":"生酛","prefs":[],"text":"Traditional sake starter method relying on natural lactic acid bacteria, including the pole-ramming step (yamaoroshi) in which steamed rice and koji are ground. The lactic acid created suppresses bad microbes. It is slower than sokujo and generally yields fuller, richer sake.","flavor":"Rich, deep, savory.","use":"Specification for rich sake suited to warming.","craft":"Duration quoted as about 20 days to a month in various sources; note differences across sources.","src":[["Sawanotsuru: kimoto","https://www.sawanotsuru.co.jp/site/nihonshu-columm/knowledge/method-of-kimoto/"],["Anchorman: kimoto yamahai sokujo","https://anchorman-inc.tokyo/kimoto-yamahai-sokujo"],["Sake Suggest: kimoto yamahai","https://sake-suggest.com/guide/kimoto-yamahai"]]},{"cat":"glossary","name":"Yamahai (yamahai-moto)","ja":"山廃酛","prefs":[],"text":"Starter derived from kimoto by abolishing the yamaoroshi pole-ramming step (the name abbreviates yamaoroshi haishi). One source dates its development to 1909 (Meiji 42). Lactic acid is still cultured naturally rather than added. Reported time is about 3-4 weeks.","flavor":"Rich, tangy lactic acid.","use":"Wide-bodied sake.","craft":"Dates and durations vary across sources.","src":[["Sakesen: kimoto yamahai sokujo","https://www.sakesen.com/blog/making-raw-sardines/"],["Anchorman: kimoto yamahai sokujo","https://anchorman-inc.tokyo/kimoto-yamahai-sokujo"],["Rairaku: starter terms","https://rairaku.jp/recommend/sake-brewing/word1/"]]},{"cat":"glossary","name":"Sokujo-moto (quick starter)","ja":"速醸酛","prefs":[],"text":"Starter made by adding brewing lactic acid, developed in 1910 (Meiji 43) at the National Brewing Research Institute. It is the current mainstream; one source says about nine-tenths of sake is made this way. It takes about 10 days to two weeks, resulting in a
