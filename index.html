ng to MAFF."}],"notes":"Saitama styles itself the 'udon republic' (Kazo, Kumagaya and Kawahaba are among the named types). Soka senbei is covered by the Agency for Cultural Affairs '100-year food' scheme. Sayama tea, nuka-zuke and any protected-name rules for Fukaya negi did not appear with usable detail in the sources consulted, so no claims are made for them.","src":[["MAFF Uchi no kyodo ryori: Saitama","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/area/saitama.html"],["MAFF: hiyajiru / suttate, Saitama","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/33_3_saitama.html"],["Premium Outlets: Fukaya local food","https://www.premiumoutlets.co.jp/column/fukayahanazono/462"],["Choco-tabi Saitama: udon republic","https://chocotabi-saitama.jp/special/saitamaudon/"]]},{"pref":12,"history":"Chiba's best-documented dishes come from two worlds: the fishing coast of the Boso peninsula (namerou, sangayaki) and farm-household festival food (futomaki matsuri-zushi, peanut miso). Peanuts reached Yachimata around Meiji 29 and became its speciality by early Taisho; by 1949 they covered about 80% of Yachimata's cultivated land, according to the city.","character":"The coastal logic is raw fish minced with miso and aromatics, as in namerou, and then baked or steamed as sangayaki. One account gives miso rather than soy sauce because soy spills on a boat. Inland, preserved and festival food dominates: peanuts, peanut miso, and futomaki sushi whose cross-section forms a picture. Segro iwashi (sesame-pickled sardine) and kujira no tare are listed with it by MAFF.","staples":[{"name":"Namerou","ja":"なめろう","note":"Fresh fish chopped with miso and aromatics; said to originate with Boso fishermen on boats."},{"name":"Sangayaki","ja":"さんが焼き","note":"Namerou shaped and baked or steamed, said to come from taking namerou to mountain work; the name is explained as 'mountain house' in one theory."},{"name":"Futomaki matsuri-zushi","ja":"太巻き祭りずし","note":"Thick sushi roll with a pictorial cut face; origin accounts conflict (zuiki core c.1800, or late Edo); MAFF cites Sanmu, Isumi and Kisarazu areas."},{"name":"Segro iwashi no goma-zuke","ja":"せぐろいわしのごま漬け","note":"Sesame-pickled sardine; selected with futomaki in the MAFF 100 rural dishes list."},{"name":"Kujira no tare","ja":"くじらのたれ","note":"Whale dish listed on MAFF's Chiba page; no process detail was found in the sources consulted."},{"name":"Rakkasei (peanut)","ja":"落花生","note":"Chiba is the top producer; Yachimata adopted peanuts around Meiji 29."},{"name":"Chiba Handachi","ja":"千葉半立","note":"The most widely grown peanut cultivar in Chiba, a late-maturing type."},{"name":"Rakkasei miso","ja":"落花生味噌","note":"Peanut miso, a preserved food regularly kept in peanut-growing households."}],"calendar":[{"season":"Spring","text":"The sources consulted give no month-level data for Chiba; futomaki matsuri-zushi is festival and household-occasion food rather than tied to a stated month."},{"season":"Summer","text":"No summer data were found. Namerou is a fresh-fish dish whose seasonality follows the catch, and the sources consulted do not give a species calendar."},{"season":"Autumn","text":"No autumn data were found in the sources consulted, and peanut harvest months were not stated in the results; peanut miso is the preserved product made from the crop."},{"season":"Winter","text":"The consulted sources give no winter-specific data. Peanut miso is described as a preservation food, so it serves as the household standby when other food is scarce."}],"markets":[{"name":"Yachimata city","ja":"八街市","note":"Peanut-growing city; the city runs a peanut history page."},{"name":"Sanmu, Isumi and Kisarazu","ja":"山武市・いすみ市・木更津市","note":"Areas MAFF names as home to the futomaki matsuri-zushi tradition."},{"name":"Boso coastal fishing ports","ja":"房総の漁港","note":"Source of the fish used for namerou and sangayaki; no named market appeared in results."}],"notes":"Futomaki matsuri-zushi and segro iwashi no goma-zuke were both chosen in MAFF's 2007 '100 rural and fishing village dishes'. Origin dates for futomaki conflict between sources, so cite the date range rather than one year. Soy sauce (Noda, Choshi) is central to Chiba but did not surface in these searches; see the shoyu category instead of this page.","src":[["MAFF Uchi no kyodo ryori: Chiba","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/area/chiba.html"],["Chiba tourism: namerou","https://maruchiba.jp/gourmet/feature/detail_454.html"],["Yachimata city: peanut history","https://www.city.yachimata.lg.jp/site/peanuts/1137.html"],["Wikipedia: futomaki matsuri-zushi","https://ja.wikipedia.org/wiki/%E5%A4%AA%E5%B7%BB%E3%81%8D%E7%A5%AD%E3%82%8A%E5%AF%BF%E5%8F%B8"]]},{"pref":13,"history":"MAFF's Tokyo page and other sources centre on Edo-mae, meaning dishes from Tokyo Bay ingredients, and on fishermen's food such as Fukagawa-meshi, which began in Fukagawa (Koto ward) as a crew meal. Daimyo travelling under the sankin-kotai system brought seeds of regional vegetables to Edo, where they were selected into the Edo Tokyo vegetables now kept as fixed varieties.","character":"Tokyo food in these sources comes from the bay and the nearby farms. Fukagawa-meshi is negi and raw asari simmered in miso and poured over rice. Edo Tokyo vegetables are fixed-seed (kotei-shu) varieties handed down from the Edo period, 52 varieties as of October 2024. Daikon was grown for pickling, e.g. Nerima daikon for takuan, and bettara-zuke is a listed Edo pickle.","staples":[{"name":"Fukagawa-meshi","ja":"深川めし","note":"Negi and raw asari simmered in miso over rice, from Fukagawa fishermen's meals; revived in 1981 by the former owner of the restaurant Fukagawa-juku."},{"name":"Edo-mae","ja":"江戸前","note":"Cooking from Tokyo Bay catch; Fukagawa-meshi, sushi and dojo nabe are given as examples."},{"name":"Dojo nabe","ja":"どぜう鍋","note":"Loach pot, given as an Edo-mae example in a travel-agency guide."},{"name":"Kusaya","ja":"くさや","note":"Fermented dried fish of the Izu Islands; production said to date from the Edo period."},{"name":"Komatsuna","ja":"小松菜","note":"Named after Komatsugawa village by the legend of shogun Yoshimune; today's market komatsuna is mostly hybrid, distinct from traditional varieties."},{"name":"Nerima daikon","ja":"練馬大根","note":"Daikon from the Nerima area since the Edo period, used for takuan."},{"name":"Kameido daikon","ja":"亀戸大根","note":"Grown around Kameido Katori shrine from about 1860-64 to early Showa."},{"name":"Bettara-zuke","ja":"べったら漬け","note":"Edo-period pickle listed by MAFF on its Tokyo page."},{"name":"Edo Tokyo vegetables","ja":"江戸東京野菜","note":"JA Tokyo Chuokai designation for fixed-seed varieties from the Edo period; 52 varieties as of October 2024."}],"calendar":[{"season":"Spring","text":"The sources consulted give no month-level data for Tokyo; the Edo Tokyo vegetables come in many varieties, but their individual seasons were not listed in the results."},{"season":"Summer","text":"No summer-specific data were found in the sources consulted; Izu Island kusaya is a year-round dried product, described as a speciality dating from the Edo period."},{"season":"Autumn","text":"Autumn data were not stated in the sources consulted. Daikon grown for pickling, such as Nerima, feeds the pickle trade including takuan."},{"season":"Winter","text":"Bettara-zuke is the Edo pickle MAFF lists for Tokyo; the sources consulted give no sale date or season for it, and none is asserted here."}],"markets":[{"name":"Fukagawa district, Koto ward","ja":"深川（江東区）","note":"Home of Fukagawa-meshi, which began as a fishermen's meal in Fukagawa, Koto ward."},{"name":"Nerima","ja":"練馬","note":"Daikon-growing area for Nerima daikon."},{"name":"Komatsugawa, Edogawa ward","ja":"小松川（江戸川区）","note":"Village linked by tradition to the name komatsuna."}],"notes":"The claim that Fukagawa-meshi is one of Japan's 'five great meshi' by a 1939 Imperial Household selection could not be verified, as sources disagree. The Yoshimune komatsuna story is tradition. Tsukiji and Toyosu markets, soba and sushi history did not appear in the results, so are not covered here; consult the sushi and soy sauce categories.","src":[["MAFF Uchi no kyodo ryori: Tokyo","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/area/tokyo.html"],["MAFF: Fukagawa-meshi","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/34_1_tokyo.html"],["Go Tokyo: Fukagawa-meshi","https://www.gourmet.gotokyo.org/jp/article/106.html"],["Wikipedia: Edo Tokyo vegetables","https://ja.wikipedia.org/wiki/%E6%B1%9F%E6%88%B8%E9%87%8E%E8%8F%9C"]]},{"pref":14,"history":"Kanagawa spans the Miura peninsula fishing and vegetable zone, Sagami Bay, Odawara and Kamakura. Misaki was among Japan's top tuna landing ports in early Showa. Odawara already made kamaboko in the Muromachi period, with volume in the late Edo period, and its reputation spread as daimyo on sankin-kotai stayed at Odawara and Hakone. Kenchin-jiru is traced to Kenchoji in Kamakura.","character":"Sea products and vegetables from the Miura peninsula and the temple cooking of Kamakura define it. The Kenchoji tradition fries vegetables in oil before simmering. Misaki fishermen cooked unsold tuna heads by hanging them in a boat chimney; MAFF's oven version bakes them 3 to 4 hours on low heat. Miura is a major daikon area, with daikon dried along the coast for takuan in winter.","staples":[{"name":"Kenchin-jiru","ja":"けんちん汁","note":"Vegetables fried in oil then simmered; origin debated between Chinese 'kenchan' and Kenchoji's 'Kencho-jiru', credited to Rankei Doryu."},{"name":"Maguro no kabuto-yaki","ja":"マグロのかぶと焼き","note":"Misaki dish: tuna head slow-roasted, said to come from fishermen steaming unsold heads on boat chimneys."},{"name":"Odawara kamaboko","ja":"小田原かまぼこ","note":"Made since the Muromachi period; large-scale production from the late Edo period."},{"name":"Nama-shirasu don","ja":"生しらす丼","note":"Raw shirasu over rice, linked to Sagami Bay and Shonan landings at Kamakura and Enoshima."},{"name":"Miura daikon","ja":"三浦大根","note":"Miura peninsula daikon growing is over 100 years old; winter-dried on the shore for takuan."},{"name":"Oyama tofu dishes","ja":"大山の豆腐料理","note":"Listed by MAFF among Kanagawa traditional foods."},{"name":"Kanko-yaki","ja":"かんこ焼き","note":"Tsukui (Sagamihara) dish: filling wrapped in a flour skin, baked then steamed."},{"name":"Herahera dango","ja":"へらへら団子","note":"Listed by MAFF among Kanagawa traditional foods; no technical detail found."},{"name":"Warihoshi daikon harihari-zuke","ja":"割り干し大根のはりはり漬け","note":"Split dried daikon pickled; listed by MAFF."}],"calendar":[{"season":"Spring","text":"The sources consulted give no month-level data for Kanagawa; shirasu landings at Sagami Bay and Shonan are documented but without a season calendar in the results."},{"season":"Summer","text":"No summer-specific data appeared in the sources consulted. Misaki tuna and Odawara kamaboko are year-round products and the results give no seasonal limits."},{"season":"Autumn","text":"Daikon from the Miura peninsula is the crop behind the winter takuan trade; autumn growing is implied by the winter drying, but the results do not state months."},{"season":"Winter","text":"Winter is when daikon for takuan is hung to dry along the Miura coast, a sight MAFF calls a seasonal feature; sources consulted give no other winter data."}],"markets":[{"name":"Misaki","ja":"三崎","note":"Tuna port in Miura city, a top-ranking landing site in early Showa."},{"name":"Odawara","ja":"小田原","note":"Kamaboko town, reputation spread by travelling daimyo."},{"name":"Kamakura and Enoshima","ja":"鎌倉・江の島","note":"Known for shirasu from Sagami Bay and for Kenchoji's kenchin-jiru."}],"notes":"Kenchin-jiru is also eaten in Iwate, Oita and Ibaraki with different ingredients, so state the Kamakura version explicitly. The Kenchoji legend that the first abbot reused dropped tofu is a temple anecdote. Sanma-men, aji himono and a specific Miura daikon brand rule were not confirmed in the results.","src":[["MAFF regional stories: Kanagawa","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/area_stories/kanagawa.html"],["MAFF: Odawara kamaboko","https://www.maff.go.jp/j/syokuiku/kodomo_navi/cuisine/cuisine2_7.html"],["MAFF: tuna kabuto-yaki, Kanagawa","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/35_13_kanagawa.html"],["MAFF: kenchin-jiru, Kanagawa","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/35_1_kanagawa.html"]]},{"pref":15,"history":"Niigata's documented dishes are tied to snow country and the Sea of Japan: hegi soba of the Uonuma region, a textile-weaving area, sasa-dango from a preservation tradition, and Murakami's salmon. The Uonuma district is also the Koshihikari heartland. Niigata sake is the product of heavy snow, clear water and the Echigo toji guild, which originated there.","character":"Flavour logic is mild and preserved. Hegi soba binds buckwheat with fu-nori seaweed, giving a smooth, springy noodle served in a hegi, a shallow tray of thin shaved wood. Noppe is a mildly seasoned taro-based simmered soup; the sliminess of the taro is essential. Murakami cures salmon as shiobiki and as koji-fermented iizushi. Sake is tanrei-karakuchi, made from Gohyakumangoku and snowmelt water.","staples":[{"name":"Hegi soba","ja":"へぎそば","note":"Uonuma soba bound with fu-nori seaweed, served on a hegi tray; credited to the area's weaving culture and eaten since the Edo period."},{"name":"Noppe","ja":"のっぺ","note":"Taro-based mild simmered soup for festivals and New Year; ingredients vary, in the north including salmon and ikura."},{"name":"Sasa-dango","ja":"笹団子","note":"Yomogi dumpling with sweet bean filling wrapped in bamboo leaf; origin variously a warring-states ration or a preserved dumpling of leftover rice."},{"name":"Tochio aburaage","ja":"栃尾の油揚げ","note":"Large fried tofu of Tochio, Nagaoka, about 20 cm long."},{"name":"Shiobiki salmon","ja":"塩引き鮭","note":"Murakami salted salmon; grilled, including skin, and served as ochazuke."},{"name":"Murakami iizushi","ja":"村上の飯ずし","note":"Salmon and kazunoko fermented with koji, a preserved dish of Murakami."},{"name":"Uonuma Koshihikari","ja":"魚沼コシヒカリ","note":"Rice from the snowy Uonuma district, which is described as the core Koshihikari area."},{"name":"Niigata sake","ja":"新潟の日本酒","note":"Tanrei-karakuchi style; 89 breweries (first nationally) in one source, over 90 in another, 85 in an older one; third in output."},{"name":"Gohyakumangoku","ja":"五百万石","note":"Sake rice named as typical of the clean, dry Niigata style."}],"calendar":[{"season":"Spring","text":"The sources consulted give no month-level data for Niigata. Noppe is a New Year and gathering dish rather than a spring one, and produce seasons were not covered."},{"season":"Summer","text":"No summer-specific data appeared in the results, and hegi soba was not tied to a season there. Uonuma is the Koshihikari area, but harvest months were not stated."},{"season":"Autumn","text":"The results give no autumn data directly. Salmon is the product Murakami cures as shiobiki and iizushi, but months were not stated in the sources consulted."},{"season":"Winter","text":"Winter is the snow-country season behind kan-zukuri sake brewing in Uonuma, where breweries use cold-season brewing and groundwater, and noppe is cooked mainly at New Year."}],"markets":[{"name":"Murakami","ja":"村上","note":"Salmon town with a shop founded about 200 years ago selling shiobiki and recipes."},{"name":"Tochio, Nagaoka","ja":"栃尾（長岡市）","note":"Home of the oversized aburaage."},{"name":"Uonuma district","ja":"魚沼","note":"Koshihikari and hegi soba area, with old breweries including Shirataki (1855) and Tamagawa (1673)."},{"name":"Nagaoka brewery district","ja":"長岡の酒蔵","note":"16 breweries, the most of any city in the prefecture; 35 in the Chuetsu region."}],"notes":"Brewery counts differ by source and year (85, 89, 'over 90'), so cite the date. Hegi soba is covered by the Agency for Cultural Affairs '100-year food' scheme. Koshihikari acreage, the Koshihikari rule set and Echigo cedar details were not in the results and are not stated here. MAFF's child-oriented page treats hegi soba as the product of weaving and soba culture together.","src":[["MAFF: hegi soba, Niigata","https://www.maff.go.jp/j/syokuiku/kodomo_navi/cuisine/cuisine3_1.html"],["Niigata Tourism: noppe","https://niigata-kankou.or.jp/feature/noope/"],["Mapple: Niigata local food","https://www.mapple.net/article/77036/"],["How to Niigata: Niigata breweries","https://howtoniigata.jp/spot/nihonshu/40210/"]]},{"pref":16,"history":"MAFF's Toyama page ties the cuisine to a steep profile from the Tateyama range to Toyama Bay, with Goto (east) and Gosei (west) differing in culture. Toyama Bay is called a natural fish tank for buri, shiroebi and hotaruika. The Kitamae-bune trade carried Hokkaido kombu to Toyama ports, making Toyama a heavy kombu consumer, and fresh bay fish met that kombu in kobu-jime.","character":"Two supply lines meet: the fresh bay catch and Kitamae-bune kombu. Kobu-jime sandwiches fish between kombu, which absorbs surface moisture and extends shelf life in the era before refrigeration. Shiroebi is eaten as sashimi, kobu-jime, in sumashi, tempura and kara-age; hotaruika as su-miso or okizuke. Himi uses buri whole, including kama, and buri shabu is popular. Masu-zushi shops each guard pressing and rice cooking.","staples":[{"name":"Himi kan-buri","ja":"氷見の寒ブリ","note":"Winter yellowtail of Himi; eaten as sashimi, shioyaki of kama and cuts, and buri shabu; Himi's buri food culture is in the 100-year food scheme."},{"name":"Buri shabu","ja":"ぶりしゃぶ","note":"Thin-sliced buri swished in hot broth; popular outside the prefecture."},{"name":"Shiroebi","ja":"白えび","note":"Toyama Bay shrimp; sashimi, kobu-jime, sumashi, tempura or kara-age."},{"name":"Hotaruika","ja":"ホタルイカ","note":"Eaten raw as sashimi, boiled with su-miso, or as okizuke."},{"name":"Kobu-jime","ja":"昆布〆","note":"Fish layered between kombu; formed in the Edo period from Kitamae-bune kombu and bay fish."},{"name":"Kobu-maki","ja":"昆布巻き","note":"Kombu roll; spread inland from the ports of Higashi-Iwase, Fushiki and Mizuhashi."},{"name":"Tororo kombu","ja":"とろろ昆布","note":"Shaved kombu sold daily in Toyama shops and kept at home."},{"name":"Masu-zushi","ja":"ます寿し","note":"Pressed masu sushi; each shop's rice cooking, seasoning and pressing method is a craft secret."}],"calendar":[{"season":"Spring","text":"Hotaruika is eaten raw, boiled with su-miso or as okizuke; the sources consulted do not state its season, so the month is not asserted here."},{"season":"Summer","text":"The sources consulted give no summer-specific data for Toyama. Tororo kombu is sold daily in the prefecture's shops, so kombu use is not tied to a season."},{"season":"Autumn","text":"No autumn-specific data were found. Shiroebi, served as sashimi, kobu-jime, sumashi, tempura and kara-age, has no season given in the sources consulted."},{"season":"Winter","text":"Himi's kan-buri (winter yellowtail) is the headline winter product, eaten as sashimi, grilled kama and cuts, and buri shabu; the Agency for Cultural Affairs lists Himi's buri food culture."}],"markets":[{"name":"Himi","ja":"氷見","note":"Port famous for winter buri and its whole-fish eating culture."},{"name":"Higashi-Iwase, Fushiki and Mizuhashi","ja":"東岩瀬・伏木・水橋","note":"Kitamae-bune ports through which kombu entered Toyama and spread."},{"name":"Rausu link","ja":"羅臼","note":"Kombu-producing town in Hokkaido; one account says about 70% of its population has Toyama ties."}],"notes":"The Rausu 70% figure is one account and should be hedged. Meiji-era Toyama migrants pioneering kombu fishing at Rausu and sending kombu home is reported by one source. Baika-gohan did not get support in the results and is omitted. Masu-zushi rules are per-shop craft, not a statutory standard, in the sources consulted.","src":[["MAFF Nippon traditional foods: Toyama","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/area/toyama.html"],["MAFF: kobu-jime","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kobu_zime.html"],["MAFF: kobu-maki","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/kobu_maki.html"],["Agency for Cultural Affairs: 100-year food, Toyama","https://www.bunka.go.jp/seisaku/shokubunka/foodculture/hyakunenfood/jirei/list_toyama.html"]]},{"pref":17,"history":"Kanazawa developed as the castle town of the Kaga domain, and MAFF's regional account ties the city's warrior-class cuisine to dishes such as jibuni. Jibuni is described as a samurai dish eaten since at least the Edo period, with no settled origin. Kaburazushi uses yellowtail that was a prized fish presented to the domain lord, and in the Edo period it was a hospitality dish among both Kaga warrior and commoner households, exchanged as a gift at the turn of the year.","character":"Jibuni: duck (or other meat) dusted with flour and simmered with sudare-fu (a Kaga speciality wheat-gluten product) and seasonal vegetables; the meat and fu go into a bowl over boiled greens, the simmering liquid is poured over and wasabi is added. Kaburazushi is a narezushi-type ferment that uses no rice: salted turnip sandwiches salted yellowtail, fermented with koji. Daikonzushi is the companion ferment: migaki-nishin (dried herring) with daikon, rice and koji.","staples":[{"name":"Jibuni","ja":"治部煮","note":"Flour-dusted duck simmered with sudare-fu and seasonal vegetables, served with wasabi; name origin disputed (a person said to have brought it to Kaga, or the simmering sound)."},{"name":"Kaburazushi","ja":"かぶら寿し","note":"Salted turnip sandwiching salted yellowtail, koji-fermented without rice; a New Year and gift dish; built on Kanazawa blue turnip and wild yellowtail in winter."},{"name":"Daikonzushi","ja":"大根ずし","note":"Migaki-nishin and daikon pickled with rice and koji; paired with kaburazushi as the two principal Kaga fermented foods."},{"name":"Kano-gani (male snow crab)","ja":"加能ガニ","note":"Male snow crab of Ishikawa; season opens 6 November and runs to 20 March in the 2026-27 season per guides."},{"name":"Kobako-gani (female snow crab)","ja":"香箱ガニ","note":"Female snow crab with a much shorter season (to 29 December in the 2026 season per local guides), shortened for resource protection."},{"name":"Sudare-fu","ja":"すだれ麩","note":"Kaga speciality wheat-gluten sheet used in jibuni."},{"name":"Kanazawa oden","ja":"金沢おでん","note":"Listed among Ishikawa's popular dishes in a Tabelog roundup; no technical detail was retrieved."}],"calendar":[{"season":"Spring","text":"Male kano-gani remain in season until 20 March (2026-27 season). No spring-specific produce was retrieved in the sources reviewed; jibuni, once a winter dish, is now eaten year-round."},{"season":"Summer","text":"No summer-specific data were found in the sources reviewed. Jibuni is described as made year-round today by combining ingredients of the moment, rather than being a winter-only dish."},{"season":"Autumn","text":"Crab season opens 6 November (2026): kano-gani (male) and kobako-gani (female) go on sale. Omicho Market holds a crab-nabe event on 14 November 2026 at the Omicho Ichiba-kan plaza."},{"season":"Winter","text":"Peak of crab: kobako-gani until 29 December, kano-gani to 20 March. Kaburazushi, made from winter turnip and yellowtail, is a New Year dish and gift; jibuni was originally a winter dish."}],"markets":[{"name":"Omicho Market","ja":"近江町市場","note":"Kanazawa's central market; holds crab-season opening sales and crab soup or crab-nabe events each November."},{"name":"Kanaishi-machi, Kanazawa","ja":"金石町","note":"Fishing district where one theory says local fishermen first ate kaburazushi as a New Year dish."}],"notes":"Jibuni and kaburazushi were chosen for MAFF's list of 100 rural local dishes (announced December 2007). Origin stories are theories, not fact: jibuni is linked to a provisions magistrate or to the 'jibu-jibu' simmering sound; kaburazushi to Kanaishi fishermen or to a hot-spring inn serving a Maeda lord. Crab season dates are fixed annually (opening 6 November), and the female season ends well before the male season, so check the year's announced dates.","src":[["MAFF: Ishikawa regional foods","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/area_stories/ishikawa.html"],["MAFF: Jibuni (Ishikawa)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/jibuni_ishikawa.html"],["MAFF: Kaburazushi (Ishikawa)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kaburazushi_ishikawa.html"],["Kanazawa tourism: Omicho crab-nabe event 2026","https://www.kanazawa-kankoukyoukai.or.jp/event/detail_50471.html"]]},{"pref":18,"history":"The Reinan (Wakasa) side of Fukui was once given the title Miketsukuni, a land permitted to present food to the emperor and court, which underlies Wakasa's fish-processing culture. Wakasa heshiko is said to have been made since around the mid-Edo period, and kodai no sasazuke is said to have begun as a way to deal with an overabundance of small sea bream. In the north (Reihoku), tradition says a senior retainer of the Fukui domain encouraged farmers to grow buckwheat in the Edo period.","character":"Two halves. Wakasa: preserved fish, namely gutted mackerel salted and then packed in rice bran (heshiko) and small sea bream cured in salt and vinegar, layered with bamboo-grass leaves in a cedar barrel (sasazuke). Reihoku and Echizen: oroshi soba, where grated daikon is built into the dashi-based tsuyu rather than served only as a condiment, with noodles using strong (bread) flour as binder, topped with katsuobushi and negi. Winter is dominated by snow crab.","staples":[{"name":"Echizen-gani","ja":"越前がに","note":"Male snow crab landed at Fukui ports; season 6 November to 20 March; identified by a yellow origin tag."},{"name":"Seiko-gani","ja":"せいこがに","note":"Female snow crab; season 6 November to 31 December."},{"name":"Mizu-gani","ja":"水がに","note":"Newly moulted male snow crab, fished 19 February to 20 March."},{"name":"Echizen oroshi soba","ja":"越前おろしそば","note":"Soba with a daikon-oroshi dashi tsuyu, katsuobushi and negi; eaten across the prefecture, mainly in Reihoku."},{"name":"Saba no heshiko","ja":"さばのへしこ","note":"Gutted mackerel salted then rice-bran cured for long keeping; made in Wakasa since roughly the mid-Edo period."},{"name":"Kodai no sasazuke","ja":"小鯛のささ漬け","note":"Small Wakasa sea bream cured in salt and vinegar, bamboo-grass leaf on top, in a cedar barrel; a gift and souvenir item."},{"name":"Wakasa beef","ja":"若狭牛","note":"Local beef named among Fukui city-guide gourmet items; no technical detail retrieved."},{"name":"Sauce katsudon","ja":"ソースカツ丼","note":"Local katsudon dressed in sauce, named among Fukui's street-style dishes in city guides."}],"calendar":[{"season":"Spring","text":"Mizu-gani (freshly moulted male crab) is fished 19 February to 20 March, and the male Echizen-gani season closes on 20 March."},{"season":"Summer","text":"No summer-specific harvest was found in the sources reviewed. Heshiko, sasazuke and oroshi soba are described without seasonal limits, so they are not tied to a stated season here."},{"season":"Autumn","text":"Crab season opens 6 November at 00:00: boats leave the evening of the 5th, nets go in at midnight, first landing about noon, first auction in the afternoon; general retail sales begin 7 November."},{"season":"Winter","text":"Male Echizen-gani are in season through 20 March and seiko-gani until 31 December. Oroshi soba is eaten as New Year's Eve soba and at the close of weddings and Buddhist memorial meals."}],"markets":[{"name":"Echizen-cho and its fishing port","ja":"越前町(越前漁港)","note":"Presented as the home of Echizen-gani; site of the first landing and first auction on opening day."},{"name":"Echizen Crab Museum","ja":"越前がにミュージアム","note":"Crab museum named in guides to the Echizen-gani area alongside port-direct inns; no further detail retrieved."}],"notes":"Echizen-gani is described as the first crab registered under Japan's GI (geographical indication) system. The yellow tag marks Fukui origin; sources say it was first attached in Echizen-cho in 1997 and extended to seiko-gani in 2007, but these dates come from commercial sites. Oroshi soba was among the 100 rural dishes selected in 2007; the story that it spread after the Showa Emperor ate two bowls in 1947 is an anecdote. Season dates are announced yearly.","src":[["MAFF: Oroshi soba (Fukui)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/oroshi_soba_fukui.html"],["MAFF: Heshiko (Fukui)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/heshiko_fukui.html"],["Fukui tourism: Echizen-gani opening 6 November","https://www.fuku-e.com/topics/detail_3496.html"],["MAFF: Fukui regional foods","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/area_stories/fukui.html"]]},{"pref":19,"history":"Mountainous Yamanashi has little rice land and developed a flour-eating (funshoku) culture. The origin of hoto is disputed: one theory derives it from Chinese 'hakutaku' noodles, another holds that Takeda Shingen used it as field rations; one commentary site gives 1815 for its first appearance in writing, and the prefecture says it appears mostly from the Edo period on. Yoshida udon's origin is also given two ways: early Meiji for silk-weaving buyers (one site), or early Showa when men took over cooking so women silk-reelers could keep working (MAFF).","character":"Hoto: wide flat wheat noodles cut and dropped straight into the pot with no salt added or resting, simmered in miso broth with kabocha, taro and carrot; unlike udon, which is salted and rested for chew. Yoshida udon is notable for an exceptionally firm chew and strong texture. In orchards, Katsunuma's grape season runs from late July (Delaware) to November (Koshu).","staples":[{"name":"Hoto","ja":"ほうとう","note":"Flat unsalted wheat noodles simmered with vegetables in miso soup; kabocha version is the classic; eaten across the prefecture."},{"name":"Yoshida no udon","ja":"吉田のうどん","note":"Hand-cut udon of Fujiyoshida with exceptional firmness and chew."},{"name":"Tori-motsu-ni","ja":"鳥もつ煮","note":"Chicken offal simmered dish created around 1950 by a Kofu soba shop that thought discarded offal a waste."},{"name":"Nigai (simmered shellfish)","ja":"煮貝","note":"Named with hoto and tori-motsu-ni as a distinctive Kofu food; the sources give no detail on ingredients or method."},{"name":"Koshu grape","ja":"甲州ぶどう","note":"Late variety at Katsunuma, harvested into October-November; the source of Koshu wine."},{"name":"Delaware","ja":"デラウェア","note":"Described by Koshu city as Japan's most-produced grape; Katsunuma picking starts in late July."},{"name":"Kyoho","ja":"巨峰","note":"Harvested from mid-August to mid-September per Koshu city."},{"name":"Katsunuma wine","ja":"勝沼ワイン","note":"Wine from Koshu grapes in Katsunuma; Maruki Winery is presented by the prefecture as Japan's oldest existing winery."}],"calendar":[{"season":"Spring","text":"No spring-specific data were found in the sources reviewed. Hoto and Yoshida udon are not tied to a particular season in the sources used here."},{"season":"Summer","text":"Katsunuma grape harvest starts in late July with Delaware; Kyoho follows from mid-August to mid-September, so summer is the start of the orchard and grape-picking season."},{"season":"Autumn","text":"Koshu, the last grape, is picked up to mid-October at one farm and into November at others; one farm finishes all harvest by early November."},{"season":"Winter","text":"Fresh-grape harvest is finished by early November, so winter-specific produce was not retrieved; hoto, a miso-based noodle stew, is recorded without a stated season."}],"markets":[{"name":"Katsunuma grape district","ja":"勝沼ぶどう郷","note":"Orchards in Koshu city with direct sales, grape picking and wineries."},{"name":"Fujiyoshida udon shops","ja":"富士吉田","note":"Home area of Yoshida udon."}],"notes":"Hoto was chosen for MAFF's 100 rural dishes in 2007. Sources disagree on Yoshida udon's origin (early Meiji vs early Showa) and the Shingen story is legend, so avoid stating either as fact. Hoto is not a type of udon: the skipped salt and rest are the defining difference. Katsunuma picking dates vary by farm and year.","src":[["MAFF: Hoto (Yamanashi)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/houtou_yama_nashi.html"],["MAFF: Yoshida udon","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/yosidano_udon.html"],["Agency for Cultural Affairs: 100-Year Food, Yamanashi","https://www.bunka.go.jp/seisaku/shokubunka/foodculture/hyakunenfood/jirei/list_yamanashi.html"],["Koshu city: grapes","https://www.city.koshu.yamanashi.jp/iju/54things/articles/no-113.html"]]},{"pref":20,"history":"Nagano has many upland areas unsuited to rice, so soba and wheat flour foods grew up. Oyaki is said to have originated in the Nishiyama area of Kamiminochi, and Jomon-era traces of baked millet flour have been found at a site in Ogawa village. Nozawana-zuke is traced to 1756, when the priest of Kenmeiji in Nozawa Onsen brought back a Tennoji turnip from Kyoto. Gohei-mochi from the Kiso and Ina area was already eaten in the mid-Edo period.","character":"Flour and grain cooking for cold uplands. Oyaki: dough of wheat or buckwheat flour with water or hot water, rolled thin around seasonal vegetables or sweet bean paste and baked, traditionally at the hearth. Gohei-mochi: half-pounded rice on a skewer, grilled with a sauce. Nozawana-zuke: a winter preserve; the pickle can be desalted and seasoned with Shinshu miso as a cooked dish, or tempura. Togakushi (training food) and Zenkoji gate-town soba are the best-known soba traditions.","staples":[{"name":"Shinshu soba","ja":"信州そば","note":"Buckwheat noodles; Nagano city's tradition includes Togakushi training-food and Zenkoji gate-town soba."},{"name":"Oyaki","ja":"おやき","note":"Dough of wheat or buckwheat flour wrapped around vegetables, wild greens, kabocha, mushrooms, walnuts or sweet beans, then baked."},{"name":"Gohei-mochi","ja":"五平餅","note":"Half-pounded uruchi rice on a skewer, grilled with sauce; Kiso and Ina area; similar dishes exist in Gifu, Toyama, Aichi and Shizuoka hills."},{"name":"Nozawana-zuke","ja":"野沢菜漬け","note":"Pickled nozawana leaf-vegetable, a winter preserve from Nozawa Onsen village."},{"name":"Nozawana cooked with Shinshu miso","ja":"野沢菜の味噌炒め","note":"Desalted pickle seasoned with Shinshu miso as a cooked dish."},{"name":"Nozawana tempura","ja":"野沢菜天ぷら","note":"Nozawana used as a tempura material."},{"name":"Togakushi soba","ja":"戸隠そば","note":"Hand-cut soba linked to the area's training-food tradition (Agency for Cultural Affairs 100-Year Food)."},{"name":"Zenkoji gate-town soba","ja":"善光寺門前そば","note":"Soba culture of the area around Zenkoji in Nagano city."}],"calendar":[{"season":"Spring","text":"Oyaki fillings follow the seasonal produce; spring fillings include wild mountain vegetables (sansai), as listed in sources among the possible fillings."},{"season":"Summer","text":"Oyaki fillings in summer can include eggplant and other garden vegetables; MAFF notes that the fillings are whatever is in season."},{"season":"Autumn","text":"Autumn oyaki fillings include mushrooms and walnuts; the sources do not give soba harvest dates."},{"season":"Winter","text":"Cold winters and vegetable shortage are the reason nozawana-zuke was made as a preserve; the pickle is made in the cold season."}],"markets":[{"name":"Zenkoji gate town, Nagano city","ja":"善光寺門前","note":"Soba shops around Zenkoji Temple."},{"name":"Togakushi","ja":"戸隠","note":"Soba area linked to the shrine's training-food tradition."},{"name":"Nozawa Onsen village","ja":"野沢温泉村","note":"Origin of nozawana and Kenmeiji temple."}],"notes":"Nagano is divided into four regions (Hokushin, Toshin, Chushin, Nanshin) with distinct food cultures, so a single 'Shinshu' style should not be assumed. Gohei-mochi shape and sauce vary by area, and its etymology is unsettled. Most of the detail here comes from MAFF and the Agency for Cultural Affairs; tourism and gourmet sites were used only for general context.","src":[["MAFF: Oyaki (Nagano)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/oyaki_nagano.html"],["MAFF: Gohei-mochi (Nagano)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/gohei_mochi_nagano.html"],["MAFF: Nozawana-zuke","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/menu/nozawana_zuke.html"],["Agency for Cultural Affairs: 100-Year Food, Nagano","https://www.bunka.go.jp/seisaku/shokubunka/foodculture/hyakunenfood/jirei/list_nagano.html"]]},{"pref":21,"history":"In Hida, where forestry was a major industry, hoba miso is said to have begun with mountain workers using a hoba (magnolia) leaf as a plate to grill miso. Hoba-zushi in southern Hida and Chuno was a portable food for mountain and field work, as hoba leaf has antibacterial properties; in Higashi-shirakawa village it was served at rice-planting lunches in cooperative (yui) work, and is mentioned by Yanagita Kunio, so it predates 1909. Keichan dates to about 1950, said to imitate Jingisukan.","character":"The magnolia leaf is both vessel and seasoning: hoba miso is homemade koji miso set on a leaf and grilled; hoba-zushi is vinegared rice wrapped in the leaf. Keichan is a chicken dish of Gujo, Gero and southern Takayama, with its name explained either from 'tonchan' (pork offal grilling) or from 'keijan' (chicken sauce). Pickles and vegetables are sold at Takayama's morning markets.","staples":[{"name":"Hoba miso","ja":"朴葉味噌","note":"Homemade koji miso grilled on a hoba leaf; Hida-Takayama; sold as a souvenir since the 1960s-70s."},{"name":"Hoba-zushi","ja":"朴葉ずし","note":"Sushi wrapped in hoba leaf; southern Hida to the Chuno area; field and forest portable food."},{"name":"Keichan","ja":"鶏ちゃん","note":"Chicken dish of Gujo, Gero and southern Takayama dated to about 1950; name theories disputed."},{"name":"Gohei-mochi (Gifu style)","ja":"五平餅","note":"Skewered half-pounded rice grilled with sauce, eaten in Gifu's mountain areas and at Takayama's morning market."},{"name":"Hida beef","ja":"飛騨牛","note":"Local beef sold as skewers and nigiri sushi at Takayama's morning market."},{"name":"Kuri kinton","ja":"栗きんとん","note":"Chestnut confection handled by confectioners in Ena."},{"name":"Hida negi","ja":"飛騨ねぎ","note":"Autumn Takayama market produce."},{"name":"Tsukemono (pickles)","ja":"漬物","note":"Sold with tasting at Takayama morning markets."}],"calendar":[{"season":"Spring","text":"Spring at the Miyagawa morning market brings wild mountain vegetables such as taranome, koshiabura and udo."},{"season":"Summer","text":"Summer at the Miyagawa morning market is dominated by summer vegetables from local farms."},{"season":"Autumn","text":"Autumn offers new rice, apples, Hida negi and Chinese cabbage at Takayama's morning markets, per travel sites."},{"season":"Winter","text":"Winter markets are quiet and snowy; the Miyagawa market opens 8:00-12:00 from January to March, versus 7:00-12:00 from April to December."}],"markets":[{"name":"Miyagawa Morning Market","ja":"宮川朝市","note":"Held daily along the east bank of the Miyagawa river, between Kajibashi and Yayoibashi, in Takayama."},{"name":"Ena confectioners","ja":"恵那","note":"Shops handling chestnut kinton."}],"notes":"MAFF stresses that recipes vary by region and household. Hoba-zushi was recorded in writing by Yanagita Kunio before 1909. Ayu (sweetfish) and chestnut kinton were searched but origins were not documented. The Takayama morning market is described as one of Japan's three great morning markets by travel media; hours differ by season.","src":[["MAFF: Hoba miso (Gifu)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/38_10_gifu.html"],["MAFF: Hoba-zushi (Gifu)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/38_1_gifu.html"],["MAFF: Keichan (Gifu)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/38_2_gifu.html"],["Gifu tourism: Miyagawa morning market","https://www.kankou-gifu.jp/spot/detail_1241.html"]]},{"pref":22,"history":"Sakura-ebi fishing began in the 27th year of Meiji (1894) when shrimp entered an aji tow-net by chance. Shizuoka tea is said to have begun in 1244 when Shoichi Kokushi planted seed from Song China at Ashikubo; Hamana Lake area is said to be the birthplace of Japanese eel farming; wasabi cultivation is dated to the Keicho era. Shizuoka oden developed in central Shizuoka from the Taisho era around the local fish-paste (black hanpen) industry.","character":"Suruga Bay seafood eaten raw or lightly processed. Okiagari is fresh sakura-ebi simmered sukiyaki-style with tofu and negi, a fishermen's pot. Nama-shirasu don: rice, shredded nori, wakegi and raw shirasu, with wasabi and soy sauce. Shizuoka oden uses black hanpen and dark broth, spread after the war using beef sinew and pork offal, finished with aonori, dashi powder and karashi. Wasabi-zuke is chopped wasabi leaf, stem and root in sake lees.","staples":[{"name":"Sakura-ebi","ja":"桜えび","note":"Caught in Japan only in Suruga Bay; landed only at Yui and Oigawa; two seasons yearly."},{"name":"Okiagari","ja":"沖あがり","note":"Raw sakura-ebi simmered with tofu and negi sukiyaki-style; a fishermen's reflection pot."},{"name":"Nama-shirasu don","ja":"生しらす丼","note":"Raw shirasu over rice with nori, wakegi and wasabi, dressed with soy sauce."},{"name":"Shirasu (kamaage, dried)","ja":"しらす","note":"Mainly anchovy fry taken by boat seine from late March to mid-January."},{"name":"Shizuoka oden","ja":"静岡おでん","note":"Black hanpen, beef sinew and offal; aonori, dashi powder and karashi."},{"name":"Wasabi-zuke","ja":"わさび漬け","note":"Wasabi leaf, stem and root in sake lees."},{"name":"Chakurae-ebi","ja":"茶くらえび","note":"Fried new-tea leaf and sakura-ebi; trademarked."},{"name":"Hamanako eel","ja":"浜名湖うなぎ","note":"Farmed eel from the Hamana Lake area to the Oigawa mouth."},{"name":"Suruga Bay deep-sea fish","ja":"駿河湾の深海魚","note":"Trawled akakasago, megisu and ginmedai served in seafood restaurants."}],"calendar":[{"season":"Spring","text":"Sakura-ebi spring season runs mid-March to early June; boat-seine shirasu fishing begins in late March."},{"season":"Summer","text":"Sakura-ebi fishing is closed between the two seasons, as only two seasons a year are fished for protection; shirasu fishing continues."},{"season":"Autumn","text":"Autumn sakura-ebi season opens late October; return bonito (modori-gatsuo) at Omaezaki and Yaizu is promoted for its autumn fat."},{"season":"Winter","text":"Sakura-ebi fishing runs to late December and shirasu fishing until mid-January. First-flush tea timing was not found in the sources."}],"markets":[{"name":"Shimizu fish market","ja":"清水魚市場","note":"Shimizu Port; a tourism listing says half the tuna consumed in Japan is landed there."},{"name":"Yaizu Port","ja":"焼津港","note":"Described as number one in Japan for bonito landings; honkarebushi factories."},{"name":"Yui and Oigawa ports","ja":"由比港・大井川港","note":"The only two ports permitted to land sakura-ebi."}],"notes":"Traditional tea and wasabi cultivation methods are recognised as a World Agricultural Heritage (GIAHS) system. Sakura-ebi are landed only at Yui and Oigawa, with fishing in two seasons for resource protection. Chakurae-ebi is a registered trademark. Shirasu is eaten raw only when very fresh; freshness is the quality criterion.","src":[["MAFF: Okiagari (Shizuoka)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/36_13_shizuoka.html"],["Shizuoka pref.: Shirasu","https://www.pref.shizuoka.jp/sangyoshigoto/nogyo/gakkotaiiku/1027666.html"],["MAFF: Shizuoka oden","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/36_16_shizuoka.html"],["MAFF: Nama-shirasu don","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/36_23_shizuoka.html"]]},{"pref":23,"history":"Aichi is the home of mame-miso (soybean miso). MAFF says Hatcho miso originates in Hatcho village, eight cho (about 870 m) from Okazaki Castle, in what is now Hatcho-cho of Okazaki. Miso-nikomi udon was a home dish and began to be sold in restaurants in Ichinomiya in the early Meiji period; theories include that Takeda Shingen's hoto passed to the Tokugawa and became a miso-based udon, and an Ichinomiya origin, with nothing settled.","character":"Mame-miso is the core flavour. Hatcho miso as registered: miso balls the size of a fist, wooden barrels, cone-shaped stacked stones, natural fermentation; the Hatcho Miso Cooperative states it ages 2+ years (two summers, two winters), while the register's minimum is shorter, so check the register. Miso-nikomi udon simmers udon directly in a strong miso broth. Hitsumabushi is chopped grilled eel over rice, finished with dashi.","staples":[{"name":"Hatcho miso","ja":"八丁味噌","note":"GI-registered mame-miso (No. 49, 15 December 2017); wooden-barrel, stone-weighted, natural fermentation."},{"name":"Miso-nikomi udon","ja":"味噌煮込みうどん","note":"Udon simmered in a miso broth; first sold in restaurants in Ichinomiya in early Meiji."},{"name":"Hitsumabushi","ja":"ひつまぶし","note":"Chopped grilled eel on rice, finished with dashi."},{"name":"Nimiso","ja":"煮味噌","note":"Listed in MAFF's Aichi dishes; no detail retrieved."},{"name":"Miso-oden","ja":"味噌おでん","note":"Listed in MAFF's Aichi dishes; no detail retrieved."},{"name":"Ogura toast","ja":"小倉トースト","note":"Promoted by Aichi tourism as an example of combining foods into new tastes."}],"calendar":[{"season":"Spring","text":"No spring-specific data were found for Aichi in the sources reviewed, which covered miso-based dishes and Hatcho miso."},{"season":"Summer","text":"No summer-specific data were found. Hatcho miso is not a seasonal product; its ageing is counted in summers and winters."},{"season":"Autumn","text":"No autumn-specific data were found in the sources reviewed; the sources do not say when miso-nikomi udon or miso-oden are eaten."},{"season":"Winter","text":"No winter-specific data were retrieved; the sources do not assign miso-nikomi udon, nimiso or miso-oden to a season."}],"markets":[{"name":"Hatcho-cho, Okazaki","ja":"岡崎市八丁町","note":"Origin district of Hatcho miso."},{"name":"Ichinomiya","ja":"一宮","note":"City where miso-nikomi udon is said to have first been sold in restaurants."}],"notes":"Hatcho miso became GI No. 49 on 15 December 2017, registered to the Aichi Prefecture Miso-Tamari Shoyu Industry Cooperative; two long-established Hatcho-cho firms outside that cooperative were not included, which led to dispute, a third-party committee report (March 2021) and, on 24 January 2025, the addition of the Hatcho Miso Cooperative as a second producer group. Check which group a producer belongs to before using the name.","src":[["MAFF: GI Hatcho miso (No. 49)","https://www.maff.go.jp/j/shokusan/gi_act/register/0049/index.html"],["MAFF: Hatcho miso added group (2025)","https://www.maff.go.jp/j/press/yusyutu_kokusai/chizai/250124.html"],["MAFF: Miso-nikomi udon (Aichi)","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/misonikomiudon_aichi.html"],["Aichi Now: gourmet","https://aichinow.pref.aichi.jp/educations/gourmet/"]]},{"pref":25,"history":"Shiga sits at a crossroads of routes and encloses Lake Biwa. MAFF's regional profile says that being able to supply rice, fish and vegetables itself, while being a transit point, shaped its own food customs. Omi rice earned the name 'granary of the Kinki'. Trade routes brought in outside goods such as mackerel along the Saba-kaido (hence saba somen). Hikone domain is recorded as presenting miso-pickled beef to the shogunal house in 1781.","character":"The cuisine is a lake-and-paddy cuisine built on preservation and fermentation. Fish from Lake Biwa is salted and lactic-fermented with rice (funazushi), beef is cured in white miso and then grilled, and a local radish is pickled (hinona-zuke). Regional taste varies inside the prefecture; MAFF says funazushi is saltier in the north and often sweeter in the south.","staples":[{"name":"Funazushi","ja":"鮒ずし","note":"Nare-zushi of nigorobuna: salted in early spring, washed and packed in rice around the summer doyo period (MAFF says July), then fermented for six months or more and eaten from New Year through the festivals of the year."},{"name":"Nigorobuna","ja":"ニゴロブナ","note":"The Lake Biwa crucian carp used for funazushi; MAFF notes its catch has fallen so fewer households make funazushi and it is now mostly bought at restaurants."},{"name":"Omi beef miso-zuke","ja":"近江牛の味噌漬","note":"Omi beef cured several days in white miso and then grilled; MAFF cites a 1781 record of Hikone domain presenting it to the shogunal family."},{"name":"Omi beef","ja":"近江牛","note":"The prefecture's wagyu brand, promoted by MAFF alongside fermented foods as a local pride."},{"name":"Hinona-zuke","ja":"日野菜漬け","note":"Pickle of hinona, said to originate in Hino town (Gamo district); selected in 1998 as a Shiga prefectural intangible folk heritage 'food culture asset' per MAFF."},{"name":"Omi rice","ja":"近江米","note":"Shiga's rice, called the 'granary of the Kinki' in the prefecture's own material; the food culture links lake and paddy."},{"name":"Saba somen","ja":"鯖そうめん","note":"Somen simmered with mackerel, cited by MAFF as a dish that came out of trade along the mackerel route."}],"calendar":[{"season":"Spring","text":"Early spring is when nigorobuna caught at the start of the season is salted for funazushi. Spring festivals are among the occasions at which funazushi, made the previous summer, is still eaten."},{"season":"Summer","text":"Around the doyo period (July in MAFF's description) the salted nigorobuna is washed and packed with rice for the main fermentation. Month-by-month produce was not given in the sources reviewed."},{"season":"Autumn","text":"The funazushi packed in summer continues to ferment through autumn (six months or more in total). No autumn ingredient calendar was found in the sources reviewed, so none is asserted here."},{"season":"Winter","text":"Around New Year funazushi reaches eating condition, with the bones softened according to the prefectural page. It is eaten at New Year, at the Okonai ritual and at spring festivals, per MAFF."}],"markets":[{"name":"Hino town (Gamo district)","ja":"日野町（蒲生郡）","note":"Food locality, not a market: the reputed origin of hinona, whose pickle was designated a Shiga food culture asset in 1998."},{"name":"Hikone (former Hikone domain)","ja":"彦根（旧彦根藩）","note":"Food locality, not a market: the domain recorded in 1781 as presenting miso-pickled Omi beef to the shogunal house."}],"notes":"Funazushi methods differ by household and region (north saltier, south sweeter), and many cooks buy pre-salted fish and do only the main packing. Because nigorobuna catches have fallen, professionals should expect supply and price to vary. Omi beef's detailed brand criteria were not confirmed in this research pass; check with the producer association before specifying it. The Saba-kaido link is described by MAFF as a trade-route origin for saba somen.","src":[["MAFF Nippon dento shokuzukan, Shiga","https://www.maff.go.jp/j/keikaku/syokubunka/traditional-foods/area/shiga.html"],["MAFF Uchi no kyodo ryori, Shiga region","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/area_stories/shiga.html"],["MAFF funazushi","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/funa_zushi_shiga.html"],["Shiga Prefecture funazushi","https://www.pref.shiga.lg.jp/ippan/shigotosangyou/suisan/18690.html"]]},{"pref":26,"history":"Kyoto was the seat of court culture, and MAFF's Kyoto food-culture paper describes a culture centred on court nobility. Sources describe Kyoto cuisine as drawing on the court's yusoku ryori and temple shojin ryori. Being far from the sea, marine products had to come from far away, which sources link to ingenuity in cooking. Buddhist thought and the basin's temperature range and abundant groundwater are given as reasons for a vegetable-centred cuisine and distinct local cultivars.","character":"Dashi is the core. Ichiban dashi is based on kombu with katsuobushi, and Kyoto's soft groundwater is said to draw out kombu umami easily; 'usuaji' (light taste) is a way of saying the dashi is doing the work. Seasonal local vegetables (kyo-yasai) and economical home cooking (obanzai) are central, with ichiju-sansai built around rice and a clear separation of hare (festive) and ke (everyday) meals.","staples":[{"name":"Kamo nasu","ja":"賀茂なす","note":"Large round eggplant from the Kamigamo area of Kita ward, Kyoto; sold roughly early May to late October."},{"name":"Shogoin daikon","ja":"聖護院だいこん","note":"Head-sized round daikon, a winter vegetable."},{"name":"Horikawa gobo","ja":"堀川ごぼう","note":"Thick burdock with a hollow core."},{"name":"Mibuna","ja":"壬生菜","note":"Leaf vegetable in season about December to March."},{"name":"Kyo takenoko","ja":"京たけのこ","note":"Moso bamboo shoot, the largest of the edible kinds."},{"name":"Kujo negi","ja":"九条ねぎ","note":"Long-established negi; cultivation is said to have begun when Fushimi Inari shrine was built."},{"name":"Manganji togarashi","ja":"万願寺とうがらし","note":"Large mild pepper listed among the representative kyo-yasai."},{"name":"Ebi-imo","ja":"海老芋","note":"Taro variety listed among the representative kyo-yasai."},{"name":"Obanzai","ja":"おばんざい","note":"Dashi-based home cooking that uses seasonal vegetables without waste."},{"name":"Ichiban dashi","ja":"一番出汁","note":"Kombu base with katsuobushi; the basis of Kyoto cooking."}],"calendar":[{"season":"Spring","text":"Mibuna stays in season until about March, and kyo takenoko is among the brand vegetables; the sources reviewed did not give a month for the bamboo-shoot season, so none is claimed."},{"season":"Summer","text":"Kamo nasu is on the market from early May to late October, covering the whole summer. The sources reviewed gave no further month-level summer detail such as hamo, so none is asserted."},{"season":"Autumn","text":"Kamo nasu continues until late October. No further autumn ingredients with confirmed months were found in the search results, so only the Kamo nasu window is stated."},{"season":"Winter","text":"Shogoin daikon is the typical winter round daikon and mibuna runs from December to the following March. Winter is the season highlighted in sources for kyo-yasai such as these."}],"markets":[{"name":"Nishiki Market","ja":"錦市場","note":"'Kyo no daidokoro'; Kyoto City says it began as a fish and poultry market in Hideyoshi's time (about 400 years), though Wikipedia gives about 1,300 years via Heian-era supply to the court; 120 or more shops (JR Central Tours), about 131 in an academic count."},{"name":"Kamigamo district (Kita ward)","ja":"上賀茂（北区）","note":"Production locality, not a market: the home district of Kamo nasu."}],"notes":"Kyoto's 'traditional vegetables' are defined as those with a pre-Meiji introduction and are managed alongside a separate 'brand product' list. Sources give different totals: 35 existing plus 2 extinct (37), about 40 including extinct, and brand lists of 31 or 19 items. Check the current prefectural list before using a name on a menu. The origin and age of Nishiki Market differ by source (about 400 versus about 1,300 years).","src":[["MAFF Kyo no shokubunka (Takahashi)","https://www.maff.go.jp/j/keikaku/syokubunka/culture/pdf/07_kyo.pdf"],["Kyoto Prefecture, Kyo brand products (vegetables)","https://www.pref.kyoto.jp/brand/1-1kyobrandnatu.html"],["Kyoto City, Kyo no dento yasai","https://www.city.kyoto.lg.jp/sankan/page/0000029058.html"],["Kyoto City commerce paper (Nishiki Market)","https://www.city.kyoto.lg.jp/sankan/cmsfiles/contents/0000147/147939/kyotoshoukoujouhou6.pdf"]]},{"pref":27,"history":"In the Edo period Osaka was the commercial centre to which rice tribute and local products from around the country were brought to domain storehouses (kurayashiki) and sold by merchants, the basis of the name 'tenka no daidokoro'. Kombu travelled from Hokkaido by the northern Kitamae-bune route along the Japan Sea and through the Seto Inland Sea to Osaka, where Sakai craftsmen processed it. Osaka's soft water is also cited as supporting dashi culture.","character":"Osaka cooking is built on awase-dashi, a kombu base combined with katsuobushi or niboshi, in contrast to Kanto's katsuobushi emphasis. Processed kombu such as tsukudani and shio-kombu is a local specialty. Frugality ('shimatsu') shows in dishes like senba-jiru, which uses fish offcuts. The modern 'daidokoro' image also takes in popular foods like takoyaki, which sources say are a postwar development.","staples":[{"name":"Senba-jiru","ja":"船場汁","note":"Clear soup of salted-mackerel arai and daikon, a Senba household dish that uses all of the fish."},{"name":"Hako-zushi (Osaka sushi)","ja":"箱寿司（大阪寿司）","note":"Sushi pressed in a wooden mould; toppings include shrimp, sea bream and conger eel."},{"name":"Takoyaki","ja":"たこ焼き","note":"Osaka-born, but a recent food: shops began increasing in the 1955 to 1964 period (Showa 30s)."},{"name":"Naniwa traditional vegetables","ja":"なにわの伝統野菜","note":"A set of 18 items including Kema cucumber, Suita kuwai and Senshu mizunasu; many disappeared with postwar urbanisation and are being revived."},{"name":"Tsukudani kombu / shio-kombu","ja":"佃煮昆布・塩昆布","note":"Processed kombu characteristic of Osaka, which treats kombu as much as a food as a dashi material."},{"name":"Awase-dashi","ja":"合わせだし","note":"Kombu base blended with katsuobushi or niboshi; the Kansai standard."},{"name":"Kintoki carrot","ja":"金時人参","note":"Named among Osaka's local ingredients alongside ikanago in a regional-ingredient survey."},{"name":"Ikanago","ja":"イカナゴ","note":"Sand lance listed among Osaka specialty products in the same survey."}],"calendar":[{"season":"Spring","text":"The sources reviewed gave no month-by-month calendar for Osaka. Ikanago is listed as a local specialty product, but its season was not given in the results, so it is not placed in a month."},{"season":"Summer","text":"No summer items with confirmed months were found. Hako-zushi and takoyaki are year-round foods in the descriptions seen, not tied to a season by the sources."},{"season":"Autumn","text":"No autumn calendar was found in the sources reviewed. The Naniwa traditional vegetables number 18 items, but the sources seen did not give their harvest months here."},{"season":"Winter","text":"Senba-jiru, the salted-mackerel and daikon clear soup, is described as a household dish; the sources reviewed did not tie it to a month. Kombu dashi is the year-round base."}],"markets":[{"name":"Kuromon Market","ja":"黒門市場","note":"Said to have begun around 1822 to 1823, when merchants near the black sanmon of Enmyoji in Nihonbashi sold fish arriving from Sakai and Kishu; recognised as an official market in 1902 per most sources; about 150 shops."},{"name":"Sakai kombu-processing district","ja":"堺（昆布加工）","note":"Production locality, not a market: Sakai's craft in processing kombu is cited as shaping Osaka's food identity."}],"notes":"The meaning of 'tenka no daidokoro' is historical (rice and goods concentrated in Osaka) and differs from the modern use that includes takoyaki and kushikatsu. Sources are mostly tourism and general media, so dates for foods like takoyaki are approximate. The Naniwa traditional vegetable list is a designated set of 18 items; confirm the current designation with the prefecture before labelling a dish. A kombu wholesaler notes that making dashi from scratch from kombu and katsuobushi has declined at home.","src":[["Osaka Info, history of Osaka food culture","https://osaka-info.jp/osaka/food/gastronomy-story01/"],["Kansai Wide-Area Union, dashi culture","https://www.kouiki-kansai.jp/koikirengo/jisijimu/nosui/kansainosyoku/873.html"],["MAFF Uchi no kyodo ryori, Senba-jiru","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/39_16_osaka.html"],["Kuromon Market history","https://kuromon.com/jp/history/"]]},{"pref":28,"history":"Hyogo is a large prefecture whose sources describe food culture splitting by region: Kobe for western-style food and sweets, Harima for Himeji oden and conger-eel dishes, and Tajima for Tajima beef. Tajima cattle are described as the roots of Kobe Beef. Nada's five sake districts, Akashi sea bream from the Inland Sea and Awaji Island produce are the other pillars named in the sources.","character":"The prefecture runs from the Japan Sea side to the Seto Inland Sea, so it combines beef, sake, Inland Sea sea bream and sand lance, and Awaji vegetables. Sweet soft Awaji onions and the autumn-fat Akashi sea bream are the benchmark ingredients named in the sources. Because of Kobe Beef's strict grading and branding, professionals must distinguish 'Tajima-gyu' from 'Kobe Beef'.","staples":[{"name":"Tajima beef","ja":"但馬牛","note":"Breed regarded as the roots of Kobe Beef; served in northern Hyogo as steak, gyudon and beef soba."},{"name":"Kobe Beef","ja":"神戸ビーフ","note":"Not a breed but a brand: Tajima cattle meeting criteria. Sources give BMS No. 6 or higher on the 12-step scale, steer or maiden heifer, and an age range of 28 to 60 months; carcass-weight limits differ by source."},{"name":"Akashi tai","ja":"明石鯛","note":"Called Japan's top sea bream; only Pacific red sea bream meeting set standards may use the name, and the autumn fish is rated highest for fat."},{"name":"Tai-meshi","ja":"鯛めし","note":"Akashi sea bream rice, listed as a local dish."},{"name":"Awaji onion","ja":"淡路島玉ねぎ","note":"Prized with chefs; the Inland Sea climate is credited for a sweet, soft onion."},{"name":"Nada gogo","ja":"灘五郷","note":"Five sake districts; makers named include Matsu-Take-Ume (Shochikubai), Hakutsuru and Kiku-Masamune."},{"name":"Ikanago kugi-ni","ja":"いかなごのくぎ煮","note":"Spring sand-lance simmered in soy; named as the spring taste."},{"name":"Izushi soba","ja":"出石そば","note":"Buckwheat dish from the Tajima area."},{"name":"Sasayama botan-nabe","ja":"丹波篠山のぼたん鍋","note":"Wild-boar hot pot from Tamba-Sasayama."},{"name":"Awaji raw shirasu-don","ja":"淡路島の生しらす丼","note":"Raw whitebait bowl listed as an Awaji standard."}],"calendar":[{"season":"Spring","text":"Spring is the season for ikanago kugi-ni, the sand lance simmered in soy that the sources name as the spring taste of Hyogo."},{"season":"Summer","text":"No summer calendar with confirmed months was found in the results. Awaji raw shirasu-don is listed as a standard on the island, but its months were not stated."},{"season":"Autumn","text":"Autumn is when Akashi sea bream is judged best: it fattens before winter and carries good-quality fat, according to the tourism source reviewed."},{"season":"Winter","text":"Tamba-Sasayama is known for boar hot pot (botan-nabe) and Izushi for soba, but the sources reviewed did not give months for either, so no winter timing is asserted."}],"markets":[{"name":"Izushi","ja":"出石","note":"Food town, not a market: listed for Izushi soba in the Tajima region."},{"name":"Tamba-Sasayama","ja":"丹波篠山","note":"Food town, not a market: listed for botan-nabe (wild boar)."},{"name":"Awaji Island","ja":"淡路島","note":"Island locality, not a market: Awaji onions and raw shirasu-don."}],"notes":"Kobe Beef and Tajima beef are not interchangeable: Kobe Beef is a branded subset of Tajima cattle, with an official identity mark whose description varies by source (a chrysanthemum stamp and a nojigiku mark are both mentioned). Carcass-weight and age figures differ across sources and some are outdated, so check the Kobe Beef Marketing and Distribution Promotion Council criteria before quoting them. 'Akashi tai' is also restricted to fish meeting set standards.","src":[["Hyogo tourism, gourmet feature","https://www.hyogo-tourism.jp/feature/gourmet"],["Kobe Beef criteria, Kobe Niku council","https://www.kobe-niku.jp/contents/about/criteria.html"],["Chiiki Brand News, Kobe Beef","https://news.tiiki.jp/articles/380"],["Tabiiro, Hyogo seafood","https://tabiiro.jp/gourmet/theme/jizakana/kinki/hyogo/"]]},{"pref":29,"history":"Nara is inland, and MAFF's account of kakinoha-zushi stresses that marine products were precious in the mountain areas, so salted mackerel was preserved and eaten with care. One theory says that around the mid-Edo period Kishu fishermen carried salted mackerel to villages along the Yoshino river, where it became a summer-festival treat. Local origin stories also link Miwa to the start of somen and Uda's Butsuryuji to tea porridge.","character":"This is a mountain-basin cuisine of preservation and rice-based staples: salted mackerel pressed on vinegared rice in persimmon leaf, hand-pulled somen, tea porridge (chagayu) and lees-pickled melon. The sources describe local vegetables (Yamato yasai) as native cultivars of the Nara basin and Yamato plateau, with certified traditional vegetables and brand vegetables.","staples":[{"name":"Kakinoha-zushi","ja":"柿の葉寿司","note":"Thinly sliced salted mackerel on vinegared rice wrapped in persimmon leaf; certified a '100-year food' in 2024 per the Agency for Cultural Affairs list."},{"name":"Miwa somen","ja":"三輪そうめん","note":"Sakurai's Miwa is held to be the birthplace of somen; tradition links it to a revelation at Omiwa shrine; known for firm texture and a history said to exceed 1,300 years."},{"name":"Chagayu","ja":"茶粥","note":"Rice porridge cooked in tea; light and fragrant with little stickiness. Tradition says Kobo Daishi sowed tea seed at Butsuryuji, Uda, in the early 9th century."},{"name":"Yamato mana","ja":"大和まな","note":"Yamato traditional vegetable, mild with a distinctive aroma, good with oil; grown mainly in Yamatotakada and Uda."},{"name":"Tsutsui renkon","ja":"筒井れんこん","note":"Lotus root from Yamatokoriyama, with long nodes and little stickiness; the Tsutsui castle area's plentiful groundwater and soft soil suited lotus."},{"name":"Yamato imo","ja":"大和いも","note":"Yam grown mainly in Gose and Tenri; used for wagashi."},{"name":"Nara-zuke","ja":"奈良漬","note":"Pickle of white melon in sake lees, built on locally abundant shirouri and good Nanto morohaku sake lees."},{"name":"Mehari-zushi","ja":"めはり寿司","note":"Rice ball wrapped in pickled takana, distributed around Kumano and Nara's Yoshino district."}],"calendar":[{"season":"Spring","text":"The sources reviewed gave no month-level spring calendar for Nara. Yamato traditional vegetables number 20 certified items plus 5 brand items, but their months were not stated in the results."},{"season":"Summer","text":"Kakinoha-zushi is tied to summer festivals in the Yoshino river villages in one origin theory. No other summer produce with confirmed months was found."},{"season":"Autumn","text":"No autumn calendar with confirmed months was found. Persimmon leaf, the wrapper for kakinoha-zushi, is the seasonal material of the sushi, but timing was not stated."},{"season":"Winter","text":"No winter calendar was found. Chagayu and Miwa somen are described as everyday and tradition foods without a stated season in the sources reviewed."}],"markets":[{"name":"Sakurai / Miwa","ja":"桜井市三輪","note":"Locality, not a market: the traditional birthplace of somen at Omiwa shrine."},{"name":"Yamatokoriyama (Tsutsui)","ja":"大和郡山市（筒井）","note":"Locality, not a market: the lotus-root district."},{"name":"Yoshino river villages","ja":"吉野川沿いの村","note":"Locality, not a market: the traditional setting for kakinoha-zushi."}],"notes":"Origins of kakinoha-zushi are disputed (a salted-mackerel peddling theory, plus preservation-food and soldiers' ration theories), so treat any single origin as one theory. 'Yamato yasai' is a prefectural certification of 25 items (20 traditional plus 5 brand). The 2024 100-year-food listing for kakinoha-zushi was reported in the search summary of the Agency for Cultural Affairs list; the date was not verified on the page itself.","src":[["MAFF kakinoha-zushi","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/kakinoha_zushi_nara.html"],["Agency for Cultural Affairs, 100-year food, Nara","https://www.bunka.go.jp/seisaku/shokubunka/foodculture/hyakunenfood/jirei/list_nara.html"],["Nara Prefecture, Yamato mana","https://www.pref.nara.lg.jp/n116/58555.html"],["Nippon Tradition Vegetable, Nara","https://tradveggie.or.jp/traditional-vegetables-prefecture/29-nara/"]]},{"pref":30,"history":"Wakayama's food is shaped by mountains, Kumano and the Kuroshio coast. Mehari-zushi began as a lunch for mountain workers in the Kumano region, and nare-zushi of salted mackerel wrapped in leaves is said to have arisen when rice packed round the fish fermented. Yuasa's kinzanji miso is described as a root of Japanese soy sauce, though that is a tradition rather than settled fact. Koyasan developed shojin ryori.","character":"It is a cuisine of preserved and fermented foods, with fish ranging by district: mackerel in Arita and Hidaka, sanma or ayu from Kushimoto to Shingu. Pickled plums and mikan are the commercial crops. Mehari-zushi and kakinoha-zushi use wrappers (takana, persimmon leaf) as both flavour and preservative.","staples":[{"name":"Mehari-zushi","ja":"めはり寿司","note":"Large rice ball wrapped in takana pickle; from the Kumano mountain-worker lunch, found around Kumano (Wakayama and Mie) and Nara's Yoshino district."},{"name":"Nare-zushi","ja":"なれずし","note":"Salted mackerel packed with rice in leaves and fermented; mackerel in Arita and Hidaka, sanma or ayu from Kushimoto to Shingu; served at autumn festivals."},{"name":"Sanma-zushi","ja":"秋刀魚寿司","note":"Made with sanma of Kumano-nada; originally a preserved food."},{"name":"Kinzanji miso","ja":"金山寺味噌","note":"Nameshi-style miso of Yuasa and Gobo; the Kishu kinzanji miso is a registered GI; Marushin Honke's Kuyo Murasaki uses kinzanji tamari, about 3 percent of the product."},{"name":"Yuasa shoyu","ja":"湯浅醤油","note":"Soy sauce of Yuasa town, linked by tradition to the kinzanji miso origin story."},{"name":"Nanko ume","ja":"南高梅","note":"Top-brand plum, grown mainly in Minabe town."},{"name":"Arida mikan","ja":"有田みかん","note":"Wakayama is Japan's top mikan producer; Arida alone is said to hold about 9 percent of national output."},{"name":"Koyasan shojin ryori and goma-dofu","ja":"高野山の精進料理・ごま豆腐","note":"Meatless monastic cuisine served at temple lodgings; sesame tofu is a Koya-cho specialty."},{"name":"Katsuura tuna","ja":"那智勝浦のマグロ","note":"Tuna dishes of Nachikatsuura."},{"name":"Taiji whale","ja":"太地町のくじら","note":"Whale dishes of Taiji."}],"calendar":[{"season":"Spring","text":"The sources reviewed did not give a spring calendar with months. Plum and mikan are the prefecture's main crops, but harvest months were not stated in the results seen."},{"season":"Summer","text":"No summer calendar was found. Nare-zushi is defined by months of fermentation, and the timing of the mackerel catch was not stated in the results."},{"season":"Autumn","text":"Nare-zushi was a treat for autumn festivals, with the sweeter, more-fermented pieces offered to guests alongside ginger and amazake, per MAFF."},{"season":"Winter","text":"No winter-specific items with months were confirmed. Mikan and Koyasan's shojin ryori are year-round references, not dated by the sources reviewed."}],"markets":[{"name":"Kuroshio Ichiba","ja":"黒潮市場","note":"Seafood market in Wakayama Marina City with more than 10 stalls and restaurants; a tuna dismantling show runs daily, twice a day at weekends; open about 10:00 to 17:00."},{"name":"Yuasa town","ja":"湯浅町","note":"Locality, not a market: home of Marushin Honke and the soy sauce and kinzanji miso tradition."}],"notes":"The 'Japan's soy sauce began here' claim for Yuasa is phrased as 'said to be the roots' in the sources, so present it as tradition. Kishu kinzanji miso is registered under the national GI system. Nare-zushi wrappers and fish vary by district. Details of Nanko ume standards, and of kuei (longtooth grouper), were not found in this research pass and are omitted.","src":[["Kansai Wide-Area Union, Wakayama food","https://www.kouiki-kansai.jp/koikirengo/jisijimu/nosui/kansainosyoku/883.html"],["MAFF nare-zushi, Wakayama","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_menu/menu/nare_zushi_wakayama.html"],["Marushin Honke, kinzanji miso","https://www.marushinhonke.com/f/history"],["Wakayama Prefecture tourism, Kuroshio Ichiba","https://www.wakayama-kanko.or.jp/spots/detail_589.html"]]},{"pref":31,"history":"Tottori is a Japan Sea prefecture whose sources centre on winter crab, sandy-soil crops and tofu-based fish paste. Tofu-chikuwa, made from momen tofu and white fish, is a local dish said to go back to the Edo period. The dune-adjacent fields behind Tottori Sand Dunes grow rakkyo, for which Tottori ranks first in Japan, and nijisseiki pear has a history of over 100 years.","character":"The cuisine rests on cold Japan Sea seafood (matsuba-gani), sandy-field crops (rakkyo, white negi) and simple preparations such as tofu-chikuwa eaten with ginger soy. Cold winters are credited with hard, tight rakkyo. Local dishes named in sources include igisu, itadaki, dondoroke-meshi and nonoko-meshi.","staples":[{"name":"Matsuba-gani","ja":"松葉ガニ","note":"Winter snow crab; the season opens on 6 November and runs to about 20 March the following year."},{"name":"Oyagani","ja":"親ガニ","note":"Female snow crab, fished only from early November to end of December and eaten at home."},{"name":"Gokaisei matsubagani","ja":"五輝星","note":"Selected top-grade matsuba-gani brand launched by the prefecture in 2015; a crab sold for 5 million yen at the first auction; reportedly none landed at Tottori port in 2024."},{"name":"Nijisseiki pear","ja":"二十世紀梨","note":"Pear with a history over 100 years, eaten in a limited period of August to September; flavour changes with ripeness colour."},{"name":"Tofu-chikuwa","ja":"とうふちくわ","note":"Fish paste of momen tofu and white fish, eaten with ginger soy."},{"name":"Sakyu rakkyo","ja":"砂丘らっきょう","note":"Rakkyo grown in dune fields; Tottori is first in Japan for rakkyo production."},{"name":"Yumigahama white negi","ja":"弓ヶ浜の白ネギ","note":"Yonago-area white negi listed as a local ingredient."},{"name":"Nonoko-meshi","ja":"ののこめし","note":"Local rice dish named in a survey of Tottori regional dishes."}],"calendar":[{"season":"Spring","text":"The matsuba-gani season ends around 20 March, and no other spring items with confirmed months were found in the sources reviewed."},{"season":"Summer","text":"Nijisseiki pear is available in a limited period starting in August. The sources describe its season as August to September, so it straddles summer and autumn."},{"season":"Autumn","text":"September ends the pear window, and from 6 November matsuba-gani opens; oyagani is fished only from early November, with late-season pears and new rice also featured in November."},{"season":"Winter","text":"Matsuba-gani is the defining winter taste, with the first auction on the day after opening (7 November). Oyagani is fished only from early November to the end of December; the crab season as a whole runs to about 20 March."}],"markets":[{"name":"Tottori Port Seafood Market Karoichi","ja":"鳥取港海鮮市場 かろいち","note":"Port seafood market that runs a crab feature each season."},{"name":"Tottori Sand Dunes area","ja":"鳥取砂丘周辺","note":"Locality, not a market: city tourism site lists dune-area local foods."}],"notes":"The matsuba-gani opening date is fixed by ministerial ordinance by sea area (6 November, season to about 20 March); oyagani has a shorter window (early November to end of December). The Gokaisei brand is selective and some years have no landings; the 5-million-yen figure comes from press reports. Several 'Japan No. 1' claims for crab landings are from promotional material, so verify before quoting.","src":[["MAFF Kodomo navi, tofu-chikuwa","https://www.maff.go.jp/j/syokuiku/kodomo_navi/cuisine/cuisine5_1.html"],["PR Times, Tottori matsuba-gani opening","https://prtimes.jp/main/html/rd/p/000000013.000078201.html"],["JOCR, matsuba-gani and oyagani","https://jocr.jp/raditopi/2025/11/26/664603/"],["Tabiiro, Tottori specialties","https://tabiiro.jp/gourmet/article/tottori-meibutsu-gotouchi/"]]},{"pref":32,"history":"Izumo soba is said to have spread in early Edo, when Matsue's lord Matsudaira Naomasa brought buckwheat craftsmen from Shinano. In the Edo period the seventh Matsue lord, Matsudaira Harusato (Fumai-ko), developed the Fumai school of tea, and Matsue's confectionery tradition grew out of it. Lake Shinji's seven delicacies have been valued since the Edo period.","character":"Shimane combines lake and sea (Shinji-ko, Okinoshima, the Japan Sea) with a tea-ceremony culture that shaped Matsue sweets. Izumo soba is milled with the hull (hikigurumi) with little wheat binder, served as warigo or kamaage. Oki soba is 100 percent buckwheat and uses grilled-mackerel or flying-fish dashi. Ago (flying fish) noyaki and akaten are local fish-paste foods.","staples":[{"name":"Izumo soba","ja":"出雲そば","note":"One of Japan's three great soba; hull-ground (hikigurumi) with little wheat binder; eaten as warigo soba in stacked bowls or kamaage."},{"name":"Oki soba","ja":"隠岐そば","note":"100 percent buckwheat noodle in a dashi of grilled mackerel or flying fish."},{"name":"Shinjiko shichin","ja":"宍道湖七珍","note":"Seven Lake Shinji products: suzuki (sea bass), shirauo, koi, unagi, moroge-ebi, amasagi and shijimi."},{"name":"Yamato shijimi","ja":"大和しじみ","note":"Lake Shinji clam, described as large and plump with a deep flavour."},{"name":"Nodoguro","ja":"のどぐろ","note":"Premium fish landed at Hamada, called the 'red jewel of the Japan Sea'."},{"name":"Akaten","ja":"赤天","note":"Hamada fish-paste fritter, named as a local food."},{"name":"Ago-noyaki","ja":"あご野焼き","note":"Grilled flying-fish paste, named as a local specialty."},{"name":"Matsue wagashi (Fumai-ko konomi)","ja":"松江和菓子（不昧公好み）","note":"Matsue sweets from the Fumai-ko tea tradition; the three famous sweets are Wakakusa, Yamakawa and Natane no Sato."}],"calendar":[{"season":"Spring","text":"24 April, the death day of Fumai-ko, is set by Matsue City ordinance as 'Cha no Yu no Hi' (tea-ceremony day). Tea and sweets are the spring link in the sources reviewed."},{"season":"Summer","text":"The sources reviewed gave no month-level summer calendar. Shinji-ko products such as shijimi and sea bass are listed as a set but their seasons were not stated in the results."},{"season":"Autumn","text":"No autumn calendar with confirmed months was found. Izumo soba is described by cooking style (warigo, kamaage) in the sources rather than by harvest month."},{"season":"Winter","text":"Kamaage soba (served in its hot cooking water) is one of the two Izumo styles and suits the cold; the sources reviewed did not date it, and no other winter items were confirmed."}],"markets":[{"name":"Lake Shinji area","ja":"宍道湖周辺","note":"Locality, not a market: source of the seven delicacies; a 'Shinjiko shichin' dining area is promoted around Matsue and Izumo."},{"name":"Matsue old confectioners","ja":"松江の老舗和菓子店","note":"Shops keeping Fumai-ko sweets; Saiundo, for example, is described as 147 years old."},{"name":"Hamada","ja":"浜田","note":"Port locality, not a market: nodoguro and akaten."}],"notes":"Soba: Izumo (hull-ground, warigo or kamaage) and Oki (100 percent buckwheat) are different styles, so do not treat them as one. The seven Shinji-ko products are listed by the prefecture. The sources reviewed did not give nodoguro or rock-oyster details, so no grading or season is claimed. Fumai-ko is the seventh Matsue lord, Matsudaira Harusato; the sweets are called 'Fumai-ko konomi'.","src":[["MAFF Izumo soba","https://www.maff.go.jp/j/keikaku/syokubunka/k_ryouri/search_m
