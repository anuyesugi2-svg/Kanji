<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Regional Japan - a map of names, flavours and traditions</title>
<meta name="description" content="An interactive, zoomable map of Japan's regional food and drink: fish names that change by region and season, shoyu, miso, kombu, ramen, noodles, sake, shochu and whisky.">
<style>
:root{
  --bg:#f2f8f7; --panel:#ffffff; --sea:#d9ebf3; --land:#fbfdfc; --ink:#12323f; --muted:#587783;
  --line:#d0e3e4; --blue:#1f6f9f; --blue-d:#0e4d6b; --green:#2e8b6a; --green-l:#e3f2ec; --blue-l:#e2f0f7;
  --chip:#eaf4f3; --shadow:0 1px 2px rgba(18,50,63,.08),0 6px 20px rgba(18,50,63,.08);
  --stroke:#9cc2c4; --sel:#0e4d6b;
}
:root[data-theme="dark"]{
  --bg:#0c1b21; --panel:#13262e; --sea:#0f2c3a; --land:#1b3841; --ink:#e2f1f0; --muted:#91b0b5;
  --line:#25424b; --blue:#5aaee0; --blue-d:#9fd3f2; --green:#4cc196; --green-l:#17382f; --blue-l:#15313f;
  --chip:#1a3640; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); --stroke:#3b6a72; --sel:#bfe6f7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0c1b21; --panel:#13262e; --sea:#0f2c3a; --land:#1b3841; --ink:#e2f1f0; --muted:#91b0b5;
    --line:#25424b; --blue:#5aaee0; --blue-d:#9fd3f2; --green:#4cc196; --green-l:#17382f; --blue-l:#15313f;
    --chip:#1a3640; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3); --stroke:#3b6a72; --sel:#bfe6f7;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:auto auto 1fr;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{font-size:18px;font-weight:650;letter-spacing:.2px;margin:0;white-space:nowrap}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap}
.mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--blue),var(--green));flex:none;align-self:center}
.search{margin-left:auto;position:relative;width:min(340px,40vw)}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;outline:none}
.search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 20%,transparent)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:var(--muted)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;z-index:30;display:none}
.results button{display:block;width:100%;text-align:left;padding:9px 12px;border:0;background:none;border-bottom:1px solid var(--line)}
.results button:last-child{border:0}
.results button:hover,.results button:focus{background:var(--chip);outline:none}
.results small{color:var(--muted);display:block}
.theme{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:36px;height:36px;display:grid;place-items:center;flex:none}
.layers{display:flex;gap:8px;padding:10px 20px;overflow-x:auto;background:var(--panel);border-bottom:1px solid var(--line);scrollbar-width:thin}
.pill{flex:none;border:1px solid var(--line);background:var(--bg);padding:6px 14px;border-radius:999px;white-space:nowrap;transition:.15s}
.pill small{color:var(--muted);margin-left:6px}
.pill:hover{border-color:var(--blue)}
.pill[aria-pressed="true"]{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-color:transparent}
.pill[aria-pressed="true"] small{color:#e6f6f1}
main{display:grid;grid-template-columns:1fr 410px;min-height:0}
.mapwrap{position:relative;min-height:0;background:var(--sea);overflow:hidden}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none}
svg#map.drag{cursor:grabbing}
.pref{fill:var(--land);stroke:var(--stroke);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;transition:fill .25s,opacity .25s;cursor:pointer;outline:none}
.pref:hover{stroke:var(--blue-d);stroke-width:2}
.pref:focus-visible{stroke:var(--sel);stroke-width:3}
.pref.sel{stroke:var(--sel);stroke-width:3}
.pref.dim{opacity:.35}
.lbl{pointer-events:none;text-anchor:middle;dominant-baseline:central;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-opacity:.85;font-weight:600;transition:opacity .2s}
.rlbl{pointer-events:none;text-anchor:middle;dominant-baseline:central;fill:var(--ink);opacity:.75;font-weight:650;letter-spacing:.08em;paint-order:stroke;stroke:var(--land);stroke-opacity:.8}
.route{fill:none;stroke:var(--blue-d);stroke-width:2.5;stroke-dasharray:7 6;vector-effect:non-scaling-stroke;pointer-events:none}
.route.spur{stroke-dasharray:2 5;opacity:.8}
.port{fill:var(--panel);stroke:var(--blue-d);stroke-width:2;vector-effect:non-scaling-stroke;pointer-events:none}
.inset{fill:none;stroke:var(--stroke);stroke-dasharray:4 4;vector-effect:non-scaling-stroke;stroke-width:1;pointer-events:none}
.ctrl{position:absolute;right:14px;top:14px;display:flex;flex-direction:column;gap:6px}
.ctrl button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);box-shadow:var(--shadow);font-size:20px;line-height:1;display:grid;place-items:center}
.ctrl button:hover{border-color:var(--blue)}
.legend{position:absolute;left:14px;top:14px;max-width:min(300px,calc(100% - 90px));background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);font-size:13px;backdrop-filter:blur(6px)}
.legend h4{margin:0 0 6px;font-size:12px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.legend .row{display:flex;align-items:center;gap:8px;padding:2px 0;border:0;background:none;width:100%;text-align:left}
.legend button.row:hover{color:var(--blue)}
.sw{width:12px;height:12px;border-radius:4px;flex:none}
.ramp{height:8px;border-radius:4px;background:linear-gradient(90deg,#d6ece6,#2a8a6a);margin:2px 0 4px}
.ramp.b{background:linear-gradient(90deg,#d7e9f3,#1f6f9f)}
.ramp+div{display:flex;justify-content:space-between;color:var(--muted);font-size:12px}
.monthbar{position:absolute;left:14px;right:70px;bottom:52px;display:none;align-items:center;gap:4px;background:color-mix(in srgb,var(--panel) 94%,transparent);border:1px solid var(--line);border-radius:14px;padding:6px 8px;box-shadow:var(--shadow);flex-wrap:wrap}
.monthbar.on{display:flex}
.monthbar b{font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 6px 0 4px}
.monthbar button{border:0;background:var(--chip);border-radius:8px;min-width:34px;height:28px;font-size:12.5px}
.monthbar button:hover{background:var(--blue-l)}
.monthbar button[aria-pressed="true"]{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff}
.badge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted);font-weight:600}
.badge.peak{background:var(--blue);color:#fff}
.badge.in{background:var(--green-l);color:var(--green)}
.card.off{opacity:.55}
.cal div.cur{outline:2px solid var(--ink);outline-offset:1px}
.regionbar{position:absolute;left:14px;bottom:14px;right:70px;display:flex;gap:6px;flex-wrap:wrap}
.regionbar button{border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 94%,transparent);padding:4px 10px;border-radius:999px;font-size:12.5px;box-shadow:var(--shadow)}
.regionbar button:hover{border-color:var(--blue)}
.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12.5px;z-index:40;display:none;max-width:260px}
.tip b{font-weight:650}
aside{background:var(--panel);border-left:1px solid var(--line);overflow-y:auto;min-height:0;padding:20px 22px 40px}
aside h2{font-size:22px;margin:0 0 2px;line-height:1.2}
aside h3{font-size:12px;margin:22px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;font-weight:650}
.ja{color:var(--muted);font-size:14px}
.sub{color:var(--muted);margin:2px 0 12px}
p{margin:8px 0}
.back{border:0;background:none;color:var(--blue);padding:0;margin-bottom:12px;font-size:13.5px}
.back:hover{text-decoration:underline}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:12px 14px;margin:0 0 10px;transition:.15s}
.card:hover{border-color:var(--blue);transform:translateY(-1px)}
.card .t{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card .t b{font-weight:650}
.card p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:3px 10px;border-radius:999px;font-size:12.5px}
button.chip:hover{background:var(--blue);color:#fff}
.box{border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--blue-l);font-size:14px}
.box.g{background:var(--green-l)}
.box b{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:2px}
.sys{border:1px solid var(--line);border-radius:14px;padding:12px;margin:0 0 10px;background:var(--bg);cursor:pointer;transition:.15s}
.sys:hover,.sys.on{border-color:var(--blue)}
.sys .h{display:flex;align-items:center;gap:8px;font-weight:650;margin-bottom:8px}
.ladder{display:flex;flex-wrap:wrap;align-items:stretch;gap:4px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 9px;line-height:1.25}
.step b{font-weight:650;display:block}
.step i{font-style:normal;color:var(--muted);font-size:12px}
.arrow{align-self:center;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:6px 0 4px}
.cal div{height:26px;border-radius:6px;background:var(--chip)}
.cal div.m1{background:#9ec9e1}
.cal div.m2{background:var(--blue)}
.calm{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;font-size:11px;color:var(--muted);text-align:center}
.season{margin:8px 0;padding-left:10px;border-left:3px solid var(--green)}
.meter{display:grid;grid-template-columns:90px 1fr;gap:6px 10px;align-items:center;margin:8px 0}
.dots{display:flex;gap:4px}
.dots i{width:16px;height:8px;border-radius:4px;background:var(--chip)}
.dots i.on{background:linear-gradient(90deg,var(--blue),var(--green))}
.rc{border-left:6px solid;padding-left:12px}
.note{margin-top:26px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:12.5px}
.empty{color:var(--muted)}
.pin{fill:var(--blue-d);stroke:var(--panel);stroke-width:2;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .15s}
.pin:hover,.pin.sel{fill:var(--green);stroke:var(--sel)}
.tlbl{pointer-events:none;fill:var(--ink);paint-order:stroke;stroke:var(--land);stroke-opacity:.9;font-weight:650;transition:opacity .15s}
.box.k{background:color-mix(in srgb,var(--green-l) 70%,var(--panel));border-left:3px solid var(--green)}
.srcs{margin:6px 0 0;padding:0;list-style:none;font-size:12.5px}
.srcs li{margin:3px 0}
.srcs a{color:var(--blue);text-decoration:none;word-break:break-word}
.srcs a:hover{text-decoration:underline}
.vbadge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--green-l);color:var(--green);font-weight:600}
.ubadge{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
@media (max-width:860px){
  .app{height:auto;min-height:100dvh;grid-template-rows:auto auto auto}
  main{grid-template-columns:1fr;grid-template-rows:62vh auto}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .brand span{display:none}
  header{padding:10px 14px}
  .layers{padding:8px 14px}
  .search{width:auto;flex:1}
  .legend{max-width:calc(100% - 80px)}
  .regionbar{right:14px;bottom:62px}
  .monthbar{right:14px;bottom:108px}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark" aria-hidden="true"></div>
    <div class="brand"><h1>Regional Japan</h1><span>地域の味 · names, flavours &amp; traditions</span></div>
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search: hamachi, tamari, Hakata..." autocomplete="off" aria-label="Search">
      <div class="results" id="results" role="listbox"></div>
    </div>
    <button class="theme" id="theme" title="Toggle light / dark" aria-label="Toggle light or dark theme">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>
  <nav class="layers" id="layers" aria-label="Map layers"></nav>
  <main>
    <div class="mapwrap" id="mapwrap">
      <svg id="map" role="group" aria-label="Interactive map of Japan's 47 prefectures"></svg>
      <div class="legend" id="legend"></div>
      <div class="ctrl">
        <button id="zin" aria-label="Zoom in">+</button>
        <button id="zout" aria-label="Zoom out">&minus;</button>
        <button id="zreset" aria-label="Reset view" title="Reset view">&#8962;</button>
      </div>
      <div class="monthbar" id="monthbar"></div>
      <div class="regionbar" id="regionbar"></div>
    </div>
    <aside id="panel" aria-live="polite"></aside>
  </main>
</div>
<div class="tip" id="tip"></div>

<script>
/*__MAP__*/
</script>
<script>
/*__DATA__*/
</script>
<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NS = "http://www.w3.org/2000/svg";
const prefById = Object.fromEntries(PREFS.map(p => [p.id, p]));
const regById = Object.fromEntries(REGIONS.map(r => [r.id, r]));
const itemById = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const fishById = Object.fromEntries(FISH.map(f => [f.id, f]));
const catById = Object.fromEntries(CATS.map(c => [c.id, c]));
const SYS_COLORS = ["#1f6f9f", "#2e9e86", "#6aaa4e", "#26457a", "#79c3c7", "#a3c05a"];
const MONTHS = "JFMAMJJASOND".split("");

/* ---------- state ---------- */
const S = { town: null, month: null, layer: "regions", item: null, fish: null, pref: null, region: null, hoverSys: null };

/* ---------- map ---------- */
const svg = $("#map");
const [bx0, by0, bx1, by1] = MAPDATA.bbox;
const PAD = 60;
const base = { x: bx0 - PAD, y: by0 - PAD, w: bx1 - bx0 + PAD * 2, h: by1 - by0 + PAD * 2 };
let vb = { ...base };
const gSea = mk("rect", { x: base.x - 4000, y: base.y - 4000, width: base.w + 8000, height: base.h + 8000, fill: "var(--sea)" });
const gMap = mk("g"), gRoute = mk("g"), gLbl = mk("g"), gReg = mk("g");
const gTowns = mk("g");
svg.append(gSea, gMap, gRoute, gReg, gTowns, gLbl);
const pathEl = {}, bbox = {};
for (const p of PREFS) {
  const d = MAPDATA.paths[p.id];
  const el = mk("path", { d: d.d, class: "pref", "data-id": p.id, tabindex: 0, role: "button", "aria-label": p.en + " " + p.ja });
  gMap.append(el); pathEl[p.id] = el;
}
for (const p of PREFS) {
  const b = pathEl[p.id].getBBox(); bbox[p.id] = { x: b.x, y: b.y, w: b.width, h: b.height };
  const t = mk("text", { class: "lbl", x: MAPDATA.paths[p.id].c[0], y: MAPDATA.paths[p.id].c[1] });
  t.textContent = p.ja.replace(/[都道府県]$/, "").replace("北海", "北海道").replace("北海道道", "北海道");
  gLbl.append(t); p.lbl = t;
}
// region labels
for (const r of REGIONS) {
  const LBL = { chubu: [20, 21], kanto: [9, 11], kinki: [26, 29], shikoku: [38, 39] };
  const pts = (LBL[r.id] || r.prefs).map(id => MAPDATA.paths[id].c);
  const t = mk("text", { class: "rlbl", x: pts.reduce((a, c) => a + c[0], 0) / pts.length, y: pts.reduce((a, c) => a + c[1], 0) / pts.length });
  t.textContent = r.en.split(" ")[0].toUpperCase();
  gReg.append(t); r.lbl = t;
}
// Okinawa inset frame
{
  const b = bbox[47], pad = 22;
  gMap.insertBefore(mk("rect", { class: "inset", x: b.x - pad, y: b.y - pad, width: b.w + pad * 2, height: b.h + pad * 2, rx: 10 }), gMap.firstChild);
}
// kombu route
const K0 = 100 * Math.cos(37 * Math.PI / 180);
const proj = ([lon, lat]) => [lon * K0, -lat * 100];
const routeLL = [[140.73, 41.77], [139.5, 40.4], [138.6, 38.6], [136.9, 37.9], [135.5, 36.5], [133.0, 36.1], [131.0, 34.7], [130.8, 34.1], [131.0, 33.95], [131.8, 33.75], [132.6, 33.95], [133.8, 34.2], [134.6, 34.35], [135.1, 34.55], [135.45, 34.65]];
const spurLL = [[136.06, 35.65], [135.9, 35.3], [135.5, 34.9], [135.45, 34.65]];
const pathOf = ll => "M" + ll.map(proj).map(([x, y]) => x.toFixed(0) + " " + y.toFixed(0)).join("L");
gRoute.append(mk("path", { class: "route", d: pathOf(routeLL) }), mk("path", { class: "route spur", d: pathOf(spurLL) }));
const PORTS = [["Hakodate", [140.73, 41.77]], ["Toyama", [137.05, 36.8]], ["Tsuruga", [136.06, 35.65]], ["Osaka", [135.45, 34.65]]];
const portLbls = [];
for (const [n, ll] of PORTS) {
  const [x, y] = proj(ll);
  gRoute.append(mk("circle", { class: "port", cx: x, cy: y, r: 6 }));
  const t = mk("text", { class: "lbl", x: x + 12, y: y - 12, style: "text-anchor:start" }); t.textContent = n;
  gRoute.append(t); portLbls.push(t);
}

const pinEl = {}, pinLbl = {};
for (const t of TOWNS) {
  let [lon, lat] = t.ll; if (t.pref === 47) { lon -= 2.6; lat += 5.6; }
  const [x, y] = proj([lon, lat]); t.xy = [x, y];
  const c = mk("circle", { class: "pin", cx: x, cy: y, r: 7, "data-town": t.id, tabindex: 0, role: "button", "aria-label": t.en + " " + t.ja });
  const l = mk("text", { class: "tlbl", x: x + 10, y: y + 4, style: "text-anchor:start" }); l.textContent = t.en;
  gTowns.append(c, l); pinEl[t.id] = c; pinLbl[t.id] = l;
}
function mk(tag, attrs = {}) { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; }

/* ---------- view / zoom ---------- */
const wrap = $("#mapwrap");
let scalePx = 1;
function applyVB() {
  svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const r = svg.getBoundingClientRect();
  scalePx = Math.min(r.width / vb.w, r.height / vb.h) || 1;
  const zoom = base.w / vb.w;
  const fs = 13 / scalePx;
  for (const p of PREFS) { p.lbl.style.fontSize = fs + "px"; p.lbl.style.strokeWidth = (3 / scalePx) + "px"; }
  const showPref = zoom > 2.1;
  gLbl.style.display = "block";
  for (const p of PREFS) p.lbl.style.opacity = showPref ? 1 : 0;
  for (const r2 of REGIONS) { r2.lbl.style.fontSize = (15 / scalePx) + "px"; r2.lbl.style.strokeWidth = (3 / scalePx) + "px"; r2.lbl.style.opacity = showPref ? 0 : (S.layer === "regions" ? .9 : .5); }
  const showT = S.layer === "towns";
  for (const t of TOWNS) {
    pinEl[t.id].setAttribute("r", 5 / scalePx);
    const L2 = pinLbl[t.id]; L2.style.fontSize = (12 / scalePx) + "px"; L2.style.strokeWidth = (3 / scalePx) + "px";
    L2.setAttribute("x", t.xy[0] + 10 / scalePx); L2.setAttribute("y", t.xy[1] + 4 / scalePx);

  h += `<h3>Season</h3><div class="cal">${f.months.map((m, i) => `<div class="m${m}${S.month === i + 1 ? " cur" : ""}"></div>`).join("")}</div><div class="calm">${MONTHS.map(m => `<span>${m}</span>`).join("")}</div>`;
  if (S.month) { const act = activeSeasons(f); h += `<div class="box g"><b>${MONTH_NAMES[S.month - 1]}</b>${badge(f)} ${act.length ? act.map(a => esc(a.n + " (" + a.j + "): " + a.t)).join("<br>") : "No special seasonal name this month."}</div>`; }
  h += f.seasons.map(s => `<div class="season"><b>${esc(s.n)}</b> <span class="ja">${esc(s.j)}</span><br>${esc(s.t)}</div>`).join("");
  h += `<div class="box g"><b>Flavour</b>${esc(f.flavor)}</div><div class="box"><b>Use</b>${esc(f.use)}</div>`;
  if (f.craft) h += `<div class="box k"><b>Craft notes</b>${esc(f.craft)}</div>`;
  return h + townChips(TOWNS.filter(t => t.fish.includes(f.id)).map(t => t.id)) + srcList(f.src) + note();
}
function panelPref(p) {
  const r = regById[p.reg]; const fish = fishFor(p.id); const items = itemsFor(p.id);
  const order = [S.layer, ...CATS.map(c => c.id).filter(c => c !== S.layer)];
  let h = `<button class="back" data-closepref>&larr; Back</button><h2>${esc(p.en)}</h2><div class="ja">${esc(p.ja)} · <button class="chip" data-region="${r.id}">${esc(r.en)}</button></div><p>${esc(p.sum)}</p>`;
  for (const cid of order) {
    if (cid === "fish") {
      if (!fish.length) continue;
      h += `<h3>Fish names here</h3>` + fish.map(({ f, s, i }) => `<button class="card" data-fish="${f.id}"><div class="t"><b>${esc(f.en)}</b><span class="ja">${esc(s.label)}</span>${badge(f)}</div><p>${esc(s.names.map(n => n.n).join(" → "))}</p></button>`).join("");
    } else {
      const list = items.filter(i => i.cat === cid); if (!list.length) continue;
      h += `<h3>${esc(catById[cid].label)}</h3>` + list.map(i => `<button class="card" data-item="${i.id}"><div class="t"><b>${esc(i.name)}</b><span class="ja">${esc(i.ja)}</span></div><p>${esc(i.flavor)}</p></button>`).join("");
    }
  }
  h += townChips(TOWNS.filter(t => t.pref === p.id).map(t => t.id));
  if (!fish.length && !items.length) h += `<p class="empty">No entries yet for this prefecture in the current layers.</p>`;
  return h + note();
}
function panelRegion(r) {
  const m = r.meter;
  return `<button class="back" data-clear>&larr; All regions</button><h2>${esc(r.en)}</h2><div class="ja">${esc(r.ja)}</div><p><b>${esc(r.tag)}.</b></p><p>${esc(r.text)}</p>
  <h3>Flavour sketch</h3><div class="meter">${meter("Salt", m.salt)}${meter("Sweet", m.sweet)}${meter("Dashi", m.dashi)}${meter("Richness", m.rich)}</div>
  <div style="font-size:12px;color:var(--muted)">An editorial impression to compare regions, not a measurement.</div>
  <h3>Prefectures</h3>${chips(r.prefs)}` + note();
}
function note() {
  return `<div class="note">Entries marked 'sourced' were cross-checked against Japanese sources (ministries, trade associations, makers and local governments), which are linked on each page. Regional names are traditions, not borders: sizes and boundaries differ by source, port and generation, and where sources disagree the page says so. Map shapes are simplified; Okinawa is shown in an inset.</div>`;
}
const mb = $("#monthbar");
function monthbar() {
  mb.classList.toggle("on", S.layer === "fish");
  mb.innerHTML = `<b>Month</b><button data-m="0" aria-pressed="${!S.month}">All</button>` + MON3.map((m, i) => `<button data-m="${i + 1}" aria-pressed="${S.month === i + 1}">${m}</button>`).join("");
}
mb.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; S.month = +b.dataset.m || null; render(true); });
function render(keepScroll) {
  const top = panel.scrollTop;
  let h;
  if (S.pref) h = panelPref(prefById[S.pref]);
  else if (S.town) h = panelTown(TOWNS.find(x => x.id === S.town));
  else if (S.fish) h = panelFish(fishById[S.fish]);
  else if (S.item) h = panelItem(itemById[S.item]);
  else if (S.region) h = panelRegion(regById[S.region]);
  else h = panelHome();
  panel.innerHTML = h; panel.scrollTop = keepScroll ? top : 0;
  paint(); legend(); monthbar(); applyVB(); writeHash();
}
panel.addEventListener("click", e => {
  const t = e.target.closest("[data-item],[data-fish],[data-pref],[data-region],[data-clear],[data-closepref],[data-sys],[data-town]"); if (!t) return;
  const d = t.dataset;
  if (d.town) selectTown(d.town);
  else if (d.item) selectItem(d.item);
  else if (d.fish) selectFish(d.fish);
  else if (d.pref) selectPref(+d.pref);
  else if (d.region) selectRegion(d.region);
  else if (d.sys !== undefined) zoomSys(+d.sys);
  else if (d.clear !== undefined) clearSel();
  else if (d.closepref !== undefined) { S.pref = null; render(); (S.item || S.fish || S.region || S.town) ? null : viewAll(); }
});
$("#regionbar").innerHTML = REGIONS.map(r => `<button data-r="${r.id}">${esc(r.en.split(" ")[0])}</button>`).join("");
$("#regionbar").addEventListener("click", e => { const b = e.target.closest("button"); if (b) fitTo(unionBox(regById[b.dataset.r].prefs)); });

/* ---------- search ---------- */
const index = [];
for (const p of PREFS) index.push({ k: [p.en, p.ja].join(" ").toLowerCase(), label: p.en + " " + p.ja, sub: "Prefecture", go: () => selectPref(p.id) });
for (const f of FISH) {
  index.push({ k: [f.en, f.ja, f.alt, f.latin].join(" ").toLowerCase(), label: f.en + " " + f.ja, sub: "Fish", go: () => selectFish(f.id) });
  for (const s of f.systems) for (const n of s.names) index.push({ k: (n.n + " " + n.j).toLowerCase(), label: n.n + " " + n.j, sub: `${f.en} name · ${s.label}`, go: () => { selectFish(f.id); } });
}
for (const t of TOWNS) index.push({ k: [t.en, t.ja, t.line].join(" ").toLowerCase(), label: t.en + " " + t.ja, sub: "Town · " + prefById[t.pref].en, go: () => selectTown(t.id) });
for (const i of ITEMS) index.push({ k: [i.name, i.ja, i.text, i.craft || ""].join(" ").toLowerCase(), label: i.name + " " + i.ja, sub: catById[i.cat].label, go: () => selectItem(i.id) });
const q = $("#q"), res = $("#results");
q.addEventListener("input", () => {
  const v = q.value.trim().toLowerCase(); if (v.length < 2) { res.style.display = "none"; return; }
  const seen = new Set(), hits = [];
  for (const e of index) { if (e.k.includes(v) && !seen.has(e.label + e.sub)) { seen.add(e.label + e.sub); hits.push(e); if (hits.length >= 8) break; } }
  res.innerHTML = hits.length ? hits.map((h, i) => `<button data-i="${i}">${esc(h.label)}<small>${esc(h.sub)}</small></button>`).join("") : `<button disabled>No matches<small>Try a fish, a prefecture or a food</small></button>`;
  res.style.display = "block"; res._hits = hits;
});
res.addEventListener("click", e => { const b = e.target.closest("button[data-i]"); if (b) { res._hits[+b.dataset.i].go(); res.style.display = "none"; q.value = ""; } });
document.addEventListener("click", e => { if (!e.target.closest(".search")) res.style.display = "none"; });

/* ---------- theme ---------- */
$("#theme").onclick = () => {
  const r = document.documentElement; const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
};

/* ---------- url state ---------- */
function writeHash() {
  const p = new URLSearchParams(); if (S.layer !== "regions") p.set("l", S.layer);
  if (S.month) p.set("m", S.month); if (S.item) p.set("item", S.item); if (S.fish) p.set("fish", S.fish); if (S.pref) p.set("pref", S.pref); if (S.town) p.set("town", S.town); if (S.region) p.set("region", S.region);
  const s = p.toString(); try { history.replaceState(null, "", s ? "#" + s : location.pathname + location.search); } catch (e) {}
}
function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  const l = p.get("l"); if (l && (l === "regions" || l === "towns" || catById[l])) S.layer = l;
  if (+p.get("m") >= 1 && +p.get("m") <= 12) S.month = +p.get("m");
  if (p.get("item") && itemById[p.get("item")]) { S.item = p.get("item"); S.layer = itemById[S.item].cat; }
  if (p.get("fish") && fishById[p.get("fish")]) { S.fish = p.get("fish"); S.layer = "fish"; }
  if (p.get("town") && TOWNS.find(t => t.id === p.get("town"))) { S.town = p.get("town"); S.layer = "towns"; }
  if (p.get("region") && regById[p.get("region")]) S.region = p.get("region");
  if (p.get("pref") && prefById[+p.get("pref")]) S.pref = +p.get("pref");
}

/* ---------- init ---------- */
readHash(); buildLayers();
const ar0 = () => svg.clientHeight / svg.clientWidth || 1;
requestAnimationFrame(() => { vb = { ...base }; clampVB(); viewAll(); render();
  if (S.town) { const [x, y] = TOWNS.find(t => t.id === S.town).xy; fitTo({ x: x - 45, y: y - 45, w: 90, h: 90 }, false); } else if (S.pref) fitTo(bbox[S.pref], false); else if (S.item) fitTo(unionBox(itemById[S.item].prefs), false); else if (S.fish) fitTo(unionBox([...new Set(fishById[S.fish].systems.flatMap(s => s.prefs))]), false);
});
})();
</script>
</body>
</html>
